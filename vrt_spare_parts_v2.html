<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRT 機修零件管理系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f7; --ink:#1e2640; --sub:#6b7a9e; --line:#e2e6f0;
  --vrt:#1e3a5f; --vrt2:#2d4d7a; --amber:#f59e0b; --amber2:#d97706;
  --card:#fff; --soft:#f7f8fc;
}
body{font-family:"Microsoft JhengHei","Noto Sans TC","Khmer OS",sans-serif;background:var(--bg);color:var(--ink)}
body.dark{--bg:#0f1422;--ink:#e6eaf5;--sub:#9aa6c4;--line:#28304a;--card:#161d2e;--soft:#1b2335}
/* Header */
.header{background:linear-gradient(135deg,var(--vrt),var(--vrt2));padding:13px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
.logo{width:35px;height:35px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.h-title{font-size:16px;font-weight:700;color:#fff}
.h-sub{font-size:11px;color:#9fb3d6;margin-top:1px;letter-spacing:.04em}
.h-stats{margin-left:auto;display:flex;gap:16px}
.hstat{text-align:right}
.hstat-v{font-size:17px;font-weight:700;color:#7dd3fc;font-family:monospace}
.hstat-l{font-size:10px;color:#9fb3d6}
.h-tools{display:flex;gap:6px;align-items:center;margin-left:14px}
.htool{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:8px;width:34px;height:32px;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;cursor:pointer;transition:.15s}
.htool:hover{background:rgba(255,255,255,.3)}
.langbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:5px 13px;
  font-size:12px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
.cloud-dot{font-size:10px;color:#cbd5e1;display:flex;align-items:center;gap:4px;margin-left:6px}
/* Toolbar */
.toolbar{background:var(--card);border-bottom:1px solid var(--line);padding:9px 20px;display:flex;gap:8px;
  flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:50}
.tb-group{display:flex;gap:4px;align-items:center}
.tb-lbl{font-size:11px;color:var(--sub);font-weight:600;margin-right:2px}
.chip{padding:5px 11px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--sub);font-family:inherit}
.chip.on{background:var(--vrt);color:#fff;border-color:var(--vrt)}
.tb-search{flex:1;min-width:150px;display:flex;justify-content:flex-end}
.tb-search input{width:100%;max-width:260px;border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-size:13px;font-family:inherit;background:var(--card);color:var(--ink)}
/* Tabs */
.tabs{background:var(--card);border-bottom:2px solid var(--line);display:flex;padding:0 14px;overflow-x:auto}
.tab{padding:12px 14px;font-size:13px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;font-weight:500;transition:.15s;user-select:none}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab.on{color:var(--amber2);border-bottom-color:var(--amber);background:var(--soft)}
.sec{display:none;padding:18px 20px}
.sec.on{display:block}
/* Card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(30,38,64,.05)}
.ct{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.ct::before{content:'';width:3px;height:11px;background:var(--amber);border-radius:2px}
/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
/* KPI */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;text-align:center;box-shadow:0 1px 3px rgba(30,38,64,.04);border-top:3px solid var(--line)}
.kpi.k-blue{border-top-color:#0ea5e9}.kpi.k-green{border-top-color:#059669}.kpi.k-amber{border-top-color:#d97706}
.kpi.k-red{border-top-color:#dc2626}.kpi.k-violet{border-top-color:#7c3aed}.kpi.k-slate{border-top-color:#64748b}
.kpi-n{font-size:24px;font-weight:700;font-family:monospace;line-height:1.1;color:var(--ink)}
.kpi-u{font-size:11px;color:var(--sub);font-weight:400}
.kpi-l{font-size:10px;color:var(--sub);margin-top:5px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:.15s}
.btn-y{background:var(--amber);color:#1c1200}.btn-y:hover{background:var(--amber2)}
.btn-y:disabled{background:var(--line);color:#a0aabf;cursor:not-allowed}
.btn-b{background:var(--vrt);color:#fff}.btn-b:hover{background:var(--vrt2)}
.btn-g{background:var(--card);color:#4a5578;border:1px solid var(--line)}.btn-g:hover{background:var(--soft)}
.btn-r{background:#fff5f5;color:#dc2626;border:1px solid #fecaca}
.btn-sm{padding:4px 9px;font-size:12px}
/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;color:var(--sub);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--line);background:var(--soft);white-space:nowrap;position:sticky;top:0;cursor:pointer}
td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
tr:hover td{background:var(--soft)}
.mono{font-family:monospace}
.num{text-align:right;font-family:monospace}
/* Badge */
.b{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:monospace}
.bok{background:#d1fae5;color:#065f46}.bwn{background:#fef3c7;color:#92400e}.bbd{background:#fee2e2;color:#991b1b}.bn{background:#e5e7eb;color:#374151}
/* Alert */
.al{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px}
.al-ok{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46}
.al-w{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}
.al-e{background:#fff1f2;border:1px solid #fca5a5;color:#991b1b}
.al-i{background:#e0f2fe;border:1px solid #7dd3fc;color:#0369a1}
/* Filter row */
.frow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=number],input[type=date]{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:6px;font-size:13px;font-family:inherit}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
/* Drop zone */
.drop{border:2px dashed #c5c9d8;border-radius:10px;padding:26px 20px;text-align:center;cursor:pointer;transition:.2s;position:relative;background:var(--soft)}
.drop:hover,.drop.drag{border-color:var(--amber);background:#fffbf0}
.drop.done{border-color:#10b981;border-style:solid;background:#f0fdf8}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* Modal */
.mask{position:fixed;inset:0;background:rgba(15,20,34,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:12px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h3{font-size:15px;margin-bottom:14px;color:var(--ink)}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%}
.frm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--vrt);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px}
.spark i{flex:1;background:#7dd3fc;border-radius:1px;min-height:2px}
.pill{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.up{background:#fee2e2;color:#b91c1c}.down{background:#d1fae5;color:#047857}.flat{background:#e5e7eb;color:#374151}
/* OCR module */
.ocr-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ocr-stage{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:280px;position:relative;overflow:hidden}
.ocr-canvas-wrap{overflow:auto;max-height:60vh;border-radius:8px;background:#0b1020;display:flex;align-items:center;justify-content:center}
.ocr-canvas-wrap canvas,.ocr-canvas-wrap img{max-width:none;transition:transform .15s}
.img-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.itool{width:32px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.itool:hover{background:var(--soft)}
.itool.on{background:var(--vrt);color:#fff;border-color:var(--vrt)}
.slider-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin-bottom:5px}
.slider-row input[type=range]{flex:1}
.conf{font-family:monospace;font-weight:700;font-size:11px;padding:1px 6px;border-radius:4px}
.conf-hi{background:#d1fae5;color:#065f46}.conf-md{background:#fef3c7;color:#92400e}.conf-lo{background:#fee2e2;color:#991b1b}
.ocr-tbl input{width:100%;border:1px solid transparent;background:transparent;padding:3px 5px;font-size:12px;border-radius:4px;color:var(--ink)}
.ocr-tbl input:focus{border-color:var(--vrt);background:var(--card)}
.ocr-row-warn td{background:#fffbeb}
.thumb{width:46px;height:46px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.page-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:14px;border:1px solid var(--line);font-size:12px;cursor:pointer;background:var(--card)}
.page-pill.on{background:var(--vrt);color:#fff;border-color:var(--vrt)}
.mode-card{border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:12px;flex:1;min-width:120px;background:var(--card)}
.mode-card.on{border-color:var(--vrt);background:#eff6ff}
.mode-card b{display:block;font-size:13px;color:var(--vrt)}
.ocr-progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.ocr-progress i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#0ea5e9);width:0;transition:width .2s}
@media(max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .h-stats{display:none}
  .sec{padding:12px 12px}
  .frm-grid{grid-template-columns:1fr}
  .ocr-split{grid-template-columns:1fr}
}

/* v3 procurement UI */
.periodbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.periodseg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.periodseg button{border:0;border-right:1px solid var(--line);background:var(--card);color:var(--sub);padding:6px 12px;cursor:pointer;font-weight:700}
.periodseg button:last-child{border-right:0}.periodseg button.on{background:var(--vrt);color:#fff}
.periodlabel{min-width:110px;text-align:center;font-family:monospace;font-weight:700;color:var(--ink)}
.compound{line-height:1.35}.compound .p{font-weight:700}.compound .s{font-size:10px;color:var(--sub);margin-top:2px}
.partlink{color:#1d4ed8;font-weight:700;cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.clickrow{cursor:pointer}.clickrow:hover td{background:#f4f8ff}
.purchase-table{table-layout:fixed}.purchase-table td{white-space:normal;word-break:break-word}
.part-table{table-layout:fixed}.part-table td{white-space:normal;word-break:break-word}
.detail-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-bottom:12px}
.detail-kpi{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px}.detail-kpi b{display:block;font-family:monospace;font-size:16px}.detail-kpi span{font-size:10px;color:var(--sub)}
@media(max-width:640px){
  .tw{overflow-x:hidden}
  .part-table th,.part-table td,.purchase-table th,.purchase-table td{padding:7px 5px;font-size:10px}
  .part-table col:nth-child(1){width:22%}.part-table col:nth-child(2){width:31%}.part-table col:nth-child(3){width:25%}.part-table col:nth-child(4){width:22%}
  .purchase-table col:nth-child(1){width:18%}.purchase-table col:nth-child(2){width:24%}.purchase-table col:nth-child(3){width:28%}.purchase-table col:nth-child(4){width:14%}.purchase-table col:nth-child(5){width:16%}
  .periodbar{padding:8px}.periodlabel{order:3;width:100%;text-align:left}
}

</style>
<script id="vrt-cloud-transport-v13">
(function(){
  if(window.__VRT_CLOUD_TRANSPORT__==='1.3')return;
  window.__VRT_CLOUD_TRANSPORT__='1.3';
  const _fetch=window.fetch.bind(window), _sessions={}, _pullVersions={}; let _lastPost=0;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function isGas(input){
    const u=typeof input==='string'?input:(input&&input.url)||'';
    if(/script\.google(?:usercontent)?\.com\//i.test(u))return true;
    try{const c=(localStorage.getItem('vrt_portal_gas_url')||'').split('?')[0];return !!c&&u.startsWith(c)}catch(_){return false}
  }
  function synth(status,msg,extra){return new Response(JSON.stringify(Object.assign({ok:false,error:msg,vrtCloudTransport:true},extra||{})),{status:status||502,headers:{'Content-Type':'application/json;charset=utf-8'}})}
  function addUploadId(init){
    if(!init||typeof init.body!=='string')return init;
    let p;try{p=JSON.parse(init.body)}catch(_){return init}
    if(!p||!(Number(p.totalChunks)>1)||p.chunk==null)return init;
    const tool=String(p.tool||'tool'), key=tool+'|'+String(p.totalChunks);
    if(!p.uploadId){
      if(Number(p.chunk)===0||!_sessions[key])_sessions[key]=Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
      p.uploadId=_sessions[key];
      init=Object.assign({},init,{body:JSON.stringify(p)});
    }
    return init;
  }
  function pinPull(input){
    if(typeof input!=='string')return input;
    try{const u=new URL(input,location.href),tool=u.searchParams.get('tool');if(u.searchParams.get('action')==='pull'&&u.searchParams.has('chunk')&&tool&&!u.searchParams.has('uploadId')&&_pullVersions[tool])u.searchParams.set('uploadId',_pullVersions[tool]);return u.href}catch(_){return input}
  }
  window.fetch=async function(input,init){
    if(!isGas(input))return _fetch(input,init);
    input=pinPull(input);init=addUploadId(init||{}); const method=String(init.method||'GET').toUpperCase();
    const tries=method==='POST'?4:3; let lastErr=null;
    for(let a=0;a<tries;a++){
      try{
        if(method==='POST'){const wait=260-(Date.now()-_lastPost);if(wait>0)await sleep(wait);_lastPost=Date.now()}
        const r=await _fetch(input,init), txt=await r.clone().text();
        let j=null,parseErr=false;try{j=txt?JSON.parse(txt):null}catch(_){parseErr=true}
        const html=/^\s*</.test(txt||''),backendErr=j&&j.ok===false;
        const transient=(!r.ok&&(r.status===408||r.status===429||r.status>=500))||html||parseErr||(backendErr&&/internal|server|timeout|temporar|service|drive|quota|rate/i.test(String(j.error||'')));
        if(r.ok&&!parseErr&&!backendErr){try{if(method==='GET'&&j&&j.data&&j.data.meta&&j.data.meta.uploadId){const u=new URL(typeof input==='string'?input:input.url,location.href),tool=u.searchParams.get('tool');if(tool)_pullVersions[tool]=j.data.meta.uploadId}}catch(_){}return r;}
        const head=(txt||'').replace(/\s+/g,' ').slice(0,180);
        const msg=backendErr?String(j.error||'GAS error'):(html?'GAS 回傳 HTML（暫時性伺服器錯誤、部署權限或網址錯誤）':parseErr?'GAS 回傳非 JSON':`HTTP ${r.status}`)+(head?` · ${head}`:'');
        lastErr=new Error(msg);
        if(transient&&a<tries-1){await sleep(650*Math.pow(2,a)+Math.floor(Math.random()*220));continue}
        return synth(r.ok?502:r.status,msg,{httpStatus:r.status});
      }catch(e){lastErr=e;if(a<tries-1){await sleep(650*Math.pow(2,a)+Math.floor(Math.random()*220));continue}}
    }
    return synth(502,lastErr&&lastErr.message?lastErr.message:'Cloud request failed');
  };
  window.vrtCloudJson=async function(input,init){const r=await window.fetch(input,init),txt=await r.text();let d;try{d=txt?JSON.parse(txt):{}}catch(_){throw new Error('GAS 回傳非 JSON：'+txt.replace(/\s+/g,' ').slice(0,180))}if(!r.ok||d&&d.ok===false)throw new Error((d&&d.error)||('HTTP '+r.status));return d};
})();
</script>

<body>

<!-- ══════════ HEADER ══════════ -->
<div class="header">
  <div class="logo">🔧</div>
  <div>
    <div class="h-title" id="hTitle">Machine Spare Parts Purchase Management</div>
    <div class="h-sub" id="hSub">VRT ADMIN CENTER · PURCHASE & PRICE · v3.1</div>
  </div>
  <div class="h-stats">
    <div class="hstat"><div class="hstat-v" id="hParts">0</div><div class="hstat-l" data-zh="零件數" data-en="Parts" data-km="គ្រឿងបន្លាស់">零件數</div></div>
    <div class="hstat"><div class="hstat-v" id="hValue">$0</div><div class="hstat-l" data-zh="年度採購" data-en="Year Spend" data-km="ចំណាយឆ្នាំ">年度採購</div></div>
    <div class="hstat"><div class="hstat-v" id="hLow">$0</div><div class="hstat-l" data-zh="最新月採購" data-en="Latest Month" data-km="ខែចុងក្រោយ">最新月採購</div></div>
  </div>
  <div class="h-tools">
    <div class="htool" onclick="cloudUpload()" title="Cloud Upload">☁️⬆</div>
    <div class="htool" onclick="cloudDownload()" title="Cloud Download">☁️⬇</div>
    <div class="htool" onclick="openTelegram()" title="Telegram">📨</div>
    <div class="htool" onclick="goTab('settings',null)" title="Settings">⚙️</div>
    <div class="htool" onclick="saveAll(true)" title="Save">💾</div>
    <button class="langbtn" onclick="toggleLang()" id="langBtn">🌐 EN</button>
  </div>
  <div class="cloud-dot" id="cloudDot">⚪ <span data-zh="未連線" data-en="Offline" data-km="គ្មានបណ្ដាញ">未連線</span></div>
</div>

<!-- ══════════ TOOLBAR ══════════ -->
<div class="toolbar">
  <div class="tb-group">
    <span class="tb-lbl" data-zh="日期" data-en="Date" data-km="កាលបរិច្ឆេទ">日期</span>
    <span class="chip" data-dt="today" onclick="setDate('today',this)" data-zh="今天" data-en="Today" data-km="ថ្ងៃនេះ">今天</span>
    <span class="chip" data-dt="week" onclick="setDate('week',this)" data-zh="本週" data-en="Week" data-km="សប្ដាហ៍">本週</span>
    <span class="chip" data-dt="month" onclick="setDate('month',this)" data-zh="本月" data-en="Month" data-km="ខែ">本月</span>
    <span class="chip" data-dt="year" onclick="setDate('year',this)" data-zh="今年" data-en="Year" data-km="ឆ្នាំ">今年</span>
    <span class="chip on" data-dt="all" onclick="setDate('all',this)" data-zh="全部" data-en="All" data-km="ទាំងអស់">全部</span>
  </div>

<!-- ══════════ TABS ══════════ -->

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(n){n=Number(n)||0;return n.toLocaleString('en-US',{maximumFractionDigits:0});}
function money(n){n=Number(n)||0;return (CUR_SYM[SET.currency]||'$')+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ym(s){return (s||'').slice(0,7);}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function openModal(html){$('modalBox').innerHTML=html;$('mask').classList.add('on');}
function closeModal(){$('mask').classList.remove('on');}
$('mask').addEventListener('click',e=>{if(e.target===$('mask'))closeModal();});

/* 庫存狀態判定 */
function partStatus(p){
  const q=Number(p.qty)||0, mn=p.minStock!=null&&p.minStock!==''?Number(p.minStock):SET.minRule;
  if(q<=0) return 'out';
  if(q<mn) return 'low';
  return 'ok';
}
function statusBadge(p){
  const s=partStatus(p);
  if(s==='out')return '<span class="b bbd">'+t('stOut')+'</span>';
  if(s==='low')return '<span class="b bwn">'+t('stLow')+'</span>';
  return '<span class="b bok">'+t('stOk')+'</span>';
}

/* ===== IndexedDB 儲存層 ===== */
const IDB_NAME='vrt_spareparts';
const IDB_STORES={
  parts:{keyPath:'id'},txns:{keyPath:'id'},versions:{keyPath:'id'},meta:{keyPath:'k'},
  suppliers:{keyPath:'id'},invoices:{keyPath:'id'},ocrhist:{keyPath:'id'},images:{keyPath:'id'}
};
function createMissingStores(db){
  Object.entries(IDB_STORES).forEach(([name,opt])=>{if(!db.objectStoreNames.contains(name))db.createObjectStore(name,opt)});
}
function openDB(){return new Promise((res,rej)=>{
  // Do not force a fixed version. Some phones already have a newer schema; opening with
  // an old version causes VersionError and makes both local data and cloud restore fail.
  const req=indexedDB.open(IDB_NAME);
  req.onupgradeneeded=e=>createMissingStores(e.target.result);
  req.onerror=()=>rej(req.error||new Error('IndexedDB open failed'));
  req.onsuccess=()=>{
    let db=req.result;
    const missing=Object.keys(IDB_STORES).filter(n=>!db.objectStoreNames.contains(n));
    if(!missing.length){res(db);return;}
    const next=Math.max(1,Number(db.version)||1)+1; db.close();
    const up=indexedDB.open(IDB_NAME,next);
    up.onupgradeneeded=e=>createMissingStores(e.target.result);
    up.onerror=()=>rej(up.error||new Error('IndexedDB schema repair failed'));
    up.onsuccess=()=>res(up.result);
  };
});}
async function idbPutAll(store,arr){const db=await openDB();return new Promise((res,rej)=>{
  const tx=db.transaction(store,'readwrite');const os=tx.objectStore(store);os.clear();
  arr.forEach(o=>os.put(o));tx.oncomplete=()=>res();tx.onerror=e=>rej(e);});}
async function idbGetAll(store){const db=await openDB();return new Promise((res,rej)=>{
  const tx=db.transaction(store,'readonly');const q=tx.objectStore(store).getAll();
  q.onsuccess=()=>res(q.result||[]);q.onerror=e=>rej(e);});}
async function idbPutMeta(k,v){const db=await openDB();return new Promise(res=>{
  const tx=db.transaction('meta','readwrite');tx.objectStore('meta').put({k,v});tx.oncomplete=()=>res();});}
async function idbGetMeta(k){const db=await openDB();return new Promise(res=>{
  const tx=db.transaction('meta','readonly');const q=tx.objectStore('meta').get(k);
  q.onsuccess=()=>res(q.result?q.result.v:null);q.onerror=()=>res(null);});}
async function idbPutImage(id,dataUrl){const db=await openDB();return new Promise(res=>{
  const tx=db.transaction('images','readwrite');tx.objectStore('images').put({id,dataUrl});tx.oncomplete=()=>res();});}
async function idbGetImage(id){const db=await openDB();return new Promise(res=>{
  const tx=db.transaction('images','readonly');const q=tx.objectStore('images').get(id);
  q.onsuccess=()=>res(q.result?q.result.dataUrl:null);q.onerror=()=>res(null);});}

async function saveAll(showToast){
  try{
    await idbPutAll('parts',PARTS);
    await idbPutAll('txns',TXNS);
    await idbPutAll('versions',VERSIONS);
    await idbPutAll('suppliers',SUPPLIERS);
    await idbPutAll('invoices',INVOICES);
    await idbPutAll('ocrhist',OCRHIST);
    await idbPutMeta('settings',SET);
    localStorage.setItem('vrt_sp_set',JSON.stringify(SET));
    if(showToast)toast(t('saved'));
    updateHeaderStats();
  }catch(e){console.error(e);toast('Save error');}
}
async function loadAll(){
  let dbOk=true;
  try{
    PARTS=await idbGetAll('parts'); TXNS=await idbGetAll('txns'); VERSIONS=await idbGetAll('versions');
    SUPPLIERS=await idbGetAll('suppliers'); INVOICES=await idbGetAll('invoices'); OCRHIST=await idbGetAll('ocrhist');
    const s=await idbGetMeta('settings'); if(s)SET=Object.assign(SET,s);
    else{const ls=localStorage.getItem('vrt_sp_set');if(ls)SET=Object.assign(SET,JSON.parse(ls));}
  }catch(e){dbOk=false;console.error('SpareParts DB load failed',e);toast('資料庫讀取失敗：'+(e.message||e));}
  // Use the same GAS URL as the rest of /prod unless this module has its own explicit URL.
  if(!SET.gasUrl) SET.gasUrl=localStorage.getItem('vrt_portal_gas_url')||'';
  if(SET.gasUrl) SET.cloudTarget='gas';
  // Never inject demo purchasing data after a DB error. Demo data is only for a genuinely empty fresh install.
  if(dbOk&&!PARTS.length&&!TXNS.length&&!localStorage.getItem('vrt_sp_initialized')){
    seedDemo(); localStorage.setItem('vrt_sp_initialized','1');
  }
}

function setDate(d,el){FILTER.date=d;document.querySelectorAll('.chip[data-dt]').forEach(c=>c.classList.remove('on'));
  if(el)el.classList.add('on');else document.querySelector('.chip[data-dt="'+d+'"]')?.classList.add('on');renderTab(_curTab);}
function applyFilters(){FILTER.store=$('fStore').value;FILTER.cat=$('fCat').value;FILTER.brand=$('fBrand').value;FILTER.q=$('fSearch').value.trim().toLowerCase();renderTab(_curTab);}
function inDateRange(dstr){
  if(FILTER.date==='all'||!dstr)return true;
  const d=new Date(dstr+'T00:00:00'),now=new Date();
  if(FILTER.date==='today')return dstr===todayStr();
  if(FILTER.date==='year')return d.getFullYear()===now.getFullYear();
  if(FILTER.date==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(FILTER.date==='week'){const wd=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-wd);mon.setHours(0,0,0,0);return d>=mon;}
  return true;
}
function filteredParts(){
  return PARTS.filter(p=>{
    if(FILTER.store&&p.location!==FILTER.store)return false;
    if(FILTER.cat&&p.category!==FILTER.cat)return false;
    if(FILTER.brand&&p.brand!==FILTER.brand)return false;
    if(FILTER.q){const s=(p.partNo+' '+p.name+' '+p.spec).toLowerCase();if(!s.includes(FILTER.q))return false;}
    return true;
  });
}
function filteredTxns(){
  return TXNS.filter(x=>{
    const p=PARTS.find(z=>z.partNo===x.partNo)||{};
    if(FILTER.store&&p.location!==FILTER.store)return false;
    if(FILTER.cat&&p.category!==FILTER.cat)return false;
    if(FILTER.brand&&p.brand!==FILTER.brand)return false;
    if(FILTER.q){const s=(x.partNo+' '+(p.name||'')).toLowerCase();if(!s.includes(FILTER.q))return false;}
    if(!inDateRange(x.date))return false;
    return true;
  });
}

/* 價格異常：同零件最近單價與前次相差 >20% */
function priceAbnormalCount(){
  let c=0;
  PARTS.forEach(p=>{const h=priceHistory(p.partNo);if(h.length>=2){const a=h[h.length-1].price,b=h[h.length-2].price;if(b&&Math.abs(a-b)/b>0.2)c++;}});
  return c;
}
function priceHistory(partNo){
  return TXNS.filter(x=>x.partNo===partNo&&x.type==='IN'&&x.unitPrice).map(x=>({date:x.date,price:+x.unitPrice}))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}

function doMove(id,type){
  const p=PARTS.find(x=>x.id===id);if(!p)return;

/* ========== MONTHLY SUMMARY ========== */
function balanceAtMonthEnd(partNo,yearMonth){
  // 月底 = 該 yyyy-mm 之最後一天；以該零件目前 qty 反推當時結存：用 txn 累積到月底
  const end=yearMonth+'-31';
  const ins=TXNS.filter(x=>x.partNo===partNo&&x.date&&x.date<=end);
  // 用 IN-OUT 累積（假設期初0；若有目前 qty 與 txn 不符，以 txn 為準近似）
  return ins.reduce((s,x)=>s+(x.type==='IN'?+x.qty:-+x.qty),0);
}
function renderMonthly(){
  fillFilterSelects();
  const year=(new Date()).getFullYear();
  const months=Array.from({length:12},(_,i)=>year+'-'+pad(i+1));
  let rows=months.map(m=>{
    const mtx=TXNS.filter(x=>ym(x.date)===m);
    const inQ=mtx.filter(x=>x.type==='IN').reduce((s,x)=>s+(+x.qty||0),0);
    const outQ=mtx.filter(x=>x.type==='OUT').reduce((s,x)=>s+(+x.qty||0),0);
    // 月底各零件結存與價值
    let bal=0,val=0,priceSum=0,priceN=0;
    PARTS.forEach(p=>{const b=balanceAtMonthEnd(p.partNo,m);if(b>0){bal+=b;val+=b*(+p.unitPrice||0);}});
    const prices=mtx.filter(x=>x.type==='IN'&&x.unitPrice).map(x=>+x.unitPrice);
    const avg=prices.length?prices.reduce((a,b)=>a+b,0)/prices.length:0;
    return {m,inQ,outQ,bal,avg,val};
  });
  const mlbl=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h=`<div class="sec on"><div class="card"><div class="ct">📆 ${t('monTitle')} — ${year}</div><div class="tw"><table><thead><tr>
    <th>${t('monMonth')}</th><th class="num">${t('monIn')}</th><th class="num">${t('monOut')}</th>
    <th class="num">${t('monBal')}</th><th class="num">${t('monAvg')}</th><th class="num">${t('monVal')}</th></tr></thead><tbody>`;
  let tIn=0,tOut=0,tVal=0;
  h+=rows.map((r,i)=>{tIn+=r.inQ;tOut+=r.outQ;tVal+=r.val;
    return `<tr><td>${mlbl[i]}</td><td class="num">${num(r.inQ)}</td><td class="num">${num(r.outQ)}</td>
      <td class="num">${num(r.bal)}</td><td class="num">${r.avg?money(r.avg):'-'}</td><td class="num">${money(r.val)}</td></tr>`;}).join('');
  h+=`<tr style="font-weight:700;background:var(--soft)"><td>Grand Total</td><td class="num">${num(tIn)}</td><td class="num">${num(tOut)}</td>
    <td class="num">-</td><td class="num">-</td><td class="num">${money(tVal)}</td></tr>`;
  h+=`</tbody></table></div>
   <div class="al al-i" style="margin-top:12px">${_lang==='en'?'Month-end balance is accumulated from In/Out records (opening assumed 0).':_lang==='km'?'នៅសល់ចុងខែគណនាពីកំណត់ត្រាចូល/ចេញ។':'月底庫存由進出紀錄累積計算（期初假設為 0）。'}</div>
   </div></div>`;
  $('app').innerHTML=h;
}

/* ========== PRICE ANALYSIS ========== */
function renderPrice(){
  fillFilterSelects();
  // 有兩筆以上 IN 價的零件
  const parts=PARTS.filter(p=>priceHistory(p.partNo).length>=1);
  const sel=$('priceSel')?$('priceSel').value:(parts[0]?parts[0].partNo:'');
  let h=`<div class="sec on"><div class="card"><div class="frow">
    <span class="tb-lbl">${t('prSelect')}</span>
    <select id="priceSel" onchange="renderPrice()">${parts.map(p=>`<option value="${escapeHtml(p.partNo)}" ${p.partNo===sel?'selected':''}>${escapeHtml(p.partNo)} — ${escapeHtml(p.name)}</option>`).join('')}</select>
  </div>`;
  const hist=priceHistory(sel);
  if(hist.length){
    const prices=hist.map(x=>x.price);
    const avg=prices.reduce((a,b)=>a+b,0)/prices.length, mx=Math.max(...prices), mn=Math.min(...prices), last=prices[prices.length-1];
    const first=prices[0], chg=first?((last-first)/first*100):0;
    const pill=chg>0.5?`<span class="pill up">▲ ${chg.toFixed(1)}%</span>`:chg<-0.5?`<span class="pill down">▼ ${Math.abs(chg).toFixed(1)}%</span>`:`<span class="pill flat">≈ 0%</span>`;
    h+=`<div class="kpi-strip">
      <div class="kpi k-blue"><div class="kpi-n">${money(last)}</div><div class="kpi-l">${t('prLast')} ${pill}</div></div>
      <div class="kpi k-green"><div class="kpi-n">${money(avg)}</div><div class="kpi-l">${t('prAvg')}</div></div>
      <div class="kpi k-red"><div class="kpi-n">${money(mx)}</div><div class="kpi-l">${t('prMax')}</div></div>
      <div class="kpi k-slate"><div class="kpi-n">${money(mn)}</div><div class="kpi-l">${t('prMin')}</div></div></div>`;
    // sparkline
    const max=mx||1;
    h+=`<div class="ct">${t('prTrend')}</div><div class="spark" style="margin-bottom:14px">`+
       hist.map(x=>`<i style="height:${Math.max(6,x.price/max*34)}px" title="${x.date}: ${money(x.price)}"></i>`).join('')+`</div>`;
    h+=`<div class="tw"><table><thead><tr><th>${t('colDate')}</th><th class="num">${t('colPrice')}</th><th class="num">Δ%</th></tr></thead><tbody>`;
    h+=hist.map((x,i)=>{const prev=i>0?hist[i-1].price:0;const d=prev?((x.price-prev)/prev*100):0;
      const dp=i===0?'-':d>0.5?`<span class="pill up">▲${d.toFixed(1)}</span>`:d<-0.5?`<span class="pill down">▼${Math.abs(d).toFixed(1)}</span>`:`<span class="pill flat">0</span>`;
      return `<tr><td class="mono">${x.date}</td><td class="num">${money(x.price)}</td><td class="num">${dp}</td></tr>`;}).join('');
    h+=`</tbody></table></div>`;
  }else h+=`<div class="empty">${t('noData')}</div>`;
  h+=`</div>`;
  // 同規格不同品牌比較
  const cur=PARTS.find(p=>p.partNo===sel);
  if(cur){
    const same=PARTS.filter(p=>p.spec&&p.spec===cur.spec);
    if(same.length>1){
      h+=`<div class="card"><div class="ct">⚖ ${t('prCompare')} — ${escapeHtml(cur.spec)}</div><div class="tw"><table><thead><tr>
        <th>${t('colBrand')}</th><th>${t('colPartNo')}</th><th class="num">${t('colPrice')}</th><th class="num">${t('colQty')}</th></tr></thead><tbody>`;
      h+=same.sort((a,b)=>a.unitPrice-b.unitPrice).map(p=>`<tr><td><b>${escapeHtml(p.brand)}</b></td><td class="mono">${escapeHtml(p.partNo)}</td><td class="num">${money(p.unitPrice)}</td><td class="num">${num(p.qty)}</td></tr>`).join('');
      h+=`</tbody></table></div></div>`;
    }
  }
  h+=`</div>`;
  $('app').innerHTML=h;
}

/* ========== STOCK ANALYSIS ========== */
function lastMoveDate(partNo){const xs=TXNS.filter(x=>x.partNo===partNo&&x.date);if(!xs.length)return null;return xs.map(x=>x.date).sort().pop();}
function daysSince(d){if(!d)return 99999;return Math.floor((Date.now()-new Date(d+'T00:00:00'))/86400000);}
function renderStock(){
  fillFilterSelects();
  const ps=filteredParts();
  const withVal=ps.map(p=>({p,v:(+p.qty||0)*(+p.unitPrice||0)}));
  const top=[...withVal].sort((a,b)=>b.v-a.v).slice(0,20);
  const low=ps.filter(p=>partStatus(p)==='low');
  const zero=ps.filter(p=>partStatus(p)==='out');
  const over=ps.filter(p=>p.maxStock!==''&&p.maxStock!=null&&(+p.qty)> (+p.maxStock));
  const idle6=ps.filter(p=>daysSince(lastMoveDate(p.partNo))>180&&(+p.qty>0));
  const idle12=ps.filter(p=>daysSince(lastMoveDate(p.partNo))>365&&(+p.qty>0));
  // 週轉率：年度 OUT 數量 / 平均庫存（近似=目前庫存）
  const outYr=TXNS.filter(x=>x.type==='OUT'&&(new Date(x.date)).getFullYear()===(new Date()).getFullYear()).reduce((s,x)=>s+(+x.qty||0),0);
  const avgInv=ps.reduce((s,p)=>s+(+p.qty||0),0)||1;
  const turn=(outYr/avgInv);
  const tbl=(title,list,valcol)=>{
    let s=`<div class="card"><div class="ct">${title} (${list.length})</div><div class="tw"><table><thead><tr>
      <th>${t('colPartNo')}</th><th>${t('colName')}</th><th class="num">${t('colQty')}</th>${valcol?`<th class="num">${valcol}</th>`:''}<th>${t('colStatus')}</th></tr></thead><tbody>`;
    s+=list.slice(0,30).map(o=>{const p=o.p||o;const extra=valcol==='value'?`<td class="num">${money((+p.qty||0)*(+p.unitPrice||0))}</td>`:valcol?`<td class="num">${num(daysSince(lastMoveDate(p.partNo)))}d</td>`:'';
      return `<tr><td class="mono">${escapeHtml(p.partNo)}</td><td>${escapeHtml(p.name)}</td><td class="num">${num(p.qty)}</td>${extra}<td>${statusBadge(p)}</td></tr>`;}).join('')||emptyRow(valcol?5:4);
    s+=`</tbody></table></div></div>`;return s;};
  let h=`<div class="sec on"><div class="kpi-strip">
    <div class="kpi k-green"><div class="kpi-n">${turn.toFixed(2)}</div><div class="kpi-l">🔄 ${t('stTurn')}</div></div>
    <div class="kpi k-amber"><div class="kpi-n">${num(low.length)}</div><div class="kpi-l">🟡 ${t('stLow')}</div></div>
    <div class="kpi k-red"><div class="kpi-n">${num(zero.length)}</div><div class="kpi-l">🔴 ${t('stZero')}</div></div>
    <div class="kpi k-violet"><div class="kpi-n">${num(over.length)}</div><div class="kpi-l">📦 ${t('stOver')}</div></div>
    <div class="kpi k-slate"><div class="kpi-n">${num(idle6.length)}</div><div class="kpi-l">💤 ${t('stIdle6')}</div></div>
    <div class="kpi k-slate"><div class="kpi-n">${num(idle12.length)}</div><div class="kpi-l">🕸 ${t('stIdle12')}</div></div>
  </div>`;
  h+=tbl('🏆 '+t('stTopValue'),top,'value');
  h+=`<div class="g2">`+tbl('🟡 '+t('stLow'),low,'value')+tbl('🔴 '+t('stZero'),zero,'value')+`</div>`;
  h+=`<div class="g2">`+tbl('📦 '+t('stOver'),over,'value')+tbl('💤 '+t('stIdle6'),idle6,'days')+`</div>`;
  h+=tbl('🕸 '+t('stIdle12'),idle12,'days');
  h+=`</div>`;
  $('app').innerHTML=h;
}

let _pendingImport=null;
function importExcel(file){
  if(!file)return;const rd=new FileReader();
  rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    const norm=k=>String(k).toLowerCase().replace(/[^a-z]/g,'');
    const map=rows.map(r=>{const o={};Object.keys(r).forEach(k=>o[norm(k)]=r[k]);
      return {partNo:String(o.partno||o.partcode||o.code||'').trim(),name:String(o.partname||o.name||'').trim(),
        spec:String(o.spec||o.specification||'').trim(),category:String(o.category||o.cat||'Other').trim(),
        brand:String(o.brand||'Other').trim(),machineType:String(o.machinetype||o.mtype||'Other').trim(),
        location:String(o.store||o.location||'Main Store').trim(),unit:String(o.unit||'PCS').trim(),
        qty:+o.qty||+o.currentqty||0,unitPrice:+o.unitprice||+o.price||0,
        minStock:+o.min||+o.minstock||SET.minRule,maxStock:o.max!==''?(+o.max||+o.maxstock||''):'',remark:String(o.remark||'').trim()};
    }).filter(r=>r.partNo);
    if(!map.length){toast('No valid rows');return;}
    _pendingImport=map;askImportMode(map.length);
  }catch(err){console.error(err);toast('Parse error');}};
  rd.readAsArrayBuffer(file);
}
function askImportMode(n){
  openModal(`<h3>📥 ${t('importMode')} (${n})</h3>
    <div style="display:grid;gap:8px">
      <button class="btn btn-g" onclick="runImport('add')">➕ ${t('mAdd')}</button>
      <button class="btn btn-g" onclick="runImport('update')">♻ ${t('mUpdate')}</button>
      <button class="btn btn-g" onclick="runImport('overwrite')">⛔ ${t('mOverwrite')}</button>
      <button class="btn btn-g" onclick="runImport('version')">🗂 ${t('mVersion')}</button>
    </div>
    <div style="text-align:right;margin-top:10px"><button class="btn btn-g" onclick="closeModal()">${t('btnCancel')}</button></div>`);
}
function runImport(mode){
  const rows=_pendingImport||[];const now=todayStr();
  if(mode==='version'){
    VERSIONS.push({id:uid(),label:ym(now)+' Inventory ('+now+')',parts:rows.map(r=>Object.assign({id:uid(),createdAt:now,updatedAt:now},r)),ts:Date.now()});
  }else if(mode==='overwrite'){
    PARTS=rows.map(r=>Object.assign({id:uid(),createdAt:now,updatedAt:now},r));
  }else{
    rows.forEach(r=>{const ex=PARTS.find(p=>p.partNo===r.partNo);
      if(ex){if(mode==='update'||mode==='add'&&false){Object.assign(ex,r);ex.updatedAt=now;}}
      else{PARTS.push(Object.assign({id:uid(),createdAt:now,updatedAt:now},r));}});
  }
  saveAll();closeModal();toast(t('saved'));goTab('inventory',null);
}

/* ========== OCR 主畫面 ========== */

  const k=(n,u,l,c)=>`<div class="kpi ${c}"><div class="kpi-n">${n}<span class="kpi-u">${u||''}</span></div><div class="kpi-l">${l}</div></div>`;

  // 模式 + 拖放

      <div style="font-size:32px">📷</div>
      <div style="font-size:13px;margin-top:6px">${t('ocrDrop')}</div>

  // Google Lens 雙欄

      <div class="ocr-stage">
        <div class="img-tools">

          <div class="itool" onclick="imgRot(90)" title="${t('iRot')} 90°">↻</div>
          <div class="itool" onclick="imgRot(180)" title="180°">⤺</div>

          <div class="itool" onclick="imgReset()" title="${t('iReset')}">⟲</div>
        </div>
        <div class="slider-row">☀ ${t('iBri')}<input type="range" min="50" max="180" value="${_ocr.img.bri}" oninput="imgFilter('bri',this.value)"></div>

function renderPagePills(){

    _ocr.pages.map((p,i)=>`<span class="page-pill ${i===_ocr.cur?'on':''}" onclick="ocrGoPage(${i})">📄 ${t('page')} ${i+1}</span>`).join('')+`</div>`;
}
function setOcrMode(k){SET.ocrMode=k;saveAll();renderOCR();}
function imgStyle(){const m=_ocr.img;return `transform:scale(${m.zoom}) rotate(${m.rot}deg);filter:brightness(${m.bri}%) contrast(${m.con}%);`;}
function applyImgStyle(){const el=$('ocrImg');if(el)el.style.cssText=imgStyle();}
function imgZoom(d){_ocr.img.zoom=Math.max(0.3,Math.min(5,_ocr.img.zoom+d));applyImgStyle();}
function imgRot(deg){_ocr.img.rot=(deg)%360;applyImgStyle();}
function imgFilter(k,v){_ocr.img[k]=+v;applyImgStyle();}
function imgReset(){_ocr.img={zoom:1,rot:0,bri:100,con:100};applyImgStyle();_cropMode=false;const cb=$('cropBox');if(cb)cb.style.display='none';}
function ocrGoPage(i){_ocr.cur=i;imgReset();renderOCR();}

/* ========== 檔案載入（圖片 / PDF 多頁 / 多張） ========== */
function ocrDropHandler(e){e.preventDefault();e.currentTarget.classList.remove('drag');ocrFiles(e.dataTransfer.files);}
async function ocrFiles(files){
  if(!files||!files.length)return;
  toast(_lang==='en'?'Loading files…':'載入檔案中…');
  for(const f of files){
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext==='pdf'){await loadPdf(f);}
    else{const url=await fileToDataUrl(f);_ocr.pages.push({dataUrl:url,name:f.name});}
  }
  _ocr.cur=0;renderOCR();
}
function fileToDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function loadPdf(f){
  try{
    if(!window.pdfjsLib){toast('PDF engine missing');return;}
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf=await f.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const vp=page.getViewport({scale:2});
      const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      _ocr.pages.push({dataUrl:cv.toDataURL('image/png'),name:f.name+' p'+p});
    }
  }catch(e){console.error(e);toast('PDF load failed');}
}

/* ========== 裁切 ========== */
function toggleCrop(){
  _cropMode=!_cropMode;
  if(_cropMode){imgReset();_cropMode=true;}
  const box=$('cropBox');if(box)box.style.display='none';
  bindCrop();renderCropState();
}
function renderCropState(){const el=document.querySelector('.itool[onclick="toggleCrop()"]');if(el)el.classList.toggle('on',_cropMode);}
function bindCrop(){
  const wrap=$('ocrWrap'),box=$('cropBox');if(!wrap||!box)return;
  let sx,sy,drawing=false;
  wrap.onmousedown=e=>{if(!_cropMode)return;const r=wrap.getBoundingClientRect();sx=e.clientX-r.left+wrap.scrollLeft;sy=e.clientY-r.top+wrap.scrollTop;drawing=true;box.style.display='block';box.style.left=sx+'px';box.style.top=sy+'px';box.style.width='0px';box.style.height='0px';};
  wrap.onmousemove=e=>{if(!drawing)return;const r=wrap.getBoundingClientRect();const cx=e.clientX-r.left+wrap.scrollLeft,cy=e.clientY-r.top+wrap.scrollTop;box.style.left=Math.min(sx,cx)+'px';box.style.top=Math.min(sy,cy)+'px';box.style.width=Math.abs(cx-sx)+'px';box.style.height=Math.abs(cy-sy)+'px';};
  wrap.onmouseup=()=>{if(!drawing)return;drawing=false;applyCrop(box);};
}
function applyCrop(box){
  const img=$('ocrImg');if(!img)return;
  const dispW=img.clientWidth,dispH=img.clientHeight;
  const natW=img.naturalWidth,natH=img.naturalHeight;
  const sx=parseFloat(box.style.left)/dispW*natW, sy=parseFloat(box.style.top)/dispH*natH;
  const sw=parseFloat(box.style.width)/dispW*natW, sh=parseFloat(box.style.height)/dispH*natH;
  if(sw<8||sh<8){box.style.display='none';return;}
  const cv=document.createElement('canvas');cv.width=sw;cv.height=sh;
  cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
  _ocr.pages[_ocr.cur].dataUrl=cv.toDataURL('image/png');
  _cropMode=false;renderOCR();toast(_lang==='en'?'Cropped':'已裁切');
}

/* ========== OCR 引擎（Tesseract / 可選 Vision API） ========== */
async function ensureTess(){
  if(_tessWorker)return _tessWorker;
  if(!window.Tesseract)throw new Error('Tesseract not loaded');
  _tessWorker=await Tesseract.createWorker(SET.ocrLang||'eng',1,{logger:m=>{
    if(m.status==='recognizing text'){_ocr.prog=Math.round(m.progress*100);const bar=document.querySelector('.ocr-progress i');if(bar)bar.style.width=_ocr.prog+'%';}
  }});
  return _tessWorker;
}
async function runOCR(){
  if(!_ocr.pages.length){toast('No image');return;}
  _ocr.busy=true;_ocr.prog=0;renderOCR();
  try{
    if(SET.visionUrl){ // 可選：外接 Vision AI
      await runVision();
    }else{
      const worker=await ensureTess();
      const psm=(OCR_MODES.find(m=>m.k===SET.ocrMode)||{}).psm||6;
      try{await worker.setParameters({tessedit_pageseg_mode:String(psm)});}catch(_){}
      const {data}=await worker.recognize(_ocr.pages[_ocr.cur].dataUrl);
      _ocr.raw=data.text||'';
      parseFromTess(data);
    }
  }catch(e){console.error(e);toast('OCR error: '+e.message);}
  _ocr.busy=false;renderOCR();
}
async function runVision(){
  try{
    const res=await fetch(SET.visionUrl,{method:'POST',headers:{'Content-Type':'application/json',...(SET.visionKey?{'Authorization':'Bearer '+SET.visionKey}:{})},
      body:JSON.stringify({image:_ocr.pages[_ocr.cur].dataUrl,task:'invoice'})});
    const d=await res.json();
    if(d.header)_ocr.header=d.header;
    if(d.lines)_ocr.lines=d.lines.map(normLine);
    _ocr.raw=d.raw||'';
  }catch(e){console.error(e);toast('Vision API failed → fallback');const w=await ensureTess();const {data}=await w.recognize(_ocr.pages[_ocr.cur].dataUrl);parseFromTess(data);}
}

/* ========== AI 整理：把 OCR 文字結構化 ========== */
function dictFix(s){let r=s||'';Object.keys(SET.ocrDict||{}).forEach(k=>{r=r.split(k).join(SET.ocrDict[k]);});return r;}
function parseFromTess(data){
  const overall=Math.round(data.confidence||0);
  const lines=(data.lines&&data.lines.length)?data.lines:(data.text||'').split('\n').map(tx=>({text:tx,confidence:overall}));
  const txtLines=lines.map(l=>({text:dictFix((l.text||'').trim()),conf:Math.round(l.confidence||overall)})).filter(l=>l.text);
  _ocr.header=parseHeader(txtLines);
  _ocr.lines=parseItems(txtLines);
  if(!_ocr.lines.length)_ocr.lines=[blankLine()];
}
function reparseAI(){ if(_ocr.raw){const fake={text:_ocr.raw,confidence:_ocr._oc||80,lines:_ocr.raw.split('\n').map(tx=>({text:tx,confidence:_ocr._oc||80}))};parseFromTess(fake);renderOCR();toast('🧠 '+t('ocrReAI'));} }

function parseHeader(L){
  const all=L.map(l=>l.text).join('\n');
  const h={invNo:'',supplier:'',date:'',currency:SET.currency,rate:'',buyer:'',dept:'Maintenance',remark:'',total:''};
  // 供應商：先比對既有，再取含英文字母且長度>4的前幾行
  const known=SUPPLIERS.find(s=>all.toUpperCase().includes((s.name||'').toUpperCase().slice(0,6)));
  if(known)h.supplier=known.name;
  else{for(const l of L.slice(0,4)){if(/[A-Za-z\u4e00-\u9fff]{4,}/.test(l.text)&&!/invoice|發票/i.test(l.text)){h.supplier=l.text.replace(/\s{2,}/g,' ').trim();break;}}}
  const inv=all.match(/no\.?\s*[:#]?\s*(\d{4,})/i)||all.match(/(\d{6})/);if(inv)h.invNo=inv[1];
  const dm=all.match(/(\d{1,2})\s*[.\/\-]\s*(\d{1,2})\s*[.\/\-]\s*(\d{2,4})/);
  if(dm){let[_,d,mo,y]=dm;y=y.length===2?'20'+y:y;h.date=y+'-'+pad(+mo)+'-'+pad(+d);}
  else{const dm2=all.match(/(20\d{2})\s*[.\/\-]\s*(\d{1,2})\s*[.\/\-]\s*(\d{1,2})/);if(dm2)h.date=dm2[1]+'-'+pad(+dm2[2])+'-'+pad(+dm2[3]);}
  if(/usd|\$/i.test(all))h.currency='USD';else if(/khr|៛|riel/i.test(all))h.currency='KHR';else if(/twd|ntd|nt\$/i.test(all))h.currency='TWD';
  const tot=all.match(/total[^\d]*(\d+(?:\.\d+)?)/i);if(tot)h.total=tot[1];
  if(!h.date)h.date=todayStr();
  return h;
}
function blankLine(){return {partNo:'',name:'',spec:'',qty:0,unitPrice:0,amount:0,category:'Other',conf:0,raw:''};}
function normLine(o){return Object.assign(blankLine(),o);}
function parseItems(L){
  const items=[];
  L.forEach(l=>{
    const txt=l.text;
    if(/invoice|發票|name of goods|品名|^\s*total|總|supplier|^\s*name\b|\bdate\b|單價|unit\s*price|數量|\bqty\b/i.test(txt))return;
    if(/\d{1,2}\s*[.\/\-]\s*\d{1,2}\s*[.\/\-]\s*\d{2,4}/.test(txt))return; // 日期行
    const nums=(txt.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
    if(nums.length<2)return; // 需至少 數量+價 或 價+額
    let qty=0,price=0,amount=0;
    if(nums.length>=3){qty=nums[nums.length-3];price=nums[nums.length-2];amount=nums[nums.length-1];}
    else{price=nums[nums.length-2];amount=nums[nums.length-1];qty=price?Math.round(amount/price):nums[0];}
    let desc=txt.replace(/\d+(?:\.\d+)?/g,' ').replace(/[|=:]/g,' ').replace(/\s{2,}/g,' ').trim();
    desc=desc.replace(/^no\.?\s*/i,'').trim();
    if(!desc&&!amount)return;
    const cat=catFromText(desc);
    items.push({partNo:genPartNo(desc,cat),name:desc||('Item '+(items.length+1)),spec:'',qty:qty||0,unitPrice:price||0,amount:amount||0,category:cat,conf:l.conf,raw:txt});
  });
  return items;
}
function catFromText(s){for(const[re,c]of CAT_KW)if(re.test(s))return c;return 'Other';}
function genPartNo(name,cat){
  const prefix=(SET.partRules||{})[cat]||'PT';
  let tok='';const m=(name||'').match(/[A-Za-z0-9][A-Za-z0-9\-]{1,}/g);
  if(m){tok=(m.find(x=>/\d/.test(x))||m[0]).toUpperCase().replace(/[^A-Z0-9\-]/g,'');}
  if(!tok)tok=Math.random().toString(36).slice(2,6).toUpperCase();
  let base=prefix+'-'+tok,no=base,i=2;
  while(PARTS.some(p=>p.partNo===no)&&!_ocr.lines.some(l=>l.partNo===no))no=base+'-'+(i++);
  return no;
}

/* ========== 右側可編輯面板 ========== */
function renderOcrPanel(){
  if(!_ocr.lines.length&&!_ocr.header.invNo)
    return `<div class="empty">${_lang==='en'?'Run OCR to extract invoice':'按「開始辨識」擷取發票'}</div>`;
  const H=_ocr.header;
  const fld=(k,lbl,val)=>`<div class="fld"><label>${lbl}</label><input id="oh_${k}" value="${escapeHtml(val||'')}" oninput="onHeaderEdit('${k}',this.value)"></div>`;
  let h=`<div style="font-size:11px;font-weight:700;color:var(--sub);margin-bottom:8px">🧾 ${t('hdrTotal')} / Header</div>
   <div class="frm-grid">
    ${fld('invNo',t('hdrInvNo'),H.invNo)}${fld('supplier',t('hdrSupplier'),H.supplier)}
    ${fld('date',t('hdrDate'),H.date)}${fld('currency',t('hdrCur'),H.currency)}
    ${fld('rate',t('hdrRate'),H.rate)}${fld('dept',t('hdrDept'),H.dept)}
    ${fld('total',t('hdrTotal'),H.total)}${fld('remark',t('hdrRemark'),H.remark)}
   </div>
   <div style="font-size:11px;font-weight:700;color:var(--sub);margin:10px 0 6px">📋 ${t('repImport')} (${_ocr.lines.length})
     <button class="btn btn-g btn-sm" style="float:right" onclick="addOcrLine()">＋</button></div>
   <div class="tw ocr-tbl"><table><thead><tr>
     <th>${t('colPartNo')}</th><th>${t('colName')}</th><th class="num">${t('colQty')}</th>
     <th class="num">${t('colPrice')}</th><th class="num">${t('colAmount')}</th><th>${t('colCat')}</th><th class="num">${t('conf')}</th><th></th></tr></thead><tbody>`;
  h+=_ocr.lines.map((ln,i)=>{
    const cc=ln.conf>=SET.confWarn?'conf-hi':ln.conf>=SET.confBad?'conf-md':'conf-lo';
    const calc=(+ln.qty||0)*(+ln.unitPrice||0);
    const mismatch=ln.amount&&Math.abs(calc-ln.amount)>Math.max(0.5,ln.amount*0.02);
    const exists=findExisting(ln);
    return `<tr class="${mismatch?'ocr-row-warn':''}">
      <td><input value="${escapeHtml(ln.partNo)}" oninput="onLineEdit(${i},'partNo',this.value)"></td>
      <td><input value="${escapeHtml(ln.name)}" oninput="onLineEdit(${i},'name',this.value)"></td>
      <td class="num"><input type="number" value="${ln.qty}" oninput="onLineEdit(${i},'qty',this.value)" style="text-align:right"></td>
      <td class="num"><input type="number" step="0.01" value="${ln.unitPrice}" oninput="onLineEdit(${i},'unitPrice',this.value)" style="text-align:right"></td>
      <td class="num"><input type="number" step="0.01" value="${ln.amount}" oninput="onLineEdit(${i},'amount',this.value)" style="text-align:right;${mismatch?'color:#dc2626;font-weight:700':''}" title="${mismatch?t('amtAbn')+' ('+money(calc)+')':''}"></td>
      <td><select onchange="onLineEdit(${i},'category',this.value)">${CATS.map(c=>`<option ${c===ln.category?'selected':''}>${c}</option>`).join('')}</select></td>
      <td class="num"><span class="conf ${cc}">${ln.conf||0}%</span></td>
      <td>${exists?`<span class="b bwn" title="${exists.partNo}">${t('ocrExists')}</span>`:''}<button class="btn btn-r btn-sm" onclick="delOcrLine(${i})">🗑</button></td></tr>`;
  }).join('');
  h+=`</tbody></table></div>`;
  return h;
}
function onHeaderEdit(k,v){_ocr.header[k]=v;}
function onLineEdit(i,k,v){
  const ln=_ocr.lines[i];const old=ln[k];
  ln[k]=(k==='qty'||k==='unitPrice'||k==='amount')?(+v||0):v;
  if(k==='name'&&ln.raw&&v&&v!==old){learnDict(ln.raw,v);}
  if(k==='qty'||k==='unitPrice'){ln.amount=(+ln.qty||0)*(+ln.unitPrice||0);}
  // 重繪面板（保留左圖）
  const panel=document.querySelector('.ocr-split .ocr-stage:last-child');if(panel)panel.innerHTML=renderOcrPanel();
}
function addOcrLine(){_ocr.lines.push(blankLine());const panel=document.querySelector('.ocr-split .ocr-stage:last-child');if(panel)panel.innerHTML=renderOcrPanel();}
function delOcrLine(i){_ocr.lines.splice(i,1);const panel=document.querySelector('.ocr-split .ocr-stage:last-child');if(panel)panel.innerHTML=renderOcrPanel();}

/* OCR 字典自學習 */
function learnDict(raw,fixed){
  const a=(raw||'').match(/[A-Za-z0-9]{2,}/g)||[],b=(fixed||'').match(/[A-Za-z0-9]{2,}/g)||[];
  if(a.length&&b.length){const k=a[0],val=b[0];if(k&&val&&k!==val&&k.length<=12){SET.ocrDict[k]=val;saveAll();}}
}
/* 比對既有零件 */
function findExisting(ln){
  if(ln.partNo){const e=PARTS.find(p=>p.partNo.toUpperCase()===ln.partNo.toUpperCase());if(e)return e;}
  const key=(ln.name||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(key.length<3)return null;
  return PARTS.find(p=>{const pk=(p.name+' '+p.spec).toUpperCase().replace(/[^A-Z0-9]/g,'');return pk.includes(key)||key.includes((p.partNo||'').toUpperCase().replace(/[^A-Z0-9]/g,''));})||null;
}

/* ========== 寫入流程 ========== */
async function commitOCR(){
  const H=_ocr.header;
  const lines=_ocr.lines.filter(l=>l.name||l.partNo);
  if(!lines.length){toast('No lines');return;}
  // 發票去重
  const dupKey=(H.supplier||'')+'|'+(H.invNo||'')+'|'+(H.date||'');
  const dup=INVOICES.find(iv=>(iv.supplier+'|'+iv.invNo+'|'+iv.date)===dupKey&&H.invNo);
  if(dup){ if(!confirm(t('invDup')+'\n'+dupKey+'\n'+t('updateQ'))){toast(t('cancelQ'));return;} }
  // 供應商自動建立
  if(H.supplier&&!SUPPLIERS.find(s=>s.name===H.supplier))
    SUPPLIERS.push({id:uid(),name:H.supplier,currency:H.currency||SET.currency,createdAt:todayStr()});
  // 圖片永久保存
  const imgId=uid();
  try{await idbPutImage(imgId,_ocr.pages[_ocr.cur].dataUrl);}catch(_){}
  // 逐列寫入庫存 + 交易 + 價格
  let added=0,updated=0;
  lines.forEach(ln=>{
    const ex=findExisting(ln);
    if(ex){
      if(ln.unitPrice)ex.unitPrice=+ln.unitPrice;
      ex.qty=(+ex.qty||0)+(+ln.qty||0);
      ex.updatedAt=todayStr();updated++;
      TXNS.push({id:uid(),date:H.date,partNo:ex.partNo,type:'IN',qty:+ln.qty||0,unitPrice:+ln.unitPrice||0,
        supplier:H.supplier,user:H.buyer||'OCR',remark:'Inv '+(H.invNo||''),balance:ex.qty,ts:Date.now()});
    }else{
      const np={id:uid(),partNo:ln.partNo||genPartNo(ln.name,ln.category),name:ln.name||ln.partNo,spec:ln.spec||'',
        category:ln.category||'Other',brand:'Other',machineType:'Other',location:'Main Store',unit:'PCS',
        qty:+ln.qty||0,unitPrice:+ln.unitPrice||0,minStock:SET.minRule,maxStock:'',remark:'OCR Inv '+(H.invNo||''),
        invoiceImg:imgId,createdAt:todayStr(),updatedAt:todayStr()};
      PARTS.push(np);added++;
      TXNS.push({id:uid(),date:H.date,partNo:np.partNo,type:'IN',qty:np.qty,unitPrice:np.unitPrice,
        supplier:H.supplier,user:H.buyer||'OCR',remark:'Inv '+(H.invNo||''),balance:np.qty,ts:Date.now()});
    }
  });
  // 發票記錄
  INVOICES.push({id:uid(),invNo:H.invNo,supplier:H.supplier,date:H.date,currency:H.currency,total:H.total,
    lines:lines.length,imgId,ts:Date.now()});
  // OCR 歷史
  const avgConf=Math.round(lines.reduce((s,l)=>s+(+l.conf||0),0)/lines.length);
  OCRHIST.push({id:uid(),date:H.date||todayStr(),supplier:H.supplier,invNo:H.invNo,confidence:avgConf,
    status:'completed',imgId,lines:lines.length,ts:Date.now()});
  await saveAll(true);
  toast(`✅ +${added} / ↻${updated}`);
  // 重置工作區
  _ocr={pages:[],cur:0,header:{},lines:[],img:{zoom:1,rot:0,bri:100,con:100},busy:false,prog:0,raw:''};
  // 雲端 + Telegram（依設定）
  if(SET.cloudTarget==='gas'&&SET.gasUrl)cloudUpload();
  goTab('inventory',null);
}

/* 影像檢視 */
async function viewImage(id){
  const url=await idbGetImage(id);
  if(!url){toast('No image');return;}
  openModal(`<h3>🖼 Invoice Image</h3><img src="${url}" style="width:100%;border-radius:8px">
    <div style="text-align:right;margin-top:10px"><button class="btn btn-g" onclick="closeModal()">${t('btnCancel')}</button></div>`);
}

(async function init(){
  await loadAll();
  applyTheme();fillFilterSelects();applyLang();updateCloudDot();updateHeaderStats();
  goTab('dashboard',null);
  // Do not block mobile startup with a legacy cloud migration. If this device has no data,
  // keep the page usable and let the user press ☁↓; the fixed status strip shows progress.
  if(!TXNS.length&&SET.gasUrl&&window.VRTSmartSync)VRTSmartSync.status('pull','本機無採購資料 · 可按拉取','warn');
})();
</script>
