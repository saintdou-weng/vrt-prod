<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRT PO Delivery Control Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#1f2733; --muted:#6b7686; --line:#e3e8f0;
  --accent:#2563eb; --accent-d:#1d4ed8; --accent-soft:#eef4ff;
  --green:#1f9d6b; --green-s:#e4f6ee; --amber:#d9881f; --amber-s:#fdf1de;
  --orange:#e0641f; --orange-s:#fde9dd; --red:#cf3b3b; --red-s:#fbe6e6;
  --blue:#2f6fb0; --blue-s:#e6f0f9; --grey:#8a93a3; --grey-s:#eef1f5;
  --shadow:0 1px 2px rgba(20,30,50,.05),0 4px 16px rgba(20,30,50,.06);
  --radius:14px; --font:'Segoe UI',system-ui,-apple-system,'Microsoft JhengHei','Noto Sans Khmer',sans-serif;
}
[data-theme="dark"]{
  --bg:#11151c; --panel:#1a2029; --ink:#e7ecf3; --muted:#9aa5b5; --line:#2a3340;
  --accent:#5b86e8; --accent-soft:#1d2839; --green-s:#16271f; --amber-s:#2a2113;
  --orange-s:#2a1a12; --red-s:#2a1515; --blue-s:#13212e; --grey-s:#1c222b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:9px 16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#1b3d96);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.4px}
.spacer{flex:1}
.act{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
  padding:6px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.tbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
.tbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.lang-seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang-seg button{border:0;background:var(--panel);color:var(--muted);padding:6px 9px;font-size:12px;font-weight:600}
.lang-seg button.on{background:var(--accent);color:#fff}

/* tab bar */
.tabs{position:sticky;top:51px;z-index:39;background:var(--panel);border-bottom:2px solid var(--line);
  display:flex;padding:0 12px;overflow-x:auto;gap:2px;box-shadow:0 2px 8px rgba(20,30,50,.03)}
.tab{padding:11px 13px;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-2px;white-space:nowrap;font-weight:600;transition:.15s;user-select:none;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink);background:var(--bg)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.tab .badge{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:0 7px;font-size:11px;font-weight:700}
.tab.on .badge{background:var(--accent);color:#fff}

.main{padding:18px;max-width:1500px;margin:0 auto}
.page-h{display:flex;align-items:baseline;gap:12px;margin:2px 0 16px;flex-wrap:wrap}
.page-h h1{font-size:20px;margin:0;font-weight:700}
.page-h .sub{color:var(--muted);font-size:13px}

/* kpi */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:25px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
.kpi .meta{font-size:11px;color:var(--muted);margin-top:2px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi.g .bar{background:var(--green)} .kpi.a .bar{background:var(--amber)}
.kpi.o .bar{background:var(--orange)} .kpi.r .bar{background:var(--red)}
.kpi.b .bar{background:var(--blue)} .kpi.k .bar{background:var(--grey)}

/* filters */
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;margin-bottom:16px;box-shadow:var(--shadow)}
.filterbar select,.filterbar input{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit}
.filterbar .lb{font-weight:700;font-size:12px;color:var(--muted)}

/* panels & charts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.panel canvas{max-height:260px}

/* table */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--panel);border-bottom:2px solid var(--line);padding:9px 10px;text-align:left;font-weight:700;color:var(--muted);z-index:2;cursor:pointer;user-select:none}
thead th:hover{color:var(--accent)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--bg)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill.ready{background:var(--green-s);color:var(--green)} .pill.waiting{background:var(--amber-s);color:var(--amber)}
.pill.risk{background:var(--orange-s);color:var(--orange)} .pill.critical{background:var(--red-s);color:var(--red)}
.pill.engineering{background:var(--blue-s);color:var(--blue)} .pill.completed{background:var(--grey-s);color:var(--grey)}
.pill.fabric{background:var(--amber-s);color:var(--amber)} .pill.trim{background:var(--orange-s);color:var(--orange)}
.pill.pattern{background:var(--blue-s);color:var(--blue)} .pill.other{background:var(--grey-s);color:var(--grey)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pocard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pocard .hd{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pocard .cust{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.pocard .bd{padding:13px 15px}
.pocard .row{display:flex;justify-content:space-between;font-size:12.5px;margin:5px 0}
.pocard .row .k{color:var(--muted)}
.prog{height:8px;border-radius:6px;background:var(--bg);overflow:hidden;margin:4px 0 2px}
.prog > i{display:block;height:100%;background:var(--accent)}
.pocard .ft{display:flex;gap:6px;padding:11px 15px;border-top:1px solid var(--line);flex-wrap:wrap}
.minib{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12px}
.minib:hover{background:var(--accent-soft);border-color:var(--accent)}

/* waves */
.wave-po{margin-bottom:16px}
.wave-po .wh{font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;box-shadow:var(--shadow)}
.wave-row{display:grid;grid-template-columns:130px 70px 90px 70px 150px 1fr;gap:10px;align-items:center;padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:5px;font-size:12.5px}
.wave-row .wd{font-weight:700}

/* import */
.dz{border:2px dashed var(--line);border-radius:var(--radius);background:var(--panel);padding:34px;text-align:center;transition:.15s;cursor:pointer}
.dz.drag{border-color:var(--accent);background:var(--accent-soft)}
.dz .ic{font-size:40px}
.dz .t{font-weight:700;margin-top:8px}
.dz .s{color:var(--muted);font-size:12.5px;margin-top:4px}
.filerow{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;margin-bottom:5px;font-size:13px}
.filerow .x{cursor:pointer;color:var(--red);font-weight:700}
.al{border-radius:9px;padding:10px 13px;font-size:13px;margin:8px 0;font-weight:600}
.al-ok{background:var(--green-s);color:var(--green)} .al-e{background:var(--red-s);color:var(--red)} .al-w{background:var(--amber-s);color:var(--amber)}
.preview-file{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;background:var(--panel)}
.chiprow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chipx{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
.dupmode{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;margin:6px 0 2px}
.dupmode label{display:flex;align-items:center;gap:5px;cursor:pointer}

/* settings/forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.05)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,35,.45);display:none;place-items:center;z-index:60;padding:20px}
.modal-bg.show{display:grid}
.modal{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(720px,96vw);max-height:90vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 14px;font-size:18px}
.modal .close{float:right;border:0;background:transparent;font-size:20px;color:var(--muted)}

/* toast */
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)} .toast.warn{background:var(--amber)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media(max-width:820px){ .grid2{grid-template-columns:1fr} .wave-row{grid-template-columns:1fr 1fr} .brand small{display:none} }
@media print{ .topbar,.tabs,.filterbar,.toast-wrap{display:none!important} }
</style>
</head>

/* ===================== date utils ===================== */
function parseD(s){ if(!s)return null; if(s instanceof Date)return s; const p=String(s).split('-'); if(p.length<3)return null; const d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function fmtD(d){ if(!d)return''; if(typeof d==='string')d=parseD(d); if(!d)return''; const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0'); return SET.datefmt==='dd/mm/yyyy'?`${da}/${m}/${y}`:SET.datefmt==='mm/dd/yyyy'?`${m}/${da}/${y}`:`${y}/${m}/${da}`; }
function daysBetween(a,b){ a=parseD(a);b=parseD(b); if(!a||!b)return null; return Math.round((b-a)/86400000); }
function ym(s){ const d=parseD(s); return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'):null; }
function todayLocal(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }

/* ===================== IndexedDB ===================== */
const DB_NAME='vrt_pocc_db', STORE='records';
function openDB(){
  const build=db=>{ if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id'}); };
  const tryOpen=ver=>new Promise((res,rej)=>{ const r=ver?indexedDB.open(DB_NAME,ver):indexedDB.open(DB_NAME);
    r.onupgradeneeded=e=>build(e.target.result);
    r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error); });
  // 自我修復：版本衝突改不帶版本；缺 store 升版補建
  return tryOpen(1)
    .catch(err=>{ if(err&&err.name==='VersionError') return tryOpen(null); throw err; })
    .then(db=>{ if(db.objectStoreNames.contains(STORE)) return db;
      const nv=db.version+1; db.close(); return tryOpen(nv); }); }
async function dbSaveAll(arr){ try{ const db=await openDB(); const tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE); st.clear(); arr.forEach(r=>st.put(r)); return new Promise(r=>tx.oncomplete=()=>r(true)); }catch(e){ try{localStorage.setItem('vrt_pocc_records',JSON.stringify(arr));}catch(_){} return true; } }
async function dbLoadAll(){ try{ const db=await openDB(); const tx=db.transaction(STORE,'readonly'),st=tx.objectStore(STORE); return new Promise(r=>{ const q=st.getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>r([]); }); }catch(e){ return JSON.parse(localStorage.getItem('vrt_pocc_records')||'[]'); } }

/* ===================== filtering / KPI ===================== */
function inPeriod(rec){
  const p=filters.period; if(p==='all')return true;
  const d=parseD(rec.completed); if(!d)return false;
  const T=todayLocal(),day=86400000,sow=x=>{const c=new Date(x);const wd=(c.getDay()+6)%7;c.setDate(c.getDate()-wd);return c;};
  if(p==='today')return +d===+T; if(p==='tomorrow')return +d===+T+day;
  if(p==='thisweek'){const s=sow(T);return d>=s&&d<new Date(+s+7*day);}
  if(p==='nextweek'){const s=new Date(+sow(T)+7*day);return d>=s&&d<new Date(+s+7*day);}
  if(p==='thismonth')return d.getFullYear()===T.getFullYear()&&d.getMonth()===T.getMonth();
  if(p==='nextmonth'){const m=new Date(T.getFullYear(),T.getMonth()+1,1);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth();}
  if(p==='lastmonth'){const m=new Date(T.getFullYear(),T.getMonth()-1,1);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth();}
  if(p==='quarter'){const q=Math.floor(T.getMonth()/3);return d.getFullYear()===T.getFullYear()&&Math.floor(d.getMonth()/3)===q;}
  if(p==='year')return d.getFullYear()===T.getFullYear();
  if(p==='custom'){const f=filters.from?parseD(filters.from):null,to=filters.to?parseD(filters.to):null; if(f&&d<f)return false; if(to&&d>to)return false; return true;}
  return true;
}
function applyFilters(){ const q=filters.q.toLowerCase();
  return DATA.filter(r=>{
    if(filters.customer!=='all'&&r.customer!==filters.customer)return false;
    if(filters.constraint!=='all'&&r.code!==filters.constraint)return false;
    if(filters.risk!=='all'&&r.risk!==filters.risk)return false;
    if(q&&!(`${r.po} ${r.item} ${r.customer} ${r.color} ${r.size} ${r.fabricItem||''}`.toLowerCase().includes(q)))return false;
    if(!inPeriod(r))return false; return true; });
}
function sumQ(rows){ return rows.reduce((a,r)=>a+(+r.qty||0),0); }
function computeKPI(rows){
  const uniq=k=>new Set(rows.map(r=>r[k]).filter(Boolean)).size;
  const cnt=f=>rows.filter(f).length; const T=todayLocal();
  const waves=new Set(rows.filter(r=>r.completed).map(r=>r.po+'|'+r.completed)).size;
  const sd=d=>{const x=parseD(d);return x&&+x===+T;};
  const tw=d=>{const x=parseD(d);if(!x)return false;const c=new Date(T);const wd=(c.getDay()+6)%7;c.setDate(c.getDate()-wd);return x>=c&&x<new Date(+c+7*86400000);};
  const tm=d=>{const x=parseD(d);return x&&x.getFullYear()===T.getFullYear()&&x.getMonth()===T.getMonth();};
  const delayed=new Set(rows.filter(r=>{const x=parseD(r.completed);return x&&x>=new Date(2026,8,1);}).map(r=>r.po)).size;
  return { customers:uniq('customer'),pos:uniq('po'),qty:sumQ(rows),waves,styles:uniq('item'),fabrics:uniq('fabricItem'),
    ready:cnt(r=>r.code==='ready'),fabric:cnt(r=>r.code==='fabric'),trim:cnt(r=>r.code==='trim'),pattern:cnt(r=>r.code==='pattern'),
    uncommit:cnt(r=>!r.committed),delayed,today:sumQ(rows.filter(r=>sd(r.completed))),week:sumQ(rows.filter(r=>tw(r.completed))),month:sumQ(rows.filter(r=>tm(r.completed))),
    critical:cnt(r=>r.risk==='critical'),risk:cnt(r=>r.risk==='risk') };
}

/* ---- smart parser (cutting-plan style) ---- */
const FIELD_ALIASES={
  poDate:['podate','orderdate'], po:['pono','ponumber','ponum','po'], item:['itemnumber','itemno','style','styleno','sku','item'],
  description:['description','desc','productname'], color:['color','colour'], size:['size'],
  qty:['orderquantity','orderqty','quantity','oriqty','origqty','qty'], uom:['uom'], mpu:['mpu'], ctns:['totalctns','ctns','carton','cartons'],
  custShip:['poshipdate','requestship','originaldelivery','shipdate'], fabOrderDate:['fabricorderdate'],
  fabMill:['fabricmill'], fabArrival:['estfabricarrival','fabricarrival','fabarrival'],
  cutPlan:['estcuttingplan','cuttingplan'], sewPlan:['estsewingplan','sewingplan'],
  completed:['vrtconfirmshipdate','vrtshipdate','productioncompleted','productioncompletion','completiondate','completed','confirmshipdate'],
  fabricItem:['fabricitem','fabriccode'], consumption:['fabricconsumption','consumption'], required:['fabricrequired','required'],
  stock:['fabricstock','stock'], comment:['comment','remark','remarks']
};
function canon(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,''); }
function canonField(cell){ const c=canon(cell); if(!c)return null;
  for(const f in FIELD_ALIASES){ for(const a of FIELD_ALIASES[f]){ if(c===a||c.replace(/s$/,'')===a){ return f; } } }
  for(const f in FIELD_ALIASES){ for(const a of FIELD_ALIASES[f]){ if(c.includes(a)){ return f; } } }
  return null;
}
function xlDate(v){ if(v==null||v==='')return null;
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); if(d&&d.y) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s=String(v).trim(); let m=s.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/); if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; return null; }
function num(v){ if(v==null||v==='')return 0; const n=parseFloat(String(v).replace(/[, ]/g,'')); return isNaN(n)?0:n; }
function clean(v){ return v==null?'':String(v).trim(); }
function deriveCode(rec,stockOK){ const cm=(rec.comment||'').toLowerCase();
  if(cm.includes('pattern')||cm.includes('spec'))return'pattern';
  if(cm.includes('button')||cm.includes('trim'))return'trim';
  if(cm.includes('not received fabric')||cm.includes('fabric delivery info'))return'fabric';
  if(rec.fabArrival||rec.fabMill)return'fabric';
  if(stockOK)return'ready';
  if(rec.completed&&!rec.fabArrival)return'ready';
  return'fabric'; }
function deriveRisk(code,completed){ if(!completed){ if(code==='trim'||code==='fabric')return'critical'; if(code==='pattern')return'engineering'; return'risk'; }
  if(completed>='2026-10-01')return'risk'; return code==='ready'?'ready':'waiting'; }
function reasonFor(code){ return {fabric:t('cc_fabric'),trim:t('cc_trim'),pattern:t('cc_pattern'),ready:t('cc_ready')}[code]||''; }

function parseWorkbook(wb,fname){
  const out=[]; const summaries=[];
  // prefer sheets that look like PO Confirmation; else any sheet with >=4 fields incl po+item+qty
  const confSheets=[], otherSheets=[];
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn]; if(!ws)return;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
    let isConf=false;
    for(let i=0;i<Math.min(4,rows.length);i++){ const j=(rows[i]||[]).map(clean).join(' ').toUpperCase(); if(j.includes('PO CONFIRMATION')||j.includes('CONFIRMATION')){ isConf=true; break; } }
    (isConf?confSheets:otherSheets).push({sn,rows});
  });
  const targets = confSheets.length?confSheets:otherSheets;
  targets.forEach(({sn,rows})=>{
    if(!rows.length)return;
    // customer from "XXX - PO CONFIRMATION" title
    let customer='';
    for(let i=0;i<Math.min(4,rows.length);i++){ const j=(rows[i]||[]).map(clean).join(' '); const m=j.match(/([A-Za-z]+)\s*[-–]\s*PO\s*CONFIRMATION/i); if(m){ customer=m[1].toUpperCase(); break; } }
    if(customer==='LS')customer='LECHNER';
    // header row: >=4 recognized fields including po & item
    let headerRow=-1,colMap={};
    for(let i=0;i<Math.min(10,rows.length);i++){ const cells=rows[i]||[]; const map={}; let hits=0;
      cells.forEach((c,ci)=>{ const f=canonField(c); if(f&&map[f]===undefined){ map[f]=ci; hits++; } });
      if(hits>=4&&map.po!==undefined&&(map.item!==undefined||map.qty!==undefined)){ headerRow=i; colMap=map; break; } }
    if(headerRow<0)return;
    const get=(row,f)=>{ const ci=colMap[f]; return ci===undefined?null:row[ci]; };
    // detect a "FABRIC STOCK"=OK marker column near fabric status (value 'OK')
    let cnt=0,q=0; const beforeLen=out.length;
    for(let i=headerRow+1;i<rows.length;i++){
      const row=rows[i]||[]; if(!row.length)continue;
      const po=clean(get(row,'po')), item=clean(get(row,'item')); const qty=num(get(row,'qty'));
      const joined=row.map(clean).join(' ').toLowerCase();
      if(joined.includes('total piece')||joined.includes('grand total'))continue;
      if(!po||!(qty>0))continue;
      const stockOK=row.some(c=>String(c).trim().toUpperCase()==='OK');
      const rec={ id:'I'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,6),
        customer:customer||clean(get(row,'customer'))||'N/A', po, item, description:clean(get(row,'description')),
        color:clean(get(row,'color')), size:clean(get(row,'size')), qty, mpu:num(get(row,'mpu'))||null, ctns:num(get(row,'ctns'))||null,
        poDate:xlDate(get(row,'poDate')), custShip:xlDate(get(row,'custShip')),
        fabMill:xlDate(get(row,'fabMill')), fabArrival:xlDate(get(row,'fabArrival')),
        completed:xlDate(get(row,'completed')), fabricItem:clean(get(row,'fabricItem'))||null,
        consumption:num(get(row,'consumption'))||null, required:num(get(row,'required'))||null, stock:num(get(row,'stock'))||null,
        comment:clean(get(row,'comment')) };
      const code=deriveCode(rec,stockOK);
      rec.code=code; rec.committed=!!rec.completed; rec.subtype=code; rec.reason=reasonFor(code);
      rec.cat= code==='ready'?'✅ 無限制':code==='pattern'?'📐 Engineering':'🧵 Material';
      rec.fabSource= code==='ready'?'Stock':(rec.fabMill?'Mill':'Mill');
      rec.risk=deriveRisk(code,rec.completed);
      out.push(rec); cnt++; q+=qty;
    }
    if(cnt>0){ const seg=out.slice(beforeLen);
      summaries.push({ sheet:sn, customer:customer||'N/A', rows:cnt, qty:q,
        pos:[...new Set(seg.map(r=>r.po))], styles:[...new Set(seg.map(r=>r.item))].length,
        fabrics:[...new Set(seg.map(r=>r.fabricItem).filter(Boolean))].length,
        codes:seg.reduce((a,r)=>{a[r.code]=(a[r.code]||0)+1;return a;},{}) }); }
  });
  return out.length?{recs:out,summaries}:null;
}

async function doParse(){
  const btn=document.getElementById('btnParse'), msg=document.getElementById('impMsg');
  btn.disabled=true; msg.textContent=t('imp_parsing');
  pendingRecs=[]; pendingSummaries=[]; const errors=[];
  for(const f of pendingFiles){
    try{ const buf=await f.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:false,raw:true});
      const res=parseWorkbook(wb,f.name);
      if(!res){ errors.push(f.name); continue; }
      pendingRecs.push(...res.recs);
      res.summaries.forEach(s=>pendingSummaries.push(Object.assign({fname:f.name},s)));
    }catch(e){ errors.push(f.name+': '+e.message); }
  }
  if(!pendingRecs.length){ msg.textContent='⚠️ '+t('imp_none'); msg.style.color='var(--red)';
    document.getElementById('previewArea').style.display='none'; btn.disabled=false; return; }
  const totQ=sumQ(pendingRecs), totPo=new Set(pendingRecs.map(r=>r.po)).size, totSt=new Set(pendingRecs.map(r=>r.item)).size;
  const errHtml=errors.length?`<div class="al al-w">⚠️ ${errors.length}: ${errors.join('; ')}</div>`:'';
  document.getElementById('previewContent').innerHTML=errHtml+pendingSummaries.map(s=>`
    <div class="preview-file"><div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:700">📄 ${s.fname} → <span style="color:var(--accent)">${s.sheet}</span></span>
      <span style="color:var(--green);font-weight:700">✓ ${s.rows} ${t('records')} · ${fmtNum(s.qty)} ${t('pcs')}</span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${t('col_customer')}: <b>${s.customer}</b> · ${t('col_pos')}: ${s.pos.length} · ${t('col_styles')}: ${s.styles} · ${t('col_fabrics')}: ${s.fabrics}</div>
      <div class="chiprow">${s.pos.slice(0,12).map(p=>`<span class="chipx">PO ${p}</span>`).join('')}${Object.entries(s.codes).map(([c,n])=>`<span class="chipx" style="background:var(--bg)">${t(CODE_LABEL(c))} ${n}</span>`).join('')}</div>
    </div>`).join('')+`<div class="al al-ok">✓ ${tf('imp_total',{n:pendingRecs.length,q:fmtNum(totQ),po:totPo,st:totSt})}</div>`;
  document.getElementById('previewArea').style.display='block';
  msg.textContent=tf('imp_found',{n:pendingRecs.length}); msg.style.color='var(--muted)';
  btn.disabled=false;
}
function confirmImport(){
  if(!pendingRecs.length)return;
  const mode=(document.querySelector('input[name="dupMode"]:checked')||{}).value||'replace';
  const impPOs=new Set(pendingRecs.map(r=>r.po));
  if(mode==='replace'){ DATA=DATA.filter(r=>!impPOs.has(r.po)).concat(pendingRecs); }
  else if(mode==='skip'){ const exist=new Set(DATA.map(r=>r.po)); DATA=DATA.concat(pendingRecs.filter(r=>!exist.has(r.po))); }
  else { DATA=DATA.concat(pendingRecs); }
  const n=pendingRecs.length;
  saveData(true); pendingFiles=[]; pendingRecs=[]; pendingSummaries=[];
  renderTabs(); render();
  const msg=document.getElementById('impMsg'); if(msg){ msg.textContent='✓ '+tf('imp_saved',{n,total:DATA.length}); msg.style.color='var(--green)'; }
  toast('✓ '+tf('imp_saved',{n,total:DATA.length}),'ok');
}
function cancelImport(){ pendingRecs=[]; pendingSummaries=[]; const pa=document.getElementById('previewArea'); if(pa)pa.style.display='none'; const m=document.getElementById('impMsg'); if(m)m.textContent=''; }

      <div class="panel"><h3>${t('ch_trend')}</h3><canvas id="aTrend"></canvas></div>
      <div class="panel"><h3>${t('ch_risk')}</h3><canvas id="aRisk"></canvas></div>
    </div>`;
}

/* ===================== SETTINGS ===================== */
function viewSettings(){
  return `<div class="page-h"><h1>${t('t_settings')}</h1></div>
  <div class="panel" style="max-width:760px"><div class="form-grid">
    <div class="field"><label>${t('set_factory')}</label><input id="s_factory" value="${SET.factory}"></div>
    <div class="field"><label>${t('set_lang')}</label><select id="s_lang"><option value="zh" ${SET.lang==='zh'?'selected':''}>中文</option><option value="en" ${SET.lang==='en'?'selected':''}>English</option><option value="km" ${SET.lang==='km'?'selected':''}>ខ្មែរ</option></select></div>
    <div class="field"><label>${t('set_datefmt')}</label><select id="s_datefmt"><option value="yyyy/mm/dd" ${SET.datefmt==='yyyy/mm/dd'?'selected':''}>yyyy/mm/dd</option><option value="dd/mm/yyyy" ${SET.datefmt==='dd/mm/yyyy'?'selected':''}>dd/mm/yyyy</option><option value="mm/dd/yyyy" ${SET.datefmt==='mm/dd/yyyy'?'selected':''}>mm/dd/yyyy</option></select></div>
    <div class="field"><label>${t('set_gas')}</label><input id="s_gas" value="${SET.gas}" placeholder="https://script.google.com/macros/s/XXX/exec"></div>
    <div class="field"><label>${t('set_tgtoken')}</label><input id="s_tgtoken" value="${SET.tgtoken}" placeholder="123456:ABC-..."></div>
    <div class="field"><label>${t('set_tgchat')}</label><input id="s_tgchat" value="${SET.tgchat}" placeholder="-100xxxxxxxxxx"></div>
  </div>
  <button class="btn" onclick="saveSettings()">${t('set_save')}</button>
  <button class="btn sec" onclick="sendTelegram()">✈ ${t('a_tg')}</button></div>
  <div class="panel" style="max-width:760px"><h3>Notes</h3><div style="font-size:12.5px;color:var(--muted);line-height:1.7">
  • GAS POST 用 <code>text/plain;charset=utf-8</code>；Telegram 用 <code>parse_mode:HTML</code>。<br>
  • 資料存於本機 IndexedDB（離線可用）；雲端同步需填入 GAS <code>/exec</code> 網址。<br>
  • 匯入支援多分頁、自動偵測表頭與客戶；SheetJS 0.18.5 + Chart.js 4.4.1。</div></div>`;
}
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function saveSettings(){ SET.factory=val('s_factory'); SET.lang=val('s_lang'); SET.datefmt=val('s_datefmt'); SET.gas=val('s_gas'); SET.tgtoken=val('s_tgtoken'); SET.tgchat=val('s_tgchat');
  localStorage.setItem(SET_KEY,JSON.stringify(SET)); if(SET.lang)setLang(SET.lang); toast(t('msg_saved'),'ok'); }

/* ===================== CHARTS ===================== */
const PAL=['#2563eb','#1f9d6b','#d9881f','#e0641f','#cf3b3b','#2f6fb0','#8a93a3','#7c4dbd'];
function destroy(id){ if(charts[id]){charts[id].destroy();delete charts[id];} }
function mk(id,type,labels,data,opt){ const el=document.getElementById(id); if(!el||typeof Chart==='undefined')return; destroy(id);
  charts[id]=new Chart(el,{type,data:{labels,datasets:[{data,backgroundColor:type==='line'?'rgba(37,99,235,.15)':PAL,borderColor:'#2563eb',borderWidth:type==='line'?2:0,fill:type==='line',tension:.3,borderRadius:6}]},
    options:Object.assign({responsive:true,maintainAspectRatio:false},opt||{})}); }
function trendData(rows){ const m={}; rows.filter(r=>r.completed).forEach(r=>{const k=ym(r.completed);m[k]=(m[k]||0)+r.qty;}); const ks=Object.keys(m).sort(); return [ks,ks.map(k=>m[k])]; }
function codeData(rows){ const m={fabric:0,trim:0,pattern:0,ready:0}; rows.forEach(r=>m[r.code]=(m[r.code]||0)+1); const ks=Object.keys(m).filter(k=>m[k]); return [ks.map(k=>t(CODE_LABEL(k))),ks.map(k=>m[k])]; }
function custData(rows){ const m={}; rows.forEach(r=>m[r.customer]=(m[r.customer]||0)+r.qty); const ks=Object.keys(m); return [ks,ks.map(k=>m[k])]; }
function riskData(rows){ const order=['ready','waiting','risk','critical','engineering']; const m={}; order.forEach(o=>m[o]=0); rows.forEach(r=>m[r.risk]=(m[r.risk]||0)+1); const ks=order.filter(k=>m[k]); return [ks.map(k=>t(RISK_LABEL(k))),ks.map(k=>m[k])]; }
function drawDashCharts(){ const rows=applyFilters(); let d=trendData(rows); mk('cTrend','line',d[0],d[1],{plugins:{legend:{display:false}}});
  d=codeData(rows); mk('cMat','doughnut',d[0],d[1]); d=custData(rows); mk('cCust','bar',d[0],d[1],{plugins:{legend:{display:false}}});
  d=riskData(rows); mk('cRisk','bar',d[0],d[1],{indexAxis:'y',plugins:{legend:{display:false}}}); }
function drawAnalysisCharts(){ const rows=applyFilters(); let d=codeData(rows); mk('aMat','doughnut',d[0],d[1]);
  d=custData(rows); mk('aCust','bar',d[0],d[1],{plugins:{legend:{display:false}}}); d=trendData(rows); mk('aTrend','line',d[0],d[1],{plugins:{legend:{display:false}}});
  d=riskData(rows); mk('aRisk','bar',d[0],d[1],{indexAxis:'y',plugins:{legend:{display:false}}}); }

/* ===================== CRUD ===================== */
function newRecord(){ goTab('master'); modal(`<h2>${t('a_new')}</h2><div class="form-grid">
  <div class="field"><label>${t('col_customer')}</label><input id="n_customer"></div><div class="field"><label>${t('col_po')}</label><input id="n_po"></div>
  <div class="field"><label>${t('col_item')}</label><input id="n_item"></div><div class="field"><label>${t('col_color')}</label><input id="n_color"></div>
  <div class="field"><label>${t('col_size')}</label><input id="n_size"></div><div class="field"><label>${t('col_qty')}</label><input id="n_qty" type="number"></div>
  <div class="field"><label>${t('col_fabric')}</label><input id="n_fabric"></div><div class="field"><label>${t('col_completed')}</label><input id="n_completed" type="date"></div>
  <div class="field"><label>${t('f_constraint')}</label><select id="n_code"><option value="fabric">${t('cc_fabric')}</option><option value="trim">${t('cc_trim')}</option><option value="pattern">${t('cc_pattern')}</option><option value="ready">${t('cc_ready')}</option></select></div>
  <div class="field"><label>${t('col_remark')}</label><input id="n_remark"></div></div>
  <button class="btn" onclick="addRecord()">${t('a_save')}</button> <button class="btn sec" onclick="closeModal()">✕</button>`); }
function addRecord(){ const code=val('n_code'); const completed=val('n_completed')||null;
  DATA.push({ id:'R'+Date.now(), customer:val('n_customer'), po:val('n_po'), item:val('n_item'), description:'', color:val('n_color'), size:val('n_size'),
    qty:+val('n_qty')||0, ctns:null, mpu:null, poDate:null, custShip:null, fabSource:code==='ready'?'Stock':'Mill', fabricItem:val('n_fabric')||null,
    fabArrival:null, completed, committed:!!completed, cat:code==='ready'?'✅ 無限制':code==='pattern'?'📐 Engineering':'🧵 Material',
    subtype:code, reason:reasonFor(code), code, risk:deriveRisk(code,completed), comment:val('n_remark') });
  closeModal(); saveData(true); renderTabs(); render(); }
function deleteSelected(){ if(!selected.size){ toast(t('msg_nodel'),'warn'); return; } if(!confirm(tf('confirm_del',{n:selected.size})))return;
  DATA=DATA.filter(r=>!selected.has(r.id)); selected.clear(); saveData(true); renderTabs(); render(); toast(t('msg_deleted'),'ok'); }
async function saveData(silent){ await dbSaveAll(DATA); if(!silent)toast(t('msg_saved'),'ok'); }

function poDetail(cust,po){ const rows=DATA.filter(r=>r.customer===cust&&r.po===po);
  const body=rows.map(r=>`<tr><td>${r.item||''}</td><td>${r.color||''}</td><td>${r.size||''}</td><td style="text-align:right">${fmtNum(r.qty)}</td><td>${r.fabricItem||''}</td>
    <td>${r.completed?fmtD(r.completed):`<span class="pill critical">${t('s_uncommitted')}</span>`}</td><td><span class="pill ${r.code}">${t(CODE_LABEL(r.code))}</span></td></tr>`).join('');
  modal(`<h2>${cust} · PO ${po}</h2><div class="tablewrap" style="max-height:60vh"><table><thead><tr>
    <th>${t('col_item')}</th><th>${t('col_color')}</th><th>${t('col_size')}</th><th>${t('col_qty')}</th><th>${t('col_fabric')}</th><th>${t('col_completed')}</th><th>${t('col_constraint')}</th>
    </tr></thead><tbody>${body}</tbody></table></div><br><button class="btn sec" onclick="closeModal()">✕</button>`); }

/* ===================== Excel export ===================== */
function exportExcel(){ const rows=applyFilters().map(r=>({ Customer:r.customer,PO:r.po,Style:r.item,Description:r.description,Color:r.color,Size:r.size,Qty:r.qty,
  'PO Date':fmtD(r.poDate),'Req Ship':fmtD(r.custShip),'Fabric':r.fabricItem,'Fabric Arrival':fmtD(r.fabArrival),
  'Completed':r.completed?fmtD(r.completed):'(Uncommitted)','Constraint':t(CODE_LABEL(r.code)),'Risk':t(RISK_LABEL(r.risk)),'Remark':r.comment }));
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'PO Detail');
  XLSX.writeFile(wb,`VRT_PO_Export_${fmtD(todayLocal()).replace(/\//g,'')}.xlsx`); toast(t('msg_exported'),'ok'); }

/* ===================== Telegram / Cloud (GAS, text/plain) ===================== */
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function buildSummary(){ const rows=DATA; const pos=new Set(rows.map(r=>r.po)).size; const qty=sumQ(rows); const un=rows.filter(r=>!r.committed).length;
  const codes={}; rows.forEach(r=>codes[r.code]=(codes[r.code]||0)+1);
  let s=`<b>${escapeHtml(t('tg_summary'))}</b>\n${escapeHtml(SET.factory)}\nPO: ${pos} · Qty: ${qty.toLocaleString()} · ${t('k_uncommit')}: ${un}\n`;
  Object.entries(codes).forEach(([c,n])=>s+=`• ${escapeHtml(t(CODE_LABEL(c)))}: ${n}\n`); return s; }
async function sendTelegram(){ if(!SET.gas){ toast(t('msg_tgcfg'),'warn'); goTab('settings'); return; }
  try{ await fetch(SET.gas,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'telegram',parse_mode:'HTML',chat_id:SET.tgchat,text:buildSummary()})}); toast(t('msg_tgsent'),'ok'); }catch(e){ toast('Telegram: '+e.message,'err'); } }

/* ===================== modal / lang / theme ===================== */
function modal(html){ document.getElementById('modalBox').innerHTML=`<button class="close" onclick="closeModal()">✕</button>`+html; document.getElementById('modalBg').classList.add('show'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg')closeModal(); });
document.getElementById('fileInput').addEventListener('change',e=>{ addFiles(e.target.files); e.target.value=''; });
function setLang(l){ LANG=l; localStorage.setItem('vrt_pocc_lang',l);
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  document.documentElement.lang=l==='zh'?'zh-Hant':l==='km'?'km':'en';
  renderActions(); renderTabs(); render(); applyT(); }
function applyT(){ document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t)); }
document.querySelectorAll('#langSeg button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
function toggleTheme(){ const b=document.body; b.dataset.theme=b.dataset.theme==='dark'?'light':'dark'; localStorage.setItem('vrt_pocc_theme',b.dataset.theme); if(VIEW==='dashboard')drawDashCharts(); if(VIEW==='analysis')drawAnalysisCharts(); }

Object.assign(window,{goTab,setFilter,setSort,toggleSel,toggleAll,newRecord,addRecord,deleteSelected,saveData,exportExcel,sendTelegram,
  poDetail,saveSettings,closeModal,toggleTheme,setLang,printPage,doParse,confirmImport,cancelImport,removeFile,clearDB,resetSample});

/* ===================== boot ===================== */
(async function init(){
  const th=localStorage.getItem('vrt_pocc_theme'); if(th)document.body.dataset.theme=th;
  if(SET.lang)LANG=SET.lang;
  let loaded=await dbLoadAll();
  if(!loaded||!loaded.length){ DATA=SEED.slice(); await dbSaveAll(DATA); } else DATA=loaded;
  renderActions(); setLang(LANG); goTab(DATA.length?'dashboard':'import');
})();

/* ===================== 雲端同步（tool=podelivery，與 Portal 同協定） ===================== */
(function(){
  const css=document.createElement('style');
  css.textContent=`
  #vcFab{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:#0f172a;border:1px solid #334155;color:#93c5fd;font-size:22px;cursor:pointer;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #vcPanel{position:fixed;right:18px;bottom:80px;width:320px;max-width:92vw;background:#0b1220;border:1px solid #24344d;border-radius:14px;padding:14px;z-index:9999;color:#e2e8f0;font-size:13px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #vcPanel h4{margin:0 0 8px;font-size:14px;color:#93c5fd}
  #vcPanel .vrow{display:flex;gap:8px;margin:8px 0}
  #vcPanel button{flex:1;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit}
  #vcPushBtn2{background:#3a2c07;border:1px solid #b45309;color:#fcd34d}
  #vcPullBtn2{background:#0c1a2c;border:1px solid #1d4ed8;color:#93c5fd}
  #vcUrl{flex:1;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:12px}
  #vcSave{flex:none;padding:8px 12px;background:#1e293b;border:1px solid #475569;color:#cbd5e1;border-radius:8px}
  #vcLogBox{max-height:110px;overflow:auto;background:#060b14;border-radius:8px;padding:8px;margin-top:8px;font-family:monospace;font-size:11.5px;line-height:1.6}
  #vcStat{color:#fbbf24;margin:4px 0}`;
  document.head.appendChild(css);

  const fab=document.createElement('button'); fab.id='vcFab'; fab.textContent='☁'; document.body.appendChild(fab);
  const panel=document.createElement('div'); panel.id='vcPanel';
  panel.innerHTML=`<h4>☁ 雲端同步 — PO 交期</h4>
    <div id="vcStat">--</div>
    <div class="vrow"><button id="vcPushBtn2">☁ 推送</button><button id="vcPullBtn2">⬇ 拉取</button></div>
    <div style="color:#64748b;font-size:11px;margin-top:4px">GAS URL</div>
    <div class="vrow"><input id="vcUrl" placeholder="https://script.google.com/.../exec"><button id="vcSave">存</button></div>
    <div id="vcLogBox"></div>`;
  document.body.appendChild(panel);

  const LS_META='vrt_pocc_sync_meta';
  const getUrl=()=>((SET.gas||localStorage.getItem('vrt_portal_gas_url')||'').trim());
  function vcLog(m,k){ const b=document.getElementById('vcLogBox');
    const c=k==='err'?'#f87171':(k==='ok'?'#4ade80':'#93c5fd');
    b.innerHTML+=`<div style="color:${c}">[${new Date().toTimeString().slice(0,8)}] ${m}</div>`; b.scrollTop=b.scrollHeight; }
  function vcStat(){ const el=document.getElementById('vcStat');
    let meta=null; try{meta=JSON.parse(localStorage.getItem(LS_META)||'null');}catch(e){}
    const ago=meta?Math.round((Date.now()-meta.ts)/3600000)+'小時前':'尚未同步';
    el.textContent=`本機 ${DATA.length} 筆 · 上次同步 ${meta?ago:'尚未同步'}`; }
  function vcBusy(on){ document.getElementById('vcPushBtn2').disabled=on; document.getElementById('vcPullBtn2').disabled=on; }

  fab.onclick=()=>{ const p=document.getElementById('vcPanel');
    const show=p.style.display!=='block'; p.style.display=show?'block':'none';
    if(show){ document.getElementById('vcUrl').value=getUrl(); vcStat(); } };

  document.getElementById('vcSave').onclick=()=>{
    const u=document.getElementById('vcUrl').value.trim();
    SET.gas=u; localStorage.setItem(SET_KEY,JSON.stringify(SET));
    try{ localStorage.setItem('vrt_portal_gas_url',u); }catch(e){}
    vcLog('✓ GAS URL 已儲存','ok'); };

  document.getElementById('vcPushBtn2').onclick=async function(){
    const url=getUrl(); if(!url){ vcLog('請先填入 GAS URL','err'); return; }
    vcBusy(true);
    try{
      const recs=DATA||[]; const CHUNK=2000; const total=recs.length;
      const chunks=Math.max(Math.ceil(total/CHUNK),1);
      vcLog(`開始推送 ${total} 筆（共 ${chunks} 批）...`,'i');
      for(let i=0;i<chunks;i++){
        const slice=recs.slice(i*CHUNK,(i+1)*CHUNK);
        const payload= chunks>1
          ? { tool:'podelivery', chunk:i, totalChunks:chunks, recordCount:total, records:slice }
          : { tool:'podelivery', recordCount:total, records:recs };
        const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
        const d=await r.json(); if(!d.ok) throw new Error(d.error||'GAS error');
        if(chunks>1) vcLog(`第 ${i+1}/${chunks} 批完成`,'i');
      }
      localStorage.setItem(LS_META,JSON.stringify({ts:Date.now(),count:total}));
      vcLog(`✓ 推送完成（${total} 筆）`,'ok'); vcStat();
    }catch(e){ vcLog('✗ 推送失敗：'+(e.message||e),'err'); }
    finally{ vcBusy(false); }
  };

  document.getElementById('vcPullBtn2').onclick=async function(){
    const url=getUrl(); if(!url){ vcLog('請先填入 GAS URL','err'); return; }
    if(!confirm('拉取會覆蓋本機 PO 交期資料，確定嗎？')) return;
    vcBusy(true); vcLog('拉取中...','i');
    try{
      const metaR=await fetch(`${url}?action=pull&meta=1&tool=podelivery`,{redirect:'follow'});
      const metaD=await metaR.json(); if(!metaD.ok) throw new Error(metaD.error||'GAS error');
      const d=metaD.data;
      if(!d||(!d.chunked&&!d.data)){ vcLog('雲端尚無 PO 交期資料','err'); return; }
      let allRecs=[];
      if(d.chunked&&d.meta&&d.meta.totalChunks){
        const tc=d.meta.totalChunks; vcLog(`分批拉取，共 ${tc} 批...`,'i');
        for(let i=0;i<tc;i++){ vcLog(`拉取第 ${i+1}/${tc} 批...`,'i');
          const cr=await fetch(`${url}?action=pull&tool=podelivery&chunk=${i}`,{redirect:'follow'});
          const cd=await cr.json();
          if(cd.ok&&cd.data&&Array.isArray(cd.data.records)) allRecs=allRecs.concat(cd.data.records); }
      }else if(!d.chunked&&d.data){ allRecs=d.data.records||[]; }
      if(!allRecs.length){ vcLog('雲端資料為空（0筆）','err'); return; }
      DATA=allRecs; await dbSaveAll(DATA);
      localStorage.setItem(LS_META,JSON.stringify({ts:Date.now(),count:allRecs.length}));
      vcLog(`✓ 拉取完成（${allRecs.length} 筆），資料已更新`,'ok');
      vcStat(); renderTabs&&renderTabs(); render();
    }catch(e){ vcLog('✗ 拉取失敗：'+(e.message||e),'err'); }
    finally{ vcBusy(false); }
  };
})();
</script>
