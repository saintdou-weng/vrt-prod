<script>

let DATA={records:[],source:'',savedAt:''},VERS=[],TAB='dashboard',LANG='zh',TREND='month',SEL_MONTH='',PERIOD_MODE='day',PERIOD_KEY='',FILTER={q:'',cust:'',line:''};

function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function excelDate(v){if(v==null||v==='')return'';if(v instanceof Date)return ymd(v);if(typeof v==='number'&&v>20000&&v<80000){const d=new Date((v-25569)*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}const s=String(v).trim(),m=s.match(/(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;return''}

function normLine(v){if(v==null||v==='')return'';let s=String(v).trim();let m=s.match(/\d+/);return m?'Line '+(+m[0]):s}

function load(){try{DATA=JSON.parse(localStorage.getItem(LS)||'{"records":[]}');VERS=JSON.parse(localStorage.getItem(VLS)||'[]')}catch(e){DATA={records:[]};VERS=[]}DATA.records=DATA.records||[];VERS=Array.isArray(VERS)?VERS:[];SEL_MONTH=months().slice(-1)[0]||ymd(new Date()).slice(0,7)}
function sig(rs){return JSON.stringify(rs.map(r=>[r.month,r.line,r.customer,r.po,r.style,r.color,r.size,r.sewingQty,r.startDate,r.endDate]))}
function snapshot(records,file){return {savedAt:new Date().toISOString(),source:file||'',records:records.map(r=>({month:r.month,line:r.line,customer:r.customer,po:r.po,style:r.style,color:r.color,size:r.size,sewingQty:r.sewingQty,startDate:r.startDate,endDate:r.endDate,manpower:r.manpower}))}}
function parseWorkbook(wb,file){let smv={};if(wb.Sheets['Sheet1']){const rr=XLSX.utils.sheet_to_json(wb.Sheets['Sheet1'],{header:1,raw:true,defval:null});for(let i=1;i<rr.length;i++)if(rr[i]?.[0])smv[String(rr[i][0]).trim().toUpperCase()]=num(rr[i][1])}
 let out=[];for(const name of wb.SheetNames.filter(n=>/PRODUCTION\s*PLAN/i.test(String(n).replace(/_/g,' ')))){const ym=monthFromSheet(name),rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});let hi=rows.findIndex(r=>(r||[]).some(x=>/^Products Tyle$/i.test(String(x||'').trim()))&&(r||[]).some(x=>/^Customer$/i.test(String(x||'').trim())));if(hi<0)continue;const h=(rows[hi]||[]).map(x=>String(x??'').replace(/\s+/g,' ').trim().toUpperCase());const inds=fn=>h.map((x,i)=>fn(x)?i:-1).filter(i=>i>=0),first=(fn,fb=-1)=>{let a=inds(fn);return a.length?a[0]:fb},last=(fn,fb=-1)=>{let a=inds(fn);return a.length?a[a.length-1]:fb};
 const actual=first(x=>x.includes('ACTUAL CUT'));if(actual<0)continue;const lines=inds(x=>x.includes('LINE#')),cLine=lines.length>1?lines[lines.length-1]:lines[0];const pieces=inds((x,i)=>x==='PIECES'&&i<actual);const cOrder=pieces.length?pieces[0]:first(x=>x.includes('ORIGINAL ORDER'),8);const cSew=pieces.length?pieces[pieces.length-1]:first(x=>x.includes('SEWING QTY'),actual-1);
 const cProd=first(x=>x.includes('PRODUCT'),0),cCust=first(x=>x==='CUSTOMER',2),cShip=first(x=>x.includes('SHIPMENT DATE'),3),cPo=first(x=>x.includes('ORDER#'),4),cStyle=first(x=>x.includes('STYLE/ARTICLE'),5),cColor=first(x=>x==='COLOR',6),cSize=first(x=>x==='SIZE',7),cDaily=first(x=>x.includes('DAILY OUTPUT'),actual+1),cSmv=first(x=>x==='SMV',actual+2),cMan=first(x=>x.includes('MANPOWER'),actual+3),cWh=first(x=>x.includes('WORKING HOURS'),actual+4),cStart=first(x=>x.includes('START DATE')),cEnd=first(x=>x.includes('FINISHED CUT PCS')),cFinish=first(x=>x.includes('FINISH DATE')),cRemark=first(x=>x.includes('REMARK'));
 let lastLine='';for(let i=hi+1;i<rows.length;i++){let r=rows[i]||[];if(r.every(v=>v==null||v===''))continue;let qty=num(r[cSew]),rawLine=normLine(r[cLine]);if(rawLine)lastLine=rawLine;let line=rawLine||lastLine;if(!qty||!line)continue;let style=String(r[cStyle]??'').trim(),sv=num(r[cSmv])||smv[style.toUpperCase()]||0;out.push({id:`${ym}|${i}|${line}|${r[cPo]??''}|${style}`,month:ym,product:String(r[cProd]??'').trim().toUpperCase(),line,customer:String(r[cCust]??'').trim().toUpperCase(),shipmentDate:excelDate(r[cShip]),po:String(r[cPo]??'').trim(),style,color:String(r[cColor]??'').trim(),size:String(r[cSize]??'').trim(),orderQty:num(r[cOrder]),sewingQty:qty,cutQty:num(r[actual]),dailyOutput:num(r[cDaily]),smv:sv,manpower:num(r[cMan]),workingHours:num(r[cWh]),startDate:excelDate(r[cStart]),endDate:excelDate(r[cEnd]),finishDate:excelDate(r[cFinish]),remark:String(r[cRemark]??'').trim(),sourceSheet:name})}}return out}

function months(){return [...new Set(DATA.records.map(r=>r.month).filter(Boolean))].sort()}

function periodAgg(keyFn){let m={};DATA.records.forEach(r=>{let k=keyFn(r);if(!k)return;let x=m[k]||(m[k]={lines:new Set(),cust:new Set(),po:new Set(),styles:new Set(),order:0,qty:0,lineMan:{}});x.lines.add(r.line);x.cust.add(r.customer);x.po.add(r.po);x.styles.add(r.style);x.order+=r.orderQty;x.qty+=r.sewingQty;x.lineMan[r.line]=Math.max(x.lineMan[r.line]||0,r.manpower||0)});return Object.keys(m).sort().reverse().map(k=>({period:k,lines:m[k].lines.size,cust:m[k].cust.size,po:m[k].po.size,styles:m[k].styles.size,order:m[k].order,qty:m[k].qty,man:Object.values(m[k].lineMan).reduce((a,b)=>a+b,0)}))}

function monthNav(){let ms=months(),i=Math.max(0,ms.indexOf(SEL_MONTH));return `<div class="periodnav"><button class="btn bg" onclick="shiftMonth(-1)">◀</button><span class="periodlabel">${esc(SEL_MONTH||'-')}</span><button class="btn bg" onclick="shiftMonth(1)">▶</button><button class="btn bg" onclick="SEL_MONTH=months().slice(-1)[0]||SEL_MONTH;renderAll()">最新</button><select onchange="SEL_MONTH=this.value;renderAll()">${ms.map(m=>`<option ${m===SEL_MONTH?'selected':''}>${m}</option>`).join('')}</select></div>`}
function shiftMonth(d){let ms=months(),i=ms.indexOf(SEL_MONTH);if(i<0)i=ms.length-1;i=Math.max(0,Math.min(ms.length-1,i+d));SEL_MONTH=ms[i]||SEL_MONTH;renderAll()}
function renderDashboard(){let e=$('dashboard');if(!DATA.records.length){e.innerHTML=`<div class="card"><div class="empty">尚未有排單資料<br><br><button class="btn by" onclick="goTab('import')">📥 匯入 Production Plan</button></div></div>`;return}let rs=activeMonthRows(),ls=lineStats(rs),tot=rs.reduce((s,r)=>s+r.sewingQty,0),order=rs.reduce((s,r)=>s+r.orderQty,0),cust=new Set(rs.map(r=>r.customer)).size,po=new Set(rs.map(r=>r.po)).size,styles=new Set(rs.map(r=>r.style)).size,man=ls.reduce((s,x)=>s+x.man,0),max=Math.max(1,...ls.map(x=>x.qty));e.innerHTML=monthNav()+`<div class="kpis"><div class="kpi a"><div class="kn">${N(tot)}</div><div class="kl">本月排單 pcs</div></div><div class="kpi b"><div class="kn">${N(order)}</div><div class="kl">訂單 pcs</div></div><div class="kpi g"><div class="kn">${ls.length}</div><div class="kl">線別</div></div><div class="kpi p"><div class="kn">${N(man)}</div><div class="kl">配置人數</div></div><div class="kpi b"><div class="kn">${cust}</div><div class="kl">客戶</div></div><div class="kpi a"><div class="kn">${po}</div><div class="kl">PO</div></div><div class="kpi p"><div class="kn">${styles}</div><div class="kl">款式</div></div></div><div class="grid2"><div class="card"><div class="ct">🧵 線別負荷</div><div class="bars">${ls.map(x=>`<div class="barrow"><span class="link" onclick="openLine('${esc(x.line)}')">${esc(x.line)}</span><div class="barbg"><div class="barfill" style="width:${x.qty/max*100}%"></div></div><span class="barval">${N(x.qty)}</span></div>`).join('')}</div></div><div class="card"><div class="ct">📌 即將上線 / 下線</div>${ls.slice().sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999')).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eef0f6"><b>${esc(x.line)}</b> · ${N(x.qty)} pcs<br><span class="subtxt">${esc(x.start||'-')} → ${esc(x.end||'-')} · ${x.styles} styles · ${x.pos} PO</span></div>`).join('')}</div></div>`}
function renderImport(){$('import').innerHTML=`<div class="card"><div class="ct">📥 Production Plan</div><div class="al">這份檔案是每週修訂版：新匯入會取代目前排單，上一版自動保留供「排單變更」比較。JULY / AUG 等所有 Production Plan 工作表會一起讀取。</div><div class="drop" onclick="$('fileInput').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();if(event.dataTransfer.files[0])importFile(event.dataTransfer.files[0])"><div style="font-size:38px">🏭</div><b>拖拉 Production Plan Excel 到這裡</b><div class="subtxt" style="margin-top:7px">.xlsx / .xls</div></div>${DATA.source?`<div style="margin-top:12px">目前：<b>${esc(DATA.source)}</b> · ${esc(DATA.savedAt?.replace('T',' ').slice(0,16)||'')}</div>`:''}</div>`}
function allDailyLinePlan(){let out={};DATA.records.forEach(r=>{let ds=workingDates(r.startDate,r.endDate);if(!ds.length)return;let q=r.sewingQty/ds.length;ds.forEach(d=>{let x=out[d]||(out[d]={});x[r.line]=(x[r.line]||0)+q})});return out}
function weekStart(s){let d=new Date(s+'T00:00:00'),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function periodKeys(mode){if(mode==='day')return Object.keys(allDailyLinePlan()).sort();if(mode==='week')return [...new Set(Object.keys(allDailyLinePlan()).map(weekStart))].sort();if(mode==='month')return months();return [...new Set(months().map(m=>m.slice(0,4)))].sort()}
function periodRowsByLine(mode,key){let m={};const add=(line,qty,man,style,po,cust)=>{let x=m[line]||(m[line]={line,qty:0,man:0,styles:new Set(),pos:new Set(),cust:new Set()});x.qty+=qty;x.man=Math.max(x.man,man||0);if(style)x.styles.add(style);if(po)x.pos.add(po);if(cust)x.cust.add(cust)};if(mode==='day'||mode==='week'){let daily=allDailyLinePlan();Object.keys(daily).forEach(d=>{if(mode==='day'?d===key:weekStart(d)===key)Object.entries(daily[d]).forEach(([line,qty])=>add(line,qty,0,'','',''))});DATA.records.forEach(r=>{let hit=workingDates(r.startDate,r.endDate).some(d=>mode==='day'?d===key:weekStart(d)===key);if(hit)add(r.line,0,r.manpower,r.style,r.po,r.customer)})}else DATA.records.filter(r=>mode==='month'?r.month===key:r.month.slice(0,4)===key).forEach(r=>add(r.line,r.sewingQty,r.manpower,r.style,r.po,r.customer));return Object.values(m).map(x=>({...x,styles:x.styles.size,pos:x.pos.size,cust:x.cust.size})).sort((a,b)=>String(a.line).localeCompare(String(b.line),undefined,{numeric:true}))}
function ensurePeriod(){let ks=periodKeys(PERIOD_MODE);if(!PERIOD_KEY||!ks.includes(PERIOD_KEY))PERIOD_KEY=ks.slice(-1)[0]||'';return ks}
function setPeriodMode(mode){PERIOD_MODE=mode;PERIOD_KEY='';renderPeriodReport(TAB)}
function shiftPeriod(n){let ks=periodKeys(PERIOD_MODE),i=ks.indexOf(PERIOD_KEY);if(i<0)i=ks.length-1;i=Math.max(0,Math.min(ks.length-1,i+n));PERIOD_KEY=ks[i]||PERIOD_KEY;renderPeriodReport(TAB)}
function periodToolbar(){let ks=ensurePeriod();return `<div class="periodnav"><div class="seg">${['day','week','month','year'].map(x=>`<button class="${PERIOD_MODE===x?'on':''}" onclick="setPeriodMode('${x}')">${x==='day'?'日':x==='week'?'週':x==='month'?'月':'年'}</button>`).join('')}</div><button class="btn bg" onclick="shiftPeriod(-1)">◀</button><span class="periodlabel">${esc(PERIOD_KEY||'-')}</span><button class="btn bg" onclick="shiftPeriod(1)">▶</button><select onchange="PERIOD_KEY=this.value;renderPeriodReport(TAB)">${ks.map(k=>`<option ${k===PERIOD_KEY?'selected':''}>${k}</option>`).join('')}</select><button class="btn bg" onclick="PERIOD_KEY=periodKeys(PERIOD_MODE).slice(-1)[0]||'';renderPeriodReport(TAB)">最新</button></div>`}
function renderPeriodReport(target){ensurePeriod();let rows=periodRowsByLine(PERIOD_MODE,PERIOD_KEY),total=rows.reduce((s,x)=>s+x.qty,0),man=rows.reduce((s,x)=>s+x.man,0),styles=rows.reduce((s,x)=>s+x.styles,0),pos=rows.reduce((s,x)=>s+x.pos,0),title=PERIOD_MODE==='day'?'日報':PERIOD_MODE==='week'?'週報':PERIOD_MODE==='month'?'月報':'年報';$(target).innerHTML=periodToolbar()+`<div class="period-kpis"><div class="kpi a"><div class="kn">${N(total)}</div><div class="kl">預作數量 pcs</div></div><div class="kpi b"><div class="kn">${rows.length}</div><div class="kl">線別</div></div><div class="kpi p"><div class="kn">${N(man)}</div><div class="kl">配置人數</div></div><div class="kpi g"><div class="kn">${styles}</div><div class="kl">款式合計</div></div><div class="kpi b"><div class="kn">${pos}</div><div class="kl">PO 合計</div></div></div><div class="card"><div class="ct">📋 ${title} · 各組預作數量</div><div class="tbl"><table class="period-table"><thead><tr><th>Line</th><th class="num">預作 pcs</th><th class="num">Manpower</th><th class="num">Styles</th><th class="num">PO</th><th class="num">Customers</th></tr></thead><tbody>${rows.map(x=>`<tr class="rowclick" onclick="openPeriodLine('${esc(x.line)}')"><td>${esc(x.line)}</td><td class="num" style="color:#1d4ed8;font-weight:700">${N(x.qty)}</td><td class="num">${N(x.man)}</td><td class="num">${x.styles}</td><td class="num">${x.pos}</td><td class="num">${x.cust}</td></tr>`).join('')||'<tr><td colspan="6">此期間沒有可分配資料</td></tr>'}</tbody></table></div></div>`}
function openPeriodLine(line){let rs=DATA.records.filter(r=>r.line===line);if(PERIOD_MODE==='month')rs=rs.filter(r=>r.month===PERIOD_KEY);else if(PERIOD_MODE==='year')rs=rs.filter(r=>r.month.slice(0,4)===PERIOD_KEY);else rs=rs.filter(r=>workingDates(r.startDate,r.endDate).some(d=>PERIOD_MODE==='day'?d===PERIOD_KEY:weekStart(d)===PERIOD_KEY));openModal(`${line} · ${PERIOD_KEY}`,recordTable(rs))}
function renderDaily(){PERIOD_MODE='day';renderPeriodReport('daily')}
function renderWeekly(){PERIOD_MODE='week';renderPeriodReport('weekly')}
function setTrend(x){PERIOD_MODE=x;PERIOD_KEY='';renderTrend()}
function renderTrend(){if(!['month','year'].includes(PERIOD_MODE))PERIOD_MODE='month';renderPeriodReport('trend')}
function renderCustomer(){let rs=activeMonthRows(),group=(key)=>{let m={};rs.forEach(r=>{let k=r[key]||'-',x=m[k]||(m[k]={qty:0,pos:new Set(),styles:new Set(),lines:new Set()});x.qty+=r.sewingQty;x.pos.add(r.po);x.styles.add(r.style);x.lines.add(r.line)});return Object.entries(m).map(([k,x])=>({k,qty:x.qty,pos:x.pos.size,styles:x.styles.size,lines:x.lines.size})).sort((a,b)=>b.qty-a.qty)};let c=group('customer'),p=group('product');$('customer').innerHTML=monthNav()+`<div class="grid2"><div class="card"><div class="ct">🏷 客戶排單</div><div class="tbl"><table><thead><tr><th>Customer</th><th class="num">pcs</th><th class="num">PO</th><th class="num">Styles</th></tr></thead><tbody>${c.map(x=>`<tr><td>${esc(x.k)}</td><td class="num">${N(x.qty)}</td><td class="num">${x.pos}</td><td class="num">${x.styles}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="ct">📦 產品排單</div><div class="tbl"><table><thead><tr><th>Product</th><th class="num">pcs</th><th class="num">PO</th><th class="num">Lines</th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.k)}</td><td class="num">${N(x.qty)}</td><td class="num">${x.pos}</td><td class="num">${x.lines}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function openLine(line){let rs=activeMonthRows().filter(r=>r.line===line);openModal(line,`<div class="kpis"><div class="kpi a"><div class="kn">${N(rs.reduce((s,r)=>s+r.sewingQty,0))}</div><div class="kl">pcs</div></div><div class="kpi b"><div class="kn">${new Set(rs.map(r=>r.style)).size}</div><div class="kl">Styles</div></div><div class="kpi p"><div class="kn">${new Set(rs.map(r=>r.po)).size}</div><div class="kl">PO</div></div></div>${recordTable(rs)}`)}
function renderLine(){let ls=lineStats(activeMonthRows());$('line').innerHTML=monthNav()+`<div class="card"><div class="ct">🧵 線別產能 / 安排</div><div class="tbl"><table><thead><tr><th>Line</th><th class="num">pcs</th><th class="num">Manpower</th><th class="num">Styles</th><th class="num">PO</th><th>Start→End</th></tr></thead><tbody>${ls.map(x=>`<tr class="rowclick" onclick="openLine('${esc(x.line)}')"><td class="link">${esc(x.line)}</td><td class="num">${N(x.qty)}</td><td class="num">${N(x.man)}</td><td class="num">${x.styles}</td><td class="num">${x.pos}</td><td>${esc(x.start||'-')} → ${esc(x.end||'-')}</td></tr>`).join('')}</tbody></table></div></div>`}
function aggVersion(v,ym){let items={},lines={};(v?.records||[]).filter(r=>r.month===ym).forEach(r=>{let k=[r.customer,r.po,r.style,r.color,r.size].join('|').toUpperCase(),x=items[k]||(items[k]={customer:r.customer,po:r.po,style:r.style,color:r.color,size:r.size,qty:0,lines:new Set(),start:[],end:[]});x.qty+=num(r.sewingQty);x.lines.add(r.line);if(r.startDate)x.start.push(r.startDate);if(r.endDate)x.end.push(r.endDate);let l=lines[r.line]||(lines[r.line]={qty:0,styles:new Set(),pos:new Set(),man:0,start:[],end:[]});l.qty+=num(r.sewingQty);l.styles.add(r.style);l.pos.add(r.po);l.man=Math.max(l.man,num(r.manpower));if(r.startDate)l.start.push(r.startDate);if(r.endDate)l.end.push(r.endDate)});Object.values(items).forEach(x=>{x.lines=[...x.lines].sort();x.start=x.start.sort()[0]||'';x.end=x.end.sort().slice(-1)[0]||''});Object.values(lines).forEach(x=>{x.styles=x.styles.size;x.pos=x.pos.size;x.start=x.start.sort()[0]||'';x.end=x.end.sort().slice(-1)[0]||''});return {items,lines}}
function currentSnap(){return snapshot(DATA.records,DATA.source)}
function renderChanges(){let e=$('changes');if(!DATA.records.length){e.innerHTML='<div class="empty">尚未有資料</div>';return}let ms=months();if(!SEL_MONTH||!ms.includes(SEL_MONTH))SEL_MONTH=ms.slice(-1)[0];let prev=VERS[0];if(!prev){e.innerHTML=monthNav()+`<div class="card"><div class="ct">🔄 排單變更</div><div class="al">目前只有一個版本。下週匯入更新檔後，會自動比較件數、日期、移組與每組安排。</div></div>`;return}let c=aggVersion(currentSnap(),SEL_MONTH),p=aggVersion(prev,SEL_MONTH),keys=new Set([...Object.keys(c.items),...Object.keys(p.items)]),chg=[],sum={add:0,remove:0,qty:0,date:0,move:0,total:0};keys.forEach(k=>{let a=c.items[k],b=p.items[k];if(!b){sum.add++;chg.push({type:'add',a,b})}else if(!a){sum.remove++;chg.push({type:'remove',a,b})}else{let q=Math.round(a.qty)!==Math.round(b.qty),d=a.start!==b.start||a.end!==b.end,m=a.lines.join(',')!==b.lines.join(',');if(q)sum.qty++;if(d)sum.date++;if(m)sum.move++;if(q||d||m)chg.push({type:'change',a,b,q,d,m})}});sum.total=Object.values(c.items).reduce((s,x)=>s+x.qty,0)-Object.values(p.items).reduce((s,x)=>s+x.qty,0);let lineKeys=new Set([...Object.keys(c.lines),...Object.keys(p.lines)]),lc=[...lineKeys].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));e.innerHTML=monthNav()+`<div class="kpis"><div class="kpi b"><div class="kn">${sum.total>0?'+':''}${N(sum.total)}</div><div class="kl">總件數差異</div></div><div class="kpi g"><div class="kn">${sum.add}</div><div class="kl">新增</div></div><div class="kpi r"><div class="kn">${sum.remove}</div><div class="kl">取消</div></div><div class="kpi a"><div class="kn">${sum.qty}</div><div class="kl">件數變更</div></div><div class="kpi p"><div class="kn">${sum.date}</div><div class="kl">日期變更</div></div><div class="kpi b"><div class="kn">${sum.move}</div><div class="kl">移組</div></div></div><div class="card"><div class="ct">🧵 各組安排變化</div><div class="tbl"><table><thead><tr><th>Line</th><th>Qty 上次→本次</th><th>Styles</th><th>PO</th><th>Manpower</th><th>Date</th></tr></thead><tbody>${lc.map(k=>{let a=c.lines[k]||{qty:0,styles:0,pos:0,man:0,start:'',end:''},b=p.lines[k]||{qty:0,styles:0,pos:0,man:0,start:'',end:''};return `<tr><td><b>${esc(k)}</b></td><td>${N(b.qty)} → ${N(a.qty)}</td><td>${b.styles} → ${a.styles}</td><td>${b.pos} → ${a.pos}</td><td>${N(b.man)} → ${N(a.man)}</td><td>${b.start||'-'}~${b.end||'-'}<br>→ ${a.start||'-'}~${a.end||'-'}</td></tr>`}).join('')}</tbody></table></div></div><div class="card"><div class="ct">📋 PO / 款式變更 (${chg.length})</div><div class="tbl"><table><thead><tr><th>變更</th><th>Customer / PO</th><th>Style</th><th>Line</th><th>Qty</th><th>Start / End</th></tr></thead><tbody>${chg.map(x=>{let a=x.a||{},b=x.b||{},chip=x.type==='add'?'<span class="chg a">新增</span>':x.type==='remove'?'<span class="chg r">取消</span>':`${x.q?'<span class="chg q">件數</span>':''}${x.d?'<span class="chg d">日期</span>':''}${x.m?'<span class="chg l">移組</span>':''}`;return `<tr><td>${chip}</td><td>${esc(a.customer||b.customer)}<div class="subtxt">${esc(a.po||b.po)}</div></td><td>${esc(a.style||b.style)}<div class="subtxt">${esc(a.color||b.color)} / ${esc(a.size||b.size)}</div></td><td>${esc((b.lines||[]).join(',')||'-')} → ${esc((a.lines||[]).join(',')||'-')}</td><td>${N(b.qty||0)} → ${N(a.qty||0)}</td><td>${b.start||'-'}→${a.start||'-'}<br>${b.end||'-'}→${a.end||'-'}</td></tr>`}).join('')||'<tr><td colspan="6">No change</td></tr>'}</tbody></table></div></div>`}
function recordTable(rs){return `<div class="tbl"><table><thead><tr><th>Line</th><th>Customer/PO</th><th>Style/Color</th><th class="num">Plan pcs</th><th>Start→End</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.line)}</td><td>${esc(r.customer)}<div class="subtxt">${esc(r.po)}</div></td><td>${esc(r.style)}<div class="subtxt">${esc(r.color)} / ${esc(r.size)}</div></td><td class="num">${N(r.sewingQty)}</td><td>${r.startDate||'-'} → ${r.endDate||'-'}</td></tr>`).join('')}</tbody></table></div>`}
function renderRecords(){let q=FILTER.q.toLowerCase(),rs=DATA.records.filter(r=>!q||[r.line,r.customer,r.po,r.style,r.color,r.size].join(' ').toLowerCase().includes(q));$('records').innerHTML=`<div class="card"><div class="frow"><input class="search" placeholder="Line / Customer / PO / Style / Color" oninput="FILTER.q=this.value;renderRecords()" value="${esc(FILTER.q)}"><span class="subtxt">${N(rs.length)} records</span></div>${recordTable(rs)}</div>`}
function renderReport(){$('report').innerHTML=`<div class="card"><div class="ct">📄 四檔週分析報告生成器</div><div class="al">Production Plan 直接使用目前平台資料，不必再匯入一次。再補 Customer Statistics、Monthly Shipping、Fabric Delivery 三份 Excel 即可。</div><button class="btn by" onclick="openReport()">📄 開啟週分析報告生成器</button></div>`}
function openReport(){localStorage.setItem('vrt_report_plan_bridge_v1',JSON.stringify({records:DATA.records.map(r=>({...r,productType:r.product,_srcMonth:r.month})),preferredMonth:SEL_MONTH}));window.open('vrt_production_weekly_report_generator_v3.html','_blank')}
function renderSettings(){let gas=localStorage.getItem('vrt_portal_gas_url')||'';$('settings').innerHTML=`<div class="card"><div class="ct">⚙️ 設定</div><label>GAS URL</label><input class="search" id="gasSet" value="${esc(gas)}" placeholder="https://script.google.com/.../exec"><div class="btnrow" style="margin-top:10px"><button class="btn by" onclick="localStorage.setItem('vrt_portal_gas_url',$('gasSet').value.trim());toast('Saved')">儲存</button><button class="btn bg" onclick="cloudPush()">☁ 上傳</button><button class="btn bg" onclick="cloudPull()">☁ 下載</button></div></div>`}
async function cloudPush(){let url=localStorage.getItem('vrt_portal_gas_url')||'';if(!url){toast('未設定 GAS URL');cloudState('☁ GAS URL missing',false);return}cloudState('☁ Uploading…');let payload={action:'push',tool:TOOL,recordCount:DATA.records.length,records:DATA.records,summary:{months:months(),pieces:DATA.records.reduce((s,r)=>s+r.sewingQty,0)},planVersions:VERS};try{await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});cloudState('☁ Uploaded '+new Date().toLocaleTimeString());toast('Cloud uploaded')}catch(e){cloudState('☁ Upload failed',false);toast('Upload failed')}}
async function cloudPull(){let url=localStorage.getItem('vrt_portal_gas_url')||'';if(!url){toast('未設定 GAS URL');cloudState('☁ GAS URL missing',false);return}cloudState('☁ Downloading…');try{let j=await(await fetch(url+'?action=pull&tool='+TOOL)).json(),p=j?.data||j;if(p?.data)p=p.data;if(Array.isArray(p?.records)){DATA={records:p.records,source:'Cloud',savedAt:new Date().toISOString()};if(Array.isArray(p.planVersions))VERS=p.planVersions;save();SEL_MONTH=months().slice(-1)[0]||SEL_MONTH;PERIOD_KEY='';renderAll();cloudState('☁ Downloaded '+new Date().toLocaleTimeString());toast('Cloud downloaded')}else{cloudState('☁ No cloud data',false);toast('No cloud data')}}catch(e){cloudState('☁ Download failed',false);toast('Download failed')}}
function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('on')}function closeModal(){$('modal').classList.remove('on')}
function toggleLang(){LANG=LANG==='zh'?'en':LANG==='en'?'km':'zh';$('langBtn').textContent=LANG==='zh'?'中':LANG==='en'?'EN':'ខ្មែរ'}
$('fileInput').addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''});
load();refresh();renderDashboard();
</script></body></html>
