<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   VRT Production Plan & Capacity Control Center v2.0
   單頁生產排產與產能分析系統 — 依 Production Plan Excel 分析日/週/月/年產能
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 全域狀態 ──────────────────────────────────────────────────────────── */
const VER = 'production_plan_capacity_v2';
let DB = [];                 // 主資料
let SMV_MAP = {};            // normalizeStyle(style) -> smv
let IMPORT_HISTORY = [];     // 匯入紀錄
let SETTINGS = {
  lang: 'zh',
  dayMode: 'working',        // working | calendar
  excludeSunday: true,
  defaultEff: 0.30,
  defaultHours: 8,
  gasUrl: '',
  tgChatId: '',
  cloudOn: false
};
let CHARTS = {};             // Chart.js 實例
let EDIT_ID = null;          // 目前編輯的 record id
let PENDING_DUP = null;      // 待處理的重複匯入

const LS_SET = 'ppc_settings';
const LS_HIST = 'ppc_import_history';
const LS_VERS = 'ppc_plan_versions_v2';
let PLAN_VERSIONS = []; // compact weekly snapshots; newest first

/* ── IndexedDB 主儲存 ─────────────────────────────────────────────────── */
const IDB_NAME = 'ProdPlanCapacity', IDB_STORE = 'records', IDB_META = 'meta';
function openIDB(){
  return new Promise((res,rej)=>{
    const build = db => {
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'id'});
      if(!db.objectStoreNames.contains(IDB_META)) db.createObjectStore(IDB_META,{keyPath:'k'});
    };
    const tryOpen = ver => new Promise((r2,j2)=>{
      const rq = ver ? indexedDB.open(IDB_NAME, ver) : indexedDB.open(IDB_NAME);
      rq.onupgradeneeded = e=>build(e.target.result);
      rq.onsuccess = e=>r2(e.target.result);
      rq.onerror = ()=>j2(rq.error);
    });
    // 自我修復：版本衝突改不帶版本；缺 store 升版補建
    tryOpen(1)
      .catch(err=>{ if(err&&err.name==='VersionError') return tryOpen(null); throw err; })
      .then(db=>{
        if(db.objectStoreNames.contains(IDB_STORE)&&db.objectStoreNames.contains(IDB_META)) return res(db);
        const nv=db.version+1; db.close();
        return tryOpen(nv).then(res);
      })
      .catch(rej);
  });
}
async function idbSaveAll(){
  try{
    const db = await openIDB();
    const tx = db.transaction([IDB_STORE,IDB_META],'readwrite');
    const st = tx.objectStore(IDB_STORE);
    st.clear();
    DB.forEach(r=>st.put(r));
    tx.objectStore(IDB_META).put({k:'smvMap', v:SMV_MAP});
    return new Promise((res)=>{ tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
  }catch(e){ console.warn('idbSaveAll',e); }
}
async function idbLoadAll(){
  try{
    const db = await openIDB();
    const tx = db.transaction([IDB_STORE,IDB_META],'readonly');
    const recs = await new Promise(r=>{ const rq=tx.objectStore(IDB_STORE).getAll(); rq.onsuccess=()=>r(rq.result||[]); rq.onerror=()=>r([]); });
    const meta = await new Promise(r=>{ const rq=tx.objectStore(IDB_META).get('smvMap'); rq.onsuccess=()=>r(rq.result?rq.result.v:{}); rq.onerror=()=>r({}); });
    DB = recs || [];
    SMV_MAP = meta || {};
  }catch(e){ console.warn('idbLoadAll',e); DB=[]; }
}
async function persist(){ await idbSaveAll(); saveSettings(); saveHistory(); saveVersions(); refreshHeader(); }

function saveSettings(){ try{ localStorage.setItem(LS_SET, JSON.stringify(SETTINGS)); }catch(e){} }
function loadSettings(){ try{ const s=JSON.parse(localStorage.getItem(LS_SET)||'null'); if(s) SETTINGS={...SETTINGS,...s}; }catch(e){}
  if(!SETTINGS.gasUrl){ const pu=(localStorage.getItem('vrt_portal_gas_url')||'').trim(); if(pu) SETTINGS.gasUrl=pu; } }
function saveHistory(){ try{ localStorage.setItem(LS_HIST, JSON.stringify(IMPORT_HISTORY)); }catch(e){} }
function loadHistory(){ try{ IMPORT_HISTORY=JSON.parse(localStorage.getItem(LS_HIST)||'[]'); }catch(e){ IMPORT_HISTORY=[]; } }
function saveVersions(){ try{ localStorage.setItem(LS_VERS,JSON.stringify(PLAN_VERSIONS.slice(0,12))); }catch(e){ console.warn('saveVersions',e); } }
function loadVersions(){ try{ PLAN_VERSIONS=JSON.parse(localStorage.getItem(LS_VERS)||'[]'); if(!Array.isArray(PLAN_VERSIONS)) PLAN_VERSIONS=[]; }catch(e){ PLAN_VERSIONS=[]; } }

/* ── 多語系 ───────────────────────────────────────────────────────────── */
const I18N = {

function t(k){ return (I18N[SETTINGS.lang]||I18N.zh)[k] || I18N.zh[k] || k; }
function toggleLang(){
  SETTINGS.lang = SETTINGS.lang==='zh'?'en':SETTINGS.lang==='en'?'km':'zh';
  saveSettings(); applyLang(); renderAll();
}
function applyLang(){
  document.documentElement.lang = SETTINGS.lang==='zh'?'zh-TW':SETTINGS.lang==='km'?'km':'en';
  document.getElementById('langBtn').textContent = SETTINGS.lang==='zh'?'🌐 EN':SETTINGS.lang==='en'?'🌐 ខ្មែរ':'🌐 中文';
  document.getElementById('hTitle').textContent = t('sysTitle');
  document.getElementById('hSub').textContent = t('sysSub');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
}

/* ── 工具函式 ─────────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeHtml(s){ return esc(s); }
function fmt(n){ const x=Number(n)||0; return x.toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmt1(n){ const x=Number(n)||0; return x.toLocaleString('en-US',{maximumFractionDigits:1}); }
function toNum(v){ if(v==null||v==='')return null; const n=Number(String(v).replace(/,/g,'').trim()); return isNaN(n)?null:n; }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2200); }

// 本地時區日期字串 (絕不用 toISOString)
function ymd(d){ if(!(d instanceof Date)||isNaN(d))return ''; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr(){ return ymd(new Date()); }
function nowStamp(){ const d=new Date(); return `${ymd(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }

// Excel 序號 / 日期字串 → YYYY-MM-DD
function anyToYMD(v){
  if(v==null||v==='')return '';
  if(v instanceof Date && !isNaN(v)) return ymd(v);
  // 純數字 → Excel serial
  const n = typeof v==='number' ? v : (/^\d+(\.\d+)?$/.test(String(v).trim()) ? Number(v) : null);
  if(n!=null && n>1 && n<80000){
    const ms=(n-25569)*86400*1000;         // Excel serial → unix ms (UTC)
    const d=new Date(ms);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  // 日期字串
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if(m) return `${m[3]}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;

}

// 款式標準化 (供 SMV 模糊匹配)：去空白去符號大寫
function normStyle(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function smvLookup(style){
  const k=normStyle(style);
  if(k && SMV_MAP[k]!=null) return SMV_MAP[k];
  return null;
}

// 工作天數 (依 dayMode)
function countWorkingDays(startYMD,endYMD){
  const s=parseYMD(startYMD), e=parseYMD(endYMD);
  if(!s||!e||e<s) return 0;
  let cnt=0; const d=new Date(s);
  while(d<=e){
    if(SETTINGS.dayMode==='calendar' || !SETTINGS.excludeSunday || d.getDay()!==0) cnt++;
    d.setDate(d.getDate()+1);
  }
  return cnt || 1;
}
function isActiveOnDate(rec,dateYMD){
  if(!rec.startDate||!rec.endDate) return false;
  return dateYMD>=rec.startDate && dateYMD<=rec.endDate;
}
// 每筆訂單的每日計劃車縫量
function dailyPlannedQty(rec){
  const active = countWorkingDays(rec.startDate,rec.endDate) || 1;
  const sew = rec.sewingQty || 0;
  if(rec.dailyOutput) return Math.min(rec.dailyOutput, sew>0?sew:rec.dailyOutput);
  return active>0 ? sew/active : sew;
}
// 某日某筆訂單的排產量 (需該日是工作日)
function plannedQtyOnDate(rec,dateYMD){
  if(!isActiveOnDate(rec,dateYMD)) return 0;
  const d=parseYMD(dateYMD);
  if(SETTINGS.dayMode==='working' && SETTINGS.excludeSunday && d.getDay()===0) return 0;
  return dailyPlannedQty(rec);
}

/* ── 裁縫狀態判斷 ─────────────────────────────────────────────────────── */
function cutStatus(rec){
  const sew=rec.sewingQty||0, cut=rec.cutQty;

  if(cut >= sew) return 'ok';
  return 'short';
}

/* ── 資料清洗 normalizeData ───────────────────────────────────────────── */
function upperType(v){
  const s=String(v||'').trim().toUpperCase();
  if(!s) return '';
  if(s.startsWith('GARM')) return 'GARMENT';
  if(s.startsWith('APRON')) return 'APRON';
  if(s==='TOP'||s.startsWith('TOP')) return 'TOP';
  return s;
}
function normLine(v){
  if(v==null||v==='') return '';
  const s=String(v).trim();
  if(/^\d+$/.test(s)) return 'Line '+s;
  if(/^line/i.test(s)) return 'Line '+s.replace(/^line\s*/i,'');
  return s;
}
function normPO(v){ if(v==null)return ''; return String(v).trim(); }

function normalizeRecord(raw){
  const r = {...raw};
  r.productType = upperType(r.productType);
  r.line = normLine(r.line);
  r.customer = String(r.customer||'').trim().toUpperCase();
  r.po = normPO(r.po);
  r.styleRaw = String(r.style||'').trim();
  r.style = r.styleRaw.toUpperCase();
  r.color = String(r.color||'').trim();
  r.size = String(r.size||'').trim();
  ['orderQty','sewingQty','cutQty','dailyOutput','manpower','workingHours','planDays','weeklyOutput','monthlyOutput','plannedHoursOrDays'].forEach(f=>{ r[f]=toNum(r[f]); });
  r.efficiencyTarget = toNum(r.efficiencyTarget);
  if(r.efficiencyTarget!=null && r.efficiencyTarget>1) r.efficiencyTarget=r.efficiencyTarget/100; // 30 → 0.30
  r.shipmentDate = anyToYMD(r.shipmentDate);
  r.startDate = anyToYMD(r.startDate);
  r.endDate = anyToYMD(r.endDate);
  r.finishDate = anyToYMD(r.finishDate);
  r.remark = String(r.remark||'').trim();
  // SMV：空白時用 style 對照
  if(r.smv==null || r.smv===''){ const s=smvLookup(r.style); if(s!=null) r.smv=s; }
  else r.smv=toNum(r.smv);
  // dailyOutput 反推
  if((r.dailyOutput==null||r.dailyOutput===0) && r.sewingQty && r.planDays) r.dailyOutput=Math.round(r.sewingQty/r.planDays);
  // planDays 反推
  if((r.planDays==null||r.planDays===0) && r.sewingQty && r.dailyOutput) r.planDays=Math.ceil(r.sewingQty/r.dailyOutput);
  if(!r.id) r.id=uid();

function uniqueKey(r){
  return [r.productType,r.line,r.customer,r.po,r.style,r.color,r.size,r.startDate,r.endDate].join('|');

// 判斷一列是否為空

let PARSED_PREVIEW = null;
function handleFiles(files){
  const arr=[...files]; if(!arr.length) return;
  let allRecs=[], fileNames=[];
  let done=0;
  arr.forEach(file=>{
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:false,raw:true});
        buildSmvMapFromSheet(wb);
        const {records}=parseMainSheet(wb);
        // 二次補 SMV (剛建好對照表)
        records.forEach(r=>{ if(r.smv==null){ const s=smvLookup(r.style); if(s!=null) r.smv=s; } r._srcFile=file.name; });
        allRecs=allRecs.concat(records);
        fileNames.push(file.name+' ('+records.length+')');
      }catch(err){ console.error(err); toast('解析失敗: '+file.name); }
      if(++done===arr.length){
        PARSED_PREVIEW={records:allRecs, files:fileNames};
        renderUpload();
      }
    };
    rd.readAsArrayBuffer(file);
  });

function resolveDup(mode){
  const {dups,cb}=PENDING_DUP||{};
  document.getElementById('dupModal').classList.remove('on');
  if(!PENDING_DUP) return;
  if(mode==='replace'){
    dups.forEach(r=>{ const i=DB.findIndex(x=>x._key===r._key); if(i>=0){ r.id=DB[i].id; DB[i]=r; } });
  } else if(mode==='revision'){
    dups.forEach(r=>{ r.id=uid(); r._key=r._key+'|rev'+Date.now().toString(36).slice(-3); r.remark=(r.remark?r.remark+' ':'')+'[REV]'; DB.push(r); });
  } // skip: 不動作
  PENDING_DUP=null;
  cb && cb();

function activeRecords(){ return DB.filter(r=>r.startDate&&r.endDate); }

  const ds=list.map(r=>r.startDate).filter(Boolean).sort();
  const de=list.map(r=>r.endDate).filter(Boolean).sort();
  return { min: ds[0]||'', max: de[de.length-1]||'' };
}
function eachDate(startYMD,endYMD,cb){
  const s=parseYMD(startYMD), e=parseYMD(endYMD); if(!s||!e)return;
  const d=new Date(s);
  while(d<=e){ cb(ymd(d), d); d.setDate(d.getDate()+1); }

// 一段期間內每筆訂單分攤加總

    if(SETTINGS.dayMode==='working'&&SETTINGS.excludeSunday&&dobj.getDay()===0){ daily[dstr]=daily[dstr]||0; return; }

    list.forEach(r=>{
      const q=plannedQtyOnDate(r,dstr);
      if(q>0){ sew+=q; daily[dstr]+=q; byLine[r.line]=(byLine[r.line]||0)+q; byCust[r.customer]=(byCust[r.customer]||0)+q; byProd[r.productType]=(byProd[r.productType]||0)+q; styles.add(r.style); lines.add(r.line); custs.add(r.customer); }
    });
  });

    if(r.startDate<=endYMD && r.endDate>=startYMD){ activeOrders.push(r); if(r.cutQty) cutNeed+=r.cutQty; }
  });
  return {sew:Math.round(sew), cutNeed, byLine, byCust, byProd,
    styles:styles.size, lines:lines.size, custs:custs.size, daily, activeOrders};
}

function weekBounds(anyYMD){
  const d=parseYMD(anyYMD)||new Date();
  const dow=d.getDay(); // 0=Sun
  const monOff = dow===0?-6:1-dow;
  const mon=new Date(d); mon.setDate(d.getDate()+monOff);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return {start:ymd(mon), end:ymd(sun)};
}
function monthBounds(ym){ // ym = 'YYYY-MM'
  const [y,m]=ym.split('-').map(Number);
  const s=new Date(y,m-1,1), e=new Date(y,m,0);
  return {start:ymd(s), end:ymd(e)};
}
function yearBounds(y){ return {start:y+'-01-01', end:y+'-12-31'}; }

function fyGroup(list){ // 產品/客戶/線別彙總 (整體，用原始 qty)
  const g={};
  list.forEach(r=>{ g[r.customer]=g[r.customer]||{}; });
  return g;
}
// 客戶彙總
function summarizeBy(list,keyFn){
  const map={};
  list.forEach(r=>{
    const k=keyFn(r)||'(空)';
    const o=map[k]||(map[k]={key:k, orderQty:0, sewQty:0, cutQty:0, cutHas:false, styles:new Set(), pos:new Set(), lines:new Set(), starts:[], ends:[], recs:[]});
    o.orderQty+=r.orderQty||0; o.sewQty+=r.sewingQty||0;
    if(r.cutQty!=null){ o.cutQty+=r.cutQty; o.cutHas=true; }
    o.styles.add(r.style); o.pos.add(r.po); o.lines.add(r.line);
    if(r.startDate) o.starts.push(r.startDate); if(r.endDate) o.ends.push(r.endDate);
    o.recs.push(r);
  });
  return Object.values(map).map(o=>({
    key:o.key, orderQty:o.orderQty, sewQty:o.sewQty, cutQty:o.cutQty, cutHas:o.cutHas,
    gap:o.cutQty-o.sewQty, styles:o.styles.size, pos:o.pos.size, lines:o.lines.size,
    minStart:o.starts.sort()[0]||'', maxEnd:o.ends.sort().slice(-1)[0]||'', recs:o.recs
  })).sort((a,b)=>b.sewQty-a.sewQty);
}

// 線別理論產能 & 負荷
function theoreticalCapacity(rec, days){
  const mp=rec.manpower||0, wh=rec.workingHours||SETTINGS.defaultHours, smv=rec.smv;
  const eff=(rec.efficiencyTarget!=null?rec.efficiencyTarget:SETTINGS.defaultEff);
  if(!mp||!smv||smv<=0) return null;
  return mp*wh*60/smv*eff*(days||1);
}

function chartOpt(extra){

}
function pieChart(id,obj){
  const entries=Object.entries(obj).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  destroyChart(id);
  if(!entries.length){ document.getElementById(id).parentElement.innerHTML='<div class="empty" style="padding:30px">-</div>'; return; }
  CHARTS[id]=new Chart(document.getElementById(id),{type:'doughnut',
    data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>Math.round(e[1])),backgroundColor:CHART_COLORS,borderWidth:1,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12}}}}});

function barRows(obj){
  const entries=Object.entries(obj).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return `<div class="empty" style="padding:20px">-</div>`;
  const max=entries[0][1];
  return entries.map(([k,v])=>`<div class="bar-row">
    <div class="bar-lb">${esc(k)}</div>
    <div class="bar-tk"><div class="bar-in" style="width:${(v/max*100).toFixed(1)}%"></div></div>
    <div class="bar-vl">${fmt(Math.round(v))}</div></div>`).join('');
}
function startEndChart(id){

function buildMgmtSummary(){
  const totSew=DB.reduce((s,r)=>s+(r.sewingQty||0),0);
  const totCut=DB.filter(r=>r.cutQty!=null).reduce((s,r)=>s+(r.cutQty||0),0);
  const pct= totSew?(totCut/totSew*100):0;
  const lines=new Set(DB.filter(r=>r.line).map(r=>r.line)).size;
  const custS=summarizeBy(DB,r=>r.customer);
  const prodS=summarizeBy(DB,r=>r.productType);

  // 線別負荷
  const rng=dateRangeOfDB(activeRecords());
  const stats=rng.min?periodStats(activeRecords(),rng.min,rng.max):{byLine:{}};
  const lineArr=Object.entries(stats.byLine).sort((a,b)=>b[1]-a[1]);
  const peakLine=lineArr[0];
  const shortCnt=DB.filter(r=>cutStatus(r)==='short').length;
  const noCutCnt=DB.filter(r=>cutStatus(r)==='nodata').length;
  // 即將上/下線 (今天起 7 天)
  const today=todayStr();
  const in7=(()=>{const d=parseYMD(today)||new Date();d.setDate(d.getDate()+7);return ymd(d);})();
  const starting=DB.filter(r=>r.startDate>=today&&r.startDate<=in7).length;
  const finishing=DB.filter(r=>r.endDate>=today&&r.endDate<=in7).length;

  const L=SETTINGS.lang;
  let txt;
  if(L==='en'){
    txt=`This Production Plan covers <b>${lines}</b> lines with a total planned sewing output of <b>${fmt(totSew)} pcs</b> and total cut of <b>${fmt(totCut)} pcs</b> (cut vs sewing ≈ <b>${fmt1(pct)}%</b>). `
      + (topProd?`Capacity is concentrated in <b>${esc(topProd.key)}</b> products; `:'')
      + (topCust?`the largest customer is <b>${esc(topCust.key)}</b> (${fmt(topCust.sewQty)} pcs). `:'')
      + (peakLine?`The highest-load line is <b>${esc(peakLine[0])}</b>. `:'');
  } else if(L==='km'){
    txt=`ផែនការនេះគ្របដណ្តប់ <b>${lines}</b> ខ្សែ ដេរសរុប <b>${fmt(totSew)} pcs</b> កាត់សរុប <b>${fmt(totCut)} pcs</b> (កាត់/ដេរ ≈ <b>${fmt1(pct)}%</b>). `
      + (topProd?`ផលិតផលសំខាន់៖ <b>${esc(topProd.key)}</b>. `:'')
      + (topCust?`អតិថិជនធំបំផុត៖ <b>${esc(topCust.key)}</b>. `:'')
      + (peakLine?`ខ្សែបន្ទុកខ្ពស់៖ <b>${esc(peakLine[0])}</b>. `:'');
  } else {
    txt=`本期 Production Plan 涵蓋 <b>${lines}</b> 條線，總車縫排產量 <b>${fmt(totSew)} pcs</b>，總裁剪量 <b>${fmt(totCut)} pcs</b>，裁剪對車縫比例約 <b>${fmt1(pct)}%</b>。`
      + (topProd?`目前主要產能集中在 <b>${esc(topProd.key)}</b> 類產品；`:'')
      + (topCust?`最大客戶為 <b>${esc(topCust.key)}</b>（${fmt(topCust.sewQty)} pcs）；`:'')
      + (peakLine?`最高負荷線別為 <b>${esc(peakLine[0])}</b>。`:'');
  }
  let alerts='';
  if(shortCnt) alerts+=`<div class="al al-e">🔴 ${L==='en'?`${shortCnt} orders are short of cut pieces — confirm cutting supply before line start.`:L==='km'?`${shortCnt} ការបញ្ជាទិញកាត់មិនគ្រប់។`:`有 ${shortCnt} 張訂單裁片短缺，需優先確認裁剪供應是否跟上上線日。`}</div>`;
  if(noCutCnt) alerts+=`<div class="al al-w">⚪ ${L==='en'?`${noCutCnt} orders have no cut data yet — please update cutting records.`:L==='km'?`${noCutCnt} ការបញ្ជាទិញគ្មានទិន្នន័យកាត់។`:`有 ${noCutCnt} 張訂單尚未填裁剪資料，需補齊裁片數據。`}</div>`;

  if(finishing) alerts+=`<div class="al al-ok">🏁 ${L==='en'?`${finishing} orders finish within 7 days.`:L==='km'?`${finishing} ការបញ្ជាទិញនឹងបញ្ចប់ក្នុង 7 ថ្ងៃ។`:`未來 7 天內有 ${finishing} 張訂單即將下線。`}</div>`;
  return `<div style="font-size:13.5px;line-height:1.7;color:#2d3a5e;margin-bottom:10px">${txt}</div>${alerts}`;
}

function periodKpiRow(stats,extra){

/* ── 日報 ─────────────────────────────────────────────────────────────── */
function renderDaily(){

  const list=applyFilters(activeRecords(),f);
  const active=list.filter(r=>isActiveOnDate(r,f.date));
  const starting=list.filter(r=>r.startDate===f.date);
  const finishing=list.filter(r=>r.endDate===f.date);
  let plannedSew=0, cutNeed=0, byLine={};
  active.forEach(r=>{ const q=plannedQtyOnDate(r,f.date); plannedSew+=q; if(r.cutQty)cutNeed+=r.cutQty; byLine[r.line]=(byLine[r.line]||0)+q; });
  const kpi=(cls,n,u,l)=>`<div class="kpi ${cls}"><div class="kpi-n">${n}<span class="kpi-u">${u||''}</span></div><div class="kpi-l">${l}</div></div>`;

  el.innerHTML=`

function dow(ymdStr){ const d=parseYMD(ymdStr); if(!d)return''; return ['週日','週一','週二','週三','週四','週五','週六'][d.getDay()]; }
function shiftDate(scope,delta){ const d=parseYMD(FILTERS[scope].date)||new Date(); d.setDate(d.getDate()+delta); FILTERS[scope].date=ymd(d); renderTab(scope); }
function miniList(list){

  destroyChart('cMonDaily');
  CHARTS.cMonDaily=new Chart(document.getElementById('cMonDaily'),{type:'line',

function weeklySplit(daily){
  const w={};
  Object.entries(daily).forEach(([d,v])=>{ const wb=weekBounds(d); const k='W '+wb.start.slice(5); w[k]=(w[k]||0)+v; });
  return w;
}

/* ── 線別產能 ─────────────────────────────────────────────────────────── */
function renderLineCap(){
  const el=document.getElementById('line');
  if(!DB.length){ el.innerHTML=emptyState(); return; }
  // 期間：全體排產範圍
  const rng=dateRangeOfDB(activeRecords());
  // 每條線的訂單
  const byLine={};
  activeRecords().forEach(r=>{ (byLine[r.line]=byLine[r.line]||[]).push(r); });
  const lineNames=Object.keys(byLine).sort((a,b)=>{
    const na=parseInt(a.replace(/\D/g,''))||0, nb=parseInt(b.replace(/\D/g,''))||0; return na-nb; });

  const cards=lineNames.map(ln=>{
    const recs=byLine[ln];
    // 該線期間排產量 (依日分攤)
    let planned=0; const stats=periodStats(recs,rng.min,rng.max); planned=stats.sew;
    // 理論產能：取該線平均 manpower/wh/smv * 工作天
    const days=countWorkingDays(rng.min,rng.max);
    // 用代表值 (第一筆有 smv 者)
    const rep=recs.find(r=>r.smv&&r.manpower)||recs[0];
    const theo=rep?theoreticalCapacity(rep,days):null;
    const load = theo? planned/theo*100 : null;
    const cls = load==null?'md':load>=100?'over':load>=70?'hi':load>=40?'md':'lo';
    const totSew=recs.reduce((s,r)=>s+(r.sewingQty||0),0);
    const totCut=recs.filter(r=>r.cutQty!=null).reduce((s,r)=>s+(r.cutQty||0),0);
    const custs=[...new Set(recs.map(r=>r.customer))];
    const styles=[...new Set(recs.map(r=>r.style))];
    const barColor = load==null?'#9ca3af':load>=100?'#dc2626':load>=70?'#059669':load>=40?'#d97706':'#dc2626';
    return `<div class="lc ${cls}">
      <div class="lc-name">${esc(ln)} <span class="pill">${recs.length} orders</span></div>
      <div style="font-size:11px;color:#6b7a9e;margin-top:3px">${esc(custs.slice(0,3).join(', '))}${custs.length>3?'…':''}</div>
      <div class="load-bar"><div class="load-fill" style="width:${load==null?0:Math.min(100,load).toFixed(0)}%;background:${barColor}"></div></div>
      <div style="font-size:11px;color:#4a5578;text-align:right">${t('load')}: <b>${load==null?'N/A':fmt1(load)+'%'}</b></div>
      <div class="mini">
        <div class="mini-c"><div class="mini-n">${fmt(totSew)}</div><div class="mini-l">${t('sewQty')}</div></div>
        <div class="mini-c"><div class="mini-n">${totCut?fmt(totCut):'-'}</div><div class="mini-l">${t('cutQty')}</div></div>
        <div class="mini-c"><div class="mini-n">${rep&&rep.manpower?rep.manpower:'-'}</div><div class="mini-l">${t('manpower')}</div></div>
        <div class="mini-c"><div class="mini-n">${rep&&rep.smv?rep.smv:'-'}</div><div class="mini-l">${t('smv')}</div></div>
      </div>
      <div style="font-size:10.5px;color:#8b95b8;margin-top:6px">${styles.length} ${t('style')} · ${theo?t('theoCap')+' '+fmt(Math.round(theo)):''}</div>
    </div>`;
  }).join('');

  // 詳細表
  const rows=activeRecords().sort((a,b)=>{
    const na=parseInt(a.line.replace(/\D/g,''))||0, nb=parseInt(b.line.replace(/\D/g,''))||0;
    return na-nb || (a.startDate>b.startDate?1:-1);
  }).map(r=>{
    const days=r.planDays||countWorkingDays(r.startDate,r.endDate);
    const theo=theoreticalCapacity(r,days);
    const load=theo?(r.sewingQty||0)/theo*100:null;
    const st=cutStatus(r);
    return `<tr>

/* ── 裁縫比對 ─────────────────────────────────────────────────────────── */
function renderCutSew(){
  const el=document.getElementById('cutsew');
  if(!DB.length){ el.innerHTML=emptyState(); return; }
  const totSew=DB.reduce((s,r)=>s+(r.sewingQty||0),0);
  const totCut=DB.filter(r=>r.cutQty!=null).reduce((s,r)=>s+(r.cutQty||0),0);
  const shortN=DB.filter(r=>cutStatus(r)==='short').length;
  const noN=DB.filter(r=>cutStatus(r)==='nodata').length;
  const overN=DB.filter(r=>cutStatus(r)==='over').length;
  const kpi=(cls,n,u,l)=>`<div class="kpi ${cls}"><div class="kpi-n">${n}<span class="kpi-u">${u||''}</span></div><div class="kpi-l">${l}</div></div>`;
  const sort=FILTERS.cutsew.sort;
  let list=[...DB];
  const gapOf=r=>(r.sewingQty||0)-(r.cutQty||0);
  if(sort==='gap') list.sort((a,b)=>gapOf(b)-gapOf(a));
  else if(sort==='ratio') list.sort((a,b)=>((a.cutQty||0)/(a.sewingQty||1))-((b.cutQty||0)/(b.sewingQty||1)));
  else if(sort==='cust') list.sort((a,b)=>a.customer.localeCompare(b.customer));

  const rows=list.map(r=>{
    const st=cutStatus(r); const gap=gapOf(r);
    const ratio=r.sewingQty?(r.cutQty||0)/r.sewingQty*100:0;
    return `<tr>
      <td>${esc(r.customer)}</td><td>${esc(r.po)}</td><td>${esc(r.styleRaw||r.style)}</td>
      <td>${esc(r.color)}</td><td>${esc(r.size)}</td><td>${esc(r.productType)}</td><td>${esc(r.line)}</td>
      <td class="num">${fmt(r.sewingQty)}</td><td class="num">${r.cutQty==null?'<span class="badge b-nodata">'+t('stNoData')+'</span>':fmt(r.cutQty)}</td>
      <td class="num" style="color:${gap>0?'#dc2626':gap<0?'#059669':'#6b7a9e'};font-weight:700">${r.cutQty==null?'-':(gap>0?'-':'+')+fmt(Math.abs(gap))}</td>
      <td class="num">${r.cutQty==null?'-':fmt1(ratio)+'%'}</td>
      <td>${esc(r.startDate)}</td><td>${esc(r.endDate)}</td><td>${statusBadge(st)}</td></tr>`;
  }).join('');

  el.innerHTML=`
    <div class="card"><div class="ct">✂️ Cut vs Sewing</div>
    <div class="kpis">
      ${kpi('a',fmt(totSew),'pcs',t('totalSew'))}
      ${kpi('g',fmt(totCut),'pcs',t('totalCut'))}
      ${kpi('r',fmt(totSew-totCut),'pcs',t('totalGap'))}
      ${kpi('r',shortN,'',t('shortOrders'))}
      ${kpi('',noN,'',t('noDataOrders'))}
      ${kpi('a',overN,'',t('overOrders'))}
    </div>
    <div class="filt"><label class="fl">${t('mode')}
      <select onchange="FILTERS.cutsew.sort=this.value;renderCutSew()">
        <option value="gap" ${sort==='gap'?'selected':''}>${t('gap')} ↓</option>
        <option value="ratio" ${sort==='ratio'?'selected':''}>${t('ratio')} ↑</option>
        <option value="cust" ${sort==='cust'?'selected':''}>${t('cust')}</option>
      </select></label></div>
    <div class="tblwrap"><table><thead><tr>
      <th>${t('cust')}</th><th>${t('po')}</th><th>${t('style')}</th><th>${t('color')}</th><th>${t('size')}</th>
      <th>${t('prodType')}</th><th>${t('line')}</th><th>${t('sewQty')}</th><th>${t('cutQty')}</th>
      <th>${t('gap')}</th><th>${t('ratio')}</th><th>${t('start')}</th><th>${t('end')}</th><th>${t('status')}</th>
    </tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

        ${f.date||f.q||f.cust||f.line?`<button class="btn btn-g btn-sm" onclick="FILTERS.records={q:'',cust:'',po:'',style:'',line:'',date:''};renderRecords()">✕ ${t('filterAll')}</button>`:''}
      </div>

        <th>${t('line')}</th><th>${t('cust')}</th><th>${t('po')}</th><th>${t('style')}</th><th>${t('prodType')}</th>
        <th>${t('color')}</th><th>${t('size')}</th><th>${t('orderQty')}</th><th>${t('sewQty')}</th><th>${t('cutQty')}</th>

const EDIT_FIELDS=[
  ['productType','prodType','select',['GARMENT','APRON','TOP']],['line','line','text'],['customer','cust','text'],
  ['shipmentDate','date','date'],['po','po','text'],['style','style','text'],['color','color','text'],['size','size','text'],
  ['orderQty','orderQty','number'],['sewingQty','sewQty','number'],['cutQty','cutQty','number'],['dailyOutput','dailyOut','number'],
  ['smv','smv','number'],['manpower','manpower','number'],['workingHours','hours','number'],['efficiencyTarget','setEff','number'],
  ['startDate','start','date'],['endDate','end','date'],['finishDate','finishing','date'],['remark','remark','text']
];
function openEdit(id){
  EDIT_ID=id;
  const r = id? DB.find(x=>x.id===id)||{} : {};
  document.getElementById('editTitle').textContent = id? (SETTINGS.lang==='zh'?'✏️ 編輯排產':'✏️ Edit Plan') : t('btnAdd');
  document.getElementById('editForm').innerHTML = EDIT_FIELDS.map(([f,lbl,type,opts])=>{
    let val = r[f]!=null?r[f]:'';
    if(f==='efficiencyTarget' && val!=='' && val<=1) val=Math.round(val*100);
    if(f==='style') val=r.styleRaw||val;
    let input;
    if(type==='select'){ input=`<select id="ef_${f}"><option value=""></option>${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`; }
    else input=`<input id="ef_${f}" type="${type}" value="${esc(val)}">`;
    return `<label>${t(lbl)}${f==='efficiencyTarget'?' %':''}${input}</label>`;
  }).join('');
  document.getElementById('editModal').classList.add('on');
}
function closeEdit(){ document.getElementById('editModal').classList.remove('on'); EDIT_ID=null; }
function saveEdit(){
  const raw={};
  EDIT_FIELDS.forEach(([f])=>{ const el=document.getElementById('ef_'+f); raw[f]=el?el.value:''; });
  if(EDIT_ID) raw.id=EDIT_ID;
  const nr=normalizeRecord(raw);
  if(EDIT_ID){ const i=DB.findIndex(x=>x.id===EDIT_ID); if(i>=0) DB[i]=nr; }
  else DB.push(nr);
  closeEdit(); persist(); renderAll(); toast(t('saved'));
}
function delRecord(id){
  if(!confirm(t('confirmDel'))) return;
  DB=DB.filter(r=>r.id!==id); persist(); renderAll(); toast(t('deleted'));
}

/* ── 匯出 / 備份 ─────────────────────────────────────────────────────── */
function exportExcel(){
  if(!DB.length){ toast('No data'); return; }
  const wb=XLSX.utils.book_new();
  const raw=DB.map(r=>({
    ProductType:r.productType,Line:r.line,Customer:r.customer,ShipmentDate:r.shipmentDate,PO:r.po,Style:r.styleRaw||r.style,
    Color:r.color,Size:r.size,OrderQty:r.orderQty,SewingQty:r.sewingQty,CutQty:r.cutQty,DailyOutput:r.dailyOutput,
    SMV:r.smv,Manpower:r.manpower,WorkingHours:r.workingHours,EfficiencyTarget:r.efficiencyTarget,
    StartDate:r.startDate,EndDate:r.endDate,FinishDate:r.finishDate,PlanDays:r.planDays,Remark:r.remark,
    CutStatus:t(STATUS_BADGE[cutStatus(r)][1])
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(raw),'Raw Data');
  // Daily
  const rng=dateRangeOfDB(activeRecords());
  const dailyRows=[];
  if(rng.min){ const st=periodStats(activeRecords(),rng.min,rng.max);
    Object.keys(st.daily).sort().forEach(d=>dailyRows.push({Date:d,PlannedSewing:Math.round(st.daily[d])})); }
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(dailyRows),'Daily Summary');
  // Weekly
  const weekRows=[];
  if(rng.min){ const st=periodStats(activeRecords(),rng.min,rng.max); const w=weeklySplit(st.daily);
    Object.entries(w).forEach(([k,v])=>weekRows.push({Week:k,PlannedSewing:Math.round(v)})); }
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(weekRows),'Weekly Summary');
  // Monthly
  const monRows=[]; const months=[...new Set(activeRecords().map(r=>r.startDate.slice(0,7)))].sort();
  months.forEach(ym=>{ const mb=monthBounds(ym); const st=periodStats(activeRecords(),mb.start,mb.end);
    monRows.push({Month:ym,PlannedSewing:st.sew,CutNeed:st.cutNeed}); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(monRows),'Monthly Summary');
  // Yearly
  const yrRows=[]; const years=[...new Set(activeRecords().map(r=>r.startDate.slice(0,4)))].sort();
  years.forEach(y=>{ const yb=yearBounds(y); const st=periodStats(activeRecords(),yb.start,yb.end);
    yrRows.push({Year:y,PlannedSewing:st.sew,CutNeed:st.cutNeed}); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(yrRows),'Yearly Summary');
  // Customer
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summarizeBy(DB,r=>r.customer).map(c=>({
    Customer:c.key,OrderQty:c.orderQty,SewingQty:c.sewQty,CutQty:c.cutHas?c.cutQty:'',Gap:c.cutHas?c.gap:'',
    Styles:c.styles,POs:c.pos,DateRange:c.minStart+'~'+c.maxEnd}))),'Customer Summary');
  // Product
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summarizeBy(DB,r=>r.productType).map(p=>({
    ProductType:p.key,SewingQty:p.sewQty,CutQty:p.cutHas?p.cutQty:'',Styles:p.styles,POs:p.pos}))),'Product Summary');
  // Line Capacity
  const lineRows=activeRecords().map(r=>{ const days=r.planDays||countWorkingDays(r.startDate,r.endDate); const theo=theoreticalCapacity(r,days);
    return {Line:r.line,ProductType:r.productType,Customer:r.customer,Style:r.styleRaw||r.style,SewingQty:r.sewingQty,
      CutQty:r.cutQty,DailyOutput:r.dailyOutput,Manpower:r.manpower,WorkingHours:r.workingHours,SMV:r.smv,
      StartDate:r.startDate,EndDate:r.endDate,PlanDays:days,TheoCap:theo?Math.round(theo):'',
      Load:theo?fmt1((r.sewingQty||0)/theo*100)+'%':''}; });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lineRows),'Line Capacity');
  // Cut vs Sewing Gap
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.map(r=>({
    Customer:r.customer,PO:r.po,Style:r.styleRaw||r.style,Color:r.color,Size:r.size,ProductType:r.productType,Line:r.line,
    SewingQty:r.sewingQty,CutQty:r.cutQty,Gap:r.cutQty==null?'':(r.sewingQty||0)-(r.cutQty||0),
    Status:t(STATUS_BADGE[cutStatus(r)][1])}))),'Cut vs Sewing Gap');
  XLSX.writeFile(wb,`VRT_Production_Capacity_${todayStr()}.xlsx`);
  toast('📤 Excel');
}
function exportCSV(){
  if(!DB.length){ toast('No data'); return; }
  const cols=['line','customer','po','style','productType','color','size','orderQty','sewingQty','cutQty','dailyOutput','smv','manpower','workingHours','startDate','endDate','finishDate','remark'];
  const head=cols.join(',');
  const body=DB.map(r=>cols.map(c=>{ let v=(c==='style'?(r.styleRaw||r.style):r[c]); v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+head+'\n'+body],{type:'text/csv;charset=utf-8'});
  dl(blob,`VRT_Production_${todayStr()}.csv`); toast('⬇ CSV');
}
function backupJSON(){
  const payload={version:VER,lastUpdated:nowStamp(),records:DB,settings:SETTINGS,importHistory:IMPORT_HISTORY,smvMap:SMV_MAP,planVersions:PLAN_VERSIONS};
  dl(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`VRT_ProdCapacity_backup_${todayStr()}.json`);
  toast('💾 JSON');
}
function restoreJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=ev=>{ try{ const o=JSON.parse(ev.target.result);
      if(Array.isArray(o.records)) DB=o.records.map(normalizeRecord);
      if(o.settings) SETTINGS={...SETTINGS,...o.settings};
      if(Array.isArray(o.importHistory)) IMPORT_HISTORY=o.importHistory;
      if(o.smvMap) SMV_MAP={...SMV_MAP,...o.smvMap};
      if(Array.isArray(o.planVersions)) PLAN_VERSIONS=o.planVersions;
      persist(); renderAll(); toast('📂 '+t('imported'));
    }catch(err){ toast('Restore failed'); } };
    rd.readAsText(f); };
  inp.click();
}
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

/* ── 雲端 (介面保留，不寫死 token) ───────────────────────────────────── */
async function cloudUpload(){
  if(!SETTINGS.gasUrl){ toast(t('noGas')); goTab('settings'); return; }
  try{
    toast(t('calc'));
    const payload={action:'push',tool:'prodplan',version:VER,lastUpdated:nowStamp(),records:DB,importHistory:IMPORT_HISTORY,planVersions:PLAN_VERSIONS};
    const r=await fetch(SETTINGS.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
    await r.text(); toast('☁️ Upload OK');
  }catch(e){ toast('Upload failed'); console.warn(e); }
}
async function cloudDownload(){
  if(!SETTINGS.gasUrl){ toast(t('noGas')); goTab('settings'); return; }
  try{
    toast(t('calc'));
    const r=await fetch(`${SETTINGS.gasUrl}?action=pull&tool=prodplan`,{redirect:'follow'});
    const j=await r.json();
    // GAS 回應為包裝格式 {ok,data:{tool,chunked,data:PAYLOAD}}；也相容未包裝舊格式
    let o=(j&&j.ok&&j.data)?j.data:j;
    if(o&&o.data&&!Array.isArray(o.records)) o=o.data;
    if(o&&Array.isArray(o.records)){ DB=o.records.map(normalizeRecord);
      if(o.settings) SETTINGS={...SETTINGS,...o.settings};
      if(Array.isArray(o.planVersions)) PLAN_VERSIONS=o.planVersions;
      persist(); renderAll(); toast('☁️ Download OK ('+DB.length+')'); }
    else toast('No cloud data');
  }catch(e){ toast('Download failed'); console.warn(e); }
}
async function cloudSync(){
  if(!SETTINGS.gasUrl){ toast(t('cloudDev')); goTab('settings'); return; }
  await cloudDownload(); await cloudUpload();
}

/* ── 每週排單版本比較 ────────────────────────────────────────────────── */
function latestPlanMonth(){const ms=snapshotMonths(DB);return ms[ms.length-1]||todayStr().slice(0,7)}function changeChips(x){let s='';if(x.type==='added')return '<span class="change-chip ch-add">新增</span>';if(x.type==='removed')return '<span class="change-chip ch-remove">取消</span>';if(x.qtyChanged)s+='<span class="change-chip ch-qty">件數</span>';if(x.dateChanged)s+='<span class="change-chip ch-date">日期</span>';if(x.moved)s+='<span class="change-chip ch-line">移組</span>';return s||'-'}function fmtDelta(n){n=Math.round(Number(n)||0);return `<span class="${n>0?'delta-up':n<0?'delta-down':'delta-same'}">${n>0?'+':''}${fmt(n)}</span>`}
function renderComparison(){const el=document.getElementById('comparison');if(!DB.length){el.innerHTML=emptyState();return}const cur=PLAN_VERSIONS[0]||makePlanVersion(DB,['current']),prev=PLAN_VERSIONS[1],months=cur.months||snapshotMonths(cur.records);let ym=FILTERS.comparison?.ym||latestPlanMonth();if(!months.includes(ym))ym=months[months.length-1]||ym;FILTERS.comparison=FILTERS.comparison||{};FILTERS.comparison.ym=ym;const c=comparePlanVersions(cur,prev,ym);let body=`<div class="card"><div class="ct">🔄 每週 Production Plan 變更</div><div class="cmp-toolbar"><label>月份 <select onchange="FILTERS.comparison.ym=this.value;renderComparison()">${months.map(m=>`<option ${m===ym?'selected':''}>${m}</option>`).join('')}</select></label><span class="pill">Current: ${esc(String(cur.savedAt||'').replace('T',' ').slice(0,16))}</span>${prev?`<span class="pill">Previous: ${esc(String(prev.savedAt||'').replace('T',' ').slice(0,16))}</span>`:''}</div>`;if(!c.comparable){el.innerHTML=body+`<div class="al al-i">${esc(c.reason)}。第一次使用新版時先匯入本週；下週再匯入更新檔後就會自動比較。若現在要測試，可先匯入舊週版本，再匯入最新版本。</div></div>`;return}body+=`<div class="kpis"><div class="kpi b"><div class="kpi-n">${fmtDelta(c.summary.totalDelta)}</div><div class="kpi-l">總排單差異 pcs</div></div><div class="kpi g"><div class="kpi-n">${c.summary.added}</div><div class="kpi-l">新增項目</div></div><div class="kpi r"><div class="kpi-n">${c.summary.removed}</div><div class="kpi-l">取消項目</div></div><div class="kpi a"><div class="kpi-n">${c.summary.qtyChanged}</div><div class="kpi-l">件數變更</div></div><div class="kpi p"><div class="kpi-n">${c.summary.dateChanged}</div><div class="kpi-l">日期變更</div></div><div class="kpi b"><div class="kpi-n">${c.summary.moved}</div><div class="kpi-l">移組</div></div></div></div>`;body+=`<div class="card"><div class="ct">🧵 各組安排變化</div><div class="tblwrap"><table><thead><tr><th>Line</th><th>Qty 上次→本次</th><th>Δ</th><th>款式</th><th>PO</th><th>人數</th><th>日期 上次→本次</th></tr></thead><tbody>${c.lineChanges.map(x=>`<tr><td><b>${esc(x.line)}</b></td><td>${fmt(x.prev.qty)} → ${fmt(x.cur.qty)}</td><td>${fmtDelta(x.qtyDelta)}</td><td>${x.prev.styles} → ${x.cur.styles} (${x.styleDelta>0?'+':''}${x.styleDelta})</td><td>${x.prev.pos} → ${x.cur.pos} (${x.poDelta>0?'+':''}${x.poDelta})</td><td>${x.prev.manpower} → ${x.cur.manpower}</td><td class="${x.dateChanged?'delta-up':''}">${esc(x.prev.start||'-')}~${esc(x.prev.end||'-')}<br>→ ${esc(x.cur.start||'-')}~${esc(x.cur.end||'-')}</td></tr>`).join('')}</tbody></table></div></div>`;const changed=c.changes.slice().sort((a,b)=>Math.abs(b.qtyDelta||0)-Math.abs(a.qtyDelta||0));body+=`<div class="card"><div class="ct">📋 PO / 款式 / 件數 / 日期變更 (${changed.length})</div><div class="tblwrap" style="max-height:520px;overflow:auto"><table><thead><tr><th>變更</th><th>Customer</th><th>PO</th><th>Style / Color / Size</th><th>Line 上次→本次</th><th>Qty 上次→本次</th><th>Start 上次→本次</th><th>End 上次→本次</th></tr></thead><tbody>${changed.map(x=>{const a=x.cur||{},b=x.prev||{};return `<tr><td>${changeChips(x)}</td><td>${esc(a.customer||b.customer)}</td><td>${esc(a.po||b.po)}</td><td>${esc(a.style||b.style)} / ${esc(a.color||b.color)} / ${esc(a.size||b.size)}</td><td>${esc((b.lines||[]).join(',')||'-')} → ${esc((a.lines||[]).join(',')||'-')}</td><td>${fmt(b.qty||0)} → ${fmt(a.qty||0)} ${fmtDelta(x.qtyDelta||0)}</td><td>${esc(b.start||'-')} → ${esc(a.start||'-')}</td><td>${esc(b.end||'-')} → ${esc(a.end||'-')}</td></tr>`}).join('')||'<tr><td colspan="8">No change</td></tr>'}</tbody></table></div></div>`;el.innerHTML=body}
function sendPlanToReport(){const fr=document.getElementById('reportFrame');if(fr&&fr.contentWindow)fr.contentWindow.postMessage({type:'VRT_PLAN_DATA',records:DB,preferredMonth:(FILTERS.comparison&&FILTERS.comparison.ym)||latestPlanMonth()},'*')}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='VRT_REPORT_READY')sendPlanToReport()});
function renderReportGen(){const el=document.getElementById('reportgen');if(!DB.length){el.innerHTML=emptyState();return}el.innerHTML=`<div class="card"><div class="ct">📄 四檔週分析報告</div><div class="report-note">Production Plan 已直接使用本平台目前資料，不必再重複匯入。只需補 Customer Statistics、Shipping Schedule、Fabric Delivery 三份檔案；月份自動抓目前排單月份，截止日預設今天（當月）或月底（過去月份），仍可自行選日期。</div><iframe id="reportFrame" class="report-frame" src="vrt_production_weekly_report_generator_v2.html?embed=1" onload="sendPlanToReport()"></iframe></div>`}

/* ── 設定 ─────────────────────────────────────────────────────────────── */
function renderSettings(){
  const el=document.getElementById('settings');
  const s=SETTINGS;
  el.innerHTML=`
    <div class="card"><div class="ct">⚙️ ${t('tabSettings')}</div>
      <div class="fgrid">
        <label>${t('setLang')}<select onchange="SETTINGS.lang=this.value;saveSettings();applyLang();renderAll()">
          <option value="zh" ${s.lang==='zh'?'selected':''}>繁體中文</option>
          <option value="en" ${s.lang==='en'?'selected':''}>English</option>
          <option value="km" ${s.lang==='km'?'selected':''}>ខ្មែរ</option></select></label>
        <label>${t('setDayMode')}<select onchange="SETTINGS.dayMode=this.value;saveSettings();renderAll()">
          <option value="working" ${s.dayMode==='working'?'selected':''}>${t('dayModeW')}</option>
          <option value="calendar" ${s.dayMode==='calendar'?'selected':''}>${t('dayModeC')}</option></select></label>
        <label>${t('setExSun')}<select onchange="SETTINGS.excludeSunday=this.value==='1';saveSettings();renderAll()">
          <option value="1" ${s.excludeSunday?'selected':''}>${t('on')}</option>
          <option value="0" ${!s.excludeSunday?'selected':''}>${t('off')}</option></select></label>
        <label>${t('setEff')} (%)<input type="number" value="${Math.round(s.defaultEff*100)}" onchange="SETTINGS.defaultEff=Math.max(0,(+this.value||30)/100);saveSettings();renderAll()"></label>
        <label>${t('setHours')}<input type="number" value="${s.defaultHours}" onchange="SETTINGS.defaultHours=+this.value||8;saveSettings();renderAll()"></label>
      </div>
    </div>
    <div class="card"><div class="ct">☁️ ${t('setCloud')}</div>
      <div class="al al-i">${t('cloudDev')}</div>
      <div class="fgrid" style="grid-template-columns:1fr 1fr">
        <label>${t('setGas')}<input type="text" value="${esc(s.gasUrl)}" placeholder="https://script.google.com/.../exec" onchange="SETTINGS.gasUrl=this.value.trim();saveSettings()"></label>
        <label>${t('setTgChat')}<input type="text" value="${esc(s.tgChatId)}" placeholder="-100xxxxxxxxxx" onchange="SETTINGS.tgChatId=this.value.trim();saveSettings()"></label>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn btn-b" onclick="cloudUpload()">${t('clUp')}</button>
        <button class="btn btn-g" onclick="cloudDownload()">${t('clDown')}</button>
        <button class="btn btn-g" onclick="cloudSync()">${t('clSync')}</button>
        <button class="btn btn-g" onclick="sendTelegramSummary()">${t('tgPush')}</button>
      </div>
    </div>
    <div class="card"><div class="ct">💾 ${t('setBackup')}</div>
      <div class="btnrow">
        <button class="btn btn-y" onclick="exportExcel()">${t('expExcel')}</button>
        <button class="btn btn-g" onclick="exportCSV()">${t('expCsv')}</button>
        <button class="btn btn-g" onclick="backupJSON()">${t('bkJson')}</button>
        <button class="btn btn-g" onclick="restoreJSON()">${t('rsJson')}</button>
        <button class="btn btn-g" onclick="window.print()">${t('printR')}</button>
        <button class="btn btn-r" onclick="if(confirm('清空所有資料？Clear all data?')){DB=[];IMPORT_HISTORY=[];persist();renderAll();toast('Cleared');}">🗑 Clear All</button>
      </div>
    </div>`;
}

/* ── 初始化 ───────────────────────────────────────────────────────────── */
document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>goTab(el.dataset.tab)));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('on'); }));

async function init(){
  loadSettings(); loadHistory(); loadVersions();
  await idbLoadAll();
  applyLang(); refreshHeader();
  renderTab('dashboard');
  const bad=DB.filter(r=>r.startDate&&/^19(00|01)/.test(r.startDate)).length;if(bad)setTimeout(()=>toast(`⚠️ 舊版有 ${bad} 筆 1900 日期，請重新匯入最新 Production Plan；新版會自動修正欄位。`),500);
}
init();




</script>
