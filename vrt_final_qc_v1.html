<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRT Final QC · v4.0</title>

<style>
:root{font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#17243e;background:#f0f3f8;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{background:#202d4c;color:#fff;padding:24px clamp(16px,4vw,54px);display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}p{margin:8px 0}a{color:#3264b7}header a{color:#dce9ff}.sub{color:#aabbda;font-size:13px}.grow{flex:1}button,select,input,textarea{font:inherit;max-width:100%;min-height:42px;border:1px solid #ccd6e7;border-radius:8px;padding:9px 12px;background:white;color:#233b61}button{cursor:pointer}button:hover{background:#eaf0fb}button:disabled{opacity:.5;cursor:default}.primary{background:#2361b5;color:white;border-color:#2361b5}.danger{color:#b62432}.bar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:3px;overflow-x:auto;background:#fff;border-bottom:1px solid #d8e0ed;padding:8px 16px}.tabs button{white-space:nowrap;border:0}.tabs .active{background:#e8effd;color:#174b9d;font-weight:700}main{max-width:1440px;margin:auto;padding:24px 20px 110px}.filters{padding:16px;background:#fff;border-radius:12px;margin-bottom:18px}.card{background:#fff;padding:20px;border:1px solid #e0e7f2;border-radius:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}.kpi{background:#fff;padding:18px;border-radius:12px;border:1px solid #dce5f2}.kpi b{display:block;font-size:28px;color:#1658a5}.muted{color:#60738d;font-size:13px}.alert{background:#fff8e4;border:1px solid #eacd7b;padding:12px;border-radius:9px;margin:12px 0}.ok{color:#18754a}.bad{color:#b62432}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}th,td{padding:11px;text-align:left;border-bottom:1px solid #e1e7ef}th{background:#f1f5fb}details{margin:12px 0}summary{cursor:pointer;font-weight:600}.empty{text-align:center;padding:45px 10px;color:#60738d}.drop{display:block;border:2px dashed #77a2db;background:#f1f7ff;border-radius:12px;padding:32px;text-align:center;cursor:pointer}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}label input,label select,label textarea{display:block;width:100%;margin-top:4px}dialog{border:0;border-radius:14px;width:min(960px,96vw);max-height:90vh;padding:24px;overflow:auto;box-shadow:0 20px 80px #17243e55}dialog::backdrop{background:#15254488}textarea{min-height:80px}.chart-row{display:grid;grid-template-columns:150px 1fr 80px;gap:10px;align-items:center;margin:10px 0}.track{background:#edf1f7;border-radius:6px;overflow:hidden}.track span{display:block;min-height:16px;background:#4880c6}.toolbar{margin:14px 0}#qcMessage{white-space:pre-wrap}footer{font-size:12px;color:#63758c;margin-top:22px}@media(max-width:600px){header{padding:20px 16px}h1{font-size:20px}main{padding:16px 12px 115px}.card{padding:15px}.kpis{grid-template-columns:repeat(2,1fr)}.chart-row{grid-template-columns:100px 1fr 70px}.fields{grid-template-columns:1fr}.filters input{width:100%}}@media print{header .actions,.tabs,.filters,.toolbar,button,#vrtSmartSyncStatus{display:none!important}body{background:white}main{padding:0}.card{break-inside:avoid}dialog{position:static}header{color:#111;background:white}}
</style></head><body>
<header><div><h1>✓ Final QC 檢驗管理</h1><div class="sub">檢驗日報 · 缺點 · 效率 · v4.0</div></div><div class="grow"></div><div class="actions"><a href="portal_v2.html">返回平台</a><button onclick="QC.sync('pull')">☁↓ Pull</button><button onclick="QC.sync('push')">☁↑ Push</button><button onclick="QC.settings()">⚙ 設定</button></div></header>
<nav class="tabs" id="qcTabs" aria-label="QC 分頁"></nav><main>
<div class="filters bar"><label>期間 <select id="qcPeriod" onchange="QC.refresh()"><option value="day">日</option><option value="week">週</option><option value="month">月</option><option value="year">年</option><option value="all">全部</option></select></label><button aria-label="上一期" onclick="QC.shift(-1)">◀</button><input id="qcDate" type="date" aria-label="日期" onchange="QC.refresh()"><button aria-label="下一期" onclick="QC.shift(1)">▶</button><select id="qcLine" aria-label="線別" onchange="QC.refresh()"><option value="">全部線別</option></select><input id="qcSearch" placeholder="款式／客戶／PO／備註" aria-label="搜尋" oninput="QC.refresh()"><span id="qcLocal" class="muted"></span></div>
<div id="qcMessage" role="status"></div><div id="qcContent"></div><footer>Reject %＝Reject 合計 ÷ 檢驗合計。效率＝產出分鐘合計 ÷ 出勤分鐘合計。缺點發生次數不等於不良成衣件數；QC 的參考 SMV 不會寫入正式 SMV。</footer>
</main><dialog id="qcDialog"><div class="bar"><h2 id="qcDialogTitle"></h2><div class="grow"></div><button aria-label="關閉" onclick="document.getElementById('qcDialog').close()">✕</button></div><div id="qcDialogBody"></div></dialog>
<script src="vrt-qc-v40.js?v=4.0.0"></script></body></html>
