<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>VRT 品質檢驗分析系統 · Final QC v4.3</title>
<script src="vrt-deploy-config.js?v=4.3.0"></script><script src="vrt-platform-v40.js?v=4.3.0"></script><script src="vendor/xlsx.full.min.js"></script><script src="vrt-data-core-v39.js?v=4.3.0"></script><script src="vrt-import-core-v40.js?v=4.3.0"></script><script src="vrt-qc-core-v42.js?v=4.3.0"></script><script src="vrt-prod-storage-vnext.js?v=4.3.0"></script><script src="vrt-smart-sync-v3.js?v=4.3.0"></script><script src="vrt-auto-sync-v3.js?v=4.3.0"></script><link rel="stylesheet" href="vrt-qc-v42.css?v=4.3.0">
</head><body>
<header class="hdr"><div class="logo" aria-hidden="true">✓</div><div class="hdr-name"><h1>品質檢驗分析系統</h1><p>FINAL QC · v4.3 · AUTO SYNC</p></div><div class="hstats"><div><b id="qcHReports">0</b><span>線別日報</span></div><div><b id="qcHDates">0</b><span>報告天數</span></div><div><b id="qcHLatest">—</b><span>最新日期</span></div></div><div class="header-actions"><a class="header-btn" href="portal_v2.html" title="返回平台">⌂ 平台</a><button class="header-btn" onclick="QC.sync('push').catch(()=>{})" title="上傳新增與修改的資料">☁↑ Push</button><button class="header-btn" onclick="QC.sync('pull').catch(()=>{})" title="下載雲端新增與修改的資料">☁↓ Pull</button><button class="header-btn" onclick="QC.settings()" aria-label="目標與雲端設定">⚙ 設定</button></div></header>
<nav class="tabs" id="qcTabs" aria-label="QC 功能分頁"></nav><main>
<div class="filters" id="qcFilters"><div class="date-controls"><button aria-label="上一期" onclick="QC.shift(-1)">◀</button><input id="qcDate" type="date" aria-label="報告日期" onchange="QC.refresh()"><button aria-label="下一期" onclick="QC.shift(1)">▶</button><select id="qcPeriod" aria-label="統計期間" onchange="QC.refresh()"><option value="day">日</option><option value="week">週</option><option value="month">月</option><option value="year">年</option><option value="all">全部</option></select></div><select id="qcLine" aria-label="線別" onchange="QC.refresh()"><option value="">全部線別</option></select><input id="qcSearch" class="search" placeholder="搜尋款式、客戶、PO、缺點或備註" aria-label="搜尋資料" oninput="QC.refresh()"><span id="qcRange" class="muted"></span></div>
<div id="qcMessage" role="status" aria-live="polite"></div><div id="qcContent"></div><footer><span id="qcLocal"></span><span>不良率＝不良件數 ÷ 檢驗量。加權效率＝產出分鐘 ÷ 出勤分鐘；缺少分鐘時不推算。日報優先於週報，同日同線只計算一次。</span></footer></main>
<dialog id="qcDialog"><div class="dialog-heading"><h2 id="qcDialogTitle"></h2><button aria-label="關閉視窗" onclick="document.getElementById('qcDialog').close()">✕</button></div><div id="qcDialogBody"></div></dialog><script src="vrt-qc-v42.js?v=4.3.0"></script></body></html>
