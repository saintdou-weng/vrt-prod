<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRT BOM Management AI · v2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* ============ TOKENS — pastel ERP / Sewing_v5 style ============ */
:root{
  --bg:#eef2f7; --panel:#ffffff; --panel2:#f7f9fc;
  --ink:#1f2d3d; --ink2:#54657a; --ink3:#90a0b3;
  --line:#e3e9f1; --line2:#eef2f7;
  --brand:#3b6ea5; --brand2:#5a8bc4; --brand-soft:#e7f0f9;
  --blue:#4a90d9; --blue-soft:#e8f1fb;
  --green:#4ea787; --green-soft:#e6f4ee;
  --gray:#7b8aa0; --gray-soft:#eef1f6;
  --amber:#d9a441; --amber-soft:#fbf3e0;
  --red:#d36b6b; --red-soft:#fbeaea;
  --purple:#8e7cc3; --purple-soft:#efeaf7;
  --teal:#4aa4a4; --teal-soft:#e4f3f3;
  --good:#4ea787; --good-soft:#e6f4ee; --bad:#d36b6b; --bad-soft:#fbeaea;
  --warn:#d9a441; --warn-soft:#fbf3e0;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 3px rgba(31,45,61,.06),0 1px 2px rgba(31,45,61,.04);
  --shadow-lg:0 12px 32px rgba(31,45,61,.16);
  --sans:'Noto Sans TC','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --headh:54px; --rib1h:46px; --rib2h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)} .sp{flex:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cdd6e2;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b6c2d2}

/* ============ TOP HEADER ============ */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--headh);z-index:50;
  background:linear-gradient(90deg,#34618f,#3b6ea5);color:#fff;display:flex;align-items:center;
  gap:14px;padding:0 16px;box-shadow:0 2px 10px rgba(31,45,61,.12)}
.hdr .brand{display:flex;align-items:center;gap:11px}
.hdr .brand .mk{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:19px}
.hdr .brand b{font-size:15.5px;font-weight:800;letter-spacing:.3px}
.hdr .brand .ai{font-size:9.5px;background:#fff;color:var(--brand);font-weight:800;padding:2px 6px;
  border-radius:5px;margin-left:3px;vertical-align:middle;letter-spacing:.5px}
.hdr .gsearch{position:relative;margin-left:8px}
.hdr .gsearch i{position:absolute;left:11px;top:9px;color:rgba(255,255,255,.7);font-size:14px}
.hdr .gsearch input{height:34px;width:min(300px,30vw);border:none;border-radius:9px;padding:0 12px 0 33px;
  background:rgba(255,255,255,.15);color:#fff;font-size:13px;outline:none}
.hdr .gsearch input::placeholder{color:rgba(255,255,255,.7)}
.hdr .gsearch input:focus{background:rgba(255,255,255,.24)}
.hdr .cloudtag{display:flex;align-items:center;gap:6px;font-size:11.5px;background:rgba(255,255,255,.14);
  padding:5px 10px;border-radius:20px;font-family:var(--mono)}
.hdr .cloudtag .dot{width:7px;height:7px;border-radius:50%;background:#cdd6e2}
.hdr .cloudtag.dirty .dot{background:var(--amber)} .hdr .cloudtag.synced .dot{background:#7ee0b8}
.hdr .langs{display:flex;background:rgba(255,255,255,.14);border-radius:8px;padding:2px;gap:1px}
.hdr .langs button{border:none;background:transparent;color:rgba(255,255,255,.8);font-size:12px;
  padding:5px 9px;border-radius:6px;cursor:pointer;font-family:var(--sans)}
.hdr .langs button.on{background:#fff;color:var(--brand);font-weight:700}
.hdr .ic{width:34px;height:34px;border-radius:9px;border:none;background:rgba(255,255,255,.14);
  color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hdr .ic:hover{background:rgba(255,255,255,.26)}

/* ============ RIBBON 1 (Office tabs) ============ */
.rib1{position:fixed;top:var(--headh);left:0;right:0;height:var(--rib1h);z-index:49;
  background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;
  padding:0 12px;gap:2px;overflow-x:auto}
.rib1 .tab{padding:0 16px;height:var(--rib1h);display:flex;align-items:center;gap:7px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--ink2);border:none;background:transparent;white-space:nowrap;
  border-bottom:2.5px solid transparent;position:relative}
.rib1 .tab i{font-size:15px}
.rib1 .tab:hover{color:var(--brand);background:var(--brand-soft)}
.rib1 .tab.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ============ RIBBON 2 (contextual sticky toolbar) ============ */
.rib2{position:fixed;top:calc(var(--headh) + var(--rib1h));left:0;right:0;min-height:var(--rib2h);z-index:48;
  background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:5px;padding:8px 14px;overflow-x:auto;flex-wrap:nowrap}
.rib2 .grp{display:flex;align-items:flex-end;gap:3px;padding:0 9px;border-right:1px solid var(--line);height:48px}
.rib2 .grp:last-child{border-right:none}
.rib2 .glbl{position:absolute}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;
  cursor:pointer;padding:5px 9px;border-radius:9px;color:var(--ink2);min-width:54px}
.rbtn i{font-size:19px}
.rbtn span{font-size:10.5px;font-weight:500;white-space:nowrap}
.rbtn:hover{background:var(--brand-soft);color:var(--brand)}
.rbtn.primary{color:var(--brand)} .rbtn.primary i{color:var(--brand)}
.rbtn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.rbtn:disabled{opacity:.38;cursor:not-allowed;background:transparent !important;color:var(--ink3)}
.rib2 . glabel{}

/* ============ MAIN ============ */
.main{margin-top:calc(var(--headh) + var(--rib1h) + var(--rib2h) + 6px);padding:18px 22px 90px;
  max-width:1500px;margin-left:auto;margin-right:auto}
.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.phead .sub{font-size:13px;color:var(--ink3);margin-top:3px}

/* ============ CARDS ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card .ch h3{font-size:14.5px;font-weight:700} .card .ch i{color:var(--brand);font-size:16px}
.card .cb{padding:16px 18px} .card .cb.flush{padding:0}

/* KPI grid */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:13px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.kpi .chip{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.kpi .ttl{font-size:11.5px;color:var(--ink2);font-weight:600;line-height:1.3}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}
.kpi .sub{font-size:11px;color:var(--ink3);margin-top:5px}
.c-blue .chip{background:var(--blue-soft);color:var(--blue)} .c-blue .val{color:var(--blue)}
.c-green .chip{background:var(--green-soft);color:var(--green)} .c-green .val{color:var(--green)}
.c-gray .chip{background:var(--gray-soft);color:var(--gray)} .c-gray .val{color:var(--gray)}
.c-amber .chip{background:var(--amber-soft);color:var(--amber)} .c-amber .val{color:var(--amber)}
.c-red .chip{background:var(--red-soft);color:var(--red)} .c-red .val{color:var(--red)}
.c-purple .chip{background:var(--purple-soft);color:var(--purple)} .c-purple .val{color:var(--purple)}
.c-teal .chip{background:var(--teal-soft);color:var(--teal)} .c-teal .val{color:var(--teal)}
.c-brand .chip{background:var(--brand-soft);color:var(--brand)} .c-brand .val{color:var(--brand)}

/* charts */
.chgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:880px){.chgrid{grid-template-columns:1fr}}
.chbox{height:280px;position:relative}

/* tables */
.tblwrap{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;padding:11px 14px;background:var(--panel2);color:var(--ink2);font-weight:700;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tbl tr:hover td{background:var(--panel2)}
table.tbl td.num,table.tbl th.num{text-align:right;font-family:var(--mono)}
table.tbl td.center,table.tbl th.center{text-align:center}
.lk{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:none}
.lk:hover{text-decoration:underline}
.empty{text-align:center;color:var(--ink3);padding:34px !important}

/* filter bar */
.filterbar{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;margin-bottom:16px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--ink2);font-weight:600}
.inp,select.inp{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:13px;
  background:var(--panel);color:var(--ink);outline:none;font-family:var(--sans);min-width:120px}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{height:auto;padding:9px 11px;resize:vertical;min-height:62px;width:100%}

/* badges / chips */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.b-active{background:var(--green-soft);color:var(--green)}
.b-develop{background:var(--blue-soft);color:var(--blue)}
.b-pending{background:var(--amber-soft);color:var(--amber)}
.b-hold{background:var(--gray-soft);color:var(--gray)}
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px}
.cMainFabric{background:var(--blue-soft);color:var(--blue)}
.cContrast{background:var(--purple-soft);color:var(--purple)}
.cRib{background:var(--teal-soft);color:var(--teal)}
.cLining{background:var(--green-soft);color:var(--green)}
.cPocketing{background:var(--amber-soft);color:var(--amber)}
.cInterlining{background:var(--gray-soft);color:var(--gray)}
.cTrim{background:var(--red-soft);color:var(--red)}
.cThread{background:#fbe8f3;color:#c45b9b}
.cPacking{background:#e8eef9;color:#5a72c4}
.cOthers{background:var(--gray-soft);color:var(--gray)}

/* buttons */
.btn{height:36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
  padding:0 15px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-family:var(--sans);white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:#cfd9e6}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dark:hover{background:#345f90}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:12px}
.btn.lg{height:42px;padding:0 20px;font-size:14px}
.btn i{font-size:15px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(31,45,61,.45);backdrop-filter:blur(2px);z-index:120;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:880px;
  animation:pop .2s ease;max-height:92vh;display:flex;flex-direction:column}
.modal.sm{max-width:440px}.modal.md{max-width:620px}.modal.lg{max-width:1180px}.modal.xl{max-width:1400px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line2)}
.modal .mh h3{font-size:16.5px;font-weight:800} .modal .mh i{color:var(--brand)}
.modal .mh .x{width:32px;height:32px;border-radius:9px;border:none;background:var(--line2);color:var(--ink2);
  font-size:15px;cursor:pointer;margin-left:auto}
.modal .mh .x:hover{background:var(--bad-soft);color:var(--bad)}
.modal .mb{padding:18px 20px;overflow-y:auto}
.modal .mf{display:flex;gap:9px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line2);
  background:var(--panel2);border-radius:0 0 16px 16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fld label{font-size:11.5px;color:var(--ink2);font-weight:600}
.note{padding:10px 14px;border-radius:10px;background:var(--line2);font-size:12.5px;color:var(--ink2);line-height:1.6}
.note.good{background:var(--good-soft);color:var(--green)}
.note.warn{background:var(--warn-soft);color:#a8801f}
.note.blue{background:var(--blue-soft);color:var(--blue)}
.hr{height:1px;background:var(--line2);border:0;margin:15px 0}

/* item editor rows */
.itemtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.itemtbl th{background:var(--panel2);padding:8px 7px;font-size:10.5px;text-transform:uppercase;color:var(--ink2);
  font-weight:700;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.itemtbl td{padding:4px 5px;border-bottom:1px solid var(--line2)}
.itemtbl input,.itemtbl select{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;
  padding:0 7px;font-size:12px;background:var(--panel);font-family:var(--sans)}
.itemtbl input.num{font-family:var(--mono);text-align:right}
.itemtbl input:focus,.itemtbl select:focus{border-color:var(--brand);outline:none}
.irow-del{width:30px;height:30px;border:none;background:var(--bad-soft);color:var(--bad);border-radius:7px;cursor:pointer}

/* PDF import split screen */
.pdfsplit{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:64vh}
@media(max-width:880px){.pdfsplit{grid-template-columns:1fr;height:auto}}
.pdfpane{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--panel2)}
.pdfpane .ph{padding:9px 13px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px;
  font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:7px}
.pdfpane .pc{flex:1;overflow:auto;padding:10px}
.pdfcanvas-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.pdfcanvas-wrap canvas{max-width:100%;box-shadow:var(--shadow);border-radius:6px}
.dropzone{border:2px dashed #c2cfdf;border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;
  background:var(--panel2);transition:.15s}
.dropzone:hover,.dropzone.drag{border-color:var(--brand);background:var(--brand-soft)}
.dropzone i{font-size:46px;color:var(--brand);opacity:.7}
.fileitem{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;font-size:12.5px;margin-bottom:6px}
.fileitem .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileitem .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}

/* toast / fab */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;
  flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--brand);color:#fff;padding:11px 18px;border-radius:11px;box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:.3s;max-width:84vw}
.toast.good{background:var(--good)}.toast.bad{background:var(--bad)}.toast.warn{background:var(--warn)}
.fabs{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;gap:11px;align-items:flex-end}
.fab{width:50px;height:50px;border-radius:15px;border:none;color:#fff;font-size:20px;box-shadow:var(--shadow-lg);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.fab:hover{transform:translateY(-2px) scale(1.04)}
.fab.add{background:var(--brand)}.fab.save{background:var(--good)}.fab.ana{background:var(--purple)}
.fab.top{background:#fff;color:var(--ink2);width:44px;height:44px;font-size:17px;border:1px solid var(--line)}

/* misc */
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;
  font-weight:600;cursor:pointer;color:var(--ink2)}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rptcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.rptcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.rptcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--brand2)}
.rptcard .ic{width:44px;height:44px;border-radius:11px;background:var(--brand-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:11px}
.rptcard h4{font-size:14.5px;font-weight:700;margin-bottom:4px}
.rptcard p{font-size:12px;color:var(--ink3);line-height:1.5}
.bar{height:7px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:var(--brand);border-radius:4px}
.diff-add{background:var(--good-soft)} .diff-mod{background:var(--warn-soft)} .diff-del{background:var(--bad-soft)}
.actlog{display:flex;flex-direction:column}
.actrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);font-size:13px}
.actrow .ai{width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.actrow .at{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto;white-space:nowrap}
@media(max-width:680px){
  .main{padding:14px 12px 90px;margin-top:calc(var(--headh) + var(--rib1h) + var(--rib2h) + 80px)}
  .hdr .gsearch{display:none}
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="hdr">
  <div class="brand"><div class="mk"><i class="bi bi-diagram-3-fill"></i></div>
    <div><b>VRT BOM Management</b><span class="ai">AI</span></div></div>
  <div class="gsearch"><i class="bi bi-search"></i>
    <input id="globalSearch" placeholder="搜尋 Search…" oninput="onGlobalSearch(this.value)"></div>
  <div class="sp"></div>
  <div class="cloudtag" id="cloudTag"><span class="dot"></span><span id="cloudTxt">Local</span></div>
  <button class="ic" onclick="openTelegram()" title="Telegram"><i class="bi bi-send"></i></button>
  <button class="ic" onclick="openBackup()" title="Backup"><i class="bi bi-hdd"></i></button>
  <div class="langs" id="langs">
    <button data-l="zh" class="on" onclick="setLang('zh')">繁</button>
    <button data-l="en" onclick="setLang('en')">EN</button>
    <button data-l="km" onclick="setLang('km')">ខ្មែរ</button>
  </div>
</header>

<!-- ===== RIBBON 1 (tabs) ===== -->
<nav class="rib1" id="rib1"></nav>

<!-- ===== RIBBON 2 (contextual sticky toolbar) ===== -->

/* keyword → category map (AI auto-classification) */
const CLASSIFY_RULES = [
  [/contrast/i,'Contrast Fabric'],
  [/\brib\b|ribbing/i,'Rib'],
  [/pocket/i,'Pocketing'],
  [/inter ?lining|fusible|fusing/i,'Interlining'],
  [/lining/i,'Lining'],
  [/main ?fabric|body ?fabric|shell ?fabric|self ?fabric/i,'Main Fabric'],
  [/thread|sewing thread/i,'Thread'],
  [/poly ?bag|polybag|carton|hang ?tag|hangtag|sticker|barcode|tissue|box(?!er)/i,'Packing'],
  [/label|button|snap|zipper|velcro|elastic|reflective|tape|drawcord|drawstring|eyelet|rivet|cord|webbing|buckle|hook|patch|emblem|stay|prong|socket|stud/i,'Trim']
];
function classifyItem(name){
  const s=String(name||'');
  for(const [re,cat] of CLASSIFY_RULES){ if(re.test(s)) return cat; }
  return 'Others';
}
/* unit auto-detect from free text */
function detectUnit(txt){
  const s=String(txt||'').toLowerCase();
  if(/\byard|yds?\b/.test(s))return'Yards'; if(/\bmeter|metre|\bm\b/.test(s))return'Meter';
  if(/\bpair|prs?\b/.test(s))return'Pair'; if(/\bcone/.test(s))return'Cone';
  if(/\broll/.test(s))return'Roll'; if(/\bkg|kilo/.test(s))return'Kg'; if(/\bgram|gsm|\bg\b/.test(s))return'Gram';
  if(/\bbox/.test(s))return'Box'; if(/\bcarton|ctn/.test(s))return'Carton'; if(/\bset/.test(s))return'Set';
  if(/\bdoz|dz/.test(s))return'Dozen'; if(/\bpcs?\b|piece/.test(s))return'PCS';
  return '';
}

function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10?'0'+n:''+n; }
function nowISO(){ return new Date().toISOString(); }
function localStamp(iso){ const d=iso?new Date(iso):new Date(); if(isNaN(d))return '';
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function localDate(iso){ const d=iso?new Date(iso):new Date(); if(isNaN(d))return '';
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseNum(v){ if(v==null||v==='')return 0; const n=parseFloat(String(v).replace(/[, ]/g,'')); return isNaN(n)?0:n; }
function fmt(n,d){ n=parseNum(n); return n.toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d!=null?d:2}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function startOfWeek(d){ d=new Date(d); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d; }

/* ---------------- IndexedDB (chunked for large datasets) ---------------- */
let idb=null;
function openIDB(){ return new Promise(res=>{
  try{
    const build=d=>{ if(!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE); };
    const tryOpen=ver=>new Promise((r2,j2)=>{ const r=ver?indexedDB.open(IDB_NAME,ver):indexedDB.open(IDB_NAME);
      r.onupgradeneeded=e=>build(e.target.result);
      r.onsuccess=e=>r2(e.target.result); r.onerror=()=>j2(r.error); });
    // 自我修復：版本衝突改不帶版本；缺 store 升版補建
    tryOpen(1)
      .catch(err=>{ if(err&&err.name==='VersionError') return tryOpen(null); throw err; })
      .then(d=>{ if(d.objectStoreNames.contains(IDB_STORE)){ idb=d; return res(idb); }
        const nv=d.version+1; d.close();
        return tryOpen(nv).then(d2=>{ idb=d2; res(idb); }); })
      .catch(()=>{ idb=null; res(null); });
  }catch(e){ idb=null; res(null); } }); }
function idbGet(k){ return new Promise(res=>{ if(!idb)return res(null);
  try{ const rq=idb.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k);
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); }catch(e){ res(null); } }); }
function idbSet(k,v){ return new Promise(res=>{ if(!idb)return res(false);
  try{ const rq=idb.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,k);
    rq.onsuccess=()=>res(true); rq.onerror=()=>res(false); }catch(e){ res(false); } }); }

function markDirty(){ dirty=true; setCloudTag('dirty');
  if(DB.settings.autosave){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,700); } }

async function persist(){
  DB.meta.rev=(DB.meta.rev||0)+1; DB.meta.savedAt=nowISO();
  const json=JSON.stringify(DB);
  // IndexedDB first (handles large data); LocalStorage as fallback mirror
  await idbSet('state',json);
  try{ localStorage.setItem(LS_KEY, json.length<4500000?json:JSON.stringify({_idbOnly:true,meta:DB.meta})); }
  catch(e){ try{ localStorage.setItem(LS_KEY, JSON.stringify({_idbOnly:true,meta:DB.meta})); }catch(_){} }
  dirty=false; setCloudTag(DB.meta.lastSync?'synced':'local');
}
async function loadState(){
  await openIDB();
  let raw=await idbGet('state');
  if(!raw){ try{ const ls=localStorage.getItem(LS_KEY); if(ls && ls.indexOf('_idbOnly')<0) raw=ls; }catch(e){} }
  if(raw){ try{ const d=JSON.parse(raw);
    DB=Object.assign({customers:[],styles:[],settings:{},activity:[],meta:{rev:0}}, d);
    DB.meta=Object.assign({rev:0,pdfImported:0,excelImported:0},DB.meta);
    DB.settings=Object.assign({},DEFAULT_SETTINGS,DB.settings); mergeCfg(); return true; }catch(e){} }
  DB.settings=Object.assign({},DEFAULT_SETTINGS);
  mergeCfg();
  return false;
}

/* ---------------- Undo / Redo (snapshot stacks) ---------------- */
let UNDO=[], REDO=[];
function snapshot(){ try{ UNDO.push(JSON.stringify({customers:DB.customers,styles:DB.styles}));
  if(UNDO.length>40) UNDO.shift(); REDO.length=0; }catch(e){} }
function canUndo(){ return UNDO.length>0; }
function canRedo(){ return REDO.length>0; }
function applySnap(s){ const d=JSON.parse(s); DB.customers=d.customers; DB.styles=d.styles; }
function undo(){ if(!UNDO.length){ toast('無可復原','warn'); return; }
  REDO.push(JSON.stringify({customers:DB.customers,styles:DB.styles}));
  applySnap(UNDO.pop()); markDirty(); persist(); toast('已復原 Undo','good'); render(); renderRibbon2(); }
function redo(){ if(!REDO.length){ toast('無可重做','warn'); return; }
  UNDO.push(JSON.stringify({customers:DB.customers,styles:DB.styles}));
  applySnap(REDO.pop()); markDirty(); persist(); toast('已重做 Redo','good'); render(); renderRibbon2(); }

function normItem(raw,idx){
  const item = raw.item||raw.itemName||raw.Items||raw.name||raw.material||'';
  let fabricCode=raw.fabricCode||'';
  if(!fabricCode){ const fm=item.match(/(?:Main Fabric|Contrast Fabric|Fabric)[-\s]*([A-Za-z0-9.]+)/i); if(fm)fabricCode=fm[1]; }
  const cat = raw.category||classifyItem(item);
  return {
    id: raw.id||uid('it'),
    no: raw.no||idx+1,
    category: CATS.indexOf(cat)>=0?cat:classifyItem(item),
    itemName: item,
    fabricCode,
    description: raw.desc||raw.description||raw.Description||'',
    composition: raw.composition||'',
    weight: raw.weight||'',
    color: raw.color||raw.Color||'',
    shade: raw.shade||'',
    width: raw.width||raw['Width/size']||raw.widthSize||'',
    supplier: raw.supplier||'',
    unit: raw.unit||raw.Unit||detectUnit(item+' '+(raw.desc||''))||(DB.settings.defaultUnit||'Yards'),
    qtyPcs: parseNum(raw.qtyPcs!=null?raw.qtyPcs:(raw['Qty/Unit']!=null?raw['Qty/Unit']:raw.qtyUnit)),
    qtyDozen: parseNum(raw.qtyDozen!=null?raw.qtyDozen:raw['Qty/Dozen']),
    wastePct: raw.wastePct!=null?parseNum(raw.wastePct):(DB.settings.defaultWaste||0),
    unitCost: parseNum(raw.unitCost),
    remark: raw.remark||''
  };
}
function coerceStyle(raw){
  if(!raw||!raw.styleNo) return null;
  const items=(raw.items||[]).map((i,ix)=>normItem(i,ix)).filter(i=>i.itemName);
  if(!items.length && !raw.allowEmpty) return null;
  return {
    id: raw.id||uid('st'),
    customerCode:(raw.customer||raw.customerCode||'OTHER').toString().toUpperCase().trim(),
    styleNo:String(raw.styleNo).trim(), styleName:raw.styleName||'', description:raw.description||'',
    season:raw.season||'', revision:raw.revision||'', department:raw.department||'', factory:raw.factory||'',
    baseSize:raw.baseSize||'', sizeRange:raw.sizeRange||'', sampleDate:raw.sampleDate||'', effectiveDate:raw.effectiveDate||'',
    status:raw.status||'Active', source:raw.source||'manual', dateModified:raw.dateModified||'', remark:raw.remark||'',
    items, versions:raw.versions||[],
    createdAt:raw.createdAt||nowISO(), updatedAt:nowISO()
  };
}

/* ---------------- Accessors / aggregates ---------------- */
function custByCode(c){ return DB.customers.find(x=>x.code===c); }
function custName(c){ const o=custByCode(c); return o?(LANG==='zh'&&o.nameZh?o.nameZh:o.name):c; }
function styleById(id){ return DB.styles.find(s=>s.id===id); }
function bomItemCount(){ return DB.styles.reduce((a,s)=>a+(s.items?s.items.length:0),0); }
function catCount(cat){ return DB.styles.reduce((a,s)=>a+(s.items||[]).filter(i=>i.category===cat).length,0); }
function fabricKinds(){ const set=new Set(); DB.styles.forEach(s=>(s.items||[]).forEach(i=>{ if(i.category==='Main Fabric'&&i.fabricCode)set.add(i.fabricCode); })); return set.size; }
function contrastKinds(){ const set=new Set(); DB.styles.forEach(s=>(s.items||[]).forEach(i=>{ if(i.category==='Contrast Fabric')set.add(i.fabricCode||i.itemName); })); return set.size; }
function trimCount(){ return catCount('Trim'); }
function versionTotal(){ return DB.styles.reduce((a,s)=>a+((s.versions||[]).length),0); }
function countSince(d){ return DB.styles.filter(s=>new Date(s.createdAt)>=d).length; }
function allMaterials(){ const out=[]; DB.styles.forEach(s=>(s.items||[]).forEach(i=>out.push(Object.assign({_style:s.styleNo,_cust:s.customerCode,_sid:s.id},i)))); return out; }
function statusBadge(st){ const map={'Active':'b-active','Develop':'b-develop','Pending':'b-pending','Hold':'b-hold'};
  return `<span class="badge ${map[st]||'b-hold'}">${esc(st||'—')}</span>`; }
function catTag(c){ return `<span class="tag ${CAT_CLASS[c]||'cOthers'}">${esc(catLabel(c))}</span>`; }

let CURRENT='dashboard';

function MAIN(){ return document.getElementById('main'); }

/* ---------- Ribbon 1 (tabs) ---------- */
function buildRibbon1(){
  const el=document.getElementById('rib1'); if(!el)return;
  el.innerHTML=TABS.map(tb=>`<button class="tab ${tb.id===CURRENT?'on':''}" onclick="go('${tb.id}')">
    <i class="bi ${tb.icon}"></i><span>${t(tb.label)}</span></button>`).join('');
}
/* ---------- Ribbon 2 (contextual toolbar) ---------- */
function renderRibbon2(){
  const el=document.getElementById('rib2'); if(!el)return;
  const groups=ribbonFor(CURRENT);
  el.innerHTML=groups.map(g=>{
    const btns=g.b.map(b=>{
      let dis=false; if(b.dis){ try{ dis=!!eval(b.dis); }catch(e){ dis=false; } }
      const label = b.l.indexOf('.')>0 ? t(b.l) : b.l;
      return `<button class="rbtn ${b.cls||''}" ${dis?'disabled':''} onclick="${esc(b.fn)}">
        <i class="bi ${b.i}"></i><span>${esc(label)}</span></button>`;
    }).join('');
    return `<div class="grp">${btns}</div>`;
  }).join('');
}
/* ---------- FABs ---------- */
function setFabs(){
  const el=document.getElementById('fabs'); if(!el)return;
  let html='';
  if(['dashboard','bom','material'].includes(CURRENT))
    html+=`<button class="fab add" title="新增" onclick="openBomEditor()"><i class="bi bi-plus-lg"></i></button>`;
  html+=`<button class="fab ana" title="分析" onclick="go('analysis')"><i class="bi bi-pie-chart"></i></button>`;
  html+=`<button class="fab top" title="回頂端" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="bi bi-arrow-up"></i></button>`;
  el.innerHTML=html;
}
/* ---------- Router ---------- */
function go(tab){ CURRENT=tab; SELECTED_ID=null; buildRibbon1(); renderRibbon2(); setFabs(); render(); window.scrollTo({top:0}); }
function render(){
  buildRibbon1(); renderRibbon2();
  const m=MAIN(); if(!m)return;
  switch(CURRENT){
    case 'dashboard': renderDashboard(); break;
    case 'bom': renderBoms(); break;
    case 'material': renderMaterial(); break;
    case 'analysis': renderAnalysis(); break;
    case 'reports': renderReports(); break;
    case 'import': renderImport(); break;
    case 'settings': renderSettings(); break;
    case 'help': renderHelp(); break;
    default: renderDashboard();
  }
}

  const row=document.getElementById('itemBody').children[i]; if(row) row.querySelectorAll('input.num')[1].value=it.qtyDozen; } }

function readBomForm(){
  const g=id=>document.getElementById(id);

  const items=EDIT_ITEMS.map((it,ix)=>Object.assign({},it,{no:ix+1})).filter(i=>i.itemName.trim());
  return {
    customerCode:g('bCust').value, styleNo, styleName:g('bName').value.trim(),
    revision:g('bRev').value.trim(), season:g('bSeason').value.trim(), status:g('bStatus').value,
    sizeRange:g('bSize').value.trim(), baseSize:g('bBase').value.trim(), department:g('bDept').value.trim(),
    sampleDate:g('bSample').value, effectiveDate:g('bEff').value, description:g('bDesc').value.trim(), items
  };

function saveBom(){
  const f=readBomForm(); if(!f)return;
  snapshot();
  if(!custByCode(f.customerCode)) DB.customers.push({id:uid('cu'),code:f.customerCode,name:f.customerCode,active:true});
  let st, isNew=false;
  if(EDIT_ID){ st=styleById(EDIT_ID);
    st.versions=st.versions||[];
    st.versions.push({ver:st.versions.length+1, ts:nowISO(), editor:DB.settings.dept||'user',
      comment:'更新', items:(st.items||[]).length, snapshot:JSON.stringify(st.items)});
    Object.assign(st,f); st.updatedAt=nowISO();
    logAct('更新 BOM',st.styleNo);
  }else{ isNew=true;
    st=coerceStyle(Object.assign({},f,{source:'manual',allowEmpty:true}));
    st.versions=[{ver:1,ts:nowISO(),editor:DB.settings.dept||'user',comment:'建立',items:st.items.length,snapshot:JSON.stringify(st.items)}];
    DB.styles.push(st); logAct('新增 BOM',st.styleNo);
  }

}
function dupBom(id){ const s=styleById(id); if(!s)return; snapshot();
  const c=coerceStyle(Object.assign({},JSON.parse(JSON.stringify(s)),{id:null,styleNo:s.styleNo+'-COPY',allowEmpty:true,source:'copy'}));
  c.versions=[{ver:1,ts:nowISO(),editor:DB.settings.dept||'user',comment:'複製自 '+s.styleNo,items:c.items.length}];

function delBom(id){ const s=styleById(id); if(!s)return;

function restoreVer(id,ver){ const s=styleById(id); if(!s)return;

  confirmBox(`還原 ${s.styleNo} 至 V${ver}？目前內容會另存為新版本。`,()=>{
    snapshot();
    s.versions.push({ver:s.versions.length+1,ts:nowISO(),editor:DB.settings.dept||'user',comment:'還原前快照',items:(s.items||[]).length,snapshot:JSON.stringify(s.items)});
    s.items=JSON.parse(v.snapshot).map((i,ix)=>normItem(i,ix)); s.updatedAt=nowISO();
    logAct('還原版本',s.styleNo+' V'+ver); markDirty(); persist(); closeModal(); toast('已還原至 V'+ver,'good'); render();

let MATPAGE=0; const MATPER=200;
function clearMatFilter(){ MATFILTER={cust:'',cat:'',q:''}; MATPAGE=0; renderMaterial(); }

function renderMaterial(){
  let mats=allMaterials();
  if(MATFILTER.cust) mats=mats.filter(m=>m._cust===MATFILTER.cust);
  if(MATFILTER.cat) mats=mats.filter(m=>m.category===MATFILTER.cat);

  const total=mats.length, pages=Math.max(1,Math.ceil(total/MATPER));
  if(MATPAGE>=pages)MATPAGE=pages-1;
  const slice=mats.slice(MATPAGE*MATPER,MATPAGE*MATPER+MATPER);

  const custs=DB.customers.slice().sort((a,b)=>a.code.localeCompare(b.code));
  const custOpts=`<option value="">${t('common.all')}</option>`+custs.map(c=>`<option value="${c.code}" ${MATFILTER.cust===c.code?'selected':''}>${esc(c.code)}</option>`).join('');

     <div class="field"><label>${t('col.cat')}</label><select class="inp" onchange="MATFILTER.cat=this.value;MATPAGE=0;renderMaterial()">${catOpts}</select></div>
     <div class="field" style="flex:1;min-width:200px"><label>${t('common.search')}</label>
       <input class="inp" style="width:100%" value="${esc(MATFILTER.q)}" placeholder="物料 / 描述 / 顏色 / 供應商…"
         oninput="MATFILTER.q=this.value;MATPAGE=0;clearTimeout(window._mft);window._mft=setTimeout(renderMaterial,200)"></div>

let CMP={a:'',b:''};
function openVersionCompare(){ CMP={a:DB.styles[0]?DB.styles[0].id:'',b:DB.styles[1]?DB.styles[1].id:''}; cmpModal(); }
function cmpModal(){
  const opts=v=>`<option value="">—</option>`+DB.styles.map(s=>`<option value="${s.id}" ${CMP[v]===s.id?'selected':''}>${esc(s.styleNo)} · ${esc(custName(s.customerCode))}</option>`).join('');
  const a=styleById(CMP.a), b=styleById(CMP.b);

let PDF_QUEUE=[];      // [{name, parsed, raw, status}]
let PDF_PREVIEW=null;  // file currently in split-screen
let PDF_DOC_CACHE={};  // name -> pdfDoc for canvas render

/* ---------- low-level: extract positioned rows from a page ---------- */
function extractRows(textContent){
  const items=textContent.items.filter(it=>it.str && it.str.trim()!=='').map(it=>({
    x:it.transform[4], y:it.transform[5], str:it.str.trim(), w:it.width||0 }));
  items.sort((a,b)=> (b.y-a.y) || (a.x-b.x));
  const rows=[]; let cur=null;
  items.forEach(it=>{
    if(cur && Math.abs(cur.y-it.y)<=3.2){ cur.cells.push(it); }
    else { cur={y:it.y, cells:[it]}; rows.push(cur); }
  });
  rows.forEach(r=>{ r.cells.sort((a,b)=>a.x-b.x); r.text=r.cells.map(c=>c.str).join(' ').replace(/\s+/g,' ').trim(); });
  return rows;
}

/* ---------- detect header row & column map ---------- */
const COL_PATTERNS=[
  {field:'no',     re:/^(n[ºo°]?|#|no\.?|item ?no)$/i},
  {field:'item',   re:/^items?$/i},
  {field:'desc',   re:/^(description|desc|construction|details?)$/i},
  {field:'color',  re:/^(colou?r|shade)$/i},
  {field:'width',  re:/^(width|width\/?size|size|w\/s)$/i},
  {field:'qtyUnit',re:/^(qty\/?unit|qty\/?pcs|consumption|usage|per ?pcs|qty ?per)$/i},
  {field:'qtyDozen',re:/^(qty\/?dozen|dozen|per ?dozen|qty\/?doz)$/i},
  {field:'unit',   re:/^(unit|uom)$/i}
];
function detectHeader(rows){
  for(let r=0;r<rows.length;r++){
    const cells=rows[r].cells;
    const joined=rows[r].text.toLowerCase();
    const hasItems=/items?\b/.test(joined);
    const hasQty=/(qty|consumption|usage|dozen)/.test(joined);
    const hasDesc=/(description|desc|construction)/.test(joined);
    if(hasItems && (hasQty||hasDesc)){
      // build column map from cells
      const cols=[];
      cells.forEach(c=>{
        let field=null;
        for(const p of COL_PATTERNS){ if(p.re.test(c.str.replace(/[\s.]/g,''))||p.re.test(c.str)){ field=p.field; break; } }
        // fuzzy contains
        if(!field){ const s=c.str.toLowerCase();
          if(/item/.test(s))field='item'; else if(/desc|construct/.test(s))field='desc';
          else if(/colou?r|shade/.test(s))field='color'; else if(/width|size/.test(s))field='width';
          else if(/dozen|doz/.test(s))field='qtyDozen'; else if(/qty|consum|usage/.test(s))field='qtyUnit';
          else if(/unit|uom/.test(s))field='unit'; else if(/^n|no|#/.test(s))field='no'; }
        cols.push({x:c.x, field});
      });
      // ensure ascending x
      cols.sort((a,b)=>a.x-b.x);
      if(cols.filter(c=>c.field).length>=2) return {row:r, cols};
    }
  }
  return null;
}
function assignCol(x, cols){
  // nearest column whose x <= cell x (left-aligned columns); fallback nearest
  let best=cols[0], bestd=1e9;
  for(const c of cols){ const d=Math.abs(c.x-x); if(x>=c.x-6 && d<bestd){ best=c; bestd=d; } }
  if(bestd===1e9){ for(const c of cols){ const d=Math.abs(c.x-x); if(d<bestd){ best=c; bestd=d; } } }
  return best.field;
}

/* ---------- detect metadata (style / customer / etc) ---------- */
function detectMeta(rows){
  const meta={customer:'',styleNo:'',revision:'',sizeRange:'',baseSize:'',dateModified:''};
  const blob=rows.map(r=>r.text).join('\n');
  const grab=(re)=>{ const m=blob.match(re); return m?m[1].trim():''; };
  meta.customer = grab(/customer\s*[:\-]?\s*([A-Za-z][A-Za-z0-9 &.\-]{1,30})/i);
  meta.styleNo  = grab(/style\s*(?:no|number|#)?\s*[:\-]?\s*([A-Za-z0-9._\-\/]{2,30})/i);
  meta.revision = grab(/rev(?:ision)?\.?\s*[:\-]?\s*([A-Za-z0-9.\-]{1,12})/i);
  meta.sizeRange= grab(/size\s*range\s*[:\-]?\s*([A-Za-z0-9 ,\-\/]{1,40})/i);
  meta.baseSize = grab(/base\s*size\s*[:\-]?\s*([A-Za-z0-9 \-]{1,20})/i);
  meta.dateModified = grab(/(?:date|modified)\s*(?:folder\s*modified)?\s*[:\-]?\s*([0-9]{1,2}[\/\-.][0-9]{1,2}[\/\-.][0-9]{2,4})/i);
  // VANTAGE RIVER appears in these sheets; customer often near top
  if(!meta.customer){ const m=blob.match(/\b(ADI|AMERICAN DAWN|LECHNER|VESTIS|CINTAS|ARAMARK|NORTHERN)\b/i); if(m)meta.customer=m[1]; }
  return meta;
}

/* ---------- parse one pdf's rows into a style record ---------- */
function parsePdfRows(rows){
  const meta=detectMeta(rows);
  const hdr=detectHeader(rows);
  const items=[];
  if(hdr){
    const cols=hdr.cols;
    for(let r=hdr.row+1;r<rows.length;r++){
      const row=rows[r];
      // stop at footer-ish rows
      if(/^(total|remark|note|approved|prepared|signature|page \d)/i.test(row.text)) continue;
      const rec={no:'',item:'',desc:'',color:'',width:'',qtyUnit:'',qtyDozen:'',unit:''};
      row.cells.forEach(c=>{ const f=assignCol(c.x,cols); if(f){ rec[f]=(rec[f]?rec[f]+' ':'')+c.str; } });
      // require an item-ish name OR a numeric consumption to count as a row
      const name=(rec.item||'').trim();
      const hasNum=parseNum(rec.qtyUnit)>0||parseNum(rec.qtyDozen)>0;
      if(!name && !hasNum) continue;
      if(/^[\d.]+$/.test(name) && !hasNum) continue; // pure number stray
      items.push({
        no: rec.no||items.length+1,
        item: name||rec.desc.slice(0,30),
        desc: rec.desc.trim(),
        color: rec.color.trim(),
        width: rec.width.trim(),
        qtyPcs: parseNum(rec.qtyUnit),
        qtyDozen: parseNum(rec.qtyDozen),
        unit: rec.unit.trim()||detectUnit(name+' '+rec.desc),
        category: classifyItem(name||rec.desc)
      });
    }
  }
  return { customer:(meta.customer||'OTHER').toUpperCase().trim(), styleNo:meta.styleNo,
    revision:meta.revision, sizeRange:meta.sizeRange, baseSize:meta.baseSize, dateModified:meta.dateModified,
    source:'pdf', items };
}

/* ---------- read + parse a PDF File ---------- */
async function parsePdfFile(file){
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  PDF_DOC_CACHE[file.name]=doc;
  let allRows=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const tc=await page.getTextContent();
    allRows=allRows.concat(extractRows(tc));
  }
  const parsed=parsePdfRows(allRows);
  if(!parsed.styleNo){ // fallback: filename
    parsed.styleNo=file.name.replace(/\.pdf$/i,'').replace(/[^A-Za-z0-9._\-]/g,'').slice(0,24)||'STYLE';
  }
  return parsed;
}

/* file pickers */
function pickFile(accept,cb,multiple){ const inp=document.createElement('input'); inp.type='file'; inp.accept=accept;
  if(multiple)inp.multiple=true; inp.onchange=()=>cb(Array.from(inp.files)); inp.click(); }
function pickPDF(){ pickFile('.pdf,application/pdf',handlePdfFiles,true); }
function pickExcel(){ pickFile('.xlsx,.xls,.csv',files=>importExcelFiles(files)); }
function pickJSON(){ pickFile('.json',files=>files[0]&&importJSONFile(files[0])); }
function pickBackup(){ pickFile('.json',files=>files[0]&&restoreBackup(files[0])); }
function onPdfDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drag');
  handlePdfFiles(Array.from(e.dataTransfer.files).filter(f=>/\.pdf$/i.test(f.name))); }
function onXlsDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drag');
  importExcelFiles(Array.from(e.dataTransfer.files).filter(f=>/\.(xlsx|xls|csv)$/i.test(f.name))); }

async function handlePdfFiles(files){
  if(!files||!files.length) return;
  if(!window.pdfjsLib){ toast('PDF.js 尚未載入，請檢查網路','bad'); return; }
  if(CURRENT!=='import') go('import');
  for(const f of files){
    const entry={name:f.name, parsed:null, status:'busy'}; PDF_QUEUE.push(entry); renderImport();
    try{ entry.parsed=await parsePdfFile(f); entry.status='ok'; }
    catch(err){ console.error(err); entry.status='err'; entry.err=err.message; }
    renderImport();
  }
  const ok=PDF_QUEUE.filter(f=>f.status==='ok').length;
  toast('PDF 辨識完成 · '+ok+' 檔','good');
}

async function renderPdfCanvas(name){
  const wrap=document.getElementById('pdfCanvas'); if(!wrap)return;
  const doc=PDF_DOC_CACHE[name];
  if(!doc){ wrap.innerHTML='<div class="muted" style="padding:20px">無法載入 PDF 影像</div>'; return; }
  wrap.innerHTML='';
  const pages=Math.min(doc.numPages,3);
  for(let p=1;p<=pages;p++){
    const page=await doc.getPage(p);
    const vp=page.getViewport({scale:1.1});
    const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    wrap.appendChild(cv);
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  }
}

/* ---------- import a parsed entry (with collision handling) ---------- */
function importParsed(i, fromPreview){
  const f=PDF_QUEUE[i]; if(!f)return;
  const src = (fromPreview&&PDF_EDIT)?PDF_EDIT:f.parsed;
  doImportStyle(src,()=>{
    DB.meta.pdfImported=(DB.meta.pdfImported||0)+1;
    f.status='done'; markDirty(); persist();
    if(fromPreview)closeModal();
    toast('已匯入 · '+src.styleNo,'good'); render();
  });
}
function importAllQueue(){
  const ok=PDF_QUEUE.filter(f=>f.status==='ok');
  if(!ok.length){ toast('無可匯入項目','warn'); return; }
  snapshot();
  let n=0;
  ok.forEach(f=>{ const st=coerceStyle(Object.assign({},f.parsed,{allowEmpty:true}));
    if(!st)return;
    if(!custByCode(st.customerCode)) DB.customers.push({id:uid('cu'),code:st.customerCode,name:st.customerCode,active:true});
    const exist=DB.styles.find(x=>x.styleNo===st.styleNo&&x.customerCode===st.customerCode);
    if(exist){ exist.items=st.items; exist.updatedAt=nowISO(); (exist.versions=exist.versions||[]).push({ver:exist.versions.length+1,ts:nowISO(),editor:'pdf',comment:'PDF 覆蓋',items:st.items.length}); }
    else { st.source='pdf'; st.versions=[{ver:1,ts:nowISO(),editor:'pdf',comment:'PDF 匯入',items:st.items.length}]; DB.styles.push(st); }
    f.status='done'; n++; DB.meta.pdfImported=(DB.meta.pdfImported||0)+1; logAct('PDF 匯入',st.styleNo);
  });
  markDirty(); persist(); toast('已匯入 '+n+' 個款式','good'); render();
}
/* generic import with create/overwrite/merge/version prompt */
function doImportStyle(src, done){
  const st=coerceStyle(Object.assign({},src,{allowEmpty:true,source:src.source||'pdf'}));
  if(!st){ toast('無有效物料','warn'); return; }
  if(!custByCode(st.customerCode)) DB.customers.push({id:uid('cu'),code:st.customerCode,name:st.customerCode,active:true});
  const exist=DB.styles.find(x=>x.styleNo===st.styleNo&&x.customerCode===st.customerCode);
  if(!exist){ snapshot(); st.versions=[{ver:1,ts:nowISO(),editor:'import',comment:'匯入',items:st.items.length}];
    DB.styles.push(st); logAct('匯入 BOM',st.styleNo); done&&done(); return; }
  // collision
  openModal(`<div class="mh"><i class="bi bi-exclamation-triangle"></i><h3>款式已存在</h3><button class="x" onclick="closeModal()">×</button></div>
   <div class="mb"><div class="note warn">「${esc(st.styleNo)}」（${esc(st.customerCode)}）已存在 ${(exist.items||[]).length} 項物料。新匯入有 ${st.items.length} 項。請選擇處理方式：</div></div>
   <div class="mf" style="justify-content:flex-start;flex-wrap:wrap">
     <button class="btn" onclick="resolveCollision('version')"><i class="bi bi-clock-history"></i> 建立新版本</button>
     <button class="btn" onclick="resolveCollision('overwrite')"><i class="bi bi-arrow-repeat"></i> 覆蓋</button>
     <button class="btn" onclick="resolveCollision('merge')"><i class="bi bi-union"></i> 合併</button>
     <div class="sp" style="flex:1"></div>
     <button class="btn" onclick="closeModal();window._impDone=null">取消</button>
   </div>`,'md');
  window._impTarget=exist; window._impSrc=st; window._impDone=done;
}
function resolveCollision(mode){
  const exist=window._impTarget, st=window._impSrc, done=window._impDone;
  if(!exist||!st){ closeModal(); return; }
  snapshot();
  (exist.versions=exist.versions||[]).push({ver:exist.versions.length+1,ts:nowISO(),editor:'import',
    comment:'匯入前快照('+mode+')',items:(exist.items||[]).length,snapshot:JSON.stringify(exist.items)});
  if(mode==='overwrite'){ exist.items=st.items; }
  else if(mode==='merge'){ const map={}; (exist.items||[]).forEach(i=>map[i.itemName]=i);
    st.items.forEach(i=>{ map[i.itemName]=i; }); exist.items=Object.values(map); }
  else if(mode==='version'){ exist.items=st.items; }
  exist.updatedAt=nowISO(); logAct('匯入合併('+mode+')',exist.styleNo);
  closeModal(); done&&done();
}

/* parse an AOA: supports flat (customer,style,item,...) or construction-style header */
function parseSheetAOA(aoa,sheetName){
  if(!aoa||!aoa.length) return [];
  // locate header row with Items + qty/desc
  let hr=-1, cols={};
  for(let r=0;r<Math.min(aoa.length,25);r++){
    const low=aoa[r].map(c=>String(c).toLowerCase().trim());
    if(low.some(c=>/item/.test(c)) && low.some(c=>/(qty|consum|dozen|desc)/.test(c))){
      hr=r; low.forEach((c,ci)=>{
        if(/item/.test(c))cols.item=ci; else if(/desc|construct/.test(c))cols.desc=ci;
        else if(/colou?r|shade/.test(c))cols.color=ci; else if(/width|size/.test(c))cols.width=ci;
        else if(/dozen|doz/.test(c))cols.dozen=ci; else if(/qty|consum|usage/.test(c))cols.qty=ci;
        else if(/unit|uom/.test(c))cols.unit=ci; else if(/category|cat/.test(c))cols.cat=ci;
        else if(/customer/.test(c))cols.cust=ci; else if(/style/.test(c))cols.style=ci;
      }); break;
    }
  }
  if(hr<0) return [];
  // metadata from rows above header
  const meta={customer:'',styleNo:'',sizeRange:'',baseSize:''};
  for(let r=0;r<hr;r++){ const line=aoa[r].join(' ');
    let m; if((m=line.match(/customer\s*[:\-]?\s*([A-Za-z][\w &.\-]{1,30})/i)))meta.customer=m[1].trim();
    if((m=line.match(/style\s*(?:no|#)?\s*[:\-]?\s*([\w.\-\/]{2,30})/i)))meta.styleNo=m[1].trim();
    if((m=line.match(/size\s*range\s*[:\-]?\s*([\w ,\-\/]{1,40})/i)))meta.sizeRange=m[1].trim();
  }
  // group rows: if customer/style columns exist → multi-style flat; else single style from meta
  const hasInline = cols.cust!=null || cols.style!=null;
  const groups={};
  for(let r=hr+1;r<aoa.length;r++){ const row=aoa[r]; if(!row||!row.length)continue;
    const item=String(cols.item!=null?row[cols.item]:'').trim(); if(!item)continue;
    const cust=(hasInline&&cols.cust!=null?String(row[cols.cust]).trim():meta.customer)||'OTHER';
    const style=(hasInline&&cols.style!=null?String(row[cols.style]).trim():meta.styleNo)||sheetName||'STYLE';
    const key=cust+'||'+style; (groups[key]=groups[key]||{customer:cust,styleNo:style,sizeRange:meta.sizeRange,source:'excel',items:[]});
    groups[key].items.push({ item, desc:cols.desc!=null?row[cols.desc]:'', color:cols.color!=null?row[cols.color]:'',
      width:cols.width!=null?row[cols.width]:'', qtyPcs:cols.qty!=null?row[cols.qty]:'', qtyDozen:cols.dozen!=null?row[cols.dozen]:'',
      unit:cols.unit!=null?row[cols.unit]:'', category:cols.cat!=null?row[cols.cat]:classifyItem(item) });
  }
  return Object.values(groups).filter(g=>g.items.length);
}

   ==================================================================== */
async function gasPost(url,payload){ const body=new URLSearchParams();
  Object.keys(payload).forEach(k=>body.set(k, typeof payload[k]==='object'?JSON.stringify(payload[k]):payload[k]));
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body.toString()});
  const txt=await r.text(); try{ return JSON.parse(txt); }catch(e){ return {ok:false,raw:txt}; } }
function dedupKey(s){ return (s.customerCode||'')+'|'+(s.styleNo||''); }
async function cloudPush(){ const url=DB.settings.cloudProxy; if(!url){ toast('請先設定 Cloud URL','warn'); go('settings'); return; }
  setCloudTag('dirty'); toast('上傳中…',''); try{
    const styles=DB.styles; const chunks=[]; for(let i=0;i<styles.length;i+=CHUNK_SIZE)chunks.push(styles.slice(i,i+CHUNK_SIZE));
    await gasPost(url,{action:'pushMeta',system:'vrt_bom2',rev:DB.meta.rev||0,chunks:chunks.length,customers:DB.customers,savedAt:nowISO()});
    for(let i=0;i<chunks.length;i++) await gasPost(url,{action:'pushChunk',system:'vrt_bom2',index:i,total:chunks.length,data:chunks[i]});
    if(!chunks.length) await gasPost(url,{action:'pushChunk',system:'vrt_bom2',index:0,total:0,data:[]});
    DB.meta.lastSync=nowISO(); markDirty(); persist(); setCloudTag('synced'); toast('已上傳雲端 ('+styles.length+')','good'); if(CURRENT==='settings')render();
  }catch(e){ setCloudTag('local'); toast('上傳失敗：'+e.message,'bad'); } }
async function cloudPull(){ const url=DB.settings.cloudProxy; if(!url){ toast('請先設定 Cloud URL','warn'); go('settings'); return; }
  toast('下載中…',''); try{
    const meta=await gasPost(url,{action:'pullMeta',system:'vrt_bom2'}); const total=(meta&&meta.chunks)||0; let styles=[];
    for(let i=0;i<total;i++){ const c=await gasPost(url,{action:'pullChunk',system:'vrt_bom2',index:i}); if(c&&Array.isArray(c.data))styles=styles.concat(c.data); }
    snapshot(); const map={}; DB.styles.forEach(s=>map[dedupKey(s)]=s);
    styles.forEach(s=>{ const k=dedupKey(s); map[k]=Object.assign({},map[k]||{},coerceStyle(Object.assign({},s,{allowEmpty:true}))||s); });
    DB.styles=Object.values(map);
    if(meta&&Array.isArray(meta.customers))meta.customers.forEach(c=>{ if(!custByCode(c.code))DB.customers.push(Object.assign({id:uid('cu')},c)); });
    DB.meta.lastSync=nowISO(); markDirty(); persist(); setCloudTag('synced'); logAct('雲端下載',styles.length+' 款式'); toast('已合併 '+styles.length+' 款式','good'); render();
  }catch(e){ toast('下載失敗：'+e.message,'bad'); } }

function downloadBackup(){ const p={_app:'VRT_BOM',_ver:2,_exported:nowISO(),customers:DB.customers,styles:DB.styles,settings:DB.settings,activity:DB.activity,meta:DB.meta};
  downloadFile('VRT_BOM_Backup_'+localDate().replace(/-/g,'')+'.json',JSON.stringify(p,null,2),'application/json'); toast('備份已下載','good'); }
function restoreBackup(file){ if(!file)return; const fr=new FileReader();
  fr.onload=()=>{ try{ const d=JSON.parse(fr.result); const styles=(d.styles||[]).map(s=>coerceStyle(Object.assign({},s,{allowEmpty:true}))).filter(Boolean);
    confirmBox(`合併 ${styles.length} 款式與 ${(d.customers||[]).length} 客戶？`,()=>{ snapshot();
      (d.customers||[]).forEach(c=>{ if(!custByCode(c.code))DB.customers.push(Object.assign({id:uid('cu')},c)); });
      const map={}; DB.styles.forEach(s=>map[dedupKey(s)]=s); styles.forEach(s=>map[dedupKey(s)]=s); DB.styles=Object.values(map);
      if(d.settings)DB.settings=Object.assign({},DB.settings,d.settings); markDirty(); persist(); logAct('還原備份',styles.length+' 款式');
      toast('還原完成','good'); closeModal(); render();
    },{danger:false,ok:'合併還原'});
  }catch(e){ toast('檔案錯誤：'+e.message,'bad'); } }; fr.readAsText(file); }
function wipeAll(){ confirmBox('永久刪除所有 BOM、客戶與紀錄，無法復原（保留通知/雲端設定）。確定？',()=>{
  DB={customers:[],styles:[],settings:Object.assign({},DEFAULT_SETTINGS,{tgProxy:DB.settings.tgProxy,tgChat:DB.settings.tgChat,cloudProxy:DB.settings.cloudProxy}),activity:[],meta:{rev:0,pdfImported:0,excelImported:0}};
  UNDO=[];REDO=[]; persist(); toast('已清除全部','warn'); closeModal(); go('dashboard'); },{ok:'全部清除'}); }

/* ---------- Toast ---------- */
function toast(msg,type){ const w=document.getElementById('toasts'); if(!w)return;
  const el=document.createElement('div'); el.className='toast'+(type?' '+type:'');
  const ic=type==='good'?'check-circle':type==='bad'?'x-circle':type==='warn'?'exclamation-triangle':'info-circle';
  el.innerHTML=`<i class="bi bi-${ic}"></i>${esc(msg)}`; w.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(8px)'; },2600);
  setTimeout(()=>el.remove(),3000); }

/* ---------- Confirm ---------- */
function confirmBox(msg,onYes,opts){ opts=opts||{}; const danger=opts.danger!==false;
  openModal(`<div class="mh"><i class="bi bi-question-circle"></i><h3>${esc(opts.title||'確認')}</h3><button class="x" onclick="closeModal()">×</button></div>
   <div class="mb"><p style="line-height:1.7;margin:2px 0">${esc(msg)}</p></div>
   <div class="mf"><button class="btn" onclick="closeModal()">${esc(opts.cancel||t('common.cancel'))}</button>
     <button class="btn ${danger?'danger':'dark'}" id="cfYes">${esc(opts.ok||t('common.ok'))}</button></div>`,'sm');
  const y=document.getElementById('cfYes'); if(y)y.onclick=()=>{ closeModal(); try{ onYes&&onYes(); }catch(e){ console.error(e); toast('操作失敗：'+e.message,'bad'); } }; }

/* ---------- CSV helpers ---------- */
function csvCell(v){ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function splitCSV(line){ const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; } }
  out.push(cur); return out.map(s=>s.trim()); }

/* ---------- Global search ---------- */
function onGlobalSearch(v){ v=(v||'').trim(); FILTER={cust:'',status:'',q:v};
  if(CURRENT!=='bom')go('bom'); else renderBoms(); }

/* ---------- Charts ---------- */
let CH={};
const PALETTE=['#4a90d9','#8e7cc3','#4aa4a4','#4ea787','#d9a441','#7b8aa0','#d36b6b','#c45b9b','#5a72c4','#6aa84f'];
function killChart(id){ if(CH[id]){ try{ CH[id].destroy(); }catch(e){} CH[id]=null; } }
function makeChart(id,cfg){ const cv=document.getElementById(id); if(!cv||typeof Chart==='undefined')return; killChart(id); CH[id]=new Chart(cv.getContext('2d'),cfg); }
function drawDashCharts(){
  const byCat={}; CATS.forEach(c=>byCat[c]=0); DB.styles.forEach(s=>(s.items||[]).forEach(i=>{ byCat[i.category]=(byCat[i.category]||0)+1; }));
  const labels=CATS.filter(c=>byCat[c]>0), vals=labels.map(c=>byCat[c]);
  makeChart('chMat',{type:'doughnut',data:{labels:labels.map(catLabel),datasets:[{data:vals,backgroundColor:PALETTE,borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}}}}});
  const byCust={}; DB.styles.forEach(s=>{ byCust[s.customerCode]=(byCust[s.customerCode]||0)+1; }); const cu=Object.keys(byCust);
  makeChart('chCust',{type:'bar',data:{labels:cu.map(custName),datasets:[{label:'款式',data:cu.map(c=>byCust[c]),backgroundColor:'#4a90d9',borderRadius:7,maxBarThickness:46}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
}
function drawAnalysisCharts(byCat,byCust){
  const cats=Object.keys(byCat||{}).filter(c=>byCat[c]>0);
  makeChart('aCat',{type:'pie',data:{labels:cats.map(catLabel),datasets:[{data:cats.map(c=>byCat[c]),backgroundColor:PALETTE,borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}}}}});
  const cu=Object.keys(byCust||{});
  makeChart('aCust',{type:'bar',data:{labels:cu.map(custName),datasets:[{label:'BOM 項目',data:cu.map(c=>byCust[c]),backgroundColor:'#8e7cc3',borderRadius:7,maxBarThickness:46}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
}

/* ---------- Seed ---------- */
function seedDefaults(){
  [{code:'ADI',name:'ADI',nameZh:'ADI',active:true},
   {code:'LECHNER',name:'Lechner',nameZh:'Lechner',active:true},
   {code:'AMERICAN DAWN',name:'American Dawn',active:true}].forEach(c=>{ if(!custByCode(c.code))DB.customers.push(Object.assign({id:uid('cu')},c)); });
  let raw=[]; try{ raw=JSON.parse(document.getElementById('seedData').textContent||'[]'); }catch(e){ raw=[]; }
  raw.forEach(r=>{ const st=coerceStyle(Object.assign({},r,{allowEmpty:true,source:'seed'}));
    if(st){ st.status='Active';
      st.versions=[{ver:1,ts:nowISO(),editor:'seed',comment:'初始匯入',items:st.items.length,snapshot:JSON.stringify(st.items)}];
      if(!custByCode(st.customerCode))DB.customers.push({id:uid('cu'),code:st.customerCode,name:st.customerCode,active:true});
      DB.styles.push(st); } });
  DB.activity.unshift({ts:nowISO(),action:'系統初始化 · 載入 '+DB.styles.length+' 個範例 BOM',target:'',user:'system'});
}

/* ---------- INIT ---------- */
let _inited=false;
async function init(){
  if(_inited)return; _inited=true;
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  document.documentElement.lang=LANG==='zh'?'zh-Hant':(LANG==='km'?'km':'en');
  const existed=await loadState();
  if(!existed || !DB.styles || DB.styles.length===0){ DB.styles=DB.styles||[]; DB.customers=DB.customers||[]; seedDefaults(); await persist(); }
  buildRibbon1(); setFabs(); go('dashboard');
  setCloudTag(DB.meta&&DB.meta.lastSync?'synced':'local');
  let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(CURRENT==='dashboard')drawDashCharts(); else if(CURRENT==='analysis')render(); },250); });
}
document.addEventListener('DOMContentLoaded',init);
if(document.readyState!=='loading')init();
