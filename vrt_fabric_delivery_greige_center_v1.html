<!DOCTYPE html>
<!-- VRT Fabric Delivery & Greige Inventory Summary Center v1
     VRT 布料交期與胚布庫存分析中心
     家族一致風格：底 #eef1f7 / header #1e2640→#2d3658 / amber #f59e0b
     慣例：GAS POST text/plain;charset=utf-8｜日期一律本地時區 getters｜Telegram parse_mode HTML + escapeHtml｜SheetJS cellDates:false,raw:true｜onclick 全部 window-scoped -->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRT Fabric Delivery & Greige Inventory Summary Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei","Noto Sans TC","Noto Sans Khmer",sans-serif;background:#eef1f7;color:#1e2640;font-size:13px;-webkit-text-size-adjust:100%}
.header{background:linear-gradient(135deg,#1e2640,#2d3658);padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(245,158,11,.35)}
.h-title{color:#fff;font-size:15px;font-weight:700}.h-title b{color:#fbbf24}
.h-sub{font-size:10.5px;color:#8b95b8;margin-top:1px}
.hgrow{flex:1}
.hstat{text-align:right;padding:0 4px}
.hstat-v{font-size:15px;font-weight:700;color:#fbbf24;font-family:ui-monospace,monospace;line-height:1}
.hstat-l{font-size:9px;color:#8b95b8;margin-top:2px}
.hicons{display:flex;gap:5px;flex-wrap:wrap}
.hicon{min-width:31px;height:31px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:7px;cursor:pointer;font-size:14px;transition:.15s;color:#dfe4f0}
.hicon:hover{background:rgba(245,158,11,.25);border-color:#f59e0b}
.hicon.on{background:#f59e0b;color:#1c1200;border-color:#f59e0b;font-weight:700}
.tabbar{background:#263049;padding:6px 14px;display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:58px;z-index:39;border-bottom:1px solid #0d1424}
.tabbar button{background:transparent;border:1px solid transparent;color:#c4cbe0;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.tabbar button.on{background:#f59e0b;color:#1c1200}
.tabbar button:hover:not(.on){background:rgba(255,255,255,.08)}
.wrap{padding:14px;max-width:1500px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:#fff;border-radius:11px;padding:12px 13px;box-shadow:0 1px 4px rgba(30,38,64,.08);border-left:4px solid #cbd2e4;cursor:default}
.card .cv{font-size:20px;font-weight:800;font-family:ui-monospace,monospace;line-height:1.1}
.card .cl{font-size:10.5px;color:#6b7594;margin-top:4px;font-weight:600}
.card .cs{font-size:10px;color:#98a1bd;margin-top:2px}
.card.ok{border-left-color:#10b981}.card.ok .cv{color:#059669}
.card.warn{border-left-color:#f59e0b}.card.warn .cv{color:#d97706}
.card.bad{border-left-color:#ef4444}.card.bad .cv{color:#dc2626}
.card.na{border-left-color:#94a3b8}.card.na .cv{color:#64748b}
.card.info{border-left-color:#3b82f6}.card.info .cv{color:#2563eb}
.panel{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(30,38,64,.08);padding:14px;margin-bottom:14px}
.panel h3{font-size:13.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.panel h3 .tag{font-size:10px;background:#eef1f7;color:#6b7594;border-radius:5px;padding:2px 7px;font-weight:600}
.fbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fbar input,.fbar select{border:1px solid #d5dbea;border-radius:7px;padding:6px 9px;font-size:12px;font-family:inherit;background:#f8fafd;color:#1e2640}
.fbar input:focus,.fbar select:focus{outline:none;border-color:#f59e0b}
.fbar .grow{flex:1}
.btn{border:0;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn.amber{background:#f59e0b;color:#1c1200}.btn.amber:hover{background:#d97706}
.btn.navy{background:#1e2640;color:#fff}.btn.navy:hover{background:#2d3658}
.btn.line{background:#fff;border:1px solid #d5dbea;color:#1e2640}.btn.line:hover{border-color:#f59e0b}
.btn.red{background:#ef4444;color:#fff}
.btn.green{background:#10b981;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tblwrap{overflow-x:auto;border:1px solid #e4e8f2;border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:#f4f6fb;color:#4a5578;text-align:left;padding:7px 9px;font-size:11px;white-space:nowrap;border-bottom:1px solid #e4e8f2;position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{color:#d97706}
td{padding:6px 9px;border-bottom:1px solid #eef1f7;white-space:nowrap;vertical-align:top}
tr:hover td{background:#fbf7ee}
td.num{text-align:right;font-family:ui-monospace,monospace}
th.num{text-align:right}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:700}
.pill.low{background:#d1fae5;color:#047857}
.pill.med{background:#fef3c7;color:#b45309}
.pill.high{background:#fee2e2;color:#b91c1c}
.pill.crit{background:#1e2640;color:#fca5a5}
.pill.na{background:#e2e8f0;color:#475569}
.pill.grs{background:#ede9fe;color:#6d28d9}
.pill.ld{background:#ffedd5;color:#c2410c}
.diff-add{background:#d1fae5}.diff-del{background:#fee2e2}.diff-chg{background:#fef3c7}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.chbox{background:#fff;border:1px solid #e4e8f2;border-radius:10px;padding:12px;min-height:250px}
.chbox h4{font-size:12px;color:#4a5578;margin-bottom:8px}
.chbox canvas{max-height:240px}
.modal{position:fixed;inset:0;background:rgba(20,26,48,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 12px;overflow:auto}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:13px;max-width:1100px;width:100%;padding:16px;box-shadow:0 12px 44px rgba(0,0,0,.3)}
.mbox h3{font-size:14px;margin-bottom:10px}
.mbox textarea{width:100%;min-height:150px;border:1px solid #d5dbea;border-radius:8px;padding:9px;font-family:ui-monospace,monospace;font-size:11.5px;background:#f8fafd}
.mbox label{font-size:11.5px;color:#4a5578;font-weight:600;display:block;margin:9px 0 4px}
.mbox input[type=text],.mbox input[type=number],.mbox input[type=password],.mbox select{width:100%;border:1px solid #d5dbea;border-radius:7px;padding:7px 9px;font-size:12px;font-family:inherit;background:#f8fafd}
.mrow{display:flex;gap:9px;flex-wrap:wrap}.mrow>div{flex:1;min-width:140px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:13px;flex-wrap:wrap}
td[contenteditable]{background:#fffbea;outline:1px dashed #f0d48a}
td[contenteditable]:focus{outline:2px solid #f59e0b;background:#fff}
.hint{font-size:11px;color:#8b95b8;margin:6px 0}
.err{color:#b91c1c;font-size:11px}
.okc{color:#047857}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e2640;color:#fff;border-radius:9px;padding:10px 18px;font-size:12.5px;z-index:200;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#6b7594;margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.subtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.subtabs button{background:#eef1f7;border:0;border-radius:7px;padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;color:#4a5578;font-family:inherit}
.subtabs button.on{background:#1e2640;color:#fbbf24}
@media(max-width:640px){.h-sub{display:none}.hstat{display:none}.wrap{padding:9px}.card .cv{font-size:17px}}
@media print{.header,.tabbar,.fbar,.btn,.hicons{display:none!important}body{background:#fff}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🧵</div>
  <div>
    <div class="h-title">VRT <b>Fabric Delivery & Greige Inventory</b> Summary Center</div>
    <div class="h-sub" id="hSub">布料交期與胚布庫存分析中心 · Fabric Material Control Center</div>
  </div>
  <div class="hgrow"></div>
  <div class="hstat"><div class="hstat-v" id="hsDemand">-</div><div class="hstat-l" data-i18n="totalDemand">總需求 yds</div></div>
  <div class="hstat"><div class="hstat-v" id="hsStock">-</div><div class="hstat-l" data-i18n="greigeStock">胚布庫存 yds</div></div>
  <div class="hstat"><div class="hstat-v" id="hsRisk" style="color:#fca5a5">-</div><div class="hstat-l" data-i18n="highRisk">高風險項</div></div>
  <div class="hicons">
    <div class="hicon" title="Import PDF" onclick="openImport('pdf')">📥</div>
    <div class="hicon" title="Import Excel / CSV" onclick="openImport('excel')">📗</div>
    <div class="hicon" title="Paste data 手動貼上" onclick="openImport('paste')">📋</div>
    <div class="hicon" title="Export Excel" onclick="exportExcel()">📤</div>
    <div class="hicon" title="Export PDF Summary" onclick="exportPDF()">📄</div>
    <div class="hicon" title="Upload to Cloud" onclick="gasUpload()">☁️</div>
    <div class="hicon" title="Download from Cloud" onclick="gasDownload()">⬇️</div>
    <div class="hicon" title="Save Local 儲存" onclick="saveLocal(true)">💾</div>
    <div class="hicon" title="Compare Version" onclick="showTab('version')">🔄</div>
    <div class="hicon" title="Telegram Summary" onclick="sendTG()">📲</div>
    <div class="hicon" title="Settings" onclick="showTab('settings')">⚙️</div>
    <div class="hicon" id="langBtn" title="Language" onclick="cycleLang()">中</div>
  </div>
</div>

<div class="tabbar" id="tabbar">
  <button data-tab="dash" class="on" onclick="showTab('dash')" data-i18n="tabDash">📊 Dashboard</button>
  <button data-tab="orders" onclick="showTab('orders')" data-i18n="tabOrders">📦 訂單需求</button>
  <button data-tab="byship" onclick="showTab('byship')" data-i18n="tabByShip">🗓️ 依交期</button>
  <button data-tab="byfabric" onclick="showTab('byfabric')" data-i18n="tabByFabric">🧵 依布種</button>
  <button data-tab="greige" onclick="showTab('greige')" data-i18n="tabGreige">🏭 胚布庫存</button>
  <button data-tab="tachiang" onclick="showTab('tachiang')" data-i18n="tabTC">🚢 大江交期</button>
  <button data-tab="outsource" onclick="showTab('outsource')" data-i18n="tabOS">🌐 外購交期</button>
  <button data-tab="risk" onclick="showTab('risk')" data-i18n="tabRisk">⚠️ 風險分析</button>
  <button data-tab="version" onclick="showTab('version')" data-i18n="tabVer">🔄 版本比較</button>
  <button data-tab="mapping" onclick="showTab('mapping')" data-i18n="tabMap">🔗 布種對應</button>
  <button data-tab="settings" onclick="showTab('settings')" data-i18n="tabSet">⚙️ 系統設定</button>
</div>

<div class="wrap">
  <div id="pg-dash"></div>
  <div id="pg-orders" style="display:none"></div>
  <div id="pg-byship" style="display:none"></div>
  <div id="pg-byfabric" style="display:none"></div>
  <div id="pg-greige" style="display:none"></div>
  <div id="pg-tachiang" style="display:none"></div>
  <div id="pg-outsource" style="display:none"></div>
  <div id="pg-risk" style="display:none"></div>
  <div id="pg-version" style="display:none"></div>
  <div id="pg-mapping" style="display:none"></div>
  <div id="pg-settings" style="display:none"></div>
</div>

<!-- Import modal -->
<div class="modal" id="mImport"><div class="mbox">
  <h3 id="mImpTitle">📥 Import</h3>
  <div class="mrow">
    <div><label data-i18n="impType">資料類型 Data Type</label>
      <select id="impType">
        <option value="orders">訂單需求 Order Demand (PDF/貼上)</option>
        <option value="tachiang">大江交期 Ta Chiang Leadtime</option>
        <option value="outsource">外購交期 Out Source Leadtime</option>
        <option value="greige">胚布庫存 Greige Inventory (Excel)</option>
      </select></div>
    <div><label data-i18n="impFile">選擇檔案 File</label><input type="file" id="impFile" accept=".pdf,.xlsx,.xls,.csv,.txt"></div>
  </div>
  <label data-i18n="impRaw">原始文字 / 手動校正區（可直接修改後重新解析）</label>
  <textarea id="impRaw" placeholder="PDF 解析後的原始文字會顯示在這裡，可手動修正錯誤行；或直接貼上表格資料（Tab / 逗號分隔）"></textarea>
  <div class="mfoot">
    <button class="btn line" onclick="closeModal('mImport')" data-i18n="cancel">取消</button>
    <button class="btn navy" onclick="reparseRaw()" data-i18n="parse">🔍 解析 Parse</button>
  </div>
  <div id="impPrevWrap" style="display:none">
    <label data-i18n="impPrev">解析預覽（黃底欄位可直接點擊修改；確認無誤才會合併進主資料）</label>
    <div class="tblwrap" style="max-height:320px;overflow:auto" id="impPrevTbl"></div>
    <div id="impErrs" class="err" style="margin-top:6px"></div>
    <div class="mrow" style="margin-top:9px">
      <div><label data-i18n="mergeMode">合併方式 Merge Mode</label>
        <select id="mergeMode"><option value="replace">取代全部（保留舊版本快照）Replace</option><option value="append">附加 Append</option></select></div>
    </div>
    <div class="mfoot">
      <button class="btn green" onclick="confirmMerge()" data-i18n="mergeBtn">✅ 確認合併 Merge into Master</button>
    </div>
  </div>
</div></div>

<!-- Edit row modal -->
<div class="modal" id="mEdit"><div class="mbox" style="max-width:560px">
  <h3 id="mEditTitle">✏️ Edit</h3>
  <div id="mEditBody"></div>
  <div class="mfoot">
    <button class="btn line" onclick="closeModal('mEdit')" data-i18n="cancel">取消</button>
    <button class="btn red" id="mEditDel" onclick="editDelete()">🗑️ 刪除</button>
    <button class="btn green" onclick="editSave()" data-i18n="save">💾 儲存</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

/* ================= 小工具 ================= */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function escapeHtml(s){return esc(s)}
function fmtN(n){return n==null||isNaN(n)?"-":Number(n).toLocaleString("en-US")}
function pad2(n){return String(n).padStart(2,"0")}
function fmtD(d){return d?d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()):"-"}
function todayD(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function nowStr(){const n=new Date();return fmtD(n)+" "+pad2(n.getHours())+":"+pad2(n.getMinutes())}
function parseMD(s){if(!s)return null;const m=String(s).trim().match(/^(\d{1,2})\/(\d{1,2})$/);if(!m)return null;return new Date(S.cfg.year||2026,+m[1]-1,+m[2])}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function widthNum(s){if(s==null||s==="")return null;const m=String(s).match(/[\d.]+/);return m?parseFloat(m[0]):null}
function near(a,b,tol){return a!=null&&b!=null&&Math.abs(a-b)<=tol}
function uid(){return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(msg){const el=$("toast");el.textContent=msg;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",2600)}
function closeModal(id){$(id).classList.remove("on")}

/* ================= 布種標準化與匹配 ================= */
function normYarn(raw){
  if(!raw)return{tokens:[],grs:false,family:"",str:""};
  let s=String(raw).toUpperCase().replace(/[＊×]/g,"*").replace(/[〞″]/g,'"').replace(/'/g,"'").replace(/\s+/g," ").trim();
  const grs=/(-RC\b|\(RC\)|RECYCLE|GRS|\bRCY\b)/.test(s);
  s=s.replace(/-RC\b/g," ").replace(/\(RECYCLE\)/g," ").replace(/RECYCLE/g," ");
  s=s.replace(/[23]\/[12]\s*TWILL/g," ").replace(/TWILL/g," ").replace(/RIP-?STOP/g," ").replace(/PLAIN/g," ");
  let family="";
  if(/T\/C|(^|[^A-Z])TC\d/.test(s))family="TC";
  if(/MESH/.test(s))family="MESH";
  if(/MECHANICAL|STRETCH/.test(s))family="MS";
  s=s.replace(/T\/C/g,"TC");
  let toks=s.split(/[*\/\s,()"%]+/).filter(Boolean).map(tk=>{
    let m;
    if(m=tk.match(/^MVS(\d+)$/))return m[1]+"S";
    if(m=tk.match(/^(\d+)['']?S$/))return m[1]+"S";
    if(m=tk.match(/^T?(\d+)D$/))return m[1]+"D";
    if(m=tk.match(/^SD(\d+)/))return "SD"+m[1];
    if(m=tk.match(/^SP(\d+)/))return "SP"+m[1];
    if(m=tk.match(/^OB(\d+)/))return "OB"+m[1];
    if(m=tk.match(/^RING(\d+)/))return "RING"+m[1];
    if(m=tk.match(/^TC(\d+)/))return "TC"+m[1];
    if(/^\d+(\.\d+)?$/.test(tk))return null;
    if(/^(B|W|BK|WH|D|CHCK|白|黑白格|藍白條|黑)$/.test(tk))return null;
    return tk;
  }).filter(Boolean);
  toks=[...new Set(toks)].sort();
  return{tokens:toks,grs,family,str:toks.join("*")};
}
function sameTokens(a,b){if(!a.length||!b.length)return false;if(a.length!==b.length)return false;return a.every((v,i)=>v===b[i])}
function decorate(){
  S.orders.forEach(o=>{o._yn=normYarn(o.yarn);o._ship=parseMD(o.estiShipDay);o._needLD=/LD/i.test(o.remark||"");o.key=o.weightOz+"|"+o.width+"|"+o.yarn.trim();});
  S.greige.forEach(g=>{g._yn=normYarn(g.yarn);g._w=widthNum(g.finishedWidth);g._key=g.weightOz+"|"+(g._w==null?"":g._w)+"|"+g.yarn.trim();});
  S.tachiang.forEach((r,i)=>{r._yn=normYarn(r.compose);r._id="tc:"+i;});
  S.outsource.forEach((r,i)=>{r._yn=normYarn(r.content+" "+r.compose);r._id="os:"+i;});
}
function greigeMatch(fabKey,oz,width,yn){
  const als=S.aliases.filter(a=>a.orderKey===fabKey);
  const rows=[];
  S.greige.forEach(g=>{
    if(als.some(a=>a.greigeKey===g._key)){rows.push(g);return}
    if(near(oz,g.weightOz,0.055)&&near(width,g._w,0.5)&&sameTokens(yn.tokens,g._yn.tokens))rows.push(g);
  });
  return rows;
}
function supplierMatch(fabKey,oz,width,yn){
  const al=S.aliases.find(a=>a.orderKey===fabKey&&a.supplierKey);
  if(al){const [k,i]=al.supplierKey.split(":");
    if(k==="tc"&&S.tachiang[+i])return{type:"TC",row:S.tachiang[+i]};
    if(k==="os"&&S.outsource[+i])return{type:"OS",row:S.outsource[+i]};}
  let hit=null;
  S.tachiang.forEach(r=>{if(!hit&&near(oz,r.weightOz,0.055)&&near(width,r.width,0.75)&&sameTokens(yn.tokens,r._yn.tokens))hit={type:"TC",row:r}});
  if(hit)return hit;
  S.outsource.forEach(r=>{
    if(hit)return;
    const wOK=r.width==null||near(width,r.width,0.75);
    const famOK=yn.family&&yn.family===famOf(r);
    if(famOK&&near(oz,r.weightOz,0.055)&&wOK)hit={type:"OS",row:r};});
  if(hit)return hit;
  S.outsource.forEach(r=>{ /* 寬鬆備援：無 family 時以 oz+width 對外購 */
    if(hit)return;
    if(!yn.family&&r.width!=null&&near(oz,r.weightOz,0.055)&&near(width,r.width,0.75))hit={type:"OS",row:r};});
  return hit;
}
function famOf(r){const c=(r.content||"").toUpperCase();if(/T\/C/.test(c))return"TC";if(/MESH/.test(c))return"MESH";if(/MECHANICAL|STRETCH/.test(c))return"MS";return""}

/* ================= 彙總計算 ================= */
function calcAll(){
  decorate();
  const map={};
  S.orders.forEach(o=>{
    const k=o.key;
    if(!map[k])map[k]={fabricKey:k,weightOz:o.weightOz,width:o.width,yarn:o.yarn,yn:o._yn,poList:new Set(),colors:new Set(),totalDemandQty:0,needLDQty:0,rows:[],nearestShip:null,latestShip:null,newColor:false};
    const f=map[k];
    f.poList.add(o.poNo);f.colors.add(o.color);f.rows.push(o);
    f.totalDemandQty+=(+o.qty||0);
    if(o._needLD)f.needLDQty+=(+o.qty||0);
    if(o.newColor)f.newColor=true;
    if(o._ship){if(!f.nearestShip||o._ship<f.nearestShip)f.nearestShip=o._ship;if(!f.latestShip||o._ship>f.latestShip)f.latestShip=o._ship;}
  });
  const today=todayD();
  FAB=Object.values(map).map(f=>{
    const gRows=greigeMatch(f.fabricKey,f.weightOz,f.width,f.yn);
    const stock=gRows.reduce((s,g)=>s+(+g.stockQty||0),0);
    const matched=gRows.length>0;
    f.greigeRows=gRows;
    f.matchedGreigeStockQty=matched?stock:null;
    f.stockBalance=matched?stock-f.totalDemandQty:null;
    f.shortageQty=matched?Math.max(f.totalDemandQty-stock,0):f.totalDemandQty;
    f.coverage=matched&&f.totalDemandQty>0?stock/f.totalDemandQty:null;
    const sup=supplierMatch(f.fabricKey,f.weightOz,f.width,f.yn);
    f.sup=sup;
    f.supplierType=sup?(sup.type==="TC"?"大江 Ta Chiang":"外購 Out Source"):null;
    f.grs=f.yn.grs;
    f.needLD=f.needLDQty>0;
    let lead=null,transit=null,leadLabel="";
    if(sup){
      transit=sup.row.normalTransitDays;
      if(sup.type==="TC"){
        const enough=matched&&stock>=f.totalDemandQty;
        lead=enough?sup.row.greigeReadyDays:sup.row.noSafetyStockDays;
        leadLabel=enough?"Greige Ready "+lead+"d":"No Safety Stock "+lead+"d";
      }else{
        lead=sup.row.leadtimeDays;
        leadLabel=lead==null?"PS 另議":"OS "+lead+"d";
      }
    }
    f.leadtimeDays=lead;f.transitDays=transit;f.leadLabel=leadLabel;
    if(lead!=null){
      let ready=addDays(today,lead+(f.newColor?7:0));
      f.estimatedReadyDate=ready;
      f.estimatedArrivalDate=addDays(ready,transit||0);
    }else{f.estimatedReadyDate=null;f.estimatedArrivalDate=null;}
    /* 風險 */
    let lvl="low",reasons=[],act=[];
    const lateVsNeed=f.estimatedArrivalDate&&f.nearestShip&&f.estimatedArrivalDate>f.nearestShip;
    if(f.stockBalance!=null&&f.stockBalance>=0){lvl="low";}
    else if(matched){
      lvl=lateVsNeed?"high":"med";
      reasons.push("缺口 "+fmtN(f.shortageQty)+" yds");
      if(f.coverage!=null&&f.coverage<0.5){lvl="high";reasons.push("覆蓋率 <50%");}
      if(lateVsNeed)reasons.push("預估到廠晚於需求交期");
      act.push(lvl==="high"?"立即下胚布/追料":"安排補胚布");
    }else{
      lvl="high";reasons.push("胚布未匹配");act.push("至『布種對應』建立別名或確認採購");
    }
    if(!sup){
      if(f.stockBalance!=null&&f.stockBalance>=0){reasons.push("無供應商交期資料（庫存足夠，暫不影響）");}
      else{lvl="crit";reasons.push("無供應商交期資料");act.push("向台北/供應商確認 leadtime");}
    }
    if(sup&&sup.type==="OS"&&sup.row.leadtimeDays==null){lvl="crit";reasons.push("Leadtime 另議 (PS)");}
    if(f.grs){lvl="crit";reasons.push("GRS/RC 客製：Pending Yarn Mill Confirmation");act.push("等紗廠回覆交期");}
    if(f.needLD){lvl="crit";reasons.push("Need LD approval ("+fmtN(f.needLDQty)+" yds)");act.push("追客戶色樣核可");}
    f.riskLevel=lvl;f.riskReason=reasons.join("；");f.actionNeeded=act.join("；")||"—";
    f.poArr=[...f.poList];f.colorArr=[...f.colors];
    return f;
  }).sort((a,b)=>b.totalDemandQty-a.totalDemandQty);
  /* 依交期 */
  const sm={};
  S.orders.forEach(o=>{
    const k=o.estiShipDay||"(Need LD / 未定)";
    if(!sm[k])sm[k]={ship:k,date:o._ship,qty:0,pos:new Set(),fabs:new Set(),maxFab:"",maxQ:0,risk:"low"};
    const g=sm[k];g.qty+=(+o.qty||0);g.pos.add(o.poNo);g.fabs.add(o.key);
  });
  const rank={low:0,med:1,high:2,crit:3};
  Object.values(sm).forEach(g=>{
    g.fabs.forEach(fk=>{
      const f=FAB.find(x=>x.fabricKey===fk);
      if(f){if(rank[f.riskLevel]>rank[g.risk])g.risk=f.riskLevel;
        const q=f.rows.filter(r=>(r.estiShipDay||"(Need LD / 未定)")===g.ship).reduce((s,r)=>s+(+r.qty||0),0);
        if(q>g.maxQ){g.maxQ=q;g.maxFab=f.weightOz+"oz/"+f.width+'"/'+f.yarn;}}
    });
  });
  SHIP=Object.values(sm).sort((a,b)=>{if(!a.date)return 1;if(!b.date)return -1;return a.date-b.date});
}
function metrics(){
  const m={total:0,jul:0,aug:0,sep:0,ld:0,ldQty:0};
  S.orders.forEach(o=>{const q=+o.qty||0;m.total+=q;
    if(o._needLD){m.ld++;m.ldQty+=q;}
    if(o._ship){const mo=o._ship.getMonth()+1;if(mo===7)m.jul+=q;else if(mo===8)m.aug+=q;else if(mo===9)m.sep+=q;}});
  m.greigeTotal=S.greige.reduce((s,g)=>s+(+g.stockQty||0),0);
  m.matchedStock=FAB.reduce((s,f)=>s+(f.matchedGreigeStockQty||0),0);
  m.shortItems=FAB.filter(f=>f.shortageQty>0&&f.greigeRows.length).length;
  m.delayItems=FAB.filter(f=>f.estimatedArrivalDate&&f.nearestShip&&f.estimatedArrivalDate>f.nearestShip&&f.shortageQty>0).length;
  m.grsItems=FAB.filter(f=>f.grs).length;
  m.unmatched=FAB.filter(f=>!f.greigeRows.length).length;
  m.highItems=FAB.filter(f=>f.riskLevel==="high"||f.riskLevel==="crit").length;
  return m;
}

   +'<div class="chbox"><h4>⚠️ 風險分布 Risk Distribution</h4><canvas id="chRisk"></canvas><div id="chRiskFb"></div></div>'
   +'<div class="chbox"><h4>📈 月份需求趨勢 Monthly Demand Trend</h4><canvas id="chMon"></canvas><div id="chMonFb"></div></div>'
   +'</div>';
  /* Top10 */
  h+='<div class="panel" style="margin-top:14px"><h3>🏆 Top 10 Demand Fabric</h3><div class="tblwrap"><table><thead><tr><th>#</th><th>Fabric</th><th class="num">'+t("demand")+'</th><th class="num">'+t("stock")+'</th><th class="num">'+t("shortage")+'</th><th>'+t("risk")+'</th></tr></thead><tbody>';
  FAB.slice(0,10).forEach((f,i)=>{h+='<tr><td>'+(i+1)+'</td><td>'+fabName(f)+'</td><td class="num">'+fmtN(f.totalDemandQty)+'</td><td class="num">'+(f.greigeRows.length?fmtN(f.matchedGreigeStockQty):'<span class="pill na">未匹配</span>')+'</td><td class="num">'+(f.shortageQty?'<b style="color:#dc2626">'+fmtN(f.shortageQty)+'</b>':"0")+'</td><td>'+pill(f.riskLevel)+'</td></tr>'});
  h+='</tbody></table></div></div>';
  $("pg-dash").innerHTML=h;

function killCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}
function drawCharts(){
  killCharts();
  const hasChart=typeof Chart!=="undefined";
  const shipRows=SHIP.filter(s=>s.date);
  if(!hasChart){ /* 離線 fallback 表格 */
    $("chShipFb").innerHTML="<table><tbody>"+shipRows.map(s=>"<tr><td>"+s.ship+"</td><td class='num'>"+fmtN(s.qty)+"</td></tr>").join("")+"</tbody></table>";
    return;
  }
  charts.ship=new Chart($("chShip"),{type:"bar",data:{labels:shipRows.map(s=>s.ship),datasets:[{label:"yds",data:shipRows.map(s=>s.qty),backgroundColor:"#f59e0b"}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmtN(v)}}}}});
  const top=FAB.slice(0,12);
  charts.cmp=new Chart($("chCmp"),{type:"bar",data:{labels:top.map(f=>f.weightOz+"oz/"+f.width+'"'),datasets:[
    {label:"需求 Demand",data:top.map(f=>f.totalDemandQty),backgroundColor:"#3b82f6"},
    {label:"胚布 Greige",data:top.map(f=>f.matchedGreigeStockQty||0),backgroundColor:"#10b981"}]},
    options:{scales:{y:{ticks:{callback:v=>fmtN(v)}}}}});
  const rc={low:0,med:0,high:0,crit:0};FAB.forEach(f=>rc[f.riskLevel]++);
  charts.risk=new Chart($("chRisk"),{type:"doughnut",data:{labels:[t("riskLow"),t("riskMed"),t("riskHigh"),t("riskCrit")],datasets:[{data:[rc.low,rc.med,rc.high,rc.crit],backgroundColor:["#10b981","#f59e0b","#ef4444","#1e2640"]}]}});
  const mon={};S.orders.forEach(o=>{if(o._ship){const k=(o._ship.getMonth()+1)+"月";mon[k]=(mon[k]||0)+(+o.qty||0)}});
  const mk=Object.keys(mon).sort((a,b)=>parseInt(a)-parseInt(b));
  charts.mon=new Chart($("chMon"),{type:"line",data:{labels:mk,datasets:[{label:"yds",data:mk.map(k=>mon[k]),borderColor:"#f59e0b",backgroundColor:"rgba(245,158,11,.15)",fill:true,tension:.3}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmtN(v)}}}}});
}

  if(opts.month){const ms=[...new Set(S.orders.filter(o=>o._ship).map(o=>o._ship.getMonth()+1))].sort((a,b)=>a-b);
    h+='<select id="'+id+'m" onchange="renderTab()"><option value="">'+t("allMonth")+'</option>'+ms.map(m=>'<option'+(gv(id+"m")==String(m)?" selected":"")+'>'+m+'</option>').join("")+'</select>';}
  if(opts.po){const ps=[...new Set(S.orders.map(o=>o.poNo))].sort();
    h+='<select id="'+id+'p" onchange="renderTab()"><option value="">'+t("allPO")+'</option>'+ps.map(p=>'<option'+(gv(id+"p")==p?" selected":"")+'>'+p+'</option>').join("")+'</select>';}
  if(opts.oz){const os=[...new Set(S.orders.map(o=>o.weightOz))].sort((a,b)=>a-b);
    h+='<select id="'+id+'o" onchange="renderTab()"><option value="">'+t("allOZ")+'</option>'+os.map(o=>'<option'+(gv(id+"o")==String(o)?" selected":"")+'>'+o+'</option>').join("")+'</select>';}
  if(opts.width){const ws=[...new Set(S.orders.map(o=>o.width))].sort((a,b)=>a-b);
    h+='<select id="'+id+'w" onchange="renderTab()"><option value="">'+t("allWidth")+'</option>'+ws.map(w=>'<option'+(gv(id+"w")==String(w)?" selected":"")+'>'+w+'</option>').join("")+'</select>';}
  if(opts.risk)h+='<select id="'+id+'r" onchange="renderTab()"><option value="">'+t("allRisk")+'</option>'+["low","med","high","crit"].map(r=>'<option value="'+r+'"'+(gv(id+"r")==r?" selected":"")+'>'+t("risk"+({low:"Low",med:"Med",high:"High",crit:"Crit"})[r])+'</option>').join("")+'</select>';
  h+='<button class="btn line" onclick="exportCurrent(\''+id+'\')">'+t("exportCur")+'</button></div>';
  return h;
}

function sorter(list,key){const st=sortState[curTab];if(!st)return list;
  return [...list].sort((a,b)=>{let x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;

function snapshot(files){
  calcAll();const m=metrics();
  S.versions.push({versionId:uid(),uploadDateTime:nowStr(),sourceFiles:files||"manual",
    totalOrderQty:m.total,totalGreigeStock:m.greigeTotal,
    shortageItems:FAB.filter(f=>f.shortageQty>0&&f.greigeRows.length).map(f=>f.fabricKey),
    delayRiskItems:m.delayItems,
    dataSnapshot:{orders:JSON.parse(JSON.stringify(S.orders.map(o=>({poNo:o.poNo,weightOz:o.weightOz,width:o.width,yarn:o.yarn,color:o.color,qty:o.qty,estiShipDay:o.estiShipDay})))),
      greige:JSON.parse(JSON.stringify(S.greige.map(g=>({spec:g.spec,yarn:g.yarn,weightOz:g.weightOz,stockQty:g.stockQty}))))}});
  if(S.versions.length>20)S.versions.shift();
  saveLocal();
}
function okey(o){return [o.poNo,o.weightOz,o.width,o.yarn,o.color].join("|")}
function gkey(g){return [g.spec,g.yarn,g.weightOz].join("|")}
function renderVersion(){
  let h='<div class="panel"><h3>🔄 '+t("tabVer")+' <span class="tag">'+S.versions.length+' versions</span><span style="flex:1"></span><button class="btn navy" onclick="snapshot(\'manual snapshot\');renderTab()">📸 手動建立快照</button></h3>';
  if(S.versions.length<1){h+='<div class="hint">尚無版本。每次匯入合併後會自動保留快照。</div></div>';$("pg-version").innerHTML=h;return}
  const opts=S.versions.map((v,i)=>'<option value="'+i+'">v'+(i+1)+' · '+v.uploadDateTime+' · '+esc(v.sourceFiles)+'</option>').join("");
  const ia=fVals.verA!=null&&fVals.verA!==""?+fVals.verA:Math.max(0,S.versions.length-2), ib=fVals.verB!=null&&fVals.verB!==""?+fVals.verB:S.versions.length-1;
  h+='<div class="fbar"><select id="verA" onchange="fVals.verA=this.value;renderTab()">'+opts+'</select> ➡ <select id="verB" onchange="fVals.verB=this.value;renderTab()">'+opts+'</select></div>';
  const A=S.versions[ia],B=S.versions[ib];
  setTimeout(()=>{if($("verA"))$("verA").value=ia;if($("verB"))$("verB").value=ib;},0);
  if(!A||!B){h+='</div>';$("pg-version").innerHTML=h;return}
  h+='<div class="cards">'
   +'<div class="card info"><div class="cv">'+fmtN(A.totalOrderQty)+' → '+fmtN(B.totalOrderQty)+'</div><div class="cl">'+t("cTotal")+'</div></div>'
   +'<div class="card info"><div class="cv">'+fmtN(A.totalGreigeStock)+' → '+fmtN(B.totalGreigeStock)+'</div><div class="cl">'+t("cGreige")+'</div></div>'
   +'<div class="card '+(B.shortageItems.length>A.shortageItems.length?"bad":"ok")+'"><div class="cv">'+A.shortageItems.length+' → '+B.shortageItems.length+'</div><div class="cl">'+t("cShort")+'</div></div></div>';
  const oa={},ob={};A.dataSnapshot.orders.forEach(o=>oa[okey(o)]=o);B.dataSnapshot.orders.forEach(o=>ob[okey(o)]=o);
  const diffs=[];
  Object.keys(ob).forEach(k=>{const n=ob[k],o=oa[k];
    if(!o)diffs.push(["add",t("verNew"),k,"",fmtN(n.qty)+" / "+(n.estiShipDay||"-")]);
    else{
      if(+n.qty!==+o.qty)diffs.push(["chg",+n.qty>+o.qty?t("verUp"):t("verDown"),k,fmtN(o.qty),fmtN(n.qty)]);
      if((o.estiShipDay||"")!==(n.estiShipDay||"")){
        const da=parseMD(o.estiShipDay),db=parseMD(n.estiShipDay);
        const early=da&&db&&db<da;
        diffs.push([early?"add":"chg",early?t("verEarly"):t("verLate"),k,o.estiShipDay||"-",n.estiShipDay||"-"]);}
    }});
  Object.keys(oa).forEach(k=>{if(!ob[k])diffs.push(["del",t("verDel"),k,fmtN(oa[k].qty),""])});
  B.shortageItems.filter(k=>!A.shortageItems.includes(k)).forEach(k=>diffs.push(["del",t("verShortNew"),k,"",""]));
  A.shortageItems.filter(k=>!B.shortageItems.includes(k)).forEach(k=>diffs.push(["add",t("verShortFix"),k,"",""]));
  const ga={},gb={};A.dataSnapshot.greige.forEach(g=>ga[gkey(g)]=+g.stockQty||0);B.dataSnapshot.greige.forEach(g=>gb[gkey(g)]=+g.stockQty||0);
  Object.keys(gb).forEach(k=>{const o=ga[k]||0,n=gb[k];if(n!==o)diffs.push([n>o?"add":"del",n>o?t("verGUp"):t("verGDown"),k,fmtN(o),fmtN(n)])});
  h+='<div class="tblwrap"><table><thead><tr><th>類型</th><th>項目 Key</th><th class="num">舊 v'+(ia+1)+'</th><th class="num">新 v'+(ib+1)+'</th></tr></thead><tbody>';
  if(!diffs.length)h+='<tr><td colspan="4" style="color:#94a3b8">無變動 No changes</td></tr>';
  diffs.forEach(d=>{h+='<tr class="diff-'+d[0]+'"><td><b>'+d[1]+'</b></td><td style="white-space:normal">'+esc(d[2])+'</td><td class="num">'+d[3]+'</td><td class="num">'+d[4]+'</td></tr>'});
  h+='</tbody></table></div><div class="legend"><span><span class="dot" style="background:#d1fae5"></span>改善/新增</span><span><span class="dot" style="background:#fee2e2"></span>惡化/取消</span><span><span class="dot" style="background:#fef3c7"></span>變更</span></div></div>';
  $("pg-version").innerHTML=h;
}

async function loadPDF(file){
  if(typeof pdfjsLib==="undefined")throw new Error("pdf.js 未載入（離線時請改用貼上）");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const lines={};
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3)*3;(lines[y]=lines[y]||[]).push({x:it.transform[4],s:it.str})});
    Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const ln=lines[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim();
      if(ln)out.push(ln);});
    out.push("--- page "+p+" ---");
  }
  $("impRaw").value=out.join("\n");
}
async function loadExcel(file){
  const buf=await file.arrayBuffer();

function parseOrdersText(raw){
  const rows=[],errs=[];
  raw.split(/\n/).forEach(ln=>{
    ln=ln.trim();
    if(!ln||/^---/.test(ln)||/Order\s*Date|Esti\s*Ship/i.test(ln))return;
    let tk=ln.includes("\t")?ln.split("\t").map(s=>s.trim()).filter(Boolean):ln.split(/\s+/);
    try{
      let i=0,orderDate="";
      if(/^\d{1,2}\/\d{1,2}$/.test(tk[0])){orderDate=tk[0];i=1}
      const poNo=tk[i];if(!/^\d+-\d+$/.test(poNo||""))throw 0;i++;
      const oz=parseFloat(tk[i++]),width=parseFloat(tk[i++]),gy=parseInt(tk[i++]);
      if(isNaN(oz)||isNaN(width))throw 0;
      let rest=tk.slice(i),ship="",remark="",qty=null;
      if(rest.length&&/^\d{1,2}\/\d{1,2}$/.test(rest[rest.length-1]))ship=rest.pop();
      for(let j=rest.length-1;j>=0;j--){
        const m=String(rest[j]).match(/^([\d,]+)(Need.*)?$/i);
        if(m&&m[1].replace(/,/g,"").length>=3){
          qty=+m[1].replace(/,/g,"");
          const tail=rest.slice(j+1).join(" ");
          remark=((m[2]||"")+" "+tail).trim();
          rest=rest.slice(0,j);break;
        }
      }
      if(qty==null)throw 0;
      const yarn=rest[0]||"",color=rest.slice(1).join(" ");
      rows.push({id:uid(),sourceFile:"import",sourceDate:nowStr(),orderDate,poNo,weightOz:oz,width,gy:isNaN(gy)?null:gy,yarn,color,qty,estiShipDay:ship,remark,newColor:false});
    }catch(e){if(/\d/.test(ln))errs.push(ln)}
  });
  return{rows,errs};
}
function parseTCText(raw){
  const rows=[],errs=[];
  raw.split(/\n/).forEach(ln=>{
    ln=ln.trim();if(!ln||/^---/.test(ln)||/Content|Normal|^PS|^Date|^Leadtime|Ta Chiang|Greige\s*$|Ready|Stock/i.test(ln)&&!/oz/i.test(ln))return;
    const oz=(ln.match(/([\d.]+)\s*oz/i)||[])[1];
    const days=[...ln.matchAll(/(\d+)\s*days/gi)].map(m=>+m[1]);
    const mcqm=ln.match(/\b(\d{4,5})\b(?!\s*days)(?![T"])/);
    const comp=(ln.match(/\/\s*([^\/]+?")\s/)||ln.match(/((?:\d+'?S|T?\d+D)[^ ]*\*[^ ]+")/)||[])[1]||"";
    const wm=(comp||ln).match(/([\d.]+)\s*"/g);
    if(oz&&days.length>=3){
      rows.push({id:uid(),content:"100% Spun Polyester",weightOz:+oz,compose:comp.trim(),width:wm?parseFloat(wm[wm.length-1]):null,mcq:mcqm?+mcqm[1]:null,greigeReadyDays:days[0],noSafetyStockDays:days[1],normalTransitDays:days[2],newColorExtraDays:7,grsRemark:"GRS 另議"});
    }else if(/oz/i.test(ln))errs.push(ln);
  });
  return{rows,errs};
}
function parseOSText(raw){
  const rows=[],errs=[];
  raw.split(/\n/).forEach(ln=>{
    ln=ln.trim();if(!ln||/^---/.test(ln)||/^Content|^PS|^Date|Out Source/i.test(ln))return;
    const oz=(ln.match(/([\d.]+)\s*oz/i)||[])[1];
    if(!oz)return;
    const days=[...ln.matchAll(/(\d+)\s*days/gi)].map(m=>+m[1]);
    const nums=[...ln.matchAll(/\b(\d{4,6})\b(?!\s*days)(?!T)/g)].map(m=>+m[1]).filter(n=>n>=500);
    const comp=(ln.match(/(\d+T\*[^ ]+|Knit\s*mesh)/i)||[])[1]||"";
    const content=(ln.split(/[\d.]+\s*oz/i)[0]||"").trim()||"Out Source";
    const wm=comp.match(/([\d.]+)"/);
    if(days.length>=1){
      const lead=/PS/i.test(ln)&&days.length<2?null:days.length>=2?days[0]:days[0];
      rows.push({id:uid(),content,weightOz:+oz,compose:comp,width:wm?+wm[1]:null,moq:nums[0]||null,mcq:nums[1]||nums[0]||null,leadtimeDays:days.length>=2?days[0]:(/PS/i.test(ln)?null:days[0]),normalTransitDays:days[days.length-1],newColorExtraDays:7,grsRemark:"GRS 另議"});
    }else errs.push(ln);
  });
  return{rows,errs};
}
function parseGreigeWB(wb){
  const rows=[],errs=[];
  wb.SheetNames.forEach(sn=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    aoa.forEach(r=>{
      if(!r||!r[0]||typeof r[0]!=="string")return;
      const spec=String(r[0]).trim();
      if(!/\d+\*\d+/.test(spec))return;
      const oz=widthNum(r[3]);
      const rmk=[r[6],r[7]].filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim().replace(/\s+/g," ")).join("; ");
      rows.push({id:uid(),sourceSheet:sn,spec,finishedWidth:r[1]?String(r[1]).trim():"",yarn:r[2]?String(r[2]).trim():"",weightOz:oz,stockQty:typeof r[4]==="number"?r[4]:(+String(r[4]||"").replace(/,/g,"")||0),dillardRecommendationQty:typeof r[5]==="number"?r[5]:0,vrtSafetyStock:typeof r[5]==="number"?r[5]:0,minInventory:typeof r[6]==="number"?r[6]:null,remark:rmk});
    });
  });
  return{rows,errs};
}
function parseGreigeText(raw){
  const rows=[],errs=[];
  raw.split(/\n/).forEach(ln=>{
    ln=ln.trim();if(!ln)return;
    const tk=ln.includes("\t")?ln.split("\t").map(s=>s.trim()):ln.split(/\s{2,}|,/).map(s=>s.trim());
    if(tk.length>=5&&/\d+\*\d+/.test(tk[0])){
      rows.push({id:uid(),sourceSheet:"paste",spec:tk[0],finishedWidth:tk[1],yarn:tk[2],weightOz:widthNum(tk[3]),stockQty:+String(tk[4]).replace(/,/g,"")||0,dillardRecommendationQty:+String(tk[5]||"").replace(/,/g,"")||0,remark:tk.slice(6).join(" ")});
    }else if(/\d/.test(ln))errs.push(ln);
  });
  return{rows,errs};
}

   +'<tr><td class="r">'+fmtN(m.total)+'</td><td class="r">'+fmtN(m.jul)+'</td><td class="r">'+fmtN(m.aug)+'</td><td class="r">'+fmtN(m.sep)+'</td><td class="r">'+fmtN(m.greigeTotal)+'</td><td class="r">'+m.shortItems+'</td><td class="r">'+m.ld+'</td><td class="r">'+m.grsItems+'</td></tr></table>'
   +'<h2>By Fabric（依風險排序）</h2><table><tr><th>Fabric</th><th>Demand</th><th>Greige</th><th>Shortage</th><th>Required</th><th>Est Arrival</th><th>Risk</th><th>Reason / Action</th></tr>';
  rows.forEach(f=>{h+='<tr><td>'+f.weightOz+'oz / '+f.width+'" / '+esc(f.yarn)+'</td><td class="r">'+fmtN(f.totalDemandQty)+'</td><td class="r">'+(f.greigeRows.length?fmtN(f.matchedGreigeStockQty):"未匹配")+'</td><td class="r">'+fmtN(f.shortageQty)+'</td><td>'+(f.nearestShip?fmtD(f.nearestShip):"-")+'</td><td>'+(f.estimatedArrivalDate?fmtD(f.estimatedArrivalDate):"-")+'</td><td>'+f.riskLevel.toUpperCase()+'</td><td>'+esc(f.riskReason)+" ➡ "+esc(f.actionNeeded)+'</td></tr>'});

window.exportPDF=exportPDF;

/* ================= Telegram ================= */
function tgSummaryText(){
  calcAll();const m=metrics();
  const risks=[...FAB].filter(f=>f.riskLevel==="high"||f.riskLevel==="crit").slice(0,6);
  let txt="<b>VRT Fabric Delivery Summary</b>\n"
   +"Date: "+fmtD(new Date())+"\n\n"
   +"Total Demand: "+fmtN(m.total)+" yds\n"
   +"July Demand: "+fmtN(m.jul)+" yds\n"
   +"August Demand: "+fmtN(m.aug)+" yds\n"
   +"September Demand: "+fmtN(m.sep)+" yds\n"
   +"Greige Stock: "+fmtN(m.greigeTotal)+" yds\n\n"
   +"High Risk Items: "+m.highItems+"\n"
   +"Need LD Approval: "+m.ld+"\n"
   +"GRS Pending: "+m.grsItems+"\n"
   +"Unmatched Fabric: "+m.unmatched+"\n\n<b>Top Risks:</b>\n";
  risks.forEach((f,i)=>{
    txt+=(i+1)+". "+escapeHtml(f.weightOz+"oz / "+f.width+'" / '+f.yarn)
      +(f.shortageQty?" - Shortage "+fmtN(f.shortageQty)+" yds":"")
      +(f.nearestShip?" - Required "+(f.nearestShip.getMonth()+1)+"/"+f.nearestShip.getDate():"")
      +(f.needLD?" - Need LD":"")+(f.grs?" - GRS pending":"")+"\n";});
  return txt;
}
async function sendTG(){
  if(!S.cfg.tgToken||!S.cfg.tgChat){toast(t("needCfg"));showTab("settings");return}
  try{
    const r=await fetch("https://api.telegram.org/bot"+S.cfg.tgToken+"/sendMessage",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id:S.cfg.tgChat,text:tgSummaryText(),parse_mode:"HTML"})});
    const j=await r.json();
    toast(j.ok?t("tgOK"):t("tgFail")+"："+(j.description||""));
  }catch(e){toast(t("tgFail")+"："+e.message)}
}
window.sendTG=sendTG;

/* ================= GAS Cloud Sync ================= */
async function gasUpload(){
  if(!S.cfg.gasEndpoint){toast(t("needCfg"));showTab("settings");return}
  try{
    calcAll();
    const payload={action:"saveFabricDeliveryData",token:S.cfg.gasToken,timestamp:nowStr(),
      data:{orderDemandData:S.orders,greigeInventoryData:S.greige,taChiangLeadtimeData:S.tachiang,outSourceLeadtimeData:S.outsource,aliases:S.aliases,
        fabricSummaryData:FAB.map(f=>({fabricKey:f.fabricKey,totalDemandQty:f.totalDemandQty,matchedGreigeStockQty:f.matchedGreigeStockQty,shortageQty:f.shortageQty,riskLevel:f.riskLevel,riskReason:f.riskReason})),
        versionHistory:S.versions.map(v=>({versionId:v.versionId,uploadDateTime:v.uploadDateTime,sourceFiles:v.sourceFiles,totalOrderQty:v.totalOrderQty,totalGreigeStock:v.totalGreigeStock,shortageItems:v.shortageItems.length}))}};
    const r=await fetch(S.cfg.gasEndpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload,(k,v)=>k.startsWith("_")?undefined:v)});
    const j=await r.json().catch(()=>({}));
    toast(j.success!==false?t("gasOK"):t("gasFail"));
  }catch(e){toast(t("gasFail")+"："+e.message)}
}
window.gasUpload=gasUpload;
async function gasDownload(){
  if(!S.cfg.gasEndpoint){toast(t("needCfg"));showTab("settings");return}
  try{
    const r=await fetch(S.cfg.gasEndpoint+"?action=getFabricDeliveryData&token="+encodeURIComponent(S.cfg.gasToken));
    const j=await r.json();
    if(j&&j.data){
      snapshot("before cloud download");
      if(j.data.orderDemandData)S.orders=j.data.orderDemandData;
      if(j.data.greigeInventoryData)S.greige=j.data.greigeInventoryData;
      if(j.data.taChiangLeadtimeData)S.tachiang=j.data.taChiangLeadtimeData;
      if(j.data.outSourceLeadtimeData)S.outsource=j.data.outSourceLeadtimeData;
      if(j.data.aliases)S.aliases=j.data.aliases;
      saveLocal();snapshot("cloud download");toast(t("gasOK"));renderTab();
    }else toast(t("gasFail"));
  }catch(e){toast(t("gasFail")+"："+e.message)}
}
window.gasDownload=gasDownload;

/* ================= 儲存 / 載入 ================= */
function saveLocal(show){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S,(k,v)=>k.startsWith("_")?undefined:v));if(show)toast(t("saved"))}
  catch(e){if(show)toast("儲存失敗："+e.message)}
}
window.saveLocal=saveLocal;
function loadSeed(){
  S.orders=SEED_ORDERS.map(a=>({id:uid(),sourceFile:"115-7-6VRT訂單進度DAVID.pdf",sourceDate:"2026-07-06",orderDate:a[0],poNo:a[1],weightOz:a[2],width:a[3],gy:a[4],yarn:a[5],color:a[6],qty:a[7],estiShipDay:a[8],remark:a[9],newColor:false}));
  S.tachiang=SEED_TC.map(a=>({id:uid(),content:"100% Spun Polyester",weightOz:a[0],compose:a[1],width:a[2],mcq:a[3],greigeReadyDays:a[4],noSafetyStockDays:a[5],normalTransitDays:a[6],newColorExtraDays:7,grsRemark:"GRS 客製交期另議"}));
  S.outsource=SEED_OS.map(a=>({id:uid(),content:a[0],weightOz:a[1],compose:a[2],width:a[3],moq:a[4],mcq:a[5],leadtimeDays:a[6],normalTransitDays:a[7],newColorExtraDays:7,grsRemark:"GRS 客製交期另議"}));
  S.greige=SEED_GREIGE.map(a=>({id:uid(),sourceSheet:a[0],spec:a[1],finishedWidth:a[2],yarn:a[3],weightOz:a[4],stockQty:a[5],dillardRecommendationQty:a[6],vrtSafetyStock:a[6],minInventory:null,remark:a[7]}));
  S.aliases=JSON.parse(JSON.stringify(SEED_ALIASES));
}
function cycleLang(){
  S.cfg.lang=({zh:"en",en:"km",km:"zh"})[S.cfg.lang]||"zh";
  $("langBtn").textContent=({zh:"中",en:"EN",km:"ខ្មែរ"})[S.cfg.lang];
  document.querySelectorAll("#tabbar button").forEach(b=>{const k=b.getAttribute("data-i18n");if(k)b.textContent=t(k)});
  document.querySelectorAll(".hstat-l[data-i18n]").forEach(el=>el.textContent=t(el.getAttribute("data-i18n")));
  saveLocal();renderTab();
}
window.cycleLang=cycleLang;
/* ================= init ================= */
(function init(){
  try{
    const saved=localStorage.getItem(LS_KEY);
    if(saved){const p=JSON.parse(saved);S={...S,...p,cfg:{...S.cfg,...(p.cfg||{})}};}
  }catch(e){}
  if(!S.orders.length){loadSeed();snapshot("內建範例資料 seed 20260706");}
  document.addEventListener("DOMContentLoaded",()=>{
    $("impFile").addEventListener("change",onImpFile);
    $("langBtn").textContent=({zh:"中",en:"EN",km:"ខ្មែរ"})[S.cfg.lang]||"中";
    document.querySelectorAll("#tabbar button").forEach(b=>{const k=b.getAttribute("data-i18n");if(k)b.textContent=t(k)});
    document.querySelectorAll(".hstat-l[data-i18n]").forEach(el=>el.textContent=t(el.getAttribute("data-i18n")));
    renderTab();
  });
  if(document.readyState!=="loading"){
    $("impFile").addEventListener("change",onImpFile);
    renderTab();
  }
})();
</script>

<script>
/* ===== 雲端同步（tool=fabric，與 Portal 同協定） ===== */
(function(){
  const css=document.createElement('style');
  css.textContent='#vcFab{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:#0f172a;border:1px solid #334155;color:#93c5fd;font-size:22px;cursor:pointer;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.35)}#vcPanel{position:fixed;right:18px;bottom:80px;width:320px;max-width:92vw;background:#0b1220;border:1px solid #24344d;border-radius:14px;padding:14px;z-index:9999;color:#e2e8f0;font-size:13px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}#vcPanel h4{margin:0 0 8px;font-size:14px;color:#93c5fd}#vcPanel .vrow{display:flex;gap:8px;margin:8px 0}#vcPanel button{flex:1;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit}#vcPushBtn2{background:#3a2c07;border:1px solid #b45309;color:#fcd34d}#vcPullBtn2{background:#0c1a2c;border:1px solid #1d4ed8;color:#93c5fd}#vcUrl{flex:1;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:12px}#vcSave{flex:none;padding:8px 12px;background:#1e293b;border:1px solid #475569;color:#cbd5e1;border-radius:8px}#vcLogBox{max-height:110px;overflow:auto;background:#060b14;border-radius:8px;padding:8px;margin-top:8px;font-family:monospace;font-size:11.5px;line-height:1.6}';
  document.head.appendChild(css);
  const fab=document.createElement('button');fab.id='vcFab';fab.textContent='☁';document.body.appendChild(fab);
  const panel=document.createElement('div');panel.id='vcPanel';
  panel.innerHTML='<h4>☁ 雲端同步 — 布料進倉</h4><div class="vrow"><button id="vcPushBtn2">☁ 推送</button><button id="vcPullBtn2">⬇ 拉取</button></div><div style="color:#64748b;font-size:11px;margin-top:4px">GAS URL</div><div class="vrow"><input id="vcUrl" placeholder="https://script.google.com/.../exec"><button id="vcSave">存</button></div><div id="vcLogBox"></div>';
  document.body.appendChild(panel);
  const URL_KEY='vrt_portal_gas_url';
  const getUrl=()=>((localStorage.getItem(URL_KEY)||'').trim());
  function vcLog(m,k){const b=document.getElementById('vcLogBox');
    const c=k==='err'?'#f87171':(k==='ok'?'#4ade80':'#93c5fd');
    b.innerHTML+='<div style="color:'+c+'">['+new Date().toTimeString().slice(0,8)+'] '+m+'</div>';b.scrollTop=b.scrollHeight;}
  fab.onclick=()=>{const p=document.getElementById('vcPanel');
    const show=p.style.display!=='block';p.style.display=show?'block':'none';
    if(show)document.getElementById('vcUrl').value=getUrl();};
  document.getElementById('vcSave').onclick=()=>{
    try{localStorage.setItem(URL_KEY,document.getElementById('vcUrl').value.trim());}catch(e){}
    vcLog('✓ GAS URL 已儲存','ok');};
  function fabRaw(){try{return localStorage.getItem(LS_KEY)||JSON.stringify(S,(k,v)=>k.startsWith('_')?undefined:v);}catch(e){return JSON.stringify(S,(k,v)=>k.startsWith('_')?undefined:v);}}
  function fabCount(raw){try{const o=JSON.parse(raw);let n=0;Object.keys(o||{}).forEach(k=>{if(Array.isArray(o[k]))n+=o[k].length;});return n||1;}catch(e){return 1;}}
  document.getElementById('vcPushBtn2').onclick=async function(){
    const url=getUrl();if(!url){vcLog('請先填入 GAS URL','err');return;}
    try{
      const raw=fabRaw();
      const payload={tool:'fabric',recordCount:fabCount(raw),fabState:raw};
      vcLog('推送中...','i');
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
      const d=await r.json();if(!d.ok)throw new Error(d.error||'GAS error');
      vcLog('✓ 推送完成','ok');
    }catch(e){vcLog('✗ 推送失敗：'+(e.message||e),'err');}
  };
  document.getElementById('vcPullBtn2').onclick=async function(){
    const url=getUrl();if(!url){vcLog('請先填入 GAS URL','err');return;}
    if(!confirm('拉取會覆蓋本機布料進倉資料，確定嗎？'))return;
    try{
      vcLog('拉取中...','i');
      const r=await fetch(url+'?action=pull&tool=fabric',{redirect:'follow'});
      const j=await r.json();if(!j.ok)throw new Error(j.error||'GAS error');
      let p=j.data&&j.data.data?j.data.data:null;
      if(!p||!p.fabState){vcLog('雲端尚無資料','err');return;}
      JSON.parse(p.fabState);   // 先驗格式
      localStorage.setItem(LS_KEY,p.fabState);
      vcLog('✓ 拉取完成，即將重新載入...','ok');
      setTimeout(()=>location.reload(),800);
    }catch(e){vcLog('✗ 拉取失敗：'+(e.message||e),'err');}
  };
})();
</script>
