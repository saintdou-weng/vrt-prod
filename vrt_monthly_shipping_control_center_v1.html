*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Microsoft JhengHei","Noto Sans TC","Noto Sans Khmer",Arial,sans-serif;background:#eef1f7;color:#1e2640;font-size:13px}.header{background:linear-gradient(135deg,#1e2640,#2d3658);padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.logo{width:42px;height:42px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:10px;display:grid;place-items:center;font-size:22px}.title{color:#fff;font-size:18px;font-weight:700}.title b{color:#fbbf24}.sub{font-size:11px;color:#8b95b8}.grow{flex:1}.hstat{text-align:right}.hstat b{font:700 20px ui-monospace,monospace;color:#fbbf24;display:block}.hstat span{font-size:10px;color:#8b95b8}.hbtn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.periodbar{background:#24304f;color:#fff;padding:9px 18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.seg{display:flex;border:1px solid #586685;border-radius:8px;overflow:hidden}.seg button{border:0;background:transparent;color:#d3d8e6;padding:7px 14px;font-weight:700;cursor:pointer}.seg button.on{background:#f59e0b;color:#1c1200}.nav{background:#34405e;border:1px solid #586685;color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer}.period{font:700 14px ui-monospace,monospace;min-width:90px;text-align:center}.tabs{background:#fff;border-bottom:2px solid #e2e6f0;display:flex;overflow:auto;padding:0 14px}.tab{padding:12px 14px;color:#6b7a9e;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px}.tab.on{color:#d97706;border-bottom-color:#f59e0b;background:#fffbf0;font-weight:700}.wrap{max-width:1450px;margin:auto;padding:16px 14px 70px}.pane{display:none}.pane.on{display:block}.card{background:#fff;border:1px solid #e2e6f0;border-radius:11px;padding:15px;margin-bottom:13px;box-shadow:0 1px 4px rgba(30,38,64,.05)}.ct{font-size:11px;font-weight:700;color:#6b7a9e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;gap:7px;align-items:center}.ct:before{content:"";width:3px;height:12px;background:#f59e0b;border-radius:2px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:13px}.kpi{background:#fff;border:1px solid #e2e6f0;border-radius:9px;padding:11px 12px;border-left:3px solid #cbd2e6}.kpi.b{border-left-color:#3b82f6}.kpi.g{border-left-color:#10b981}.kpi.a{border-left-color:#f59e0b}.kpi.p{border-left-color:#8b5cf6}.kpi.r{border-left-color:#ef4444}.kn{font:700 23px ui-monospace,monospace}.kl{font-size:10px;color:#6b7a9e;margin-top:5px}.filt{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}select,input{border:1px solid #d0d5e8;border-radius:7px;padding:7px 10px;background:#fff;font:inherit}.fl{font-size:11px;color:#6b7a9e;display:flex;flex-direction:column;gap:3px}.btn{border:0;border-radius:7px;padding:8px 13px;font-weight:700;cursor:pointer}.by{background:#f59e0b;color:#1c1200}.bg{background:#fff;border:1px solid #d0d5e8;color:#4a5578}.tbl{overflow:auto;border:1px solid #e2e6f0;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#f7f8fc;color:#6b7a9e;font-size:10px;text-transform:uppercase;padding:8px 9px;text-align:left;border-bottom:2px solid #e2e6f0;white-space:nowrap}td{padding:8px 9px;border-bottom:1px solid #eef0f6;vertical-align:top}.num{text-align:right;font-family:ui-monospace,monospace}.remark{white-space:pre-wrap;min-width:180px}.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#dbeafe;color:#1e40af}.hold{background:#fef3c7;color:#92400e}.drop{border:2px dashed #c5c9d8;border-radius:12px;padding:40px;text-align:center;cursor:pointer;background:#fafbfc}.drop:hover{border-color:#f59e0b;background:#fffbf0}.chart{height:300px;position:relative}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.al{padding:10px 12px;border-radius:8px;background:#eff6ff;border:1px solid #93c5fd;color:#1e40af;margin-bottom:10px}.empty{text-align:center;padding:50px;color:#8b95b8}.delta-up{color:#b45309;font-weight:700}.delta-down{color:#047857;font-weight:700}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e2640;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:999}.cloud{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;border:0;background:#1e2640;color:#93c5fd;font-size:20px;cursor:pointer;box-shadow:0 4px 16px #0004}@media(max-width:800px){.grid2{grid-template-columns:1fr}.hstat{display:none}.wrap{padding:12px 8px}.tbl{overflow-x:auto}.periodbar{padding:8px 10px}}
</style></head><body>
<div class="header"><div class="logo">🚢</div><div><div class="title">VRT <b>Monthly Shipping</b> 控制中心</div><div class="sub" id="source">只管理 Monthly Shipping Schedule · 已移除 Weekly Open Order</div></div><div class="grow"></div><div class="hstat"><b id="hPieces">0</b><span>Pieces</span></div><div class="hstat"><b id="hCartons">0</b><span>Cartons</span></div><div class="hstat"><b id="hRows">0</b><span>Shipments</span></div><button class="hbtn" onclick="toggleLang()" id="langBtn">中</button><button class="hbtn" onclick="goTab('import')">匯入</button></div>
<div class="periodbar"><span>比較週期</span><div class="seg"><button data-mode="month" class="on" onclick="setMode('month')">月 Month</button><button data-mode="year" onclick="setMode('year')">年 Year</button></div><button class="nav" onclick="nav(-1)">◀</button><span class="period" id="period">—</span><button class="nav" onclick="nav(1)">▶</button><button class="nav" onclick="goLatest()">最新</button></div>
<div class="tabs"><div class="tab on" data-tab="dashboard" onclick="goTab('dashboard')">📊 儀錶板</div><div class="tab" data-tab="schedule" onclick="goTab('schedule')">🗓 月出貨排程</div><div class="tab" data-tab="compare" onclick="goTab('compare')">📆 月份比較</div><div class="tab" data-tab="revision" onclick="goTab('revision')">🔄 本月版本變更</div><div class="tab" data-tab="import" onclick="goTab('import')">📥 匯入</div></div>
<div class="wrap"><div id="dashboard" class="pane on"></div><div id="schedule" class="pane"></div><div id="compare" class="pane"></div><div id="revision" class="pane"></div><div id="import" class="pane"></div></div>
<input id="fileInput" type="file" accept=".xlsx,.xls,.csv" multiple hidden><button class="cloud" onclick="cloudPull()">☁</button><div id="toast" class="toast"></div>
<script>
const LS='vrt_monthship_v2',VLS='vrt_monthship_versions_v2',GASKEY='vrt_monthship_gas_url',TOOL='monthship';let DATA={records:[],sources:[]},VERSIONS={},MODE='month',ANCHOR='',TAB='dashboard',LANG='zh',CH={};
const $=id=>document.getElementById(id),N=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0}),num=v=>{const n=Number(String(v==null?'':v).replace(/,/g,''));return isNaN(n)?0:n},esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout($('toast')._t);$('toast')._t=setTimeout(()=>$('toast').style.display='none',2200)}function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function excelDate(v){if(v==null||v==='')return'';if(v instanceof Date)return ymd(v);if(typeof v==='number'&&v>20000&&v<80000){const d=new Date((v-25569)*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}const s=String(v).trim(),m=s.match(/(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;const d=new Date(s);return isNaN(d)?'':ymd(d)}function monthOf(d){return String(d||'').slice(0,7)}function yearOf(d){return String(d||'').slice(0,4)}function save(){localStorage.setItem(LS,JSON.stringify(DATA));localStorage.setItem(VLS,JSON.stringify(VERSIONS))}function load(){try{DATA=JSON.parse(localStorage.getItem(LS)||'{"records":[],"sources":[]}');VERSIONS=JSON.parse(localStorage.getItem(VLS)||'{}')}catch(e){}DATA.records=DATA.records||[];DATA.sources=DATA.sources||[];VERSIONS=VERSIONS||{};goLatest(false)}
function parseWeek(raw,fallback){let s=String(raw||'').trim();let m=s.match(/(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[-\s](\d{1,2})[-\s](20\d{2})/i);if(m){const ms={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};return `${m[3]}-${String(ms[m[1].slice(0,3).toUpperCase()]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`}return fallback||''}
function monthFromSheet(name){const s=String(name).toUpperCase(),mm={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};let m=0;Object.keys(mm).some(k=>{if(s.includes(k)){m=mm[k];return true}return false});let y=(s.match(/20\d{2}/)||[])[0];return y&&m?`${y}-${String(m).padStart(2,'0')}`:''}
function parseWorkbook(wb,file){let out=[];const monthSheets=wb.SheetNames.filter(n=>monthFromSheet(n));for(const name of monthSheets){const ym=monthFromSheet(name),rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});let hi=rows.findIndex(r=>(r||[]).some(x=>String(x).toUpperCase()==='WEEK')&&(r||[]).some(x=>String(x).toUpperCase()==='CUSTOMER'));if(hi<0)continue;let curDate='';for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];if(r.every(v=>v==null||v===''))continue;if(r[1])curDate=parseWeek(r[1],curDate);const customer=String(r[2]||'').trim();if(!customer)continue;const pieces=num(r[5]),cartons=num(r[6]);if(!pieces&&!cartons&&!r[7])continue;out.push({id:`${ym}|${i}|${customer}|${cartons}`,month:ym,date:curDate||`${ym}-01`,week:String(r[1]||'').split(/\n/)[0]||'',customer,size:String(r[3]||''),mode:String(r[4]||''),pieces,cartons,remark:String(r[7]||''),status:/HOLD|WAIT|CANNOT|DELAY/i.test(String(r[7]||''))?'WATCH':'PLAN',sourceFile:file})}}if(!out.length&&wb.Sheets['SUMMARY']){const rows=XLSX.utils.sheet_to_json(wb.Sheets['SUMMARY'],{header:1,raw:true,defval:null});for(let i=6;i<rows.length;i++){const r=rows[i]||[],date=excelDate(r[2]);if(!date||!r[3])continue;out.push({id:`${date}|${i}|${r[3]}`,month:monthOf(date),date,week:'',customer:String(r[3]),size:String(r[4]||''),mode:String(r[5]||''),pieces:num(r[6]),cartons:num(r[7]),remark:String(r[8]||''),status:/HOLD|WAIT|CANNOT|DELAY/i.test(String(r[8]||''))?'WATCH':'PLAN',sourceFile:file})}}return out}
function importFiles(files){[...files].forEach(file=>{const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:false,raw:true}),recs=parseWorkbook(wb,file.name);if(!recs.length){toast('沒有找到月出貨排程');return}const months=[...new Set(recs.map(r=>r.month))];months.forEach(m=>{const now=recs.filter(r=>r.month===m),old=DATA.records.filter(r=>r.month===m);if(old.length){VERSIONS[m]=VERSIONS[m]||[];const sig=JSON.stringify(old.map(x=>[x.date,x.customer,x.mode,x.pieces,x.cartons,x.remark]));if(!VERSIONS[m].length||JSON.stringify(VERSIONS[m][0].records.map(x=>[x.date,x.customer,x.mode,x.pieces,x.cartons,x.remark]))!==sig)VERSIONS[m].unshift({savedAt:new Date().toLocaleString(),records:old});VERSIONS[m]=VERSIONS[m].slice(0,6)}DATA.records=DATA.records.filter(r=>r.month!==m).concat(now)});DATA.sources.unshift({file:file.name,time:new Date().toLocaleString(),months});DATA.sources=DATA.sources.slice(0,20);save();ANCHOR=months.sort().slice(-1)[0];MODE='month';renderAll();toast(`已匯入 ${recs.length} 筆 · ${months.join(', ')}`)}catch(err){console.error(err);toast('匯入失敗 '+err.message)}};rd.readAsArrayBuffer(file)})}
function latestMonth(){return [...new Set(DATA.records.map(r=>r.month).filter(Boolean))].sort().slice(-1)[0]||ymd(new Date()).slice(0,7)}function goLatest(render=true){ANCHOR=MODE==='year'?latestMonth().slice(0,4):latestMonth();if(render)renderAll()}function setMode(m){MODE=m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));ANCHOR=m==='year'?(ANCHOR||latestMonth()).slice(0,4):((ANCHOR&&ANCHOR.length===7)?ANCHOR:latestMonth());renderAll()}function nav(d){if(MODE==='year'){ANCHOR=String((+ANCHOR||+latestMonth().slice(0,4))+d)}else{let x=new Date((ANCHOR||latestMonth())+'-01T00:00:00');x.setMonth(x.getMonth()+d);ANCHOR=ymd(x).slice(0,7)}renderAll()}function periodRows(){return DATA.records.filter(r=>MODE==='year'?r.month.startsWith(ANCHOR):r.month===ANCHOR)}function sum(rows,k){return rows.reduce((s,r)=>s+num(r[k]),0)}function uniq(rows,k){return new Set(rows.map(r=>r[k]).filter(Boolean)).size}
function goTab(t){TAB=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===t));renderTab()}function renderAll(){$('period').textContent=ANCHOR;const r=periodRows();$('hPieces').textContent=N(sum(r,'pieces'));$('hCartons').textContent=N(sum(r,'cartons'));$('hRows').textContent=N(r.length);$('source').textContent='Monthly Shipping Schedule only · '+(DATA.sources[0]?.file||'No source');renderTab()}function renderTab(){({dashboard:renderDash,schedule:renderSchedule,compare:renderCompare,revision:renderRevision,import:renderImport}[TAB]||renderDash)()}
function k(c,n,l){return `<div class="kpi ${c}"><div class="kn">${n}</div><div class="kl">${l}</div></div>`}function filters(rows){const cs=[...new Set(rows.map(r=>r.customer))].sort();return `<div class="filt"><label class="fl">客戶<select id="fc" onchange="renderSchedule()"><option value="">全部客戶</option>${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label class="fl">搜尋<input id="fq" oninput="renderSchedule()" placeholder="客戶 / 備註"></label></div>`}
function renderDash(){const r=periodRows();if(!r.length){$('dashboard').innerHTML='<div class="card empty">目前週期沒有 Shipping Schedule 資料</div>';return}const watch=r.filter(x=>x.status==='WATCH'),modes={};r.forEach(x=>modes[x.mode||'N/A']=(modes[x.mode||'N/A']||0)+x.cartons);$('dashboard').innerHTML=`<div class="kpis">${k('b',N(sum(r,'pieces')),'總件數 pcs')}${k('a',N(sum(r,'cartons')),'總箱數 ctns')}${k('g',N(r.length),'出貨筆數')}${k('p',N(uniq(r,'customer')),'客戶數')}${k('r',N(watch.length),'待確認 / 風險')}${k('',N(uniq(r,'date')),'出貨日期數')}</div><div class="grid2"><div class="card"><div class="ct">📈 ${esc(ANCHOR)} 出貨趨勢</div><div class="chart"><canvas id="trend"></canvas></div></div><div class="card"><div class="ct">🚢 運輸方式</div><div class="chart"><canvas id="mode"></canvas></div></div></div><div class="card"><div class="ct">⚠ 待確認</div>${watch.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Customer</th><th>Mode</th><th class="num">PCS</th><th class="num">CTNS</th><th>Remark</th></tr></thead><tbody>${watch.map(x=>`<tr><td>${x.date}</td><td>${esc(x.customer)}</td><td>${esc(x.mode)}</td><td class="num">${N(x.pieces)}</td><td class="num">${N(x.cartons)}</td><td class="remark">${esc(x.remark)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">無待確認資料</div>'}</div>`;drawCharts(r,modes)}
function drawCharts(r,modes){Object.values(CH).forEach(c=>{try{c.destroy()}catch(e){}});CH={};const by={};r.forEach(x=>by[x.date]=(by[x.date]||0)+x.cartons);const ds=Object.keys(by).sort();CH.t=new Chart($('trend'),{type:'bar',data:{labels:ds,datasets:[{data:ds.map(d=>by[d]),label:'CTNS',backgroundColor:'#f59e0b'}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}});CH.m=new Chart($('mode'),{type:'doughnut',data:{labels:Object.keys(modes),datasets:[{data:Object.values(modes)}]},options:{maintainAspectRatio:false}})}
function renderSchedule(){const base=periodRows();$('schedule').innerHTML=`${filters(base)}<div class="card"><div class="ct">🗓 ${esc(ANCHOR)} 月出貨排程</div><div id="schedTable"></div></div>`;const c=$('fc')?.value||'',q=($('fq')?.value||'').toLowerCase();const r=base.filter(x=>(!c||x.customer===c)&&(!q||`${x.customer} ${x.remark} ${x.mode}`.toLowerCase().includes(q)));$('schedTable').innerHTML=`<div class="tbl"><table><thead><tr><th>Date</th><th>Week</th><th>Customer</th><th>Size</th><th>Mode</th><th class="num">Pieces</th><th class="num">Cartons</th><th>Status</th><th>Remark</th></tr></thead><tbody>${r.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${x.date}</td><td>${esc(x.week)}</td><td><b>${esc(x.customer)}</b></td><td>${esc(x.size)}</td><td>${esc(x.mode)}</td><td class="num">${N(x.pieces)}</td><td class="num">${N(x.cartons)}</td><td><span class="badge ${x.status==='WATCH'?'hold':''}">${x.status}</span></td><td class="remark">${esc(x.remark)}</td></tr>`).join('')||'<tr><td colspan="9">No data</td></tr>'}</tbody></table></div>`}
function renderCompare(){const year=MODE==='year'?ANCHOR:(ANCHOR||latestMonth()).slice(0,4),months=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);const rows=months.map(m=>{const r=DATA.records.filter(x=>x.month===m);return {m,pieces:sum(r,'pieces'),cartons:sum(r,'cartons'),ships:r.length,cust:uniq(r,'customer')}});$('compare').innerHTML=`<div class="card"><div class="ct">📆 ${year} 月份比較</div><div class="tbl"><table><thead><tr><th>Month</th><th class="num">Pieces</th><th class="num">Cartons</th><th class="num">Shipments</th><th class="num">Customers</th><th class="num">CTNS Δ MoM</th></tr></thead><tbody>${rows.map((x,i)=>{const d=x.cartons-(rows[i-1]?.cartons||0);return `<tr><td>${x.m}</td><td class="num">${N(x.pieces)}</td><td class="num">${N(x.cartons)}</td><td class="num">${N(x.ships)}</td><td class="num">${N(x.cust)}</td><td class="num ${d>0?'delta-up':d<0?'delta-down':''}">${i?(d>0?'+':'')+N(d):'-'}</td></tr>`}).join('')}</tbody></table></div></div>`}
function key(x){return [x.date,x.customer,x.mode,x.size].join('|').toUpperCase()}function renderRevision(){const m=MODE==='year'?latestMonth():ANCHOR,prev=VERSIONS[m]?.[0];const cur=DATA.records.filter(x=>x.month===m);if(!prev){$('revision').innerHTML='<div class="card"><div class="ct">🔄 本月版本變更</div><div class="al">目前沒有上一版本。下次匯入同月份更新檔後，這裡會比較日期、件數、箱數、客戶與備註。</div></div>';return}const a=new Map(cur.map(x=>[key(x),x])),b=new Map(prev.records.map(x=>[key(x),x])),ks=new Set([...a.keys(),...b.keys()]),chg=[];ks.forEach(k=>{const c=a.get(k),p=b.get(k);if(!p)chg.push({type:'新增',c,p:null});else if(!c)chg.push({type:'取消',c:null,p});else if(c.pieces!==p.pieces||c.cartons!==p.cartons||c.remark!==p.remark)chg.push({type:'修改',c,p})});$('revision').innerHTML=`<div class="card"><div class="ct">🔄 ${m} 本次 vs 上次</div><div class="al">比較日期 / 客戶 / Mode / Size，相同項目再檢查 Pieces、Cartons、Remark 是否改變。</div><div class="tbl"><table><thead><tr><th>Type</th><th>Date</th><th>Customer</th><th>Mode</th><th>Pieces 上次→本次</th><th>Cartons 上次→本次</th><th>Remark</th></tr></thead><tbody>${chg.map(x=>{const c=x.c||{},p=x.p||{};return `<tr><td>${x.type}</td><td>${c.date||p.date}</td><td>${esc(c.customer||p.customer)}</td><td>${esc(c.mode||p.mode)}</td><td>${N(p.pieces||0)} → ${N(c.pieces||0)}</td><td>${N(p.cartons||0)} → ${N(c.cartons||0)}</td><td class="remark">${esc(c.remark||p.remark||'')}</td></tr>`}).join('')||'<tr><td colspan="7">No change</td></tr>'}</tbody></table></div></div>`}
function renderImport(){$('import').innerHTML=`<div class="card"><div class="ct">📥 Monthly Shipping Schedule</div><div class="al">已完全移除 Weekly Open Order。直接匯入 <b>1-VRT MONTHLY SHIPPING SCHEDULE.xlsx</b>；系統會同時讀 JULY-2026、AUG-2026… 等月份工作表。</div><div class="drop" onclick="$('fileInput').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();importFiles(event.dataTransfer.files)"><div style="font-size:36px">🚢</div><b>拖拉 Monthly Shipping Excel 到這裡</b><div style="color:#6b7a9e;margin-top:6px">.xlsx / .xls / .csv</div></div><div style="margin-top:12px">${DATA.sources.map(s=>`<div>${esc(s.time)} · ${esc(s.file)} · ${esc((s.months||[]).join(', '))}</div>`).join('')}</div></div>`}
function toggleLang(){LANG=LANG==='zh'?'en':'zh';$('langBtn').textContent=LANG==='zh'?'中':'EN'}
async function cloudPush(){let url=localStorage.getItem(GASKEY)||localStorage.getItem('vrt_portal_gas_url')||'';if(!url){toast('未設定 GAS URL');return}const payload={action:'push',tool:TOOL,recordCount:DATA.records.length,records:DATA.records,summary:{months:[...new Set(DATA.records.map(r=>r.month))],cartons:sum(DATA.records,'cartons'),pieces:sum(DATA.records,'pieces')}};try{await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});toast('Cloud uploaded')}catch(e){toast('Upload failed')}}async function cloudPull(){let url=localStorage.getItem(GASKEY)||localStorage.getItem('vrt_portal_gas_url')||'';if(!url){toast('未設定 GAS URL');return}try{let j=await(await fetch(url+'?action=pull&tool='+TOOL)).json(),p=j?.data||j;if(p?.data)p=p.data;if(Array.isArray(p?.records)){DATA.records=p.records;save();goLatest();toast('Cloud downloaded')}else toast('No cloud data')}catch(e){toast('Download failed')}}
$('fileInput').addEventListener('change',e=>importFiles(e.target.files));load();renderAll();
</script></body></html>
