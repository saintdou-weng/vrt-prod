</style></head><body>
<div class="header"><div class="logo">🚢</div><div><div class="htitle">VRT <span style="color:#fbbf24">Monthly Shipping</span> 控制中心</div><div class="hsub">Monthly Shipping Schedule only · v3.1 · <span id="cloudStatus">☁ Local only</span></div></div><div class="grow"></div><div class="hstats"><div class="hstat"><b id="hPieces">0</b><span>Pieces</span></div><div class="hstat"><b id="hCartons">0</b><span>Cartons</span></div></div><button class="hbtn" onclick="cloudPush()">☁↑</button><button class="hbtn" onclick="cloudPull()">☁↓</button><button class="hbtn" onclick="goTab('import')">匯入</button></div>

<div class="wrap"><div id="dashboard" class="pane on"></div><div id="schedule" class="pane"></div><div id="trend" class="pane"></div><div id="revision" class="pane"></div><div id="import" class="pane"></div></div>
<input id="fileInput" type="file" accept=".xlsx,.xls" hidden><button class="cloud" onclick="cloudPull()">☁</button><div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="mtitle"><span id="modalTitle"></span><span class="x" onclick="closeModal()">×</span></div><div id="modalBody"></div></div></div>
<script>
const LS='vrt_monthship_v3_data',VLS='vrt_monthship_v3_versions',TOOL='monthship';let DATA={records:[],source:'',savedAt:''},VERS=[],TAB='dashboard',MONTH='',TREND='month',Q='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),num=v=>{let n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0},N=n=>num(n).toLocaleString('en-US',{maximumFractionDigits:1});
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}function cloudState(text,ok=true){let e=$('cloudStatus');if(e){e.textContent=text;e.style.color=ok?'#86efac':'#fca5a5'}}function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function excelDate(v){if(v==null||v==='')return'';if(v instanceof Date)return ymd(v);if(typeof v==='number'&&v>20000&&v<80000){let d=new Date((v-25569)*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}let s=String(v).trim(),m=s.match(/(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`}let d=new Date(s);return isNaN(d)?'':ymd(d)}
function save(){localStorage.setItem(LS,JSON.stringify(DATA));localStorage.setItem(VLS,JSON.stringify(VERS.slice(0,12)))}function load(){try{DATA=JSON.parse(localStorage.getItem(LS)||'{"records":[]}');VERS=JSON.parse(localStorage.getItem(VLS)||'[]')}catch(e){}DATA.records=DATA.records||[];VERS=Array.isArray(VERS)?VERS:[];MONTH=months().slice(-1)[0]||ymd(new Date()).slice(0,7)}
function monthLabel(v){let s=String(v||'').toUpperCase(),mm={JANUARY:1,FEBRUARY:2,MARCH:3,APRIL:4,MAY:5,JUNE:6,JULY:7,AUGUST:8,SEPTEMBER:9,OCTOBER:10,NOVEMBER:11,DECEMBER:12};for(let k in mm)if(s.includes(k)){let y=(s.match(/20\d{2}/)||[])[0];return y?`${y}-${String(mm[k]).padStart(2,'0')}`:''}return''}
function headerIndex(h,terms){return h.findIndex(x=>terms.some(t=>x.includes(t)))}
function parseShipSheet(ws,name){let rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),hi=rows.findIndex(r=>{let h=(r||[]).map(x=>String(x??'').trim().toUpperCase());return h.some(x=>x.includes('CUSTOMER'))&&h.some(x=>x.includes('TOTAL PIECES'))&&h.some(x=>x.includes('TOTAL CARTON'))});if(hi<0)return[];let h=(rows[hi]||[]).map(x=>String(x??'').replace(/\s+/g,' ').trim().toUpperCase()),cMonth=headerIndex(h,['MONTH']),cDate=headerIndex(h,['SHIPPING DATE']),cWeek=headerIndex(h,['WEEK']),cCust=headerIndex(h,['CUSTOMER']),cSize=headerIndex(h,['SIZE']),cMode=headerIndex(h,['MODE']),cPieces=headerIndex(h,['TOTAL PIECES']),cCarton=headerIndex(h,['TOTAL CARTON']),cRemark=headerIndex(h,['REMARK']),curMonth=monthLabel(name),curDate='',out=[];for(let i=hi+1;i<rows.length;i++){let r=rows[i]||[];if(cMonth>=0&&r[cMonth])curMonth=monthLabel(r[cMonth])||curMonth;if(cDate>=0&&r[cDate])curDate=excelDate(r[cDate])||curDate;if(cWeek>=0&&r[cWeek]){let w=String(r[cWeek]),m=w.match(/([A-Z]{3,9})[-\s](\d{1,2})[-\s](20\d{2})/i);if(m){let d=new Date(`${m[1]} ${m[2]}, ${m[3]}`);if(!isNaN(d))curDate=ymd(d)}}let customer=String(r[cCust]??'').trim();if(!customer||/^TOTAL$/i.test(customer))continue;let pieces=num(r[cPieces]),cartons=num(r[cCarton]);if(!pieces&&!cartons)continue;let date=(cDate>=0?excelDate(r[cDate]):'')||curDate,month=curMonth||(date?date.slice(0,7):'');out.push({id:`${name}|${i}|${customer}`,month,date,customer,size:String(r[cSize]??'').trim(),mode:String(r[cMode]??'').trim(),pieces,cartons,remark:String(r[cRemark]??'').trim(),status:/WAIT|HOLD|ADJUST|DELAY|CANNOT/i.test(String(r[cRemark]??''))?'WATCH':/CONFIRMED/i.test(String(r[cRemark]??''))?'CONFIRMED':'PLAN'})}return out}
function parseWorkbook(wb,file){let summary=wb.SheetNames.find(n=>String(n).trim().toUpperCase()==='SUMMARY'),out=summary?parseShipSheet(wb.Sheets[summary],summary):[];if(!out.length)wb.SheetNames.filter(n=>/20\d{2}/.test(n)&&String(n).trim().toUpperCase()!=='SUMMARY').forEach(n=>out=out.concat(parseShipSheet(wb.Sheets[n],n)));if(!out.length)throw new Error('找不到 Shipping Date / Customer / Total Pieces / Total Carton 資料');return out}
async function importFile(f){try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false,raw:true}),rs=parseWorkbook(wb,f.name);if(DATA.records.length)VERS.unshift({savedAt:DATA.savedAt,source:DATA.source,records:DATA.records});DATA={records:rs,source:f.name,savedAt:new Date().toISOString()};save();MONTH=months().slice(-1)[0];renderAll();goTab('dashboard');cloudState('☁ Local updated');toast(`✓ ${rs.length} shipments`);if(localStorage.getItem('vrt_portal_gas_url'))cloudPush(true)}catch(e){toast('Import failed: '+e.message)}}
function months(){return [...new Set(DATA.records.map(r=>r.month).filter(Boolean))].sort()}function rowsMonth(m=MONTH){return DATA.records.filter(r=>r.month===m)}function sum(rs,k){return rs.reduce((s,r)=>s+num(r[k]),0)}function uniq(rs,k){return new Set(rs.map(r=>r[k]).filter(Boolean)).size}
function monthNav(){let ms=months();return `<div class="periodnav"><button class="btn bg" onclick="shift(-1)">◀</button><span class="periodlabel">${MONTH||'-'}</span><button class="btn bg" onclick="shift(1)">▶</button><button class="btn bg" onclick="MONTH=months().slice(-1)[0]||MONTH;renderAll()">最新</button><select onchange="MONTH=this.value;renderAll()">${ms.map(m=>`<option ${m===MONTH?'selected':''}>${m}</option>`).join('')}</select></div>`}function shift(d){let a=months(),i=a.indexOf(MONTH);if(i<0)i=a.length-1;i=Math.max(0,Math.min(a.length-1,i+d));MONTH=a[i]||MONTH;renderAll()}
function goTab(t){TAB=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===t));renderTab(t)}function renderTab(t){({dashboard:renderDashboard,schedule:renderSchedule,trend:renderTrend,revision:renderRevision,import:renderImport}[t]||(()=>{}))()}function renderAll(){refresh();renderTab(TAB)}function refresh(){$('hPieces').textContent=N(sum(rowsMonth(),'pieces'));$('hCartons').textContent=N(sum(rowsMonth(),'cartons'))}
function renderDashboard(){let e=$('dashboard');if(!DATA.records.length){e.innerHTML=`<div class="card"><div class="empty">尚未匯入 Monthly Shipping Schedule<br><br><button class="btn by" onclick="goTab('import')">📥 匯入</button></div></div>`;return}let r=rowsMonth(),pcs=sum(r,'pieces'),ctn=sum(r,'cartons'),max=Math.max(1,...Object.values(r.reduce((m,x)=>{m[x.customer]=(m[x.customer]||0)+x.cartons;return m},{})));let by=r.reduce((m,x)=>{m[x.customer]=(m[x.customer]||0)+x.cartons;return m},{});e.innerHTML=monthNav()+`<div class="kpis"><div class="kpi b"><div class="kn">${N(pcs)}</div><div class="kl">Pieces 件</div></div><div class="kpi a"><div class="kn">${N(ctn)}</div><div class="kl">Cartons 箱</div></div><div class="kpi g"><div class="kn">${r.length}</div><div class="kl">Shipments</div></div><div class="kpi p"><div class="kn">${uniq(r,'customer')}</div><div class="kl">Customers</div></div><div class="kpi b"><div class="kn">${ctn?N(pcs/ctn):'-'}</div><div class="kl">PCS / CTN</div></div></div><div class="grid2"><div class="card"><div class="ct">📦 客戶箱數</div><div class="bars">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="barbg"><div class="barfill" style="width:${v/max*100}%"></div></div><span class="barval">${N(v)}</span></div>`).join('')}</div></div><div class="card"><div class="ct">⚠️ 待確認</div>${r.filter(x=>x.status==='WATCH').map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eef0f6"><b>${esc(x.customer)}</b> · ${x.date}<br><span class="subtxt">${esc(x.remark||'')}</span></div>`).join('')||'<div class="al">本月無 WAIT / HOLD / ADJUST 註記</div>'}</div></div>`}
function renderSchedule(){let r=rowsMonth().filter(x=>!Q||[x.customer,x.remark,x.mode].join(' ').toLowerCase().includes(Q.toLowerCase()));$('schedule').innerHTML=monthNav()+`<div class="card"><div class="frow"><input class="search" placeholder="客戶 / Mode / Remark" value="${esc(Q)}" oninput="Q=this.value;renderSchedule()"><span class="subtxt">${r.length} shipments</span></div><div class="tbl"><table class="compact"><thead><tr><th>Date</th><th>Customer / Mode</th><th>Size</th><th class="num">Pieces 件</th><th class="num">Cartons 箱</th><th>Status</th></tr></thead><tbody>${r.map((x,i)=>`<tr onclick="detail(${DATA.records.indexOf(x)})" style="cursor:pointer"><td class="mono">${x.date}</td><td class="link">${esc(x.customer)}<div class="subtxt">${esc(x.mode)}</div></td><td>${esc(x.size||'-')}</td><td class="num" style="color:#1d4ed8;font-weight:700">${N(x.pieces)}</td><td class="num" style="color:#d97706;font-weight:700">${N(x.cartons)}</td><td><span class="badge ${x.status==='WATCH'?'a':x.status==='CONFIRMED'?'g':''}">${x.status}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function detail(i){let x=DATA.records[i];if(!x)return;openModal(x.customer,`<div class="kpis"><div class="kpi b"><div class="kn">${N(x.pieces)}</div><div class="kl">Pieces</div></div><div class="kpi a"><div class="kn">${N(x.cartons)}</div><div class="kl">Cartons</div></div></div><p><b>Date:</b> ${x.date}<br><b>Mode:</b> ${esc(x.mode)}<br><b>Size:</b> ${esc(x.size||'-')}<br><b>Remark:</b> ${esc(x.remark||'-')}</p>`)}
function setTrend(x){TREND=x;renderTrend()}function trendRows(){let m={};DATA.records.forEach(r=>{let k=TREND==='year'?r.month.slice(0,4):r.month,x=m[k]||(m[k]={dates:new Set(),cust:new Set(),pieces:0,cartons:0,ships:0});x.dates.add(r.date);x.cust.add(r.customer);x.pieces+=r.pieces;x.cartons+=r.cartons;x.ships++});return Object.keys(m).sort().reverse().map(k=>({period:k,days:m[k].dates.size,cust:m[k].cust.size,pieces:m[k].pieces,cartons:m[k].cartons,ships:m[k].ships}))}
function renderTrend(){let a=trendRows();$('trend').innerHTML=`<div class="frow" style="margin-bottom:12px"><div class="seg"><button class="${TREND==='month'?'on':''}" onclick="setTrend('month')">月報</button><button class="${TREND==='year'?'on':''}" onclick="setTrend('year')">年報</button></div><span class="grow"></span><span class="subtxt">${a.length} 個期間</span></div><div class="card"><div class="ct">${TREND==='month'?'月別報表':'年別報表'}</div><div class="tbl"><table><thead><tr><th>期間</th><th class="num">出貨日</th><th class="num">Customers</th><th class="num">Shipments</th><th class="num">Pieces 件</th><th class="num">Cartons 箱</th><th class="num">PCS/CTN</th></tr></thead><tbody>${a.map(x=>`<tr><td class="link" onclick="if(TREND==='month'){MONTH='${x.period}';goTab('schedule')}">${x.period}</td><td class="num">${x.days}</td><td class="num">${x.cust}</td><td class="num">${x.ships}</td><td class="num" style="color:#1d4ed8;font-weight:700">${N(x.pieces)}</td><td class="num" style="color:#d97706;font-weight:700">${N(x.cartons)}</td><td class="num">${x.cartons?N(x.pieces/x.cartons):'-'}</td></tr>`).join('')}</tbody></table></div></div>`}
function key(x){return [x.date,x.customer,x.mode,x.size].join('|').toUpperCase()}function renderRevision(){let prev=VERS[0],cur=rowsMonth();if(!prev){$('revision').innerHTML=monthNav()+`<div class="card"><div class="al">目前只有一個版本。下次匯入更新檔後會比較同月份的日期、件數、箱數與備註。</div></div>`;return}let pr=(prev.records||[]).filter(x=>x.month===MONTH),a=new Map(cur.map(x=>[key(x),x])),b=new Map(pr.map(x=>[key(x),x])),ks=new Set([...a.keys(),...b.keys()]),chg=[];ks.forEach(k=>{let c=a.get(k),p=b.get(k);if(!p)chg.push({t:'新增',c,p});else if(!c)chg.push({t:'取消',c,p});else if(c.pieces!==p.pieces||c.cartons!==p.cartons||c.remark!==p.remark)chg.push({t:'修改',c,p})});$('revision').innerHTML=monthNav()+`<div class="card"><div class="ct">🔄 本月版本變更</div><div class="tbl"><table><thead><tr><th>Type</th><th>Date / Customer</th><th>Pieces 上次→本次</th><th>Cartons 上次→本次</th><th>Remark</th></tr></thead><tbody>${chg.map(x=>{let c=x.c||{},p=x.p||{};return `<tr><td>${x.t}</td><td>${c.date||p.date}<div class="subtxt">${esc(c.customer||p.customer)}</div></td><td>${N(p.pieces||0)} → ${N(c.pieces||0)}</td><td>${N(p.cartons||0)} → ${N(c.cartons||0)}</td><td>${esc(c.remark||p.remark||'')}</td></tr>`}).join('')||'<tr><td colspan="5">No change</td></tr>'}</tbody></table></div></div>`}
function renderImport(){$('import').innerHTML=`<div class="card"><div class="ct">📥 Monthly Shipping Schedule</div><div class="al">只讀 <b>SUMMARY</b> 工作表：Shipping Date / Customer / Size / Mode / <b>Total Pieces</b> / <b>Total Carton</b>。不再讀 Weekly Open Order，也不會把件數與箱數錯位。</div><div class="drop" onclick="$('fileInput').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();if(event.dataTransfer.files[0])importFile(event.dataTransfer.files[0])"><div style="font-size:38px">🚢</div><b>拖拉 Monthly Shipping Schedule Excel</b></div>${DATA.source?`<div style="margin-top:12px">目前：${esc(DATA.source)} · ${esc(DATA.savedAt?.replace('T',' ').slice(0,16)||'')}</div>`:''}</div>`}
async function cloudPush(silent=false){let url=localStorage.getItem('vrt_portal_gas_url')||'';if(!url){if(!silent)toast('未設定 GAS URL');cloudState('☁ GAS URL missing',false);return}cloudState('☁ Uploading…');let payload={action:'push',tool:TOOL,recordCount:DATA.records.length,records:DATA.records,summary:{months:months(),pieces:sum(DATA.records,'pieces'),cartons:sum(DATA.records,'cartons')}};try{await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});cloudState('☁ Uploaded '+new Date().toLocaleTimeString());if(!silent)toast('Cloud uploaded')}catch(e){cloudState('☁ Upload failed',false);if(!silent)toast('Upload failed')}}
async function cloudPull(){let url=localStorage.getItem('vrt_portal_gas_url')||'';if(!url){toast('未設定 GAS URL');cloudState('☁ GAS URL missing',false);return}cloudState('☁ Downloading…');try{let j=await(await fetch(url+'?action=pull&tool='+TOOL)).json(),p=j?.data||j;if(p?.data)p=p.data;if(Array.isArray(p?.records)){DATA={records:p.records,source:'Cloud',savedAt:new Date().toISOString()};save();MONTH=months().slice(-1)[0]||MONTH;renderAll();cloudState('☁ Downloaded '+new Date().toLocaleTimeString());toast('Cloud downloaded')}else{cloudState('☁ No cloud data',false);toast('No cloud data')}}catch(e){cloudState('☁ Download failed',false);toast('Download failed')}}
function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('on')}function closeModal(){$('modal').classList.remove('on')}
$('fileInput').addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''});load();refresh();renderDashboard();
</script></body></html>
