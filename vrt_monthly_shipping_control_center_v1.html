function pad(n){return String(n).padStart(2,'0');}
function nowLocal(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function num(v){if(v==null||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:0;const s=String(v).replace(/,/g,'').trim();if(!s||s==='-'||s==='–'||s==='—')return 0;const n=Number(s);return isFinite(n)?n:0;}
function fmt(v,d=0){return num(v).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});}
function fmtFlex(v){const n=num(v);return Math.abs(n%1)>0.001?fmt(n,1):fmt(n,0);}
function money(v){return '$'+num(v).toLocaleString('en-US',{maximumFractionDigits:0});}
function pct(v){return `${Math.round(num(v)*100)}%`;}
function sum(list,fn){return (list||[]).reduce((a,x)=>a+num(fn?fn(x):x),0);}
function cleanName(s){return String(s||'').trim().replace(/\s+/g,' ');}
function toast(msg,cls=''){const el=document.getElementById('toast');el.className='toast '+cls;el.textContent=msg;el.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.style.display='none',2600);}
function kpi(cls,n,u,l){return `<div class="kpi ${cls||''}"><div class="kpi-n">${esc(n)}${u?`<span class="kpi-u">${esc(u)}</span>`:''}</div><div class="kpi-l">${esc(l)}</div></div>`;}
function badge(type,label){const cls=type==='risk'?'b-risk':type==='watch'?'b-watch':type==='ok'?'b-ok':type==='ship'?'b-ship':type==='info'?'b-info':'b-nodata';return `<span class="badge ${cls}">${esc(label)}</span>`;}

function dbOpen(){
  const build=db=>{if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);};
  const tryOpen=ver=>new Promise((resolve,reject)=>{
    const req=ver?indexedDB.open(DB_NAME,ver):indexedDB.open(DB_NAME);
    req.onupgradeneeded=e=>build(e.target.result);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  // 自我修復：版本衝突改不帶版本；缺 store 升版補建
  return tryOpen(DB_VER)
    .catch(err=>{if(err&&err.name==='VersionError')return tryOpen(null);throw err;})
    .then(db=>{if(db.objectStoreNames.contains(STORE))return db;
      const nv=db.version+1;db.close();return tryOpen(nv);});
}
async function dbGet(key){
  const db=await dbOpen();
  return new Promise(resolve=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>resolve(null);
  });
}
async function dbSet(key,value){
  const db=await dbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function persist(){await dbSet('main',STATE);}

function normCustomer(s){
  let t=cleanName(s).toUpperCase();
  t=t.replace(/SINAGPORE/g,'SINGAPORE');
  t=t.replace(/\(CANNOT SHIP\)/g,'');
  t=t.replace(/\(ADI\)/g,'ADI');
  t=t.replace(/&/g,' AND ');
  t=t.replace(/[^\w\s]/g,' ');
  t=t.replace(/\b(CO|COMPANY|LTD|LIMITED|INC|IND|INDUSTRIES|SUPPLY|TEXTILES|TEXTILE|PTY|PTE|LLC)\b/g,' ');
  t=t.replace(/\s+/g,' ').trim();
  if(t==='ADI'||t.includes('AMERICAN DAWN'))return 'AMERICAN DAWN';
  if(t.includes('AUSTRALIA'))return 'AUSTRALIA LINEN';
  if(t.includes('ALSCO SINGAPORE'))return 'ALSCO SINGAPORE';
  if(t.includes('ALSCO MALAYSIA'))return 'ALSCO MALAYSIA';
  if(t.includes('WHITE PLAIN'))return 'WHITE PLAIN LINEN';
  if(t.includes('DEANE'))return 'DEANE APPAREL';
  if(t.includes('MAGNUS'))return 'MAGNUS TEXTILES';
  if(t.includes('LECHNER'))return 'LECHNER AND SONS';
  if(t.includes('DICKSON'))return 'DICKSON';
  if(t.includes('NORTHERN'))return 'NORTHERN UNIFORM';
  return t;
}

function planRows(){return STATE.monthly?.planRows||[];}
function scheduleRows(){return STATE.monthly?.scheduleRows||[];}
function weeklyRows(){return STATE.weekly?.rows||[];}

function groupByCustomer(rows,fnKey){
  const map=new Map();
  (rows||[]).forEach(r=>{
    const key=fnKey?fnKey(r):normCustomer(r.customer);
    if(!key)return;
    if(!map.has(key))map.set(key,[]);
    map.get(key).push(r);
  });
  return map;
}

function computeLinks(){
  const pMap=groupByCustomer(planRows());
  const sMap=groupByCustomer(scheduleRows());
  const wMap=groupByCustomer(weeklyRows());
  const keys=[...new Set([...pMap.keys(),...sMap.keys(),...wMap.keys()])].sort();
  return keys.map(key=>{
    const plans=pMap.get(key)||[];
    const schedules=sMap.get(key)||[];
    const weekly=wMap.get(key)||[];
    const display=plans[0]?.customer||schedules.find(x=>x.customer)?.customer||weekly[0]?.customer||key;
    const monthlyOpenCtns=sum(plans,x=>x.totalCtnsOpen);
    const monthlyShipCtns=sum(plans,x=>x.shippingMonthCtns);
    const scheduleCtns=sum(schedules,x=>x.totalCarton);
    const weeklyOpenCtns=sum(weekly,x=>x.totalOpenCtns);
    const scannedCtns=sum(weekly,x=>x.scannedCtns);
    const unProducedCtns=sum(weekly,x=>x.unProducedCtns);
    const pcsOpen=sum(plans,x=>x.totalPcsOpen)||sum(weekly,x=>x.garmentPcs+x.apronPcs+x.topNapkinPcs);
    const wip=sum(plans,x=>x.balWipPcs);
    const amount=sum(weekly,x=>x.totalOpenAmount);
    const allRemarks=[...plans.map(x=>x.remark),...schedules.map(x=>x.remark),...weekly.map(x=>x.remark)].filter(Boolean).join('\n');
    const remarkUpper=allRemarks.toUpperCase();
    const deltaWeeklyVsMonthly=weeklyOpenCtns-monthlyOpenCtns;
    const deltaScheduleVsPlan=scheduleCtns-monthlyShipCtns;
    let level='ok',labelKey='statusOk';
    if(/CANNOT SHIP|ON HOLD|HOLD|WAITING|UNTIL SEP|COLOR FASTNESS|FABRIC/.test(remarkUpper)){
      level='risk';labelKey='statusNeedAttention';
    }else if(weeklyOpenCtns>0 && scheduleCtns===0 && monthlyShipCtns===0){
      level='risk';labelKey='statusNoPlan';
    }else if(Math.abs(deltaWeeklyVsMonthly)>Math.max(80,weeklyOpenCtns*0.15)||Math.abs(deltaScheduleVsPlan)>80){
      level='watch';labelKey='statusCheckDelta';
    }
    return {key,display,plans,schedules,weekly,monthlyOpenCtns,monthlyShipCtns,scheduleCtns,weeklyOpenCtns,scannedCtns,unProducedCtns,pcsOpen,wip,amount,allRemarks,deltaWeeklyVsMonthly,deltaScheduleVsPlan,level,labelKey};
  });
}

function totals(){
  const links=computeLinks();
  return {
    links,
    monthlyPcs:sum(planRows(),x=>x.totalPcsOpen),
    monthlyOpenCtns:sum(planRows(),x=>x.totalCtnsOpen),
    monthlyShipCtns:sum(planRows(),x=>x.shippingMonthCtns),
    scheduleCtns:sum(scheduleRows(),x=>x.totalCarton),
    wipPcs:sum(planRows(),x=>x.balWipPcs),
    weeklyOpenCtns:sum(weeklyRows(),x=>x.totalOpenCtns),
    weeklyScannedCtns:sum(weeklyRows(),x=>x.scannedCtns),
    weeklyUnProducedCtns:sum(weeklyRows(),x=>x.unProducedCtns),
    weeklyAmount:sum(weeklyRows(),x=>x.totalOpenAmount),
    riskCount:links.filter(x=>x.level==='risk').length,
    watchCount:links.filter(x=>x.level==='watch').length
  };
}

        </tbody></table></div>
      </div>

function shortReason(r){
  const txt=(r.allRemarks||'').toUpperCase();
  if(/CANNOT SHIP|COLOR FASTNESS/.test(txt))return t('reasonCannotShip');
  if(/ON HOLD|HOLD/.test(txt))return t('reasonHold');
  if(/WAITING|FABRIC|UNTIL SEP/.test(txt))return t('reasonFabric');
  if(r.weeklyOpenCtns>0&&r.scheduleCtns===0&&r.monthlyShipCtns===0)return t('reasonNoPlan');
  if(Math.abs(r.deltaWeeklyVsMonthly)>0)return `${t('reasonDelta')} ${fmtFlex(r.deltaWeeklyVsMonthly)} ${t('ctns')}`;
  return t('reasonCheck');
}

function drawDashboardCharts(){
  const weeks={};
  scheduleRows().forEach(r=>{if(num(r.totalCarton)>0){const k=r.week||'No Week';weeks[k]=(weeks[k]||0)+num(r.totalCarton);}});
  const weekLabels=Object.keys(weeks).sort((a,b)=>num(a.replace(/\D/g,''))-num(b.replace(/\D/g,'')));
  mkChart('chWeek',{type:'bar',data:{labels:weekLabels,datasets:[{label:t('ctns').toUpperCase(),data:weekLabels.map(k=>weeks[k]),backgroundColor:'#f59e0b'}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  const open=computeLinks().filter(x=>x.weeklyOpenCtns>0).sort((a,b)=>b.weeklyOpenCtns-a.weeklyOpenCtns).slice(0,9);
  mkChart('chOpen',{type:'bar',data:{labels:open.map(x=>x.display),datasets:[{label:t('produced'),data:open.map(x=>x.scannedCtns),backgroundColor:'#10b981'},{label:t('unproduced'),data:open.map(x=>x.unProducedCtns),backgroundColor:'#ef4444'}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true}}}});
}

function mkChart(id,cfg){
  const el=document.getElementById(id);
  if(!el||!window.Chart)return;
  if(CHARTS[id])CHARTS[id].destroy();
  CHARTS[id]=new Chart(el,cfg);
}
function topBars(list,field,color){
  const max=Math.max(1,...list.map(x=>num(x[field])));
  return list.length?list.map(x=>`<div class="bar-row"><div class="bar-lb" title="${esc(x.display)}">${esc(x.display)}</div><div class="bar-tk"><div class="bar-in ${color||''}" style="width:${Math.max(2,num(x[field])/max*100)}%"></div></div><div class="bar-vl">${fmtFlex(x[field])}</div></div>`).join(''):`<div class="empty" style="padding:20px">${t('noData')}</div>`;
}

function bindDrop(id,kind){
  const el=document.getElementById(id);
  if(!el)return;
  el.ondragover=e=>{e.preventDefault();el.classList.add('drag');};
  el.ondragleave=()=>el.classList.remove('drag');
  el.ondrop=e=>{e.preventDefault();el.classList.remove('drag');importFiles(kind,e.dataTransfer.files);};
}

async function readWorkbook(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv'){
    const text=await file.text();
    return XLSX.read(text,{type:'string',cellDates:false,raw:true});
  }
  const buf=await file.arrayBuffer();
  return XLSX.read(new Uint8Array(buf),{type:'array',cellDates:false});
}

function aoa(wb,sn){
  return XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,cellDates:false,defval:''});
}
function rowText(row){return (row||[]).map(x=>String(x||'').trim().toUpperCase()).join(' ');}
function parseDateInWeekCell(v){
  const text=String(v||'');
  const week=(text.match(/WEEK\s*(\d+)/i)||[])[1];
  const dm=text.match(/([A-Z]+)[-/](\d{1,2})[-/](\d{4})/i);
  const months={JANUARY:1,JAN:1,FEBRUARY:2,FEB:2,MARCH:3,MAR:3,APRIL:4,APR:4,MAY:5,JUNE:6,JUN:6,JULY:7,JUL:7,AUGUST:8,AUG:8,SEPTEMBER:9,SEP:9,OCTOBER:10,OCT:10,NOVEMBER:11,NOV:11,DECEMBER:12,DEC:12};
  return {week:week?`WEEK ${week}`:'',date:dm?`${dm[3]}-${pad(months[dm[1].toUpperCase()]||1)}-${pad(dm[2])}`:'',raw:text};
}
function get(row,i){return row&&row.length>i?row[i]:'';}
function findHeaderIndex(rows,needles){return rows.findIndex(r=>needles.every(n=>rowText(r).includes(n)));}

function parseMonthlyWorkbook(wb,fileName){
  const out={monthLabel:'',sourceFile:fileName,planRows:[],scheduleRows:[]};
  wb.SheetNames.forEach(sn=>{
    const rows=aoa(wb,sn);
    const pi=findHeaderIndex(rows,['CUSTOMER','TOTAL PCS OPEN']);
    if(pi>=0){
      for(let i=pi+1;i<rows.length;i++){
        const r=rows[i],customer=cleanName(get(r,1));
        if(!customer)continue;
        if(/^TOTAL/i.test(customer))continue;
        out.planRows.push({customer,totalPcsOpen:num(get(r,2)),totalCtnsOpen:num(get(r,3)),shippingMonthCtns:num(get(r,4)),estPendingCtns:num(get(r,5)),shipWeekPcs:num(get(r,6)),balWipPcs:num(get(r,7)),totalBalPcs:num(get(r,8)),remark:cleanName(get(r,9))});
      }
    }
    const si=findHeaderIndex(rows,['WEEK','TOTAL CARTON']);
    if(si>=0){
      out.monthLabel=sn;
      let week='',weekDate='',weekRaw='';
      for(let i=si+1;i<rows.length;i++){
        const r=rows[i];
        const p=parseDateInWeekCell(get(r,1));
        if(p.week){week=p.week;weekDate=p.date;weekRaw=p.raw;}
        const customer=cleanName(get(r,2)),remark=cleanName(get(r,6)),cartons=num(get(r,5));
        if(!customer&&!remark&&!cartons)continue;
        out.scheduleRows.push({week,weekDate,weekRaw,customer,size:cleanName(get(r,3)),mode:cleanName(get(r,4)),totalCarton:cartons,remark,status:/CONFIRMED/i.test(remark)?'CONFIRMED':remark?'HOLD':''});
      }
    }
  });
  return out;
}

function isSummaryName(name){return /TOTAL ORDER|TOTAL RATIO|GRAND TOTAL|DAY TO COMPLETE|WEEK TO COMPLETE|AVR\.|TOTAL MIN|COMPARED TO|EST AVR/i.test(name);}
function parseWeeklyWorkbook(wb,fileName){
  const out={asOf:'',sourceFile:fileName,rows:[]};
  wb.SheetNames.forEach(sn=>{
    const rows=aoa(wb,sn);
    const first=rows.slice(0,8).map(rowText).join(' ');
    if(!/WEEKLY OPEN ORDER SUMMARY|WEEKLY BACKLOG/i.test(first+' '+sn))return;
    const m=first.match(/AS OF\s+(\d{1,2})[-/](\d{1,2})[-/](\d{4})/i);
    if(m)out.asOf=`${m[3]}-${pad(m[1])}-${pad(m[2])}`;
    for(let i=6;i<rows.length;i++){
      const r=rows[i],customer=cleanName(get(r,1));
      if(!customer||isSummaryName(customer))continue;
      out.rows.push({customer,garmentPcs:num(get(r,3)),apronPcs:num(get(r,4)),topNapkinPcs:num(get(r,5)),fabricYds:num(get(r,6)),totalOpenCtns:num(get(r,7)),scannedCtns:num(get(r,8)),unProducedCtns:num(get(r,9)),totalOpenSmv:num(get(r,10)),totalOpenAmount:num(get(r,11)),remark:cleanName(get(r,12))});
    }
  });
  return out;
}

async function expandMsgFiles(files){
  const out=[];
  for(const file of [...files]){
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    if(ext!=='msg'){out.push(file);continue;}
    try{
      const list=extractMsgExcelAttachments(await file.arrayBuffer(),file.name);
      if(!list.length)toast(`${file.name} ${t('msgNoAttachment')}`,'warn');
      list.forEach(att=>out.push(new File([att.bytes],att.name,{type:'application/octet-stream'})));
    }catch(err){
      console.warn(err);
      toast(`MSG ${t('msgParseFail')}：${file.name}`,'err');
    }
  }
  return out;
}

function bytesOf(content){return content instanceof Uint8Array?content:new Uint8Array(content||[]);}
function decodeUtf16(bytes){
  let s='';
  for(let i=0;i+1<bytes.length;i+=2){const code=bytes[i]|(bytes[i+1]<<8);if(code===0)break;s+=String.fromCharCode(code);}
  return s.trim();
}
function decodeAnsi(bytes){
  let s='';
  for(let i=0;i<bytes.length;i++){if(bytes[i]===0)break;s+=String.fromCharCode(bytes[i]);}
  return s.trim();
}
function extractMsgExcelAttachments(arrayBuffer,sourceName){
  if(!XLSX.CFB)throw new Error('SheetJS CFB reader is unavailable');
  const cfb=XLSX.CFB.read(new Uint8Array(arrayBuffer),{type:'array'});
  const groups={};
  (cfb.FullPaths||[]).forEach((path,i)=>{
    const m=path.match(/__attach_version1\.0_#\d+/i);
    if(!m)return;
    const key=m[0],entry=cfb.FileIndex[i];
    if(!groups[key])groups[key]={source:sourceName};
    const lower=path.toLowerCase(),bytes=bytesOf(entry&&entry.content);
    if(lower.includes('__substg1.0_37010102'))groups[key].bytes=bytes;
    if(lower.includes('__substg1.0_3707001f')||lower.includes('__substg1.0_3704001f'))groups[key].name=decodeUtf16(bytes);
    if(lower.includes('__substg1.0_3707001e')||lower.includes('__substg1.0_3704001e'))groups[key].name=groups[key].name||decodeAnsi(bytes);
  });
  return Object.values(groups).filter(x=>x.bytes&&/\.(xlsx|xls|csv)$/i.test(x.name||'')).map((x,idx)=>({name:x.name||`${sourceName}_attachment_${idx+1}.xlsx`,bytes:x.bytes}));
}

async function importFiles(kind,fileList){
  if(!fileList||!fileList.length)return;
  if(!window.XLSX){toast(t('msgSheetJs'),'err');return;}
  toast(t('loading'));
  const files=await expandMsgFiles(fileList);
  let monthlyFound={planRows:[],scheduleRows:[],sourceFile:'',monthLabel:''};
  let weeklyFound={rows:[],sourceFile:'',asOf:''};
  const names=[];
  for(const file of files){
    try{
      const wb=await readWorkbook(file);
      const monthly=parseMonthlyWorkbook(wb,file.name);
      const weekly=parseWeeklyWorkbook(wb,file.name);
      if(kind==='auto'||kind==='monthly'){
        if(monthly.planRows.length||monthly.scheduleRows.length){
          monthlyFound.planRows=monthlyFound.planRows.concat(monthly.planRows);
          monthlyFound.scheduleRows=monthlyFound.scheduleRows.concat(monthly.scheduleRows);
          monthlyFound.monthLabel=monthly.monthLabel||monthlyFound.monthLabel;
          monthlyFound.sourceFile=[monthlyFound.sourceFile,file.name].filter(Boolean).join(', ');
        }
      }
      if(kind==='auto'||kind==='weekly'){
        if(weekly.rows.length){
          weeklyFound.rows=weeklyFound.rows.concat(weekly.rows);
          weeklyFound.asOf=weekly.asOf||weeklyFound.asOf;
          weeklyFound.sourceFile=[weeklyFound.sourceFile,file.name].filter(Boolean).join(', ');
        }
      }
      names.push(file.name);
    }catch(err){
      console.warn(err);
      toast(`${t('msgParseFail')}：${file.name}`,'err');
    }
  }
  let changed=[];
  if(monthlyFound.planRows.length||monthlyFound.scheduleRows.length){
    STATE.monthly={...STATE.monthly,...monthlyFound,sourceFile:monthlyFound.sourceFile||STATE.monthly.sourceFile};
    changed.push(`Monthly ${monthlyFound.planRows.length}/${monthlyFound.scheduleRows.length}`);
  }
  if(weeklyFound.rows.length){
    STATE.weekly={...STATE.weekly,...weeklyFound,sourceFile:weeklyFound.sourceFile||STATE.weekly.sourceFile};
    changed.push(`Weekly ${weeklyFound.rows.length}`);
  }
  STATE.history=STATE.history||[];
  STATE.history.unshift({ts:nowLocal(),type:kind,files:names.join(', '),detail:changed.join(' · ')||t('msgNoReport')});
  STATE.history=STATE.history.slice(0,40);
  await persist();
  renderImport();
  refreshHeader();
  toast(changed.length?`${t('msgImported')}：${changed.join(' · ')}`:t('msgNoReport'),'ok');
}

    schedule:scheduleRows().map(r=>({'Week':r.week,'Date':r.weekDate,'Customer':r.customer,'Size':r.size,'Mode':r.mode,'Total Carton':r.totalCarton,'Status':r.status,'Remark':r.remark})),
    monthly:planRows().map(r=>({'Customer':r.customer,'Total PCS Open':r.totalPcsOpen,'Total CTNS Open':r.totalCtnsOpen,'Shipping in Month CTNS':r.shippingMonthCtns,'Est Pending CTNS':r.estPendingCtns,'Ship Week PCS':r.shipWeekPcs,'Bal WIP PCS':r.balWipPcs,'Remark':r.remark})),
    weekly:weeklyRows().map(r=>({'Customer':r.customer,'Garment PCS':r.garmentPcs,'Apron PCS':r.apronPcs,'Top/Napkin PCS':r.topNapkinPcs,'Fabric YDS':r.fabricYds,'Open CTNS':r.totalOpenCtns,'Scanned CTNS':r.scannedCtns,'Un-produced CTNS':r.unProducedCtns,'Open SMV':r.totalOpenSmv,'Open Amount':r.totalOpenAmount,'Remark':r.remark}))
  };
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},300);}
function exportExcel(){
  if(!window.XLSX){toast(t('msgSheetJs'),'err');return;}
  const wb=XLSX.utils.book_new();
  const rows=workbookRowsForExport();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.links),'Customer Link');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.schedule),'Monthly Schedule');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.monthly),'Monthly Plan');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.weekly),'Weekly Open');
  XLSX.writeFile(wb,`vrt_shipping_weekly_link_${nowLocal().slice(0,10)}.xlsx`);
}
function exportJson(){
  dl(new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'}),`vrt_shipping_backup_${nowLocal().slice(0,10)}.json`);
}
async function resetToInitial(){
  if(!confirm(t('resetConfirm')))return;
  STATE=structuredClone(INITIAL_DATA);
  STATE.lang=LANG;
  STATE.history.unshift({ts:nowLocal(),type:'reset',files:'initial data',detail:'Reset to embedded data'});
  await persist();
  renderTab();
  toast(t('resetDone'),'ok');
}

function setupInputs(){
  document.getElementById('autoInput').addEventListener('change',e=>{importFiles('auto',e.target.files);e.target.value='';});
  document.getElementById('monthlyInput').addEventListener('change',e=>{importFiles('monthly',e.target.files);e.target.value='';});
  document.getElementById('weeklyInput').addEventListener('change',e=>{importFiles('weekly',e.target.files);e.target.value='';});
}

async function init(){
  try{
    const saved=await dbGet('main');
    if(saved&&saved.monthly&&saved.weekly)STATE=saved;
  }catch(err){console.warn(err);}
  LANG=STATE.lang||'zh';
  STATE.lang=LANG;
  document.documentElement.lang=LANG==='zh'?'zh-TW':LANG;
  buildTabs();
  setupInputs();
  renderTab();
}

Object.assign(window,{goTab,setLang,exportExcel,exportJson,resetToInitial,importFiles});
document.addEventListener('DOMContentLoaded',init);
</script>

<script>
/* ===== 雲端同步（tool=monthship，與 Portal 同協定） ===== */
(function(){
  const css=document.createElement('style');
  css.textContent='#vcFab{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:#0f172a;border:1px solid #334155;color:#93c5fd;font-size:22px;cursor:pointer;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.35)}#vcPanel{position:fixed;right:18px;bottom:80px;width:320px;max-width:92vw;background:#0b1220;border:1px solid #24344d;border-radius:14px;padding:14px;z-index:9999;color:#e2e8f0;font-size:13px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}#vcPanel h4{margin:0 0 8px;font-size:14px;color:#93c5fd}#vcPanel .vrow{display:flex;gap:8px;margin:8px 0}#vcPanel button{flex:1;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit}#vcPushBtn2{background:#3a2c07;border:1px solid #b45309;color:#fcd34d}#vcPullBtn2{background:#0c1a2c;border:1px solid #1d4ed8;color:#93c5fd}#vcUrl{flex:1;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:12px}#vcSave{flex:none;padding:8px 12px;background:#1e293b;border:1px solid #475569;color:#cbd5e1;border-radius:8px}#vcLogBox{max-height:110px;overflow:auto;background:#060b14;border-radius:8px;padding:8px;margin-top:8px;font-family:monospace;font-size:11.5px;line-height:1.6}';
  document.head.appendChild(css);
  const fab=document.createElement('button');fab.id='vcFab';fab.textContent='☁';document.body.appendChild(fab);
  const panel=document.createElement('div');panel.id='vcPanel';
  panel.innerHTML='<h4>☁ 雲端同步 — 月出貨</h4><div class="vrow"><button id="vcPushBtn2">☁ 推送</button><button id="vcPullBtn2">⬇ 拉取</button></div><div style="color:#64748b;font-size:11px;margin-top:4px">GAS URL</div><div class="vrow"><input id="vcUrl" placeholder="https://script.google.com/.../exec"><button id="vcSave">存</button></div><div id="vcLogBox"></div>';
  document.body.appendChild(panel);
  const URL_KEY='vrt_portal_gas_url';
  const getUrl=()=>((localStorage.getItem(URL_KEY)||'').trim());
  function vcLog(m,k){const b=document.getElementById('vcLogBox');
    const c=k==='err'?'#f87171':(k==='ok'?'#4ade80':'#93c5fd');
    b.innerHTML+='<div style="color:'+c+'">['+new Date().toTimeString().slice(0,8)+'] '+m+'</div>';b.scrollTop=b.scrollHeight;}
  fab.onclick=()=>{const p=document.getElementById('vcPanel');
    const show=p.style.display!=='block';p.style.display=show?'block':'none';
    if(show)document.getElementById('vcUrl').value=getUrl();};
  document.getElementById('vcSave').onclick=()=>{
    try{localStorage.setItem(URL_KEY,document.getElementById('vcUrl').value.trim());}catch(e){}
    vcLog('✓ GAS URL 已儲存','ok');};
  function msCount(){let n=0;try{(STATE.monthly||[]).forEach(m=>{n+=((m.rows||m.items||[]).length)||1;});n+=((STATE.weekly&&STATE.weekly.length)||0);}catch(e){}return n||1;}
  document.getElementById('vcPushBtn2').onclick=async function(){
    const url=getUrl();if(!url){vcLog('請先填入 GAS URL','err');return;}
    try{
      const payload={tool:'monthship',recordCount:msCount(),msState:JSON.stringify(STATE)};
      vcLog('推送中...','i');
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
      const d=await r.json();if(!d.ok)throw new Error(d.error||'GAS error');
      vcLog('✓ 推送完成','ok');
    }catch(e){vcLog('✗ 推送失敗：'+(e.message||e),'err');}
  };
  document.getElementById('vcPullBtn2').onclick=async function(){
    const url=getUrl();if(!url){vcLog('請先填入 GAS URL','err');return;}
    if(!confirm('拉取會覆蓋本機月出貨資料，確定嗎？'))return;
    try{
      vcLog('拉取中...','i');
      const r=await fetch(url+'?action=pull&tool=monthship',{redirect:'follow'});
      const j=await r.json();if(!j.ok)throw new Error(j.error||'GAS error');
      let p=j.data&&j.data.data?j.data.data:null;
      if(!p||!p.msState){vcLog('雲端尚無資料','err');return;}
      const st=JSON.parse(p.msState);
      if(!st||!st.monthly){vcLog('雲端資料格式不符','err');return;}
      STATE=st;await persist();renderTab();
      vcLog('✓ 拉取完成，資料已更新','ok');
    }catch(e){vcLog('✗ 拉取失敗：'+(e.message||e),'err');}
  };
})();
</script>
