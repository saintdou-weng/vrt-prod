function renderDashboard(){let e=$('dashboard');if(!DATA.records.length){e.innerHTML=`<div class="card"><div class="empty">尚未匯入 Monthly Shipping Schedule<br><br><button class="btn by" onclick="goTab('import')">📥 匯入</button></div></div>`;return}let r=rowsMonth(),pcs=sum(r,'pieces'),ctn=sum(r,'cartons'),max=Math.max(1,...Object.values(r.reduce((m,x)=>{m[x.customer]=(m[x.customer]||0)+x.cartons;return m},{})));let by=r.reduce((m,x)=>{m[x.customer]=(m[x.customer]||0)+x.cartons;return m},{}),qa=(DATA.qa||[]).filter(x=>x.includes(MONTH));e.innerHTML=monthNav()+qa.map(x=>`<div class="al alw"><b>來源核對：</b>${esc(x)}</div>`).join('')+`<div class="kpis"><div class="kpi b"><div class="kn">${N(pcs)}</div><div class="kl">Pieces 件</div></div><div class="kpi a"><div class="kn">${N(ctn)}</div><div class="kl">Cartons 箱</div></div><div class="kpi g"><div class="kn">${r.length}</div><div class="kl">出貨排程筆數（含數量待補）</div></div><div class="kpi p"><div class="kn">${uniq(r,'customer')}</div><div class="kl">不同客戶數 Customers</div></div><div class="kpi b"><div class="kn">${ctn?N(pcs/ctn):'-'}</div><div class="kl">PCS / CTN</div></div></div><div class="grid2"><div class="card"><div class="ct">📦 客戶箱數</div><div class="bars">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="barbg"><div class="barfill" style="width:${v/max*100}%"></div></div><span class="barval">${N(v)}</span></div>`).join('')}</div></div><div class="card"><div class="ct">⚠️ 待確認</div>${r.filter(x=>x.status==='WATCH').map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eef0f6"><b>${esc(x.customer)}</b> · ${x.date}<br><span class="subtxt">${esc(x.remark||'')}</span></div>`).join('')||'<div class="al">本月無 WAIT / HOLD / ADJUST 註記</div>'}</div></div>`}

function exportRows(){return DATA.records.map(x=>({'Shipping Date':x.date,Month:x.month,Customer:x.customer,Size:x.size,Mode:x.mode,'Total Pieces':x.pieces,'Total Carton':x.cartons,Remark:x.remark,Status:x.status}))}function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function exportXlsx(){let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(exportRows()),'SHIPPING');XLSX.writeFile(wb,`VRT_MONTHLY_SHIPPING_${MONTH||'ALL'}.xlsx`)}function exportCsv(){let csv='\ufeff'+XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(exportRows()));downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`VRT_MONTHLY_SHIPPING_${MONTH||'ALL'}.csv`)}
