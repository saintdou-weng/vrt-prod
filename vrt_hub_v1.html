<style>
/* v4.25（2026-11-12）8 個入口：Paul 11/11 核可、11/12「還沒進行合併的動作」→ 這一頁就是合併後的入口。
   舊頁面和資料都不動：每個分頁就是原本那一頁（同一個網站，資料共用）。第一個分頁「📊 一覽」是新的：點卡片展開圖表＋明細，往下滑自動載入更多。 */
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#4f46e5;--acc2:#eef2ff;--ok:#059669;--warn:#d97706;--crit:#dc2626;--bar:#6366f1;--bar2:#94a3b8;--hdr:#ffffff;--chip:#f1f5f9}
[data-theme=dark]{--bg:#0f1626;--card:#16213a;--ink:#f1f5f9;--mut:#94a3b8;--line:#25324f;--acc:#818cf8;--acc2:#1e2a4a;--ok:#34d399;--warn:#fbbf24;--crit:#f87171;--bar:#818cf8;--bar2:#475569;--hdr:#131d33;--chip:#1e2a45}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
a{color:var(--acc)}
.hdr{background:var(--hdr);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
@media(min-width:900px){.hdr{padding-right:200px}} /* 右上角平台版本小標不要蓋到按鈕 */
.hdr .home{font-size:20px;text-decoration:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.hdr h1{font-size:16px;margin:0;white-space:nowrap}.hdr .sub{font-size:11px;color:var(--mut)}
.hub-pick{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
.hub-pick a{font-size:12px;text-decoration:none;color:var(--mut);padding:5px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.hub-pick a.on{background:var(--acc2);color:var(--acc);border-color:var(--acc);font-weight:700}
.hdr .tools{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.tabs{display:flex;gap:2px;padding:0 10px;background:var(--hdr);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.stage{flex:1;position:relative;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
.stage iframe.on{display:block}
.pane{position:absolute;inset:0;overflow:auto;display:none;padding:14px 16px 40px}.pane.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg input{flex:1;min-width:160px;max-width:280px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.seg select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:12px}
.note{font-size:12px;color:var(--mut);margin:6px 0 12px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:800}.kpi .l{font-size:11px;color:var(--mut);margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.12s}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.card.open{grid-column:1/-1;cursor:default;transform:none;border-color:var(--acc)}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .t b{font-size:15px}.card .t span{font-size:11px;color:var(--mut)}
.card .m{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px 10px;margin-top:6px}
.card .m div{font-size:11px;color:var(--mut)}.card .m div b{display:block;font-size:15px;color:var(--ink)}
.card svg.spark{width:100%;height:34px;margin-top:6px;display:block}
.det{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.det h4{margin:14px 0 6px;font-size:13px}
.chart{width:100%;display:block}
.tblw{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px}
table.dt{border-collapse:collapse;width:100%;font-size:12px}
table.dt th,table.dt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.dt th{position:sticky;top:0;background:var(--chip);font-weight:700}
table.dt td.r,table.dt th.r{text-align:right}
.close{float:right}
.more{text-align:center;color:var(--mut);font-size:12px;padding:16px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--mut);margin-left:4px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}
@media(max-width:640px){.hdr h1{font-size:14px}.hub-pick{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.pane{padding:10px}.cards{grid-template-columns:1fr}}

/* v4.26 詳細面板／甘特圖／背景 */
.lead{background:var(--acc2);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.7;margin-bottom:8px}.lead b{font-size:16px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mut);margin:2px 4px 0 0;white-space:nowrap}.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.crit{color:var(--crit)}
.pbar{height:8px;border-radius:99px;background:var(--chip);margin-top:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px}.pbar.big{height:16px}.pcap{font-size:10.5px;color:var(--mut);margin-top:3px}
.small{font-size:11px;color:var(--mut)}
.sheet{position:fixed;inset:0;z-index:9995;background:rgba(2,6,23,.55);display:none;padding:10px}.sheet.on{display:flex}
.sh-box{margin:auto;width:min(1180px,100%);height:100%;background:var(--bg);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.sh-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--hdr);border-bottom:1px solid var(--line)}
.sh-t{flex:1;min-width:0}.sh-t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh-t span{font-size:11px;color:var(--mut)}
.sh-pos{font-size:12px;color:var(--mut);white-space:nowrap}.sh-hd .btn{font-size:15px;padding:6px 12px}.sh-hd .btn:disabled{opacity:.3}
.sh-tabs{display:flex;gap:2px;padding:0 8px;background:var(--hdr);border-bottom:1px solid var(--line);overflow-x:auto}
.sh-tabs button{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}.sh-tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.sh-body{flex:1;overflow:auto;padding:12px 14px 20px}.sh-body h4{margin:14px 0 6px;font-size:14px}
.sh-next{display:block;width:100%;margin-top:18px;padding:12px;font-size:14px;text-align:center}
.sh-rel{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--hdr);overflow-x:auto}
.sh-rl{font-size:11px;color:var(--mut);white-space:nowrap}.sh-rel button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}.sh-rel button.on{background:var(--acc);border-color:var(--acc);color:#fff}.sh-rel button i{font-style:normal;opacity:.7;font-size:11px}
.gwrap{display:flex;flex-direction:column;height:100%}.gscroll{flex:1;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:0}
.glegend{font-size:11px;color:var(--mut);margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.glegend i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-left:8px}
.lg-plan{background:var(--bar)}.lg-act{background:none!important;width:auto!important}.lg-act::before{content:'792';font-style:normal;font-size:10px;color:var(--ok);font-weight:700}
.lg-gap,.g-c.gap{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(148,163,184,.28) 5px 7px)}.lg-today{background:rgba(245,158,11,.35)}
.gantt{min-width:calc(120px + var(--n)*var(--cw))}.g-row{display:flex;border-bottom:1px solid var(--line);position:relative}
.g-l{width:120px;flex:none;position:sticky;left:0;z-index:3;background:var(--card);border-right:1px solid var(--line);padding:4px 8px;display:flex;flex-direction:column;justify-content:center}
.g-l b{font-size:14px;display:flex;align-items:center;gap:6px}.g-l b i{width:10px;height:10px;border-radius:3px;display:inline-block}.g-l span{font-size:10.5px;color:var(--mut)}.g-l em{font-style:normal;color:var(--crit);font-weight:700}
.g-t{position:relative;flex:none;width:calc(var(--n)*var(--cw))}.g-head{position:sticky;top:0;z-index:5;background:var(--chip)}.g-head .g-l{background:var(--chip);font-size:12px;font-weight:700}.g-head .g-t{display:flex}
.g-d{width:var(--cw);flex:none;text-align:center;padding:4px 0;border-right:1px solid var(--line);font-size:11px}.g-d b{display:block}.g-d span{color:var(--mut);font-size:10px}.g-d.sun,.g-d.sun span{color:var(--crit)}.g-d.today{background:rgba(245,158,11,.35)}
.g-c{position:absolute;top:0;bottom:0;width:var(--cw);border-right:1px solid var(--line)}.g-c.sun{background:rgba(220,38,38,.06)}.g-c.today{box-shadow:inset 0 0 0 999px rgba(245,158,11,.14)}
.g-c s{position:absolute;bottom:2px;left:0;right:0;text-align:center;text-decoration:none;font-size:10px;font-weight:700;color:var(--ok)}
.g-b{position:absolute;height:22px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;line-height:22px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.25)}.g-b.past{opacity:.5}.g-b:hover{outline:2px solid var(--ink)}
.bgmenu{position:absolute;right:10px;top:54px;z-index:9500;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none;width:230px}.bgmenu.on{display:block}
.bgmenu b{font-size:11px;color:var(--mut);display:block;margin:6px 0 4px}.bgmenu .row{display:flex;gap:6px;flex-wrap:wrap}.bgmenu .sw{width:44px;height:30px;border-radius:8px;border:2px solid var(--line);cursor:pointer;background-size:cover;background-position:center}.bgmenu .sw.on{border-color:var(--acc)}
/* 脈絡：訂單→排單→SMV→裁→車→包→出 */
.flow{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding:4px 0 8px}.flow em{align-self:center;font-style:normal;color:var(--mut);font-size:16px}
.fs{flex:1;min-width:118px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--bar2);border-radius:10px;padding:8px 10px}
.fs b{display:block;font-size:12px;color:var(--mut)}.fs span{display:block;font-size:18px;font-weight:800;margin:2px 0}.fs i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);line-height:1.4}
.fs.ok{border-top-color:var(--ok)}.fs.part{border-top-color:var(--warn)}.fs.none{opacity:.75}
body[data-bg]{background-size:cover;background-position:center;background-attachment:fixed}
body[data-bg] .pane,body[data-bg] .stage iframe{background:transparent}body[data-bg] .card,body[data-bg] .kpi{background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(6px)}
.sh-cv img{width:40px;height:40px;border-radius:10px;object-fit:cover;display:block;cursor:pointer;border:2px solid #f59e0b}.sh-back{display:none}
.card .cv{float:right;width:46px;height:46px;border-radius:10px;object-fit:cover;margin:0 0 4px 8px;border:2px solid #f59e0b}
.card .phc{font-size:10.5px;font-weight:700;color:#b45309;background:#fef3c7;border-radius:99px;padding:1px 7px;margin-left:4px}
.sh-t .lowtag,.lowtag{display:inline-block;color:#fff!important;font-size:10.5px;font-weight:800;color:#fff;background:var(--crit);border-radius:99px;padding:1px 7px}
</style>
</head>
<body>
<div class="hdr">
  <a class="home" href="portal_v2.html?v=4.25.0" title="回生產平台入口">🏭</a>
  <div><h1 id="hubTitle">VRT 生產平台</h1><div class="sub" id="hubSub">8 個入口 · 舊頁面和資料都不動</div></div>

<script>
(function(){
'use strict';
const V='4.33.0';
/* ── 8 個入口（Paul 11/11 核可）── 每個分頁就是原本那一頁 */
const HUBS=[
 {id:'overview',ic:'📊',name:'總覽＋報告',tabs:[['prod','生產總覽','production_v4.html'],['weekly','週報產生器','vrt_production_weekly_report_generator_v3.html'],['cust','客戶統計','vrt_customer_statistics_control_center_v1.html'],['erp','ERP 對照','vrt_erp_link_v1.html']]},
 {id:'orders',ic:'📋',name:'訂單與交期',drill:'orders',tabs:[['orders','訂單','orders_v3.html'],['po','PO 交期控制','VRT_PO_Delivery_Control_Center.html']]},
 {id:'plan',ic:'📅',name:'排單',drill:'plan',tabs:[['cap','排單／產能','production_plan_capacity_v1.html'],['cutplan','裁剪計劃','cutting_plan_v2.html']]},
 {id:'output',ic:'🧵',name:'生產實績',drill:'output',tabs:[['cut','裁剪','cutting_v3.html'],['sew','車縫','sewing_v5.html'],['cutpack','裁剪用布＋裝箱','vrt_cut_pack_v1.html'],['qc','QC 品檢','vrt_final_qc_v1.html']]},
 {id:'style',ic:'📐',name:'款式',drill:'style',tabs:[['ie','IE／OBD／SMV','ie_smv_report_v2_1.html'],['bom','BOM','VRT_BOM_Management_v2_AI.html'],['cost','成本','vrt_bom_costing_view_v39.html']]},
 {id:'fabric',ic:'🧶',name:'布料',drill:'fabric',tabs:[['stock','布料／副料庫存','vrt_fabric_stock_control_v1.html'],['inbound','布料進倉','vrt_fabric_delivery_greige_center_v1.html']]},
 {id:'ship',ic:'🚢',name:'成品與出貨',drill:'ship',tabs:[['fg','成品庫存','VRT_FG_Inventory_Management_v1.html'],['shipping','出貨進度','shipping_v2.html'],['month','月出貨','vrt_monthly_shipping_control_center_v1.html']]},
 {id:'parts',ic:'🔧',name:'機修零件',drill:'parts',tabs:[['parts','零件／採購／換針','vrt_spare_parts_v2.html']]}
];
window.VRT_HUBS=HUBS;
const $=s=>document.querySelector(s);
const E=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=(n,d)=>(n==null||!isFinite(n))?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:d==null?0:d});
const P=n=>(n==null||!isFinite(n))?'—':Number(n).toFixed(1)+'%';

/* ── 主題 ── */
function themeNow(){return document.documentElement.getAttribute('data-theme')||'dark'}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('vrt_theme',t)}catch(e){}$('#themeBtn').textContent='🎨';$('#themeBtn').title='淡色／深色／背景';
  document.querySelectorAll('#stage iframe').forEach(f=>{try{f.contentWindow.VRTTheme&&f.contentWindow.VRTTheme.apply()}catch(e){}})}
/* 背景：淡色／深色／圖片（內建 4 張漸層，或自己選一張圖；存在這台瀏覽器）*/
const BGS={none:'',mist:'linear-gradient(135deg,#dbeafe,#f5f3ff 45%,#fce7f3)',weave:'repeating-linear-gradient(45deg,rgba(99,102,241,.07) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(99,102,241,.07) 0 2px,transparent 2px 9px),linear-gradient(#f8fafc,#eef2ff)',night:'radial-gradient(circle at 20% 10%,#1e3a8a 0,transparent 45%),radial-gradient(circle at 85% 80%,#581c87 0,transparent 40%),#0b1020',leaf:'linear-gradient(160deg,#d1fae5,#ecfeff 50%,#fef9c3)'};
function applyBg(){let k='';try{k=localStorage.getItem('vrt_bg')||''}catch(e){}let img='';if(k==='custom'){try{img=localStorage.getItem('vrt_bg_img')||''}catch(e){}}const v=k==='custom'?(img?'url('+img+')':''):(BGS[k]||'');if(v){document.body.setAttribute('data-bg',k);document.body.style.backgroundImage=v}else{document.body.removeAttribute('data-bg');document.body.style.backgroundImage=''}}
function bgMenu(){let m=$('#bgMenu');if(!m){m=document.createElement('div');m.id='bgMenu';m.className='bgmenu';document.body.appendChild(m);document.addEventListener('click',e=>{if(!e.target.closest('#bgMenu,#themeBtn'))m.classList.remove('on')})}
  let k='';try{k=localStorage.getItem('vrt_bg')||''}catch(e){}
  m.innerHTML=`<b>明暗</b><div class="row"><button class="btn" data-th="light">☀️ 淡色</button><button class="btn" data-th="dark">🌙 深色</button></div><b>背景</b><div class="row">${Object.keys(BGS).map(x=>`<div class="sw ${x===(k||'none')?'on':''}" data-bg="${x}" title="${x==='none'?'不用背景':x}" style="background:${BGS[x]||'var(--bg)'}"></div>`).join('')}</div><b>自己的圖片</b><div class="row"><button class="btn" data-pick="1">🖼 選一張圖…</button><input type="file" accept="image/*" hidden></div><div class="small" style="margin-top:6px">背景只套在 8 個入口頁的外框和 📊 一覽；原本的頁面維持自己的底色。</div>`;
  m.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));

function hrIdb(){return new Promise(res=>{try{const q=indexedDB.open('psjhr',1);q.onupgradeneeded=()=>{try{q.transaction.abort()}catch(_){}};q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);q.onblocked=()=>res(null)}catch(_){res(null)}})}
async function hrGet(db,k){return new Promise(res=>{try{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(_){res(null)}})}
const lineOfDept=d=>{const s=String(d||'').toUpperCase();let m=s.match(/LINE\s*0*(\d{1,2})\b/)||s.match(/^L\s*0*(\d{1,2})\b/)||s.match(/第\s*0*(\d{1,2})\s*線/)||s.match(/(?:SEW|縫|車)[^0-9]{0,8}0*(\d{1,2})\b/);return m?'L'+(+m[1]):''};
const tenure=d=>{if(!d)return '';const m=Math.floor((new Date(ymdToday())-new Date(String(d).slice(0,10)))/(30.44*864e5));return m<0?'':m<12?m+' 個月':(m/12).toFixed(1)+' 年'};
function sewerGroups(){return once('sewer',async()=>{const db=await hrIdb();const d=db&&await hrGet(db,'db_v1');if(!d||!Array.isArray(d.emp)||!d.emp.length){const e=new Error('這台還沒有 PSJHR 員工資料。請先在這台打開一次 PSJHR（會自動下載），再回來這裡。');e.hr=true;throw e}
  const dept={},title={},jc={};(d.jobcode||[]).forEach(j=>jc[j.code]=j.desc);[...(d.basepay||[]),...(d.contact||[])].forEach(r=>{if(r.dept&&!dept[r.emp_no]&&!/^\d{3}$/.test(r.dept))dept[r.emp_no]=r.dept;if(r.title&&!title[r.emp_no])title[r.emp_no]=r.title});
  const left=new Set((d.joinleave||[]).filter(r=>r.leave_date).map(r=>r.emp_no));
  const {rows:sw}=await loadTool('sewing',keepMonths(2)).catch(()=>({rows:[]}));const days=lastDays(sw,30,r=>r.date),D=new Set(days);const SL=groupBy(sw.filter(r=>D.has(r.date)),r=>'L'+String(r.lineNo||r.line||'').replace(/^Line\s*/i,'').replace(/^L/i,''));
  const people=d.emp.filter(r=>r.emp_no&&!/離|RESIGN|LEFT|TERMIN|QUIT/i.test(String(r.status||''))&&!left.has(r.emp_no)).map(r=>{const dn=dept[r.emp_no]||r.dept_code||'',tt=jc[r.title_code]||title[r.emp_no]||r.title_code||'';return {r,dn,tt,line:lineOfDept(dn)}})
   .filter(p=>p.line||/SEW|車縫|縫製|OPERATOR|車工/i.test(p.dn+' '+p.tt));
  const pid=no=>{const m=String(no).match(/^0*([A-Za-z]?\d+)/);return m?m[1]:String(no)};
  const out=people.map(p=>{const r=p.r,ls=SL.get(p.line)||[];const e=effW(ls),n=sum(ls,x=>x.pieces);
    return {key:String(r.emp_no),kind:'車工',title:r.name||r.emp_no,sub:E([r.emp_no,p.line||p.dn].filter(Boolean).join(' · ')),line:p.line||'—',search:[r.emp_no,p.dn,p.tt,p.line].join(' '),chip:p.line,
     badge:`<span class="tag">${E(p.tt||'—')}</span>`,pid:pid(r.emp_no),
     kpis:[[E(p.line||'—'),'線別'],[E(tenure(r.join_date)||'—'),'年資'],[E(r.sex||'—'),'性別'],[P(e),'這條線近 30 天效率',effCls(e)],[F(n),'這條線近 30 天件數']],
     detail:()=>`<div id="hrPh" data-pid="${E(pid(r.emp_no))}" style="float:right;margin:0 0 8px 10px"></div><h4>基本資料</h4>${kv([['工號 Emp No.',r.emp_no],['姓名 Name',r.name],['部門 Dept',p.dn],['職稱 Title',p.tt],['線別 Line',p.line],['性別 Sex',r.sex],['到職 Join date',r.join_date],['年資 Tenure',tenure(r.join_date)],['狀態 Status',r.status]])}
      <h4>這條線近 30 天（車縫日報；個人產量要有個人計件資料才算得出來）</h4>${ls.length?CH.bars(dailySeries(ls,days,x=>x.pieces,b=>effW(b)),{v2:true,v2Unit:'%',legend:'長條＝這條線每天件數，橘線＝效率'}):'<p class="note">近 30 天沒有這條線的車縫日報。</p>'}
      <p class="note">完整個人檔案（出勤、請假、薪資、照片）在 PSJHR：<a href="https://saintdou-weng.github.io/psjhr/#emp" target="_blank" rel="noopener">打開 PSJHR 員工頁 ↗</a></p>`}});
  return out.sort((a,b)=>String(a.line).localeCompare(String(b.line),'en',{numeric:true})||a.title.localeCompare(b.title))})}

  const lk=l=>'L'+(String(l||'').match(/\d+/)||[''])[0];
  const draw=()=>{const days=[];for(let d=start,k=0;k<weeks*7;k++,d=addD(d,1))days.push(d);const end=days[days.length-1],today=ymdToday(),cw=weeks<=2?74:weeks<=4?46:30;
   p.querySelector('#gSeg').innerHTML=`<button data-s="-7">◀ 上一週</button><button data-s="0">今天</button><button data-s="7">下一週 ▶</button>`+[2,3,4,8].map(w=>`<button data-w="${w}" class="${w===weeks?'on':''}">看 ${w} 週</button>`).join('')+`<span class="glegend"><i class="lg-plan"></i>色條＝排單（款號・件數）<i class="lg-act"></i>小字＝車縫實際件數<i class="lg-gap"></i>沒排單<i class="lg-today"></i>今天</span>`;
   p.querySelectorAll('#gSeg [data-s]').forEach(b=>b.onclick=()=>{start=+b.dataset.s?addD(start,+b.dataset.s):monday(today);draw()});p.querySelectorAll('#gSeg [data-w]').forEach(b=>b.onclick=()=>{weeks=+b.dataset.w;draw()});
   const vis=runs.filter(r=>r.end>=start&&r.start<=end);const flat=[];let gapAll=0,noPlan=[];
   let h=`<div class="gantt" style="--cw:${cw}px;--n:${days.length}"><div class="g-row g-head"><div class="g-l">組別</div><div class="g-t">${days.map(d=>{const w=new Date(d+'T00:00:00').getDay();return `<div class="g-d ${w===0?'sun':''} ${d===today?'today':''}"><b>${d.slice(5).replace('-','/')}</b><span>${'日一二三四五六'[w]}</span></div>`}).join('')}</div></div>`;
   lines.forEach((l,li)=>{const col=LINE_COL[li%LINE_COL.length];const rs=vis.filter(r=>r.line===l).sort((a,b)=>a.start.localeCompare(b.start));const lanes=[];
    rs.forEach(r=>{let k=lanes.findIndex(e=>e<r.start);if(k<0){k=lanes.length;lanes.push('')}lanes[k]=r.end;r._lane=k;r._col=col;flat.push(r)});
    const busy=new Set();rs.forEach(r=>days.forEach(d=>{if(d>=r.start&&d<=r.end)busy.add(d)}));
    const gaps=days.filter(d=>d>=today&&new Date(d+'T00:00:00').getDay()!==0&&!busy.has(d));gapAll+=gaps.length;if(!rs.some(r=>r.end>=today))noPlan.push(l);
    const qty=sum(rs,r=>r.qty),act=sew.get(l)||new Map();const lh=Math.max(1,lanes.length)*26+22;
    h+=`<div class="g-row" style="height:${lh}px"><div class="g-l"><b><i style="background:${col}"></i>${E(l)}</b><span>${F(qty)} 件・${rs.length} 張${gaps.length?`・<em>空 ${gaps.length} 天</em>`:''}</span></div><div class="g-t">`+
     days.map((d,di)=>{const w=new Date(d+'T00:00:00').getDay();const a=act.get(d);return `<div class="g-c ${w===0?'sun':''} ${d===today?'today':''} ${gaps.includes(d)?'gap':''}" style="left:calc(${di}*var(--cw))">${a?`<s>${F(a)}</s>`:''}</div>`}).join('')+
     rs.map(r=>{const a=Math.max(0,dd(start,r.start)),b=Math.min(days.length-1,dd(start,r.end));const past=r.end<today;return `<div class="g-b ${past?'past':''}" data-i="${flat.indexOf(r)}" style="left:calc(${a}*var(--cw) + 2px);width:calc(${b-a+1}*var(--cw) - 4px);top:${r._lane*26+3}px;background:${col}" title="${E(r.style)}・${F(r.qty)} 件・${r.start.slice(5)}～${r.end.slice(5)}">${E(r.style)}・${F(r.qty)}</div>`}).join('')+`</div></div>`});
   h+='</div>';p.querySelector('#gScroll').innerHTML=h;
   const maxEnd=runs.map(r=>r.end).sort().pop()||'';
   p.querySelector('#gLead').innerHTML=`📌 ${start.slice(5).replace('-','/')}～${end.slice(5).replace('-','/')}：<b>${lines.length}</b> 條線、<b>${vis.length}</b> 張排單、<b>${F(sum(vis,r=>r.qty))}</b> 件。${gapAll?`今天起有 <b class="crit">${gapAll}</b> 個工作天沒排單`:'今天起沒有空檔'}${noPlan.length?`；<b class="crit">${noPlan.join('、')}</b> 今天之後表上完全沒單`:''}。<span class="small">排單表：${E(src)}，最晚排到 ${E(maxEnd)}。點色條看這張單做到哪。</span>`;
   p.querySelectorAll('.g-b').forEach(b=>b.onclick=()=>SHEET.open(flat.map(runGroup),+b.dataset.i));
   const t=p.querySelector('.g-d.today');t&&t.scrollIntoView({block:'nearest',inline:'center'})};
  const runGroup=r=>{const act=sew.get(r.line)||new Map();const mine=r.sewRows;const done=sum(mine,x=>x.pieces),rem=Math.max(0,r.qty-done);const dys=lastDays(mine,30,x=>x.date);const rate=dys.length?done/dys.length:0;const today=ymdToday();
    let est='';if(rem>0&&rate>0){let d=today,n=Math.ceil(rem/rate);while(n>0){d=addD(d,1);if(new Date(d+'T00:00:00').getDay()!==0)n--}est=d}
    const late=est&&est>r.end;
    return {key:r.k,kind:'排單',title:r.line+'・'+r.style,sub:E(r.customer)+'・'+r.start.slice(5)+'～'+r.end.slice(5),chip:F(r.qty),badge:rem<=0&&done>0?'<span class="tag ok">✅ 做完了</span>':late?`<span class="tag crit">🔴 照現在速度 ${est.slice(5)} 才做完（排到 ${r.end.slice(5)}）</span>`:est?`<span class="tag ok">🟢 估 ${est.slice(5)} 做完</span>`:'<span class="tag">還沒開始車</span>',
     kpis:[[F(r.qty),'排單件數'],[F(done),'已車',done?'ok':''],[F(rem),'還剩',rem?'warn':'ok'],[F(r.daily),'排單日產'],[F(rate),'實際每天']],
     detail:()=>`${flowHtml(r,done)}
      <h4>📈 每天實際車縫</h4>${dys.length?CH.bars(dys.map(d=>({label:d.slice(5),v:sum(mine.filter(x=>x.date===d),x=>x.pieces),v2:effW(mine.filter(x=>x.date===d))})),{v2:true,v2Unit:'%',legend:`長條＝這條線這一款每天車的件數，橘線＝效率。排單日產目標 ${F(r.daily)} 件。`}):'<p class="note">車縫日報裡還沒有這條線做這一款的紀錄。</p>'}
      <h4>📋 排單內容</h4>${table([['PO',x=>E(x.po)],['顏色',x=>E(x.color)],['尺寸',x=>E(x.size)],['排車縫',x=>F(x.sewingQty),1],['已裁',x=>F(x.cutQty),1],['開始',x=>E(x.startDate)],['結束',x=>E(x.endDate)],['人數',x=>F(x.manpower),1],['SMV',x=>F(x.smv,2),1],['備註',x=>E(x.remark)]],r.rows)}
      <h4>🧵 同一款其他線</h4>${(()=>{const o=runs.filter(x=>x!==r&&normS(x.style)===normS(r.style));return o.length?table([['線',x=>E(x.line)],['件數',x=>F(x.qty),1],['開始',x=>E(x.start)],['結束',x=>E(x.end)]],o):'<p class="note">只有這條線做這一款。</p>'})()}`}};
  Promise.all([loadTool('prodplan'),loadTool('sewing',keepMonths(3))]).then(([pl,sw])=>{
   const rows=pl.rows.filter(r=>r&&r.line&&+r.sewingQty>0&&String(r.style||'').trim()&&r.startDate);src=[...new Set(rows.map(r=>String(r.sourceSheet||'').replace(/^VRT export · /,'')))].slice(-1)[0]||'';
   rows.forEach(r=>{const st=String(r.startDate).slice(0,10),en=String(r.endDate||r.finishDate||r.startDate).slice(0,10),l=lk(r.line),k=l+'|'+normS(r.style);
    const x=runs.find(q=>q.k0===k&&!(st>addD(q.end,3)||en<addD(q.start,-3)));
    if(x){if(st<x.start)x.start=st;if(en>x.end)x.end=en;x.qty+=+r.sewingQty||0;x.daily=Math.max(x.daily,+r.dailyOutput||0);x.rows.push(r)}
    else runs.push({k0:k,k:k+'|'+st,line:l,style:String(r.style).trim(),customer:String(r.customer||''),start:st,end:en<st?st:en,qty:+r.sewingQty||0,daily:+r.dailyOutput||0,rows:[r]})});
   sw.rows.forEach(r=>{const l=lk(r.lineNo);if(!sew.has(l))sew.set(l,new Map());const m=sew.get(l);m.set(r.date,(m.get(r.date)||0)+(+r.pieces||0))});
   runs.forEach(r=>{r.sewRows=sw.rows.filter(x=>lk(x.lineNo)===r.line&&x.date>=addD(r.start,-2)&&(()=>{const a=normS(x.styleNo),b=normS(r.style);return a&&b&&(a===b||a.indexOf(b)>=0||b.indexOf(a)>=0)})())});
   lines=[...new Set(runs.map(r=>r.line))].sort((a,b)=>(+a.slice(1))-(+b.slice(1)));draw();loadX()}).catch(e=>{p.querySelector('#gLead').innerHTML='⚠️ '+E(e.message||e)})}},
 ship:{segments:[
  {label:'📦 每張 PO（出貨）',photo:'ship',photoTip:'放這張 PO 的包裝、嘜頭、裝箱正確照；當月有不同的放每月異常。',sorts:[['未出多→少',(a,b)=>b.n-a.n],['ETD 近→遠',(a,b)=>String(a.etd||'9').localeCompare(String(b.etd||'9'))],['訂單多→少',(a,b)=>b.o-a.o]],build:async()=>({groups:await poGroups(),top:'<p class="note">每張 PO：訂單、已出、未出、ETD，依款號／顏色／尺寸列出。</p>'})},
  {label:'🚢 每個客戶（出貨進度）',photo:'customer',photoKey:g=>custKey(g.title),sorts:[['未出件數',(a,b)=>b.n-a.n],['已出件數',(a,b)=>b.s-a.s]],
   async build(){const [{rows},ms]=await Promise.all([loadTool('shipping'),loadTool('monthship').catch(()=>({rows:[]}))]);
    const C=groupBy(rows,r=>r.cust);const groups=[...C].map(([k,a])=>{const n=sum(a,r=>r.open),s=sum(a,r=>r.shipped),o=sum(a,r=>r.orig);const byM=groupBy(a.filter(r=>r.etd),r=>String(r.etd).slice(0,7));const mk=[...byM.keys()].sort().slice(-12);
      return {key:k,title:k,n,s,sub:o?P(s/o*100)+' 已出':'',kpis:[[F(n),'未出件',n?'warn':''],[F(s),'已出件'],[String(new Set(a.filter(r=>+r.open>0).map(r=>r.po)).size),'張 PO 未完']],spark:mk.map(m=>sum(byM.get(m),r=>r.orig)),
       detail:()=>`<h4>每月（ETD）訂單件數＋未出</h4>${CH.bars(mk.map(m=>({label:m,v:sum(byM.get(m),r=>r.orig),v2:sum(byM.get(m),r=>r.open)})),{v2:true,legend:'長條＝訂單件數，橘線＝還沒出的件數'})}
        <h4>還沒出完的（未出多→少）</h4>${table([['PO',r=>E(r.po)],['款號',r=>E(r.style)],['品名',r=>E(String(r.desc||'').slice(0,28))],['布料',r=>E(r.fabItem)],['訂單',r=>F(r.orig),1],['已出',r=>F(r.shipped),1],['未出',r=>`<b class="warn">${F(r.open)}</b>`,1],['ETD',r=>E(r.etd)],['狀態',r=>E(r.status)]],a.filter(r=>+r.open>0).sort((x,y)=>y.open-x.open))}`}}).filter(g=>g.n||g.s);
    const M=groupBy(ms.rows,r=>r.month);const mm=[...M.keys()].sort();
    return {groups,top:`<div class="kpis"><div class="kpi"><div class="v warn">${F(sum(rows,r=>r.open))}</div><div class="l">全部未出件數</div></div><div class="kpi"><div class="v">${F(sum(rows,r=>r.shipped))}</div><div class="l">已出件數</div></div>${mm.slice(-3).map(m=>`<div class="kpi"><div class="v">${F(sum(M.get(m),r=>r.pieces))}</div><div class="l">${E(m)} 月出貨件數</div></div>`).join('')}</div>${mm.length?`<h4 style="margin:4px 0">月出貨件數</h4>${CH.bars(mm.map(m=>({label:m,v:sum(M.get(m),r=>r.pieces)})))}`:''}`}}}
 ]},
 fabric:{segments:[
  {label:'🧶 每個料號（庫存＋近 3 個月進出）',photo:'fabric',photoTip:'放這個布的正確顏色／布面照；當月收到色差或不同的，放在下面的每月異常。',sorts:[['庫存多→少',(a,b)=>b.bal-a.bal],['發出多→少',(a,b)=>b.iss-a.iss],['進倉多→少',(a,b)=>b.rec-a.rec],['料號',(a,b)=>a.title.localeCompare(b.title,'en',{numeric:true})]],
   build:async()=>({groups:await fabricGroups(),top:'<p class="note">每個料號：目前庫存（最近一次盤點）＋近 3 個月進出。點進去可放正確布面照與每月色差／異常照。</p>'})},
  {label:'🧷 輔料（每個料號）',photo:'accessory',photoTip:'放這個輔料（鈕扣、拉鍊、吊牌、織帶…）正確的樣子；當月收到不同顏色或規格的放每月異常。',sorts:[['結存多→少',(a,b)=>b.bal-a.bal],['料號',(a,b)=>a.title.localeCompare(b.title,'en',{numeric:true})]],build:async()=>({groups:await accGroups(),top:'<p class="note">最近一次副料盤點的每個料號：結存、顏色／尺寸。點進去可放輔料照片。</p>'})}
 ]},
 parts:{segments:[
  {label:'🔧 零件（依類別）',sorts:[['低於安全量',(a,b)=>b.low-a.low],['品項數',(a,b)=>b.n-a.n]],
   async build(){const {rows}=await loadTool('spareparts',k=>/^p:parts_master/.test(k));const C=groupBy(rows,r=>r.category||'未分類');
    const isLow=r=>+r.minStock>0&&(+r.qty||0)<+r.minStock;
    const groups=[...C].map(([k,a])=>{const low=a.filter(isLow).length;return {key:k,title:k,n:a.length,low,search:a.map(r=>r.partNo+' '+r.name+' '+r.machineType).join(' '),sub:'',kpis:[[String(a.length),'品項'],[String(low),'低於安全量',low?'crit':'ok'],[F(sum(a,r=>(+r.qty||0)*(+r.unitPrice||0))),'庫存金額']],
      detail:()=>`<h4>依機種</h4>${CH.hbars([...groupBy(a,r=>r.machineType||'—')].map(([m,b])=>({label:m,v:b.length})).sort((x,y)=>y.v-x.v).slice(0,15))}<h4>品項（低於安全量排前面）</h4>${table([['料號',r=>link('parts',r.partNo)],['名稱',r=>E(r.name)],['規格',r=>E(r.spec)],['機種',r=>E(r.machineType)],['庫存',r=>`<b class="${isLow(r)?'crit':''}">${F(r.qty)}</b>`,1],['安全量',r=>F(r.minStock),1],['單價',r=>F(r.unitPrice,2),1],['位置',r=>E(r.location)]],a.slice().sort((x,y)=>(isLow(y)-isLow(x))||String(x.partNo).localeCompare(String(y.partNo))))}`}});
    return {groups,top:`<div class="kpis"><div class="kpi"><div class="v">${rows.length}</div><div class="l">零件品項</div></div><div class="kpi"><div class="v crit">${rows.filter(isLow).length}</div><div class="l">低於安全量</div></div></div><p class="note">點類別 → 品項表的料號可再點開那一個零件（照片、換零件紀錄）。</p>`}}},
  {label:'🔩 每個零件（料號）',photo:'parts',photoTip:'放零件正確的樣子（型號、規格標籤）；收到不一樣的放每月異常。',sorts:[['低於安全量先',(a,b)=>(b.low-a.low)||(b.used-a.used)],['近 3 個月換得多',(a,b)=>b.used-a.used],['庫存金額',(a,b)=>b.amt-a.amt],['料號',(a,b)=>a.title.localeCompare(b.title,'en',{numeric:true})]],build:async()=>({groups:await partGroups(),top:'<p class="note">點一個零件：照片、庫存、換零件紀錄。</p>'})},
  {label:'⚙️ 機台／設備（每一台）',photo:'machine',photoTip:'放這台機器的正面照與銘牌（廠牌、型號、序號），盤點時一看就對得上。',sorts:[['線別',(a,b)=>String(a.line).localeCompare(String(b.line),'en',{numeric:true})],['近 3 個月換得多',(a,b)=>b.used-a.used],['故障／待修先',(a,b)=>(/broken|repair/.test(b.cond)?1:0)-(/broken|repair/.test(a.cond)?1:0)],['資產編號',(a,b)=>a.title.localeCompare(b.title,'en',{numeric:true})]],build:async()=>{const l=await machineGroups();const bad=l.filter(g=>/broken|repair/.test(g.cond)).length;return {groups:l,top:`<div class="kpis"><div class="kpi"><div class="v">${l.length}</div><div class="l">台機器（清冊）</div></div><div class="kpi"><div class="v ${bad?'crit':'ok'}">${bad}</div><div class="l">故障／待修</div></div><div class="kpi"><div class="v">${new Set(l.map(g=>g.line).filter(Boolean)).size}</div><div class="l">條線／位置</div></div></div><p class="note">機台照片可以在每台的「📷 照片」上傳，或用照片庫的「📥 匯入對照表」把 Excel 裡的機台照片一次匯入（照片同一列要有資產編號）。</p>`}}},
  {label:'🪡 換針（依針型／尺寸）',photo:'needle',photoTip:'放這種針的正確樣子（針型、號數）；斷針／彎針的異常照放每月。',sorts:[['近 30 天支數',(a,b)=>b.n30-a.n30],['斷／損多→少',(a,b)=>b.fail-a.fail]],build:async()=>({groups:await needleGroups(),top:'<p class="note">換款（Change Style）是計畫內消耗，不算斷／損。</p>'})}
 ]}
};

if(!location.hash)location.replace('#'+HUBS[0].id);
