/* v4.25（2026-11-12）8 個入口：Paul 11/11 核可、11/12「還沒進行合併的動作」→ 這一頁就是合併後的入口。
   舊頁面和資料都不動：每個分頁就是原本那一頁（同一個網站，資料共用）。第一個分頁「📊 一覽」是新的：點卡片展開圖表＋明細，往下滑自動載入更多。 */
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#4f46e5;--acc2:#eef2ff;--ok:#059669;--warn:#d97706;--crit:#dc2626;--bar:#6366f1;--bar2:#94a3b8;--hdr:#ffffff;--chip:#f1f5f9}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}

.stage iframe.on{display:block}

.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}

.sh-hero .ph{width:168px;height:168px;flex:none;border-radius:12px;background:var(--chip) center/cover no-repeat;border:2px solid #f59e0b;cursor:pointer;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:13px;line-height:1.5}

.sh-hero .tx{flex:1;min-width:0}.sh-hero .kpis{margin:10px 0 0}.sh-hero .tx b{font-size:22px;display:block;word-break:break-all}.sh-hero .sub{color:var(--mut);font-size:13px;margin:4px 0 8px}.sh-hero .chips .tag{margin-right:6px}

 .sh-t>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh-t>span .tag{display:none}.sh-hd{flex-wrap:nowrap}}

.gwrap{display:flex;flex-direction:column;height:100%}.gscroll{flex:1;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:0}

.lg-plan{background:var(--bar)}.lg-act{background:none!important;width:auto!important}.lg-act::before{content:'792';font-style:normal;font-size:10px;color:var(--ok);font-weight:700}

.fs.ok{border-top-color:var(--ok)}.fs.part{border-top-color:var(--warn)}.fs.none{opacity:.75}

const GAS=()=>{try{return (window.VRTPlatform&&VRTPlatform.getGasUrl&&VRTPlatform.getGasUrl())||(window.VRT_DEPLOY_CONFIG&&VRT_DEPLOY_CONFIG.gasUrl)||''}catch(e){return ''}};
const idb=(()=>{let dbp;const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('VRT_Hub',1);r.onupgradeneeded=()=>r.result.createObjectStore('c');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(m,f)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('c',m);const q=f(t.objectStore('c'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  const T=(p,ms)=>Promise.race([p.catch(()=>null),new Promise(r=>setTimeout(()=>r(null),ms))]);

const memo={};
async function loadTool(tool,keep){
  const mk=tool+'|'+(keep?keep.toString():'');if(memo[mk])return memo[mk];
  return memo[mk]=(async()=>{const G=GAS();if(!G)throw new Error('這台還沒設定雲端連線（入口頁 GAS URL）');
    let c=await idb.get('t#'+tool);c=c&&c.b?c:{h:{},b:{}};
    const m=await fetch(G+'?action=smartManifest&tool='+tool+'&t='+Date.now(),{redirect:'follow',cache:'no-store'}).then(r=>r.json());
    const d=m.data||m;const H=d.hashes||{};let want=Object.keys(H).filter(k=>!keep||keep(k));let ch=false;
    for(let i=0;i<want.length;i+=4)await Promise.all(want.slice(i,i+4).map(async k=>{if(c.h[k]===H[k]&&c.b[k])return;
      const b=await fetch(G+'?action=smartBucket&tool='+tool+'&bucket='+encodeURIComponent(k)+'&hash='+encodeURIComponent(H[k]),{redirect:'follow'}).then(r=>r.json());
      c.b[k]=((b.data&&b.data.records)||[]).map(r=>r._vrtValue||r);c.h[k]=H[k];ch=true}));
    if(ch){/* v4.50 同一個工具同時載兩種分桶（例：IE 款式＋工序）時，先合併再存，免得互相蓋掉快取 */let c2=await idb.get('t#'+tool).catch(()=>null);c2=c2&&c2.b?c2:{h:{},b:{}};for(const k of Object.keys(c.b))if(c.h[k]===H[k]){c2.b[k]=c.b[k];c2.h[k]=c.h[k]}idb.set('t#'+tool,c2).catch(()=>{})}
    return {rows:want.flatMap(k=>c.b[k]||[]),updatedAt:d.updatedAt,summary:d.summary||{}}})().catch(e=>{delete memo[mk];throw e});
}
const monthsBack=n=>{const out=[];const d=new Date();for(let i=0;i<n;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}return out};

 /* bars: [{label,v,v2?}] ; v2 畫成折線（右軸，例如效率%） */
 bars(items,o){o=o||{};const n=items.length;if(!n)return '<p class="note">沒有資料</p>';const W=Math.max(640,n*28),H=220,pl=44,pr=o.v2?40:8,pt=12,pb=40;

  const y=v=>pt+ih-(v/mx)*ih,y2=v=>pt+ih-(v/mx2)*ih;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:${W}px;min-width:${Math.min(W,560)}px">`;
  for(let g=0;g<=4;g++){const v=mx*g/4,yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-4}" y="${yy+3}" font-size="9" text-anchor="end" fill="var(--mut)">${F(v)}</text>`;
    if(o.v2)s+=`<text x="${W-pr+4}" y="${yy+3}" font-size="9" fill="var(--warn)">${F(mx2*g/4)}${o.v2Unit||''}</text>`}
  const step=Math.ceil(n/16);
  items.forEach((it,i)=>{const x=pl+i*bw;s+=`<rect x="${x+bw*.15}" y="${y(it.v||0)}" width="${bw*.7}" height="${Math.max(0,pt+ih-y(it.v||0))}" rx="2" fill="${it.c||'var(--bar)'}"><title>${E(it.label)}：${F(it.v)}${o.v2&&it.v2!=null?' · '+F(it.v2,1)+(o.v2Unit||''):''}</title></rect>`;
    if(i%step===0)s+=`<text x="${x+bw/2}" y="${H-pb+12}" font-size="9" text-anchor="end" fill="var(--mut)" transform="rotate(-35 ${x+bw/2} ${H-pb+12})">${E(String(it.label).slice(0,12))}</text>`});

};

const lineOfDept=d=>{const s=String(d||'').toUpperCase();let m=s.match(/LINE\s*0*(\d{1,2})\b/)||s.match(/^L\s*0*(\d{1,2})\b/)||s.match(/第\s*0*(\d{1,2})\s*線/)||s.match(/(?:SEW|縫|車)[^0-9]{0,8}0*(\d{1,2})\b/);return m?'L'+(+m[1]):''};

 orders:{segments:[
  {label:'👥 每個客戶還有多少沒做',photo:'customer',photoKey:g=>custKey(g.title),photoTip:'放客戶的吊牌、標籤、包裝標準照。',sorts:[['還沒做的箱數 多→少',(a,b)=>b.n-a.n],['最近要出的排前面',(a,b)=>String(a.nextShip||'9').localeCompare(String(b.nextShip||'9'))],['比上一次增加最多',(a,b)=>b.diff-a.diff]],
   async build(){const [{rows},po]=await Promise.all([loadTool('orders',k=>/^p:weekly_/.test(k)&&monthsBack(4).some(m=>k.indexOf(m)>=0)),loadTool('orders',k=>/^h:/.test(k)).catch(()=>({rows:[]}))]);
    const dates=[...new Set(rows.map(r=>r.as_of_date).filter(Boolean))].sort();const last=dates[dates.length-1],prev=dates[dates.length-2];const today=ymdToday();
    const PO=groupBy(po.rows,r=>custKey(r.customer));
    const C=groupBy(rows,r=>r.customer);const groups=[...C].map(([k,a])=>{const byD=groupBy(a,r=>r.as_of_date);const cur=byD.get(last)||[];const n=sum(cur,r=>r.unproducedCtns),done=sum(cur,r=>r.producedCtns),amt=sum(cur,r=>r.openAmount);
      const pn=prev?sum(byD.get(prev)||[],r=>r.unproducedCtns):n,diff=n-pn;
      const ser=dates.map(d=>({label:d.slice(5),v:sum(byD.get(d)||[],r=>r.unproducedCtns)}));

      const pos=[...groupBy(pls,r=>r.po_number)].map(([no,b])=>({no,qty:sum(b,r=>r.qty),amt:sum(b,r=>r.ext_price),ship:b.map(r=>r.ship).filter(Boolean).sort()[0]||'',od:b.map(r=>r.order_date).filter(Boolean).sort()[0]||'',styles:[...new Set(b.map(r=>r.style_code))]})).sort((x,y)=>String(y.ship).localeCompare(String(x.ship)));
      const fut=pos.filter(x=>x.ship>=today).sort((x,y)=>x.ship.localeCompare(y.ship)),nextShip=fut.length?fut[0].ship:'';

      return {key:k,kind:'客戶',title:k,n,amt,diff,nextShip,search:pos.map(x=>x.no+' '+x.styles.join(' ')).join(' '),sub:'到 '+String(last||'').slice(5),badge,chip:F(n)+' 箱',

       bar:tot?done/tot*100:0,barCap:tot?`還沒出的 ${F(tot)} 箱裡，已做好 ${P(done/tot*100)}`:'目前沒有未出的箱數',spark:ser.map(x=>x.v),sparkCap:`最近 ${ser.length} 次 Weekly「還沒做」的箱數（越來越矮＝有在消化）`,
       detail:()=>`<h4>📉 走勢</h4><p class="note">每一條＝那一次 Weekly 報表上，這個客戶「還沒生產」的箱數。最右邊是最新（${E(last)}）。</p>${CH.bars(ser)}

        <h4>📄 客戶 PDF 訂單（${pos.length} 張）</h4>${pos.length?`<p class="note">客戶寄來的原始 PO。🟢 還沒到要求出貨日　⚪ 已經過了要求出貨日（是否已出請看「成品與出貨」）。</p>`+table([['',x=>x.ship?(x.ship>=today?'🟢':'⚪'):'❔'],['PO',x=>E(x.no)],['下單日',x=>E(x.od||'—')],['要求出貨日',x=>`<b>${E(x.ship||'沒寫')}</b>`],['還有幾天',x=>x.ship&&x.ship>=today?daysTo(x.ship)+' 天':'—',1],['件數',x=>F(x.qty),1],['金額',x=>'$'+F(x.amt),1],['款式',x=>`<span class="small">${E(x.styles.slice(0,4).join('、'))}${x.styles.length>4?' …共 '+x.styles.length+' 款':''}</span>`]],pos):'<p class="note">平台裡還沒有這個客戶的 PDF 訂單。</p>'}

  {label:'📄 每張客戶 PDF 訂單（依要出貨日）',sorts:[['還沒到期的先（近→遠）',(a,b)=>(a.past-b.past)||(a.past?String(b.ship).localeCompare(String(a.ship)):String(a.ship).localeCompare(String(b.ship)))],['件數 多→少',(a,b)=>b.n-a.n],['下單日 新→舊',(a,b)=>String(b.od).localeCompare(String(a.od))]],
