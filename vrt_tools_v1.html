<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#0e7490;--red:#dc2626;--grn:#059669;--amb:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:17px;flex:1;min-width:180px}header a{color:#4f46e5;font-weight:700;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.kpi b{display:block;font-size:22px}.kpi small{color:var(--mut)}.kpi.on{border-color:var(--acc);box-shadow:0 0 0 2px #a5f3fc}
.tabs{display:flex;gap:6px;margin:6px 0 10px;overflow-x:auto}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}.chips button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.chips button.on{background:#ecfeff;border-color:var(--acc);color:#155e75;font-weight:800}
.flt{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px}@media(max-width:640px){.flt{grid-template-columns:1fr 1fr}}
input,select,textarea{font:inherit;border:1px solid #d6dde8;border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:6px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.it{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;gap:10px;padding:8px;cursor:pointer;align-items:center}.it:hover{border-color:var(--acc)}
.th{width:64px;height:64px;border-radius:10px;background:#f1f5f9;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
.it .t{flex:1;min-width:0}.it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .t small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{font-size:20px;font-weight:900;text-align:right;line-height:1}.q small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#155e75;font-weight:800}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;color:#fff}
.cat{margin:14px 0 6px;font-weight:900;color:#334155;font-size:15px}
.note{font-size:12px;color:var(--mut);line-height:1.5}#msg{margin:8px 0;font-weight:700}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form label{font-size:12px;color:var(--mut);display:grid;gap:3px}.form .w{grid-column:1/-1}
table.mx{border-collapse:collapse;width:100%;background:#fff;font-size:13px}table.mx th,table.mx td{border:1px solid var(--line);padding:6px 8px;text-align:center}table.mx th{background:#f8fafc;position:sticky;top:0}table.mx td.l{text-align:left;font-weight:700;white-space:nowrap}table.mx th{font-size:12px;min-width:56px}table.mx td.n{cursor:pointer;color:#155e75;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}.ov>div{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:600}
.qrb{display:flex;gap:12px;align-items:center;border:1px dashed #94a3b8;border-radius:12px;padding:10px;margin:10px 0}.qrb svg{width:110px;height:110px;flex:none}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:grid!important;grid-template-columns:repeat(3,1fr);gap:4mm;padding:0}.lb{border:1px solid #000;border-radius:3mm;padding:2mm;display:flex;gap:2mm;align-items:center;break-inside:avoid;height:30mm}.lb svg{width:26mm;height:26mm;flex:none}.lb b{font-size:11pt;font-family:monospace}.lb div{font-size:8pt;line-height:1.25}@page{size:A4;margin:8mm}}
@media(max-width:520px){header h1 small{display:none}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi b{font-size:19px}.form{grid-template-columns:1fr}}
</style></head><body>
<header><a href="vrt_hub_v1.html">◀ 生產平台</a><h1>🧰 <span id="ttl">生產器具與工具</span> <small style="font-weight:400;color:#64748b;font-size:12px">Production Equipment &amp; Tools</small></h1>
<span id="lng" style="display:flex;border:1px solid #e2e8f0;border-radius:99px;overflow:hidden"><button data-l="zh" class="btn g" style="border:0;border-radius:0;padding:6px 10px">中</button><button data-l="en" class="btn g" style="border:0;border-radius:0;padding:6px 10px">EN</button><button data-l="km" class="btn g" style="border:0;border-radius:0;padding:6px 10px">ខ្មែរ</button></span>
<button class="btn g" id="scan">📷 <span>掃 QR</span></button><button class="btn" id="add">＋ <span>新增</span></button></header>
<main>
<div class="kpis" id="kpis"></div>
<div class="tabs" id="tabs"><button data-v="list" class="on"></button><button data-v="loc"></button><button data-v="count"></button><button data-v="label"></button><button data-v="import"></button></div>
<div id="msg"></div>
<div id="view"></div>
</main>
<div id="print"></div>
<script src="vendor/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id),E=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V=VRTTools;let LG=(()=>{try{return localStorage.getItem('vrt_lang')||'zh'}catch(_){return 'zh'}})();if(!/^(zh|en|km)$/.test(LG))LG='zh';
const T=(zh,en,km)=>LG==='zh'?zh:LG==='km'?(km||en):en;
const catN=c=>{const x=V.CAT[c]||V.CAT.other;return x[1]+' '+(LG==='zh'?x[2]:LG==='km'?x[4]:x[3])};
const siteN=s=>{const x=V.SITES.find(a=>a[0]===s);return x?(LG==='zh'?x[1]:LG==='km'?x[3]:x[2]):(s||'—')};
const areaN=a=>{const x=V.AREA[a];return x?(LG==='zh'?x[1]:LG==='km'?x[3]:x[2]):(a||'—')};
const staN=s=>{const x=V.STA[s]||V.STA.ok;return LG==='zh'?x[1]:LG==='km'?x[3]:x[2]};const staC=s=>(V.STA[s]||V.STA.ok)[4];
const today=()=>new Date().toISOString().slice(0,10);const days=d=>d?Math.round((new Date(today())-new Date(String(d).slice(0,10)))/864e5):null;
const nm=r=>r.name||r.sub||catN(r.cat);
let VIEW='list',KF='all',FC='',FS='',FA='',Q='';
function msg(t,ok){$('msg').innerHTML=t?`<span style="color:${ok===false?'var(--red)':'var(--grn)'}">${t}</span>`:''}
function rows(){return V.rows().slice().sort((a,b)=>V.CATS.findIndex(c=>c[0]===a.cat)-V.CATS.findIndex(c=>c[0]===b.cat)||String(a.code).localeCompare(String(b.code)))}
const calDue=r=>r.calib&&days(r.calib)>=-30;const noCount=r=>{const d=days(r.checked);return d===null||d>90};
function filtered(){const q=Q.trim().toUpperCase();return rows().filter(r=>(KF==='all'||(KF==='bad'&&/repair|lost/.test(r.status))||(KF==='cal'&&calDue(r))||(KF==='nocount'&&noCount(r)))&&(!FC||r.cat===FC)&&(!FS||r.site===FS)&&(!FA||r.area===FA)&&(!q||[r.code,r.name,r.sub,r.spec,r.keeper,r.brand,r.model,r.serial,r.spot,r.remarks,catN(r.cat),areaN(r.area)].join(' ').toUpperCase().includes(q)))}
function kpis(){const R=rows();const k=[['all',T('品項','Items','មុខទំនិញ'),R.length,R.reduce((a,r)=>a+(+r.qty||0),0)+' '+T('件','pcs','')],['bad',T('待修／遺失','Repair / missing','ជួសជុល/បាត់'),R.filter(r=>/repair|lost/.test(r.status)).length],['cal',T('校正到期（30 天內）','Calibration due','ត្រូវក្រិត'),R.filter(calDue).length],['nocount',T('超過 90 天沒盤點','Not counted 90d','មិនបានរាប់'),R.filter(noCount).length],['photo',T('還沒照片','No photo','គ្មានរូប'),R.filter(r=>!thumb(r)).length]];
  $('kpis').innerHTML=k.map(x=>`<div class="kpi ${KF===x[0]?'on':''}" data-k="${x[0]}"><b style="color:${x[0]==='all'?'var(--ink)':x[2]?'var(--amb)':'var(--grn)'}">${x[2]}</b><small>${x[1]}${x[3]?' · '+x[3]:''}</small></div>`).join('');
  document.querySelectorAll('[data-k]').forEach(d=>d.onclick=()=>{KF=d.dataset.k==='photo'?'all':d.dataset.k;VIEW='list';if(d.dataset.k==='photo'){Q='';}render();if(d.dataset.k==='photo')msg(T('沒有照片的項目：點進去按「📷 加照片」。','Items without photo: open one and add a photo.',''))})}
function thumb(r){try{if(!window.VRTPhotos)return '';const a=VRTPhotos.rows('tool',r.code);const c=a.find(x=>x.cover)||a[0];return c?c.thumb:''}catch(_){return ''}}
function card(r){const t=thumb(r);return `<div class="it" data-id="${E(r.id)}"><div class="th">${t?`<img src="${E(t)}" alt="">`:(V.CAT[r.cat]||V.CAT.other)[1]}</div><div class="t"><span class="code">${E(r.code)}</span> <span class="st" style="background:${staC(r.status)}">${E(staN(r.status))}</span><b>${E(nm(r))}</b><small>📍 ${E(siteN(r.site))} · ${E(areaN(r.area))}${r.spot?' · '+E(r.spot):''}</small>${r.spec?`<small>${E(r.spec)}</small>`:''}</div><div class="q">${E(r.qty||0)}<small>${E(r.unit||T('件','pcs',''))}</small></div></div>`}
function listView(){const R=filtered(),all=rows();const cnt=c=>all.filter(r=>r.cat===c).length;
  let h=`<div class="chips"><button data-c="" class="${FC?'':'on'}">${T('全部','All','ទាំងអស់')} ${all.length}</button>${V.CATS.map(c=>`<button data-c="${c[0]}" class="${FC===c[0]?'on':''}">${catN(c[0])} ${cnt(c[0])}</button>`).join('')}</div>
  <div class="flt"><input id="q" placeholder="🔍 ${T('搜尋編號、名稱、位置、保管人…','Search code, name, place, keeper…','ស្វែងរក…')}" value="${E(Q)}"><select id="fs"><option value="">${T('全部廠區','All sites','ទាំងអស់')}</option>${V.SITES.map(s=>`<option value="${s[0]}" ${FS===s[0]?'selected':''}>${E(siteN(s[0]))}</option>`).join('')}</select><select id="fa"><option value="">${T('全部區域','All areas','ទាំងអស់')}</option>${V.AREAS.map(a=>`<option value="${a[0]}" ${FA===a[0]?'selected':''}>${E(areaN(a[0]))}</option>`).join('')}</select><button class="btn g" id="clr">${T('清除','Clear','សម្អាត')}</button></div>`;
  if(!all.length)h+=`<div class="box"><b>${T('還沒有登記任何器具','Nothing registered yet','មិនទាន់មាន')}</b><p class="note">${T('三種方式：① 右上「＋ 新增」一項一項登記（手機可以邊走邊拍照）；② 「📥 匯入」下載 Excel 範本，填好放回來；③ 把現有清單（Excel／PDF／照片）交給 Claude 整理匯入。','① ＋ New, one by one (take photos on the phone); ② 📥 Import an Excel (download the template); ③ give an existing list to Claude.','')}</p><p class="note">${T('車縫機台不放這裡，在「機修零件 → 機台清冊」；機針、零件耗材也在機修零件頁。','Sewing machines live in Spare Parts → Machine register.','')}</p></div>`;
  else if(!R.length)h+=`<p class="note">${T('沒有符合的項目。','No matching items.','គ្មាន')}</p>`;
  let c='';R.forEach(r=>{if(r.cat!==c){if(c)h+='</div>';c=r.cat;const g=R.filter(x=>x.cat===c);h+=`<div class="cat">${catN(c)} <small style="color:var(--mut);font-weight:600">${g.length} ${T('項','items','')} · ${g.reduce((a,x)=>a+(+x.qty||0),0)} ${T('件','pcs','')}</small></div><div class="grid">`}h+=card(r)});if(c)h+='</div>';
  $('view').innerHTML=h;
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{FC=b.dataset.c;render()});
  $('q').oninput=e=>{Q=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{const p=$('q').selectionStart;render();$('q').focus();$('q').setSelectionRange(p,p)},300)};
  $('fs').onchange=e=>{FS=e.target.value;render()};$('fa').onchange=e=>{FA=e.target.value;render()};$('clr').onclick=()=>{Q='';FC=FS=FA='';KF='all';render()};
  document.querySelectorAll('.it').forEach(d=>d.onclick=()=>detail(V.rows().find(r=>r.id===d.dataset.id)))}
/* 依位置：每個廠區／區域 × 類別的數量，點數字就看清單 */
function locView(){const R=rows();const keys=[];V.SITES.forEach(s=>V.AREAS.forEach(a=>{if(R.some(r=>r.site===s[0]&&r.area===a[0]))keys.push([s[0],a[0]])}));const cats=V.CATS.filter(c=>R.some(r=>r.cat===c[0]));
  if(!keys.length){$('view').innerHTML=`<p class="note">${T('登記之後，這裡會列出每個地方有哪些器具、各幾件。','After registering, this shows what is where.','')}</p>`;return}
  $('view').innerHTML=`<p class="note">${T('數字＝件數（點一下看是哪些）。','Numbers are pieces (tap to list).','')}</p><div style="overflow:auto"><table class="mx"><tr><th>${T('廠區／區域','Site / area','')}</th>${cats.map(c=>`<th>${E(catN(c[0]))}</th>`).join('')}<th>${T('合計','Total','សរុប')}</th></tr>${keys.map(([s,a])=>{const rr=R.filter(r=>r.site===s&&r.area===a);return `<tr><td class="l">${E(siteN(s))} · ${E(areaN(a))}</td>${cats.map(c=>{const n=rr.filter(r=>r.cat===c[0]).reduce((x,r)=>x+(+r.qty||0),0);return n?`<td class="n" data-s="${s}" data-a="${a}" data-c="${c[0]}">${n}</td>`:'<td style="color:#cbd5e1">·</td>'}).join('')}<td><b>${rr.reduce((x,r)=>x+(+r.qty||0),0)}</b></td></tr>`}).join('')}</table></div>`;
  document.querySelectorAll('td.n').forEach(td=>td.onclick=()=>{FS=td.dataset.s;FA=td.dataset.a;FC=td.dataset.c;VIEW='list';render()})}
/* 盤點：選地方 → 一項一項填實際數量和狀況 → 存檔（記下盤點日） */
let CS='A',CA='';
function countView(){const areas=V.AREAS.filter(a=>rows().some(r=>r.site===CS&&r.area===a[0]));if(!CA&&areas[0])CA=areas[0][0];const R=rows().filter(r=>r.site===CS&&r.area===CA);
  $('view').innerHTML=`<div class="box"><b>✅ ${T('盤點','Stock count','រាប់ស្តុក')}</b><p class="note">${T('走到那個地方，一項一項點數，填實際數量；壞的改狀況。存檔後會記下盤點日和差異。','Go to the place, count each item, enter the real number; save records the date and the difference.','')}</p><div class="flt" style="grid-template-columns:1fr 2fr"><select id="cs">${V.SITES.map(s=>`<option value="${s[0]}" ${CS===s[0]?'selected':''}>${E(siteN(s[0]))}</option>`).join('')}</select><select id="ca">${V.AREAS.map(a=>`<option value="${a[0]}" ${CA===a[0]?'selected':''}>${E(areaN(a[0]))}${areas.some(x=>x[0]===a[0])?'':' （0）'}</option>`).join('')}</select></div>
  ${R.length?`<table class="mx"><tr><th>${T('項目','Item','')}</th><th>${T('系統','System','')}</th><th>${T('實際','Counted','')}</th><th>${T('狀況','Status','')}</th></tr>${R.map(r=>`<tr><td class="l"><span class="code">${E(r.code)}</span><br>${E(nm(r))}<br><small class="note">${r.checked?T('上次盤點 ','Last ','')+E(r.checked):T('沒盤點過','Never counted','')}</small></td><td>${E(r.qty||0)}</td><td><input type="number" min="0" data-cq="${E(r.id)}" value="${E(r.qty||0)}" style="width:80px;text-align:center"></td><td><select data-cs="${E(r.id)}">${V.STATUS.map(s=>`<option value="${s[0]}" ${r.status===s[0]?'selected':''}>${E(staN(s[0]))}</option>`).join('')}</select></td></tr>`).join('')}</table><button class="btn" id="csave" style="width:100%;margin-top:10px">💾 ${T('存檔盤點結果','Save count','រក្សាទុក')}</button>`:`<p class="note">${T('這個地方還沒有登記的器具。','Nothing registered here yet.','')}</p>`}</div>`;
  $('cs').onchange=e=>{CS=e.target.value;CA='';render()};$('ca').onchange=e=>{CA=e.target.value;render()};
  if($('csave'))$('csave').onclick=async()=>{let all=V.all().slice(),diff=[];R.forEach(r=>{const q=+document.querySelector(`[data-cq="${r.id}"]`).value||0,s=document.querySelector(`[data-cs="${r.id}"]`).value;if(q!==(+r.qty||0))diff.push(r.code+' '+(r.qty||0)+'→'+q);const log=(r.log||[]).concat([{d:today(),q,was:+r.qty||0,s}]).slice(-24);all=V.upsert(Object.assign({},r,{qty:q,status:s,checked:today(),log}),all)});await push(all,T('盤點已存檔 ✅','Count saved ✅','')+(diff.length?' · '+T('有差異：','Differences: ','')+diff.join('、'):' · '+T('全部相符','all match','')))}}
/* QR 標籤：選要印的 → 列印（A4，一頁 24 張） */
function qrSvg(text,cell){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:cell||3,margin:1,scalable:true})}
const linkOf=r=>location.origin+location.pathname+'?c='+encodeURIComponent(r.code);
function labelView(){const R=filtered();$('view').innerHTML=`<div class="box"><b>🏷️ ${T('QR 標籤','QR labels','ស្លាក QR')}</b><p class="note">${T('印出來貼在棧板、料架、櫃子、推車、設備上。手機相機掃一下就打開那一項，可以直接盤點、改狀況、拍照。下面清單跟著「清單」頁的篩選（類別／廠區／區域）。','Print and stick on the item. Scanning opens it directly. Uses the filters of the List tab.','')}</p>

/* 匯入：Excel（有表頭）。相同編號會更新；沒編號的自動給號。 */
const HMAP=[['code',/^code|編號|qr/i],['cat',/categ|類別/i],['sub',/sub|細項|種類|type/i],['name',/^name|名稱|品名/i],['spec',/spec|規格|尺寸|size/i],['site',/site|廠區|^廠/i],['area',/area|區域|位置|location/i],['spot',/spot|線別|細部|詳細/i],['qty',/qty|數量|quantity/i],['unit',/unit|單位/i],['status',/status|狀況|狀態/i],['keeper',/keeper|保管|負責/i],['brand',/brand|廠牌|品牌/i],['model',/model|型號/i],['serial',/serial|序號|機號/i],['buy',/buy|購買|購入/i],['cost',/cost|金額|價格/i],['calib',/calib|校正/i],['remarks',/remark|備註|note/i]];
function findCat(v){v=String(v||'').trim();if(!v)return '';const c=V.CATS.find(c=>c[0]===v.toLowerCase()||v.includes(c[2])||c[2].includes(v)||new RegExp(c[3].split(/[ &]/)[0],'i').test(v)||c[7].some(s=>v.includes(s.replace(/（.*）/,''))));return c?c[0]:''}
function findArea(v){v=String(v||'').trim();if(!v)return '';const a=V.AREAS.find(a=>a[0]===v.toLowerCase()||v.includes(a[1].replace(/／.*/,''))||new RegExp(a[2].split(' ')[0],'i').test(v));return a?a[0]:'other'}
function findSite(v){v=String(v||'').toUpperCase();return /B/.test(v)?'B':/A/.test(v)?'A':''}
function findSta(v){v=String(v||'');return /修|repair/i.test(v)?'repair':/廢|scrap/i.test(v)?'scrap':/失|lost|miss/i.test(v)?'lost':'ok'}
function importView(){$('view').innerHTML=`<div class="box"><b>📥 ${T('匯入／更新','Import / update','នាំចូល')}</b><p class="note">${T('Excel：一列一項（類別、細項、名稱、規格、廠區、區域、數量、單位、狀況、保管人…）。有「編號」的會更新那一項；沒編號的自動編號。匯入前先看預覽。','Excel: one row per item. Rows with a code update that item; others get a new code. Preview first.','')}</p><p class="note">${T('照片和 PDF（購買單、校正證書、說明書）：打開那一項按「📷 加照片／PDF」，PDF 會轉成照片存起來。','Photos and PDFs: open the item and use “📷 Add photo / PDF”.','')}</p><button class="btn g" id="tpl">⬇️ ${T('下載 Excel 範本','Download template','ទាញយកគំរូ')}</button> <button class="btn g" id="exp">⬇️ ${T('匯出目前清單','Export current list','នាំចេញ')}</button><br><br><input type="file" id="imf" accept=".xlsx,.xls,.csv"><div id="imp"></div></div>`;
  const HD=['Code 編號','Category 類別','Sub-type 細項','Name 名稱','Spec / size 規格尺寸','Site 廠區 (A/B)','Area 區域','Spot 線別／細部位置','Qty 數量','Unit 單位','Status 狀況','Keeper 保管人','Brand 廠牌','Model 型號','Serial 序號','Buy date 購入日','Cost 金額','Calibration due 校正到期','Remarks 備註'];
  const toRow=r=>[r.code,(V.CAT[r.cat]||V.CAT.other)[2],r.sub,r.name,r.spec,r.site,(V.AREA[r.area]||V.AREA.other)[1],r.spot,r.qty,r.unit,(V.STA[r.status]||V.STA.ok)[1],r.keeper,r.brand,r.model,r.serial,r.buy,r.cost,r.calib,r.remarks];
  const dl=(aoa,fn)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=HD.map(()=>({wch:16}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tools');const ref=[['類別 Category','細項 Sub-types','代碼']].concat(V.CATS.map(c=>[c[2]+' '+c[3],c[7].join('、'),c[5]])).concat([[],['區域 Area']]).concat(V.AREAS.map(a=>[a[1]+' '+a[2]]));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ref),'選項 Options');XLSX.writeFile(wb,fn)};
  $('tpl').onclick=()=>dl([HD,['','棧板','大塑膠棧板','','120×100 cm','B','布倉','','120','片','良好','布倉組長','','','','','','',''],['','推車／搬運','鐵牛車（油壓拖板車）','','2.5 噸','A','成品倉','','1','台','良好','','','','','','','',''],['','QC／實驗室設備','色燈箱','','D65/TL84/UV','A','QC／實驗室','','1','台','良好','QC 主管','','','','','','2027-03-31','']],'VRT_Tools_Template.xlsx');
  $('exp').onclick=()=>dl([HD].concat(rows().map(toRow)),'VRT_Tools_'+today()+'.xlsx');
  $('imf').onchange=async e=>{const f=e.target.files[0];if(!f)return;let recs=[];try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});for(const sn of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});const hi=a.findIndex(r=>r.filter(c=>HMAP.some(([,re])=>re.test(String(c)))).length>=3);if(hi<0)continue;
      const map=a[hi].map(h=>{const m=HMAP.find(([,re])=>re.test(String(h).trim()));return m?m[0]:null});a.slice(hi+1).forEach(r=>{const o={};map.forEach((k,i)=>{if(k&&String(r[i]).trim()!==''&&o[k]==null)o[k]=String(r[i]).trim()});if(o.name||o.sub||o.code)recs.push(o)})}}catch(x){$('imp').innerHTML='<p style="color:var(--red)">'+T('讀不到：','Cannot read: ','')+E(x.message||x)+'</p>';return}
    recs=recs.map(o=>{const r=Object.assign({},o);r.cat=findCat(o.cat)||findCat(o.sub)||findCat(o.name)||'other';r.area=findArea(o.area);r.site=findSite(o.site)||'A';r.status=findSta(o.status);r.qty=+String(o.qty||'1').replace(/[^\d.]/g,'')||0;const ex=o.code&&V.byCode(o.code);if(ex)r.id=ex.id;return r});
    if(!recs.length){$('imp').innerHTML='<p style="color:var(--red)">'+T('找不到資料（表頭要有 類別／名稱／數量 這類欄位）。','No rows found (need headers like Category / Name / Qty).','')+'</p>';return}
    $('imp').innerHTML=`<p><b>${recs.length}</b> ${T('列','rows','')}（${T('更新','update','')} ${recs.filter(r=>r.id).length}、${T('新增','new','')} ${recs.filter(r=>!r.id).length}）</p>`+recs.slice(0,40).map(r=>`<div class="note">• ${E(r.code||'（新）')} ${E(catN(r.cat))}｜${E(r.name||r.sub)}｜${E(siteN(r.site))} ${E(areaN(r.area))}｜${E(r.qty)} ${E(r.unit||'')}</div>`).join('')+`<button class="btn" id="impgo" style="margin-top:8px;width:100%">✅ ${T('確認匯入並上傳','Import and upload','នាំចូល')}</button>`;
    $('impgo').onclick=async()=>{let all=V.all().slice();recs.forEach(r=>{all=V.upsert(r,all)});await push(all,T('匯入完成 ✅','Imported ✅',''))}}}
/* 一項的詳細卡：資料、QR、照片、快速盤點、改狀況 */
function detail(r){if(!r)return;const ov=document.createElement('div');ov.className='ov';const c=V.CAT[r.cat]||V.CAT.other;
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${E(v)}</dd>`:'';

   <div class="qrb">${qrSvg(linkOf(r),4)}<div><div class="code" style="font-size:18px">${E(r.code)}</div><div class="note">${T('掃這個 QR 就打開這一項','Scan to open this item','')}</div><button class="btn g s" id="d1">🖨️ ${T('印這張標籤','Print label','')}</button></div></div>

  document.body.appendChild(ov);const close=()=>{ov.remove();if(/[?&]c=/.test(location.search))history.replaceState(null,'',location.pathname)};

  ov.querySelector('#dedit').onclick=()=>{close();form(r)};ov.querySelector('#dcopy').onclick=()=>{close();const n=Object.assign({},r);delete n.id;delete n.code;delete n.log;delete n.checked;form(n)}}
async function pdfToImages(file){if(!window.pdfjsLib){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=()=>rej(new Error('pdf.js'));document.head.appendChild(s)})}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=Math.min(doc.numPages,8);p++){const pg=await doc.getPage(p),v=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(2,1400/Math.max(v.width,v.height))});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));out.push(new File([b],file.name.replace(/\.pdf$/i,'')+'_p'+p+'.jpg',{type:'image/jpeg'}))}return out}

async function push(all,ok){msg(T('上傳雲端中…','Uploading…',''));$('view').style.opacity=.5;try{await V.save(all,t=>msg(t));msg(ok);if(VIEW==='form')VIEW='list';render()}catch(e){msg(T('上傳失敗：','Upload failed: ','')+(e.message||e),false)}finally{$('view').style.opacity=1}}
/* 掃 QR：Android Chrome 可以直接在頁面掃；其他手機用相機 App 掃標籤也會打開 */
async function scan(){if(!('BarcodeDetector' in window)){alert(T('這支手機的瀏覽器不支援頁面內掃描：請直接用手機相機掃標籤，會自動打開這一項。','In-page scanning is not supported here: use the phone camera app to scan the label.',''));return}
  const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div><b>📷 ${T('對準 QR 標籤','Point at the QR label','')}</b><video id="sv" playsinline style="width:100%;border-radius:12px;margin-top:8px;background:#000"></video><button class="btn g" id="sx" style="width:100%;margin-top:8px">${T('關閉','Close','')}</button></div>`;document.body.appendChild(ov);
  let stream,stop=false;const end=()=>{stop=true;try{stream.getTracks().forEach(t=>t.stop())}catch(_){}ov.remove()};ov.querySelector('#sx').onclick=end;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=ov.querySelector('#sv');v.srcObject=stream;await v.play();const bd=new BarcodeDetector({formats:['qr_code']});
    (async function loop(){if(stop)return;try{const c=await bd.detect(v);if(c.length){const raw=c[0].rawValue,m=raw.match(/[?&]c=([^&]+)/),code=decodeURIComponent(m?m[1]:raw);const r=V.byCode(code);end();if(r)detail(r);else alert(T('找不到編號 ','Code not found: ','')+code);return}}catch(_){}setTimeout(loop,250)})()}catch(e){end();alert(T('打不開相機：','Camera failed: ','')+(e.message||e))}}
function render(){kpis();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));if(VIEW==='loc')locView();else if(VIEW==='count')countView();else if(VIEW==='label')labelView();else if(VIEW==='import')importView();else if(VIEW==='list')listView()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;msg('');render()});
function paintL(){document.querySelectorAll('#lng button').forEach(b=>{const on=b.dataset.l===LG;b.style.background=on?'#0e7490':'#fff';b.style.color=on?'#fff':'#0f172a'});
  const tb=[['📋 清單','📋 List','📋 បញ្ជី'],['📍 依位置','📍 By place','📍 តាមទីតាំង'],['✅ 盤點','✅ Count','✅ រាប់'],['🏷️ QR 標籤','🏷️ QR labels','🏷️ ស្លាក QR'],['📥 匯入／匯出','📥 Import / export','📥 នាំចូល']];document.querySelectorAll('#tabs button').forEach((b,i)=>b.textContent=T(...tb[i]));
  $('ttl').textContent=T('生產器具與工具','Production equipment & tools','ឧបករណ៍ផលិតកម្ម');$('add').lastChild.textContent=T('新增','New','បន្ថែម');$('scan').lastChild.textContent=T('掃 QR','Scan QR','ស្កេន QR')}
document.querySelectorAll('#lng button').forEach(b=>b.onclick=()=>{LG=b.dataset.l;try{localStorage.setItem('vrt_lang',LG)}catch(_){}paintL();render()});paintL();
$('add').onclick=()=>form();$('scan').onclick=scan;
V.on(()=>{if(VIEW!=='form')render()});if(window.VRTPhotos&&VRTPhotos.on)VRTPhotos.on(()=>{if(VIEW==='list')render()});render();
V.load().then(()=>{if(VIEW!=='form')render();const c=new URLSearchParams(location.search).get('c');if(c){const r=V.byCode(c);if(r)detail(r);else msg(T('找不到編號 ','Code not found: ','')+c,false)}});
</script></body></html>
