<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRT Customer Statistics v3.0</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:"Microsoft JhengHei","Noto Sans TC","Noto Sans Khmer",Arial,sans-serif;background:#eef1f7;color:#1e2640;font-size:13px}

.htitle{font-size:18px;font-weight:700;color:#fff}.hsub{font-size:11px;color:#8b95b8;margin-top:2px}.grow{flex:1}
.hstats{display:flex;gap:20px}.hstat{text-align:right}.hstat b{display:block;color:#fbbf24;font:700 20px ui-monospace,monospace}.hstat span{font-size:10px;color:#8b95b8}
.hbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700}

.tab{padding:12px 14px;white-space:nowrap;cursor:pointer;color:#6b7a9e;border-bottom:2px solid transparent;margin-bottom:-2px}.tab.on{color:#d97706;border-bottom-color:#f59e0b;background:#fffbf0;font-weight:700}

.card{background:#fff;border:1px solid #e2e6f0;border-radius:11px;padding:15px;margin-bottom:13px;box-shadow:0 1px 4px rgba(30,38,64,.05)}
.ct{font-size:11px;font-weight:700;color:#6b7a9e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:7px}.ct:before{content:"";width:3px;height:12px;background:#f59e0b;border-radius:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:13px}
.kpi{background:#fff;border:1px solid #e2e6f0;border-radius:9px;padding:11px 12px;border-left:3px solid #cbd2e6}.kpi.b{border-left-color:#3b82f6}.kpi.g{border-left-color:#10b981}.kpi.a{border-left-color:#f59e0b}.kpi.p{border-left-color:#8b5cf6}.kpi.r{border-left-color:#ef4444}
.kn{font:700 23px ui-monospace,monospace}.ku{font-size:10px;color:#6b7a9e;margin-left:3px}.kl{font-size:10px;color:#6b7a9e;margin-top:5px}
.btnrow,.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:8px 13px;font-weight:700;cursor:pointer}.by{background:#f59e0b;color:#1c1200}.bg{background:#fff;border:1px solid #d0d5e8;color:#4a5578}.bb{background:#2563eb;color:#fff}.br{background:#fff1f2;color:#b91c1c;border:1px solid #fecaca}
select,input{border:1px solid #d0d5e8;border-radius:7px;padding:7px 10px;background:#fff;font:inherit;color:#1e2640}.search{min-width:250px;flex:1}
.tbl{overflow:auto;border:1px solid #e2e6f0;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#f7f8fc;color:#6b7a9e;font-size:10px;text-transform:uppercase;padding:8px 9px;text-align:left;border-bottom:2px solid #e2e6f0;white-space:nowrap}td{padding:8px 9px;border-bottom:1px solid #eef0f6;vertical-align:top}.num{text-align:right;font-family:ui-monospace,monospace}.mono{font-family:ui-monospace,monospace}.link{color:#1d4ed8;font-weight:700;cursor:pointer;text-decoration:underline dotted}.subtxt{font-size:10px;color:#6b7a9e;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.drop{border:2px dashed #c5c9d8;border-radius:12px;padding:38px 18px;text-align:center;background:#fafbfc;cursor:pointer}.drop:hover{border-color:#f59e0b;background:#fffbf0}
.al{padding:10px 12px;border-radius:8px;background:#eff6ff;border:1px solid #93c5fd;color:#1e40af;margin-bottom:10px}.alw{background:#fffbeb;border-color:#fcd34d;color:#92400e}.ale{background:#fff1f2;border-color:#fca5a5;color:#991b1b}
.empty{text-align:center;padding:50px 20px;color:#8b95b8}.seg{display:flex;border:1px solid #d0d5e8;border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;color:#4a5578;padding:8px 16px;font-weight:700;cursor:pointer}.seg button.on{background:#f59e0b;color:#1c1200}
.periodnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.periodlabel{min-width:92px;text-align:center;font:700 14px ui-monospace,monospace}
.bars{display:flex;flex-direction:column;gap:8px}.barrow{display:grid;grid-template-columns:minmax(85px,140px) 1fr 88px;gap:9px;align-items:center}.barbg{height:9px;background:#e8edf5;border-radius:5px;overflow:hidden}.barfill{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:5px}.barval{text-align:right;font-family:ui-monospace,monospace;font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#dbeafe;color:#1e40af}.badge.g{background:#d1fae5;color:#065f46}.badge.a{background:#fef3c7;color:#92400e}.badge.r{background:#fee2e2;color:#991b1b}
.deltaUp{color:#b45309;font-weight:700}.deltaDown{color:#047857;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:9999;padding:20px;overflow:auto}.modal.on{display:flex;align-items:flex-start;justify-content:center}.modalbox{width:min(100%,920px);background:#fff;border-radius:14px;padding:18px;margin-top:4vh;box-shadow:0 20px 60px #0006}
.mtitle{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:17px;font-weight:700;margin-bottom:14px}.x{font-size:24px;color:#6b7a9e;cursor:pointer}
.cloud{position:fixed;right:18px;bottom:18px;width:48px;height:48px;border-radius:50%;border:0;background:#1e2640;color:#93c5fd;font-size:20px;cursor:pointer;box-shadow:0 4px 18px #0005;z-index:100}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e2640;color:#fff;border-radius:8px;padding:10px 18px;display:none;z-index:12000}
@media(max-width:760px){.hstats{display:none}.wrap{padding:12px 8px 70px}.grid2{grid-template-columns:1fr}.card{padding:12px}.tabs{padding:0 6px}.tab{padding:11px 10px}.kpis{grid-template-columns:repeat(2,1fr)}.tbl{overflow-x:auto}.search{min-width:100%}.barrow{grid-template-columns:90px 1fr 74px}th,td{padding:7px 6px}.modal{padding:8px}.modalbox{margin-top:2vh}}

.metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.pct{font-weight:700}@media(max-width:700px){.metricgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="header"><div class="logo">📊</div><div><div class="htitle">VRT Customer Statistics Control Center</div><div class="hsub">客戶訂單 · 完成 · 未作 · WIP · FG · Fabric · v3.0</div></div><div class="grow"></div><div class="hstats"><div class="hstat"><b id="hOrder">0</b><span>總訂單 pcs</span></div><div class="hstat"><b id="hBal">0</b><span>未完成 pcs</span></div></div><button class="hbtn" onclick="cloudPush()">☁↑</button><button class="hbtn" onclick="cloudPull()">☁↓</button><button class="hbtn" onclick="goTab('import')">匯入</button></div>
<div class="tabs"><div class="tab on" data-tab="dashboard" onclick="goTab('dashboard')">📊 儀錶板</div><div class="tab" data-tab="trend" onclick="goTab('trend')">📆 月年趨勢</div><div class="tab" data-tab="customer" onclick="goTab('customer')">👤 客戶分析</div><div class="tab" data-tab="product" onclick="goTab('product')">🏷 產品分析</div><div class="tab" data-tab="detail" onclick="goTab('detail')">📋 PO / 款式</div><div class="tab" data-tab="import" onclick="goTab('import')">📥 匯入</div></div>
<div class="wrap"><div id="dashboard" class="pane on"></div><div id="trend" class="pane"></div><div id="customer" class="pane"></div><div id="product" class="pane"></div><div id="detail" class="pane"></div><div id="import" class="pane"></div></div>
<input id="fileInput" type="file" accept=".xlsx,.xls" hidden><button class="cloud" onclick="cloudPull()">☁</button><div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="mtitle"><span id="modalTitle"></span><span class="x" onclick="closeModal()">×</span></div><div id="modalBody"></div></div></div>
<script>
const LS='vrt_custstats_v3_data',TOOL='custstats';let DATA={overall:null,customers:[],products:[],details:[],source:'',snapshotDate:''},TAB='dashboard',TREND='month',Q='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),num=v=>{let n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0},N=n=>num(n).toLocaleString('en-US',{maximumFractionDigits:1});
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function excelDate(v){if(v==null||v==='')return'';if(v instanceof Date)return ymd(v);if(typeof v==='number'&&v>20000&&v<80000){let d=new Date((v-25569)*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}return''}
function save(){localStorage.setItem(LS,JSON.stringify(DATA))}function load(){try{DATA=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}DATA.customers=DATA.customers||[];DATA.products=DATA.products||[];DATA.details=DATA.details||[]}
function cell(rows,r,c){return rows[r-1]?.[c-1]}
function parseDashboard(wb){let ws=wb.Sheets[wb.SheetNames.find(n=>n.toUpperCase()==='DASHBOARD')];if(!ws)throw new Error('缺少 DASHBOARD');let rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),hi=rows.findIndex(r=>(r||[]).some(x=>String(x||'').toUpperCase().includes('PO COUNT'))&&(r||[]).some(x=>String(x||'').toUpperCase().includes('BALANCE QTY')));if(hi<0)throw new Error('DASHBOARD 客戶彙總無法辨識');let customers=[];for(let i=hi+1;i<rows.length;i++){let r=rows[i]||[],name=String(r[0]??'').trim();if(/CHAPTER\s*2/i.test(name))break;if(!name||/TOTAL|合計/i.test(name))continue;let order=num(r[2]),done=num(r[3]),bal=num(r[4]);if(!(order||done||bal))continue;customers.push({customer:name,poCount:Math.round(num(r[1])),orderQty:order,completedQty:done,balanceQty:bal,completion:num(r[5]),status:String(r[7]??''),cuttingWip:num(r[8]),fgPcs:num(r[9]),fgCtn:num(r[10]),actualNotSewn:num(r[11]),noFabric:num(r[12])})}
 let totalRow=rows.find(r=>/TOTAL|合計/i.test(String(r?.[0]||''))&&num(r?.[2])>0),overall=totalRow?{poCount:Math.round(num(totalRow[1])),orderQty:num(totalRow[2]),completedQty:num(totalRow[3]),balanceQty:num(totalRow[4]),completion:num(totalRow[5]),cuttingWip:num(totalRow[8]),fgPcs:num(totalRow[9]),fgCtn:num(totalRow[10]),actualNotSewn:num(totalRow[11]),noFabric:num(totalRow[12])}:null;
 let ch2=rows.findIndex(r=>/CHAPTER\s*2/i.test(String(r?.[0]||''))),products=[];if(ch2>=0){for(let i=ch2+2;i<rows.length;i++){let r=rows[i]||[],name=String(r[0]??'').trim();if(/TOTAL|合計/i.test(name))break;if(!name)continue;let order=num(r[2]),done=num(r[3]),bal=num(r[4]);if(!(order||done||bal))continue;products.push({product:name,poCount:Math.round(num(r[1])),orderQty:order,completedQty:done,balanceQty:bal,completion:num(r[5]),status:String(r[7]??''),cuttingWip:num(r[8]),fgPcs:num(r[9]),actualNotSewn:num(r[10]),noFabric:num(r[11])})}}
 return {overall,customers,products,snapshotDate:excelDate(rows[1]?.[1])}}
function parseDetails(wb){let ws=wb.Sheets[wb.SheetNames.find(n=>n.toUpperCase()==='ALL CUSTOMER')];if(!ws)return[];let rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),out=[];for(let i=4;i<rows.length;i++){let r=rows[i]||[],customer=String(r[0]??'').trim(),po=String(r[5]??'').trim();
  // ALL CUSTOMER 後段有 Excel 輔助計算列（A/F 會出現 1）；不能當成訂單再加一次。
  if(customer==='1'&&po==='1')break;
  if(!customer||!po)continue;
  let order=num(r[10]),open=num(r[57]),completed=order-open,cutWip=num(r[49]),fg=num(r[54]),fgctn=num(r[55]),notSewn=num(r[56]),noFab=Math.max(notSewn-cutWip,0);
  out.push({id:i+1,customer,poDate:excelDate(r[1]),etd:excelDate(r[2]),eta:excelDate(r[3]),product:String(r[4]??'').trim(),po,style:String(r[6]??'').trim(),color:String(r[8]??'').trim(),size:String(r[9]??'').trim(),orderQty:order,completedQty:completed,balanceQty:open,cuttingWip:cutWip,fgPcs:fg,fgCtn:fgctn,actualNotSewn:notSewn,noFabric:noFab,openOrder:open,fabricItem:String(r[12]??'').trim(),fabricType:String(r[13]??'').trim(),fabricReq:num(r[16]),fabricStock:num(r[18])})}return out}
async function importFile(f){try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false,raw:true}),d=parseDashboard(wb),details=parseDetails(wb);DATA={...d,details,source:f.name,savedAt:new Date().toISOString()};save();renderAll();goTab('dashboard');toast(`✓ Order ${N(d.overall?.orderQty)} · Balance ${N(d.overall?.balanceQty)} · ${details.length} rows`);if(localStorage.getItem('vrt_portal_gas_url'))cloudPush(true)}catch(e){toast('Import failed: '+e.message)}}
function refresh(){let o=DATA.overall||{};$('hOrder').textContent=N(o.orderQty);$('hBal').textContent=N(o.balanceQty)}function goTab(t){TAB=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===t));renderTab(t)}function renderTab(t){({dashboard:renderDashboard,trend:renderTrend,customer:renderCustomers,product:renderProducts,detail:renderDetails,import:renderImport}[t]||(()=>{}))()}function renderAll(){refresh();renderTab(TAB)}
function kpi(n,l,c=''){return `<div class="kpi ${c}"><div class="kn">${N(n)}</div><div class="kl">${l}</div></div>`}
function renderDashboard(){let e=$('dashboard'),o=DATA.overall;if(!o){e.innerHTML=`<div class="card"><div class="empty">尚未匯入 Customer Statistics<br><br><button class="btn by" onclick="goTab('import')">📥 匯入</button></div></div>`;return}e.innerHTML=`<div class="al">資料來源：Excel 第一頁 <b>DASHBOARD</b>。Snapshot 更新日：<b>${DATA.snapshotDate||'-'}</b>。以下總數直接採用原報表，不用 ETD 重新推算。</div><div class="kpis">${kpi(o.orderQty,'總訂單量 pcs','b')}${kpi(o.completedQty,'總完成量 pcs','g')}${kpi(o.balanceQty,'總未完成 pcs','r')}${kpi(o.completion*100,'完成率 %','a')}${kpi(o.cuttingWip,'Cutting WIP','p')}${kpi(o.fgPcs,'FG 成品庫存 pcs','b')}${kpi(o.fgCtn,'FG 成品箱數','a')}${kpi(o.actualNotSewn,'Actual Order Not Sewing','p')}${kpi(o.noFabric,'No Fabric Available pcs','r')}${kpi(o.poCount,'PO 數','b')}</div><div class="card"><div class="ct">👤 客戶現況（來自 Dashboard）</div><div class="tbl"><table><thead><tr><th>Customer</th><th class="num">PO</th><th class="num">Order</th><th class="num">Completed</th><th class="num">Balance</th><th class="num">Cut WIP</th><th class="num">FG</th><th class="num">No Fabric</th></tr></thead><tbody>${DATA.customers.map((x,i)=>`<tr onclick="customerDetail(${i})" style="cursor:pointer"><td class="link">${esc(x.customer)}</td><td class="num">${x.poCount}</td><td class="num">${N(x.orderQty)}</td><td class="num">${N(x.completedQty)}</td><td class="num">${N(x.balanceQty)}</td><td class="num">${N(x.cuttingWip)}</td><td class="num">${N(x.fgPcs)}</td><td class="num">${N(x.noFabric)}</td></tr>`).join('')}</tbody></table></div></div>`}
function periodRows(){let m={};DATA.details.filter(r=>r.etd).forEach(r=>{let k=TREND==='year'?r.etd.slice(0,4):r.etd.slice(0,7),x=m[k]||(m[k]={po:new Set(),cust:new Set(),order:0,done:0,bal:0,wip:0,fg:0,not:0,nofab:0});x.po.add(r.po);x.cust.add(r.customer);x.order+=r.orderQty;x.done+=r.completedQty;x.bal+=r.balanceQty;x.wip+=r.cuttingWip;x.fg+=r.fgPcs;x.not+=r.actualNotSewn;x.nofab+=r.noFabric});
  const now=TREND==='year'?ymd(new Date()).slice(0,4):ymd(new Date()).slice(0,7),keys=Object.keys(m),cur=keys.filter(k=>k===now),past=keys.filter(k=>k<now).sort().reverse(),future=keys.filter(k=>k>now).sort();
  return [...cur,...past,...future].map(k=>({period:k,future:k>now,...m[k],po:m[k].po.size,cust:m[k].cust.size}))}
function setTrend(x){TREND=x;renderTrend()}function renderTrend(){let a=periodRows(),nodate=DATA.details.filter(r=>!r.etd).reduce((s,r)=>s+r.balanceQty,0);$('trend').innerHTML=`<div class="frow" style="margin-bottom:12px"><div class="seg"><button class="${TREND==='month'?'on':''}" onclick="setTrend('month')">月報</button><button class="${TREND==='year'?'on':''}" onclick="setTrend('year')">年報</button></div><span class="grow"></span><span class="subtxt">依 VRT Ship Date (ETD) 分期間 · 無 ETD 未完成量 ${N(nodate)} pcs</span></div><div class="card"><div class="ct">${TREND==='month'?'月別報表':'年別報表'}</div><div class="tbl"><table><thead><tr><th>期間</th><th class="num">PO</th><th class="num">客戶</th><th class="num">Order</th><th class="num">Completed</th><th class="num">Balance</th><th class="num">Cut WIP</th><th class="num">FG</th><th class="num">No Fabric</th></tr></thead><tbody>${a.map(x=>`<tr><td class="mono" style="color:#d97706;font-weight:700">${x.period}${x.future?' <span class="badge a">Future</span>':''}</td><td class="num">${x.po}</td><td class="num">${x.cust}</td><td class="num">${N(x.order)}</td><td class="num">${N(x.done)}</td><td class="num" style="color:#dc2626;font-weight:700">${N(x.bal)}</td><td class="num">${N(x.wip)}</td><td class="num">${N(x.fg)}</td><td class="num">${N(x.nofab)}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderCustomers(){$('customer').innerHTML=`<div class="card"><div class="ct">👤 客戶分析</div><div class="tbl"><table><thead><tr><th>Customer</th><th class="num">Order</th><th class="num">Completed</th><th class="num">Balance</th><th class="num">Completion</th><th class="num">Actual Not Sewing</th><th class="num">No Fabric</th></tr></thead><tbody>${DATA.customers.map((x,i)=>`<tr onclick="customerDetail(${i})" style="cursor:pointer"><td class="link">${esc(x.customer)}</td><td class="num">${N(x.orderQty)}</td><td class="num">${N(x.completedQty)}</td><td class="num">${N(x.balanceQty)}</td><td class="num">${(x.completion*100).toFixed(1)}%</td><td class="num">${N(x.actualNotSewn)}</td><td class="num">${N(x.noFabric)}</td></tr>`).join('')}</tbody></table></div></div>`}
function customerDetail(i){let x=DATA.customers[i],rs=DATA.details.filter(r=>r.customer.toUpperCase()===x.customer.toUpperCase());openModal(x.customer,`<div class="kpis">${kpi(x.orderQty,'Order','b')}${kpi(x.completedQty,'Completed','g')}${kpi(x.balanceQty,'Balance','r')}${kpi(x.cuttingWip,'Cut WIP','p')}${kpi(x.fgPcs,'FG pcs','b')}${kpi(x.actualNotSewn,'Not Sewing','a')}${kpi(x.noFabric,'No Fabric','r')}</div>${detailTable(rs)}`)}
function renderProducts(){$('product').innerHTML=`<div class="card"><div class="ct">🏷 產品組合（來自 Dashboard Chapter 2）</div><div class="tbl"><table><thead><tr><th>Product</th><th class="num">PO</th><th class="num">Order</th><th class="num">Completed</th><th class="num">Balance</th><th class="num">Cut WIP</th><th class="num">FG</th><th class="num">No Fabric</th></tr></thead><tbody>${DATA.products.map(x=>`<tr><td><b>${esc(x.product)}</b></td><td class="num">${x.poCount}</td><td class="num">${N(x.orderQty)}</td><td class="num">${N(x.completedQty)}</td><td class="num">${N(x.balanceQty)}</td><td class="num">${N(x.cuttingWip)}</td><td class="num">${N(x.fgPcs)}</td><td class="num">${N(x.noFabric)}</td></tr>`).join('')}</tbody></table></div></div>`}
function detailTable(rs){return `<div class="tbl"><table><thead><tr><th>ETD</th><th>PO / Style</th><th>Product</th><th class="num">Order</th><th class="num">Completed</th><th class="num">Balance</th><th class="num">FG</th><th>Fabric</th></tr></thead><tbody>${rs.slice(0,1000).map(r=>`<tr><td>${r.etd||'-'}</td><td><b>${esc(r.po)}</b><div class="subtxt">${esc(r.style)} / ${esc(r.color)} / ${esc(r.size)}</div></td><td>${esc(r.product)}</td><td class="num">${N(r.orderQty)}</td><td class="num">${N(r.completedQty)}</td><td class="num">${N(r.balanceQty)}</td><td class="num">${N(r.fgPcs)}</td><td>${esc(r.fabricItem)}<div class="subtxt">${esc(r.fabricType)}</div></td></tr>`).join('')}</tbody></table></div>`}
function renderDetails(){let rs=DATA.details.filter(r=>!Q||[r.customer,r.po,r.style,r.color,r.fabricItem,r.fabricType].join(' ').toLowerCase().includes(Q.toLowerCase()));$('detail').innerHTML=`<div class="card"><div class="frow"><input class="search" placeholder="Customer / PO / Style / Fabric" value="${esc(Q)}" oninput="Q=this.value;renderDetails()"><span class="subtxt">${rs.length} rows</span></div>${detailTable(rs)}</div>`}
function renderImport(){$('import').innerHTML=`<div class="card"><div class="ct">📥 ALL CUSTOMER STATISTICS</div><div class="al">新版會先讀 <b>DASHBOARD 第一頁</b> 的總訂單、完成、未完成、Cutting WIP、FG、Actual Not Sewing、No Fabric Available，再讀 ALL CUSTOMER 做 PO / ETD 月年分析。Dashboard 標題月份不作為日期，採用 Updated 日期。</div><div class="drop" onclick="$('fileInput').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();if(event.dataTransfer.files[0])importFile(event.dataTransfer.files[0])"><div style="font-size:38px">📊</div><b>拖拉 VRT - ALL CUSTOMER STATISTICS REPORT.xlsx</b></div>${DATA.source?`<div style="margin-top:12px">目前：${esc(DATA.source)} · Snapshot ${DATA.snapshotDate||'-'}</div>`:''}</div>`}
async function cloudPush(silent=false){let url=localStorage.getItem('vrt_portal_gas_url')||'';if(!url){if(!silent)toast('未設定 GAS URL');return}let o=DATA.overall||{},payload={action:'push',tool:TOOL,recordCount:DATA.details.length,records:DATA.details,summary:{orderQty:o.orderQty||0,completedQty:o.completedQty||0,balanceQty:o.balanceQty||0,cuttingWip:o.cuttingWip||0,fgPcs:o.fgPcs||0,noFabric:o.noFabric||0,snapshotDate:DATA.snapshotDate||''},summaryData:DATA};try{await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});if(!silent)toast('Cloud uploaded')}catch(e){if(!silent)toast('Upload failed')}}
async function cloudPull(){let url=localStorage.getItem('vrt_portal_gas_url')||'';if(!url){toast('未設定 GAS URL');return}try{let j=await(await fetch(url+'?action=pull&tool='+TOOL)).json(),p=j?.data||j;if(p?.data)p=p.data;if(p?.summaryData)DATA=p.summaryData;else if(p?.data?.overall)DATA=p.data;else{toast('Cloud data format not compatible');return}save();renderAll();toast('Cloud downloaded')}catch(e){toast('Download failed')}}
function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('on')}function closeModal(){$('modal').classList.remove('on')}
$('fileInput').addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''});load();refresh();renderDashboard();
</script></body></html>
