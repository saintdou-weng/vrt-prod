<!DOCTYPE html>
<!-- VRT Customer Order / Fabric / Cutting / Sewing / Shipping Statistics Control Center v1
     風格沿用 production_plan_capacity_v1（家族一致）：底 #eef1f7 / header #1e2640→#2d3658 / amber #f59e0b -->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRT Customer Statistics Control Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei","Noto Sans TC","Noto Sans Khmer",sans-serif;background:#eef1f7;color:#1e2640;font-size:13px;-webkit-text-size-adjust:100%}
.header{background:linear-gradient(135deg,#1e2640,#2d3658);padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(245,158,11,.35)}
.h-title{color:#fff;font-size:15px;font-weight:700}.h-title b{color:#fbbf24}
.h-sub{font-size:10.5px;color:#8b95b8;margin-top:1px}
.hgrow{flex:1}
.hstat{text-align:right;padding:0 4px}
.hstat-v{font-size:15px;font-weight:700;color:#fbbf24;font-family:ui-monospace,monospace;line-height:1}
.hstat-l{font-size:9px;color:#8b95b8;margin-top:2px}
.hicons{display:flex;gap:5px;flex-wrap:wrap}
.hicon{min-width:31px;height:31px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:7px;cursor:pointer;font-size:14px;transition:.15s;color:#dfe4f0}
.hicon:hover{background:rgba(245,158,11,.25);border-color:#f59e0b}
.hicon.on{background:#f59e0b;color:#1c1200;border-color:#f59e0b;font-weight:700}
/* mode switch */
.modebar{background:#263049;padding:7px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:58px;z-index:39;border-bottom:1px solid #0d1424}
.mode-sw{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:3px}
.mode-sw button{background:transparent;border:0;color:#c4cbe0;padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.mode-sw button.on{background:#f59e0b;color:#1c1200}
.modebar .dp{display:flex;align-items:center;gap:6px;color:#c4cbe0;font-size:11.5px}
.modebar input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit}
.modebar input::-webkit-calendar-picker-indicator{filter:invert(1)}
.modebar .nav-b{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#dfe4f0;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12px}
.modebar .cur{color:#fbbf24;font-weight:700;font-family:ui-monospace,monospace;min-width:120px;text-align:center}
/* tabs */
.tabs{background:#fff;border-bottom:2px solid #e2e6f0;display:flex;padding:0 12px;overflow-x:auto;gap:0;position:sticky;top:104px;z-index:30}
.tab{padding:11px 13px;font-size:12px;cursor:pointer;color:#6b7a9e;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;font-weight:500;transition:.15s;user-select:none}
.tab:hover{color:#1e2640;background:#f7f8fc}
.tab.on{color:#d97706;border-bottom-color:#f59e0b;background:#fffbf0;font-weight:700}
.wrap{max-width:1440px;margin:0 auto;padding:16px 14px 70px}
.pane{display:none}.pane.on{display:block}
.card{background:#fff;border:1px solid #e2e6f0;border-radius:11px;padding:15px;margin-bottom:13px;box-shadow:0 1px 4px rgba(30,38,64,.05)}
.ct{font-size:11px;font-weight:700;color:#6b7a9e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ct::before{content:'';width:3px;height:12px;background:#f59e0b;border-radius:2px;flex-shrink:0}
.ct .sp{flex:1}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:13px}
.kpi{background:#fff;border:1px solid #e2e6f0;border-radius:9px;padding:11px 12px;box-shadow:0 1px 3px rgba(30,38,64,.04);border-left:3px solid #cbd2e6}
.kpi.g{border-left-color:#10b981}.kpi.a{border-left-color:#f59e0b}.kpi.r{border-left-color:#ef4444}
.kpi.b{border-left-color:#3b82f6}.kpi.p{border-left-color:#8b5cf6}.kpi.o{border-left-color:#e67e22}.kpi.c{border-left-color:#9b59b6}
.kpi-n{font-size:20px;font-weight:700;font-family:ui-monospace,monospace;line-height:1.05;color:#1e2640;word-break:break-all}
.kpi-u{font-size:10.5px;color:#6b7a9e;margin-left:2px;font-weight:400}
.kpi-l{font-size:10px;color:#6b7a9e;margin-top:5px;line-height:1.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
/* drop */
.drop{border:2px dashed #c5c9d8;border-radius:11px;padding:30px 20px;text-align:center;cursor:pointer;transition:.2s;background:#fafbfc}
.drop:hover,.drop.drag{border-color:#f59e0b;background:#fffbf0}
.drop.done{border-color:#10b981;border-style:solid;background:#f0fdf8}
.drop-i{font-size:34px;margin-bottom:8px}
.drop-t{font-size:14px;font-weight:700;color:#1e2640}
.drop-s{font-size:11.5px;color:#6b7a9e;margin-top:4px}
/* btn */
.btn{padding:8px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit;border:none;transition:.15s;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-y{background:#f59e0b;color:#1c1200}.btn-y:hover:not(:disabled){background:#d97706}
.btn-b{background:#3b82f6;color:#fff}.btn-b:hover:not(:disabled){background:#2563eb}
.btn-g{background:#fff;color:#4a5578;border:1px solid #d0d5e8}.btn-g:hover:not(:disabled){background:#f7f8fc}
.btn-r{background:#fff5f5;color:#dc2626;border:1px solid #fecaca}.btn-r:hover:not(:disabled){background:#fee2e2}
.btn-sm{padding:5px 9px;font-size:11.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
select,input[type=text],input[type=date],input[type=number],input[type=month]{background:#fff;border:1px solid #d0d5e8;color:#1e2640;padding:7px 10px;border-radius:7px;font-size:12.5px;font-family:inherit}
select:focus,input:focus{outline:2px solid #f59e0b33;border-color:#f59e0b}
label.fl{font-size:11px;color:#6b7a9e;font-weight:600;display:flex;flex-direction:column;gap:3px}
/* table */
.tblwrap{overflow-x:auto;border:1px solid #e2e6f0;border-radius:9px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:640px}
th{text-align:left;padding:8px 10px;color:#6b7a9e;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid #e2e6f0;background:#f7f8fc;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid #eef0f6;color:#2d3a5e;white-space:nowrap}
tr:hover>td{background:#fafbfc}
.num{font-family:ui-monospace,monospace;text-align:right}
th.num{text-align:right}
.drow{cursor:pointer;user-select:none}
.drow .cr{display:inline-block;width:13px;color:#8b95b8;transition:.15s}
.drow.open .cr{transform:rotate(90deg)}
.lv1 td:first-child{padding-left:10px}.lv2 td:first-child{padding-left:26px}
.lv3 td:first-child{padding-left:42px}.lv4 td:first-child{padding-left:58px}
.lv5 td:first-child{padding-left:74px}.lv6 td:first-child{padding-left:90px}
.crow>td{background:#fbfcff}
/* badge */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.b-ok{background:#d1fae5;color:#065f46}
.b-watch{background:#fef3c7;color:#92400e}
.b-risk{background:#fee2e2;color:#991b1b}
.b-nodata{background:#e5e7eb;color:#4b5563}
.b-shipped{background:#dbeafe;color:#1e40af}
.b-fabric{background:#fde8d0;color:#9a4a0d}
.b-cutting{background:#ede0fb;color:#6b21a8}
.b-over{background:#fef3c7;color:#92400e}
.b-info{background:#e0f2fe;color:#0369a1}
/* alerts */
.al{padding:10px 13px;border-radius:9px;font-size:12.5px;margin-bottom:9px;line-height:1.5}
.al-ok{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46}
.al-w{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}
.al-e{background:#fff1f2;border:1px solid #fca5a5;color:#991b1b}
.al-i{background:#eff6ff;border:1px solid #93c5fd;color:#1e40af}
.empty{text-align:center;padding:50px 20px;color:#8b95b8}
.empty-i{font-size:44px;margin-bottom:12px;opacity:.5}
/* charts */
.chartbox{position:relative;height:250px}.chartbox.tall{height:300px}
/* rank bars */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.bar-lb{width:150px;flex-shrink:0;color:#2d3a5e;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-tk{flex:1;height:18px;background:#eef0f6;border-radius:4px;overflow:hidden;position:relative}
.bar-in{height:100%;background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:4px}
.bar-in.r{background:linear-gradient(90deg,#ef4444,#b91c1c)}
.bar-in.b{background:linear-gradient(90deg,#3b82f6,#1d4ed8)}
.bar-in.p{background:linear-gradient(90deg,#8b5cf6,#6d28d9)}
.bar-vl{width:96px;text-align:right;flex-shrink:0;font-family:ui-monospace,monospace;font-weight:600;color:#1e2640;font-size:11.5px}
/* line cards */
.lc{background:#fff;border:1px solid #e2e6f0;border-radius:10px;padding:12px;border-top:3px solid #cbd2e6}
.lc.hi{border-top-color:#059669}.lc.md{border-top-color:#d97706}.lc.lo{border-top-color:#dc2626}
.lc-name{font-size:14px;font-weight:700;color:#1e2640;display:flex;justify-content:space-between;align-items:center}
.load-bar{height:7px;background:#eef0f6;border-radius:4px;overflow:hidden;margin:8px 0}
.load-fill{height:100%;border-radius:4px;transition:width .4s}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mini-c{background:#f7f8fc;border-radius:6px;padding:6px;text-align:center}
.mini-n{font-size:14px;font-weight:700;font-family:ui-monospace,monospace;color:#1e2640}
.mini-l{font-size:9px;color:#6b7a9e;margin-top:1px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,26,45,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:20px;overflow-y:auto}
.modal.on{display:flex}
.modal-c{background:#fff;border-radius:13px;padding:20px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modal-t{font-size:16px;font-weight:700;margin-bottom:14px;color:#1e2640;display:flex;justify-content:space-between;align-items:center}
.mclose{cursor:pointer;color:#9ca3af;font-size:22px;line-height:1;background:none;border:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
@media(max-width:640px){.fgrid{grid-template-columns:1fr 1fr}.kpi-n{font-size:18px}}
.fgrid label{font-size:11px;color:#6b7a9e;font-weight:600;display:flex;flex-direction:column;gap:3px}
.fgrid input,.fgrid select{width:100%}
/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e2640;color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;max-width:90vw;text-align:center}
.toast.ok{background:#065f46}.toast.err{background:#991b1b}.toast.warn{background:#92400e}
.ver{position:fixed;right:11px;bottom:9px;font-size:10px;color:#9aa3bd;background:rgba(255,255,255,.75);padding:3px 9px;border-radius:20px;z-index:20;pointer-events:none}
.pill{display:inline-flex;gap:5px;align-items:center;background:#f7f8fc;border:1px solid #e2e6f0;border-radius:20px;padding:4px 11px;font-size:11.5px;color:#4a5578;font-weight:600}
.split{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eef0f6;font-size:12px;gap:10px}
.split:last-child{border-bottom:none}
.split b{font-family:ui-monospace,monospace;color:#1e2640}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;background:#eef2ff;color:#4338ca;font-weight:600}
.tip{border-bottom:1px dotted #94a3b8;cursor:help;position:relative}
.tip:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:135%;background:#1e2640;color:#fff;padding:7px 10px;border-radius:7px;font-size:11px;font-weight:400;white-space:normal;width:230px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.3);line-height:1.4}
.imp-stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;margin-top:12px}
.imp-stat .s{background:#f7f8fc;border-radius:9px;padding:9px;text-align:center}
.imp-stat .s b{display:block;font-size:19px;color:#1e2640;font-family:ui-monospace,monospace}
.imp-stat .s span{font-size:10.5px;color:#6b7a9e}
.imp-hist{font-size:11.5px;color:#4a5578;padding:6px 0;border-bottom:1px solid #eef0f6;display:flex;justify-content:space-between;gap:10px}
.note{background:#fffbeb;border:1px solid #fcd34d;border-radius:9px;padding:9px 12px;font-size:11.5px;color:#92400e;margin-bottom:11px;line-height:1.5}
textarea{width:100%;min-height:120px;border:1px solid #d0d5e8;border-radius:7px;padding:9px;font-family:ui-monospace,monospace;font-size:11.5px;resize:vertical}
@media print{.header,.modebar,.tabs,.hicons,.btnrow,.filt,.no-print{display:none!important}.wrap{padding:0}.card{break-inside:avoid;box-shadow:none;border-color:#ccc}}
@media(max-width:640px){.tabs{top:104px}.bar-lb{width:110px}}
</style>
</head>
<body>
<div class="header">
  <div class="logo">📊</div>
  <div>
    <div class="h-title">VRT Customer <b>Statistics</b> Control Center</div>
    <div class="h-sub" id="hSub">客戶訂單・布料・裁剪・車縫・出貨統計控制中心</div>
  </div>
  <div class="hgrow"></div>
  <div class="hstat"><div class="hstat-v" id="hRecs">0</div><div class="hstat-l" data-i18n="hRecords">明細</div></div>
  <div class="hstat"><div class="hstat-v" id="hOpen">0</div><div class="hstat-l" data-i18n="hOpen">未出 pcs</div></div>
  <div class="hstat"><div class="hstat-v" id="hCust">0</div><div class="hstat-l" data-i18n="hCust">客戶</div></div>
  <div class="hicons">
    <div class="hicon" title="Language / 語言" onclick="toggleLang()" id="langBtn">🌐 <span id="langTag" style="font-size:10px">中</span></div>
    <div class="hicon" title="Cloud Upload" onclick="cloudUpload()">☁️</div>
    <div class="hicon" title="Cloud Download" onclick="cloudDownload()">⬇️</div>
    <div class="hicon" title="Cloud Sync" onclick="cloudSync()">🔄</div>
    <div class="hicon" title="Telegram Push" onclick="sendTelegramSummary()">📨</div>
    <div class="hicon" title="Print" onclick="window.print()">🖨️</div>
  </div>
</div>

<div class="modebar">
  <span style="color:#8b95b8;font-size:11px;font-weight:600" data-i18n="periodMode">統計週期</span>
  <div class="mode-sw" id="modeSw">
    <button data-m="day" onclick="setMode('day')" data-i18n="mDay">日 Day</button>
    <button data-m="week" onclick="setMode('week')" data-i18n="mWeek">週 Week</button>
    <button data-m="month" class="on" onclick="setMode('month')" data-i18n="mMonth">月 Month</button>
    <button data-m="year" onclick="setMode('year')" data-i18n="mYear">年 Year</button>
  </div>
  <div class="dp">
    <button class="nav-b" onclick="periodNav(-1)">◀</button>
    <span class="cur" id="periodCur">—</span>
    <button class="nav-b" onclick="periodNav(1)">▶</button>
    <button class="nav-b" onclick="periodToday()" data-i18n="today">今天</button>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="pane on" id="dashboard"></div>
  <div class="pane" id="import"></div>
  <div class="pane" id="daily"></div>
  <div class="pane" id="weekly"></div>
  <div class="pane" id="monthly"></div>
  <div class="pane" id="yearly"></div>
  <div class="pane" id="custprod"></div>
  <div class="pane" id="postyle"></div>
  <div class="pane" id="fabric"></div>
  <div class="pane" id="cutting"></div>
  <div class="pane" id="line"></div>
  <div class="pane" id="shipping"></div>
  <div class="pane" id="compare"></div>
  <div class="pane" id="records"></div>
  <div class="pane" id="settings"></div>
</div>

<div class="modal" id="modal"><div class="modal-c" id="modalC"></div></div>
<div class="toast" id="toast"></div>
<div class="ver">VRT Customer Statistics v1 · SAINTDOU / AC</div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" multiple style="display:none">
<input type="file" id="jsonInput" accept=".json" style="display:none">
<input type="file" id="planInput" accept=".json,.xlsx,.xls" style="display:none">

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   VRT Customer Statistics Control Center — Engine
   儲存：IndexedDB "VRTCustomerStatistics" (records/events/summaries/settings/importHistory)
   ═══════════════════════════════════════════════════════════════════════════ */
const VER='v1';
const DB_NAME='VRTCustomerStatistics';
const ST_REC='records', ST_EVT='events', ST_SUM='summaries', ST_SET='settings', ST_HIS='importHistory';
const LS_SET='vcs_settings', LS_HIST='vcs_import_history', LS_FILTER='vcs_last_filter', LS_CMP='vcs_compare_payload';
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());})();

/* ── ALL CUSTOMER 欄位對應（欄位固定索引，A=0）─────────────────────────── */
const COLMAP=[
  ['customer',0,'txt'],['poDate',1,'date'],['etd',2,'date'],['indcEta',3,'date'],
  ['garmentType',4,'txt'],['po',5,'txt'],['style',6,'txt'],['color',8,'txt'],['size',9,'txt'],
  ['openQty',10,'num'],['unit',11,'txt'],
  ['fabricItem',12,'txt'],['fabricType',13,'txt'],['yrdPerPcs',14,'num'],['totalYdsRequired',15,'num'],
  ['fabricReqPerOpen',16,'num'],['fabricReqPerNotCut',17,'num'],['fabricStockYds',18,'num'],
  ['firstFabricCatchUp',19,'txt'],['fabricStatus',20,'txt'],['fabricOrderDate',21,'date'],
  ['davidFabricDate',22,'date'],['fabricLeadTimeDays',23,'num'],['estimatedFabricEta',24,'date'],
  ['actualFabricArrived',25,'date'],
  ['estimatedCuttingPlanDate',26,'date'],['estimatedSewingPlanDate',27,'date'],['planToMarkerRoom',28,'num'],
  ['markerPlanDate',29,'raw'],['cutStock',30,'num'],['cutAdjust',31,'num'],['actualCutPcs',32,'num'],
  ['recutOver',33,'num'],['actualCuttingDateRaw',34,'raw'],['actualCutStock',35,'num'],['cutFlag',36,'num'],
  ['uncutQty',37,'num'],
  ['qtyTransferCutWip',39,'num'],['qtyInput',40,'num'],['sewingPlanDate',41,'date'],['loadingDateRaw',42,'raw'],
  ['lineNo',43,'txt'],['cuttingPcsBalance',44,'num'],['receivingDateRaw',45,'raw'],
  ['qtyReceivedFromSewing',46,'num'],['sewingAdjust',47,'num'],['totalPacked',48,'num'],['cuttingWip',49,'num'],
  ['shippedDateRaw',50,'raw'],['shippedQty',51,'num'],['shippedAdjust',52,'num'],['totalShipped',53,'num'],
  ['stockFgPcs',54,'num'],['stockFgCtn',55,'num'],['actualNotSewing',56,'num'],['openOrderPcs',57,'num'],
  ['openOrderCtns',58,'num'],['pcsPerBox',59,'num'],['comment',60,'txt'],
  ['poToFabricOrderDays',61,'num'],['fabricOrderToEtaDays',62,'num'],['etaToCutDays',63,'num'],
  ['cutToSewDays',64,'num'],['sewToShipDays',65,'num']
];
/* raw 事件欄位 → process 類型 */
const RAW_EVENT_COLS=[
  ['markerPlanDate','marker'],['actualCuttingDateRaw','cutting'],['loadingDateRaw','loading'],
  ['receivingDateRaw','receiving'],['shippedDateRaw','shipping']

/* ── 小工具 ─────────────────────────────────────────────────────────────── */
function p2(n){return String(n).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmt(n){n=Math.round(+n||0);return n.toLocaleString('en-US');}
function fmt1(n){return (Math.round((+n||0)*10)/10).toLocaleString('en-US');}
function pct(a,b){return b>0?Math.round(a/b*1000)/10:0;}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(msg,cls){const el=document.getElementById('toast');el.className='toast'+(cls?' '+cls:'');el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2600);}
function nowStamp(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200);}
function num(v){if(v==null||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:0;let s=String(v).replace(/[, ]/g,'').replace(/^-$/,'0');let f=parseFloat(s);return isFinite(f)?f:0;}
function sum(list,f){return list.reduce((s,r)=>s+(+f(r)||0),0);}
function uniq(list,f){return [...new Set(list.map(f).filter(x=>x!=null&&x!==''))];}

/* ── 日期解析 ───────────────────────────────────────────────────────────── */
function fmtDate(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function validYMD(y,m,d){y=+y;m=+m;d=+d;return y>=2000&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31;}
function parseDateToken(tok){
  tok=String(tok).trim();
  if(/^\d{8}$/.test(tok)){const y=tok.slice(0,4),m=tok.slice(4,6),d=tok.slice(6,8);return validYMD(y,m,d)?`${y}-${m}-${d}`:null;}
  if(/^\d{6}$/.test(tok)){const y='20'+tok.slice(0,2),m=tok.slice(2,4),d=tok.slice(4,6);return validYMD(y,m,d)?`${y}-${m}-${d}`:null;}
  return null;
}
function parseAnyDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return fmtDate(v);
  if(typeof v==='number'){
    if(v>=20000&&v<=60000){const d=new Date(Math.round((v-25569)*86400000));return isNaN(d)?'':fmtDate(d);}
    v=String(v);
  }
  let s=String(v).trim();
  let mIso=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(mIso)return validYMD(mIso[1],mIso[2],mIso[3])?`${mIso[1]}-${p2(mIso[2])}-${p2(mIso[3])}`:'';
  let mSl=s.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{2,4})$/);
  if(mSl){let mo=mSl[1],da=mSl[2],yr=mSl[3];yr=yr.length===2?('20'+yr):yr;return validYMD(yr,mo,da)?`${yr}-${p2(mo)}-${p2(da)}`:'';}
  if(/^\d{8}$/.test(s))return parseDateToken(s)||'';
  if(/^\d{6}$/.test(s))return parseDateToken(s)||'';
  let d=new Date(s);if(!isNaN(d)&&d.getFullYear()>1990&&d.getFullYear()<2100)return fmtDate(d);
  return '';
}
/* ISO 週：回傳 YYYY-Www */
function isoWeek(ymd){
  if(!ymd)return '';
  let d=new Date(ymd+'T00:00:00');if(isNaN(d))return '';
  let t=new Date(d.getTime());t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  let wk1=new Date(t.getFullYear(),0,4);
  let wn=1+Math.round(((t-wk1)/86400000-3+((wk1.getDay()+6)%7))/7);
  return t.getFullYear()+'-W'+p2(wn);
}
function weekOf(dateObj){return isoWeek(fmtDate(dateObj));}
function monthKey(ymd){return ymd?ymd.slice(0,7):'';}
function yearKey(ymd){return ymd?ymd.slice(0,4):'';}
function periodKeyOf(ymd,mode){if(!ymd)return '';return mode==='day'?ymd:mode==='week'?isoWeek(ymd):mode==='month'?monthKey(ymd):yearKey(ymd);}
/* 週起訖（週一~週日）*/
function weekBounds(wkKey){
  let m=wkKey.match(/^(\d{4})-W(\d{2})$/);if(!m)return null;
  let y=+m[1],w=+m[2];
  let simple=new Date(y,0,1+(w-1)*7);
  let dow=simple.getDay();
  let mon=new Date(simple);mon.setDate(simple.getDate()-((dow+6)%7));
  let sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return {start:fmtDate(mon),end:fmtDate(sun)};
}

/* ── 日期文字 timeline parser（核心）───────────────────────────────────── */
function parseSegment(seg,process,ctx){
  const raw=String(seg).trim();if(!raw)return null;
  /* 純 5 位 Excel serial */
  if(/^\d{5}$/.test(raw)){let n=+raw;if(n>=20000&&n<=60000){let date=parseAnyDate(n);return mkEvent(date,process,'Unknown Line',fbQty(0,process,ctx),raw,date?'ok':'unparsed',ctx);}}
  let m8=raw.match(/(?<![\d])(\d{8})(?![\d])/);
  let m6=raw.match(/(?<![\d])(\d{6})(?![\d])/);
  let tok=m8?m8[1]:(m6?m6[1]:null);
  let date=tok?parseDateToken(tok):null;
  let rest=tok?raw.replace(tok,' '):raw;
  let line=null;
  let lm=rest.match(/L\s*(\d+)/i);if(lm)line='Line '+(+lm[1]);
  let qty=0;
  if(rest.includes('=')){
    let be=rest.match(/(\d+)\s*=/);if(be&&!lm)line='Line '+(+be[1]);
    let after=rest.slice(rest.indexOf('=')+1);let ns=after.match(/\d+/g);
    if(ns)qty=ns.reduce((a,b)=>a+ +b,0);
  }else{
    let tmp=rest;if(lm)tmp=tmp.replace(/L\s*\d+/i,' ');
    let ns=tmp.match(/\d+/g);if(ns)qty=ns.reduce((a,b)=>a+ +b,0);
  }
  qty=fbQty(qty,process,ctx);
  return mkEvent(date,process,line||'Unknown Line',qty,raw,date?'ok':'unparsed',ctx);
}
function fbQty(qty,process,ctx){if(qty&&qty>0)return qty;let f=PROC_FALLBACK[process];return f&&ctx&&ctx[f]?ctx[f]:(qty||0);}
function mkEvent(date,process,line,qty,rawText,status,ctx){
  return {id:uid(),date:date||null,process,line:line||'Unknown Line',qty:+qty||0,rawText,parseStatus:status,
    customer:ctx.customer,po:ctx.po,style:ctx.style,color:ctx.color,size:ctx.size,garmentType:ctx.garmentType,recId:ctx.id};
}
function parseTimeline(raw,process,ctx){
  const out=[];
  if(raw==null||raw==='')return out;
  let s=String(raw).trim();if(!s)return out;
  let segs=s.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
  segs.forEach(seg=>{let e=parseSegment(seg,process,ctx);if(e)out.push(e);});
  if(!out.length)out.push(mkEvent(null,process,'Unknown Line',fbQty(0,process,ctx),s,'unparsed',ctx));
  return out;
}

/* ── 正規化 ─────────────────────────────────────────────────────────────── */
function normCustomer(v){return String(v==null?'':v).trim().replace(/\s+/g,' ').toUpperCase();}
function normText(v){return String(v==null?'':v).trim();}
function normGarment(v){
  let s=String(v==null?'':v).trim().toUpperCase();
  if(!s)return 'OTHER';
  if(/APRON/.test(s))return 'APRON';
  if(/NAPKIN|SERVIETTE/.test(s))return 'NAPKIN';
  if(/\bTOP\b|SHIRT|JACKET|POLO|BLOUSE/.test(s))return 'TOP';
  if(/GARMENT|PANT|TROUSER|COAT|UNIFORM|GOWN|SCRUB|COVERALL/.test(s))return 'GARMENT';
  return GARMENT_KEYS.includes(s)?s:'OTHER';
}
function styleKey(v){return String(v==null?'':v).trim().toUpperCase().replace(/[\s\-_.]/g,'');}
function hasLetter(s){return /[A-Za-z\u4e00-\u9fff\u1780-\u17ff]/.test(String(s==null?'':s));}
function isSummaryRow(r){
  const c=String(r.customer||'').trim();
  const cu=c.toUpperCase();
  // 明確關鍵字總計列
  if(/^(GRAND\s*TOTAL|TOTAL|SUB.?TOTAL|SUMMARY|TTL)\b/.test(cu))return true;
  if(/^(合計|總計|小計|总计|合计|總數|总数|總合|合計數)/.test(c))return true;
  // 客戶欄不含任何字母（英/中/高棉）→ 佔位/總計/雜訊列（例如整表總計列 customer/po/style/size 全填 "1"）
  if(c!=='' && !hasLetter(c))return true;
  // 客戶欄空白但 style/po 也不含字母，且有大量數量（無主體的總計列）
  if(c==='' && !hasLetter(r.po) && !hasLetter(r.style) && num(r.openQty)>0)return true;
  return false;
}
function isEmptyRow(r){return !((r.customer||'').trim()||(r.po||'').trim()||(r.style||'').trim())|| (num(r.openQty)===0 && !(r.customer||'').trim());}

/* 由陣列列建立 record（依 COLMAP 固定索引）*/
function rowToRecord(arr){
  const rec={id:uid(),_raw:{}};
  COLMAP.forEach(([field,idx,type])=>{
    let v=arr[idx];
    if(type==='num')rec[field]=num(v);
    else if(type==='date')rec[field]=parseAnyDate(v);
    else if(type==='raw')rec[field]=(v==null?'':String(v).trim());
    else rec[field]=normText(v);
  });
  rec.customer=normCustomer(rec.customer);
  rec.garmentType=normGarment(rec.garmentType);
  rec.style=normText(rec.style);
  rec.styleKey=styleKey(rec.style);
  rec.color=normText(rec.color);
  rec.size=normText(rec.size);
  rec.po=normText(rec.po);
  rec.lineNo=normText(rec.lineNo);
  return rec;
}
function dupKey(r){return [r.customer,r.po,r.styleKey,r.color,r.size,r.garmentType,num(r.openQty)].join('|');}

/* ── 記錄衍生計算 ───────────────────────────────────────────────────────── */
function derive(r){
  const openQty=num(r.openQty);
  const acs=num(r.actualCutStock)|| (num(r.actualCutPcs)+num(r.cutStock));
  const uncut=r.uncutQty!=null&&r.uncutQty!==''?num(r.uncutQty):Math.max(openQty-acs,0);
  const totalShipped=num(r.totalShipped)||num(r.shippedQty);
  const openOrderPcs=r.openOrderPcs!=null&&num(r.openOrderPcs)>0?num(r.openOrderPcs):Math.max(openQty-totalShipped,0);
  const reqNotCut=num(r.fabricReqPerNotCut);
  const fabStock=num(r.fabricStockYds);
  const fabShort=Math.max(reqNotCut-fabStock,0);
  const fabCover=reqNotCut>0?fabStock/reqNotCut:1;
  const cutComp=openQty>0?acs/openQty:0;
  const cutShort=Math.max(openQty-acs,0);
  const overCut=Math.max(acs-openQty*1.0,0);
  const d={openQty,acs,uncut,totalShipped,openOrderPcs,reqNotCut,fabStock,fabShort,fabCover,
    cutComp,cutShort,overCut,
    packed:num(r.totalPacked),input:num(r.qtyInput),fg:num(r.stockFgPcs),cutWip:num(r.cuttingWip),
    notSew:num(r.actualNotSewing),totYds:num(r.totalYdsRequired),marker:num(r.planToMarkerRoom),
    recut:num(r.recutOver)};
  // 狀態 badge
  let st='nodata';
  if(openQty<=0)st='nodata';
  else if(totalShipped>=openQty)st='shipped';
  else if(fabShort>0)st='fabric';
  else if(uncut>0||acs<openQty)st='cutting';
  else if(r.etd&&r.etd<TODAY&&openOrderPcs>0)st='risk';
  else if(r.etd&&daysBetween(TODAY,r.etd)>=0&&daysBetween(TODAY,r.etd)<=7&&openOrderPcs>0)st='watch';
  else st='ok';
  d.status=st;
  d.overdue=(r.etd&&r.etd<TODAY&&openOrderPcs>0);
  d.dueSoon=(r.etd&&daysBetween(TODAY,r.etd)>=0&&daysBetween(TODAY,r.etd)<=7&&openOrderPcs>0);
  return d;
}
function daysBetween(a,b){let da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00');if(isNaN(da)||isNaN(db))return NaN;return Math.round((db-da)/86400000);}
const BADGE={ok:['b-ok','🟢',()=>t('bOK')],watch:['b-watch','🟡',()=>t('bWatch')],risk:['b-risk','🔴',()=>t('bRisk')],
  nodata:['b-nodata','⚫',()=>t('bNoData')],shipped:['b-shipped','🔵',()=>t('bShipped')],
  fabric:['b-fabric','🟠',()=>t('bFabShort')],cutting:['b-cutting','🟣',()=>t('bCutShort')]};
function badge(st){const b=BADGE[st]||BADGE.nodata;return `<span class="badge ${b[0]}">${b[1]} ${esc(b[2]())}</span>`;}

/* ── 事件建立 ───────────────────────────────────────────────────────────── */
function buildEventsFor(rec){
  const evs=[];
  const ctx={id:rec.id,customer:rec.customer,po:rec.po,style:rec.style,color:rec.color,size:rec.size,
    garmentType:rec.garmentType,actualCutPcs:num(rec.actualCutPcs),planToMarkerRoom:num(rec.planToMarkerRoom),
    qtyInput:num(rec.qtyInput),qtyReceivedFromSewing:num(rec.qtyReceivedFromSewing),shippedQty:num(rec.shippedQty)||num(rec.totalShipped)};
  RAW_EVENT_COLS.forEach(([col,proc])=>{
    let raw=rec[col];
    if(raw==null||raw==='')return;
    parseTimeline(raw,proc,ctx).forEach(e=>evs.push(e));
  });
  // 若有 sewingPlanDate + qtyInput 但無 loading 事件 → 補一筆 sewing 估算
  const hasSew=evs.some(e=>e.process==='loading'||e.process==='sewing');
  if(!hasSew && rec.sewingPlanDate && num(rec.qtyInput)>0){
    evs.push(mkEvent(rec.sewingPlanDate,'sewing',rec.lineNo?('Line '+rec.lineNo.replace(/\D/g,'')):'Unknown Line',num(rec.qtyInput),'[plan]'+rec.sewingPlanDate,'estimated',ctx));
  }
  return evs;
}
function rebuildEvents(){EVENTS=[];RECORDS.forEach(r=>{buildEventsFor(r).forEach(e=>EVENTS.push(e));});}

/* ── IndexedDB ──────────────────────────────────────────────────────────── */
function openIDB(){
  const build=db=>{
    [ST_REC,ST_EVT].forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});
    [ST_SUM,ST_SET].forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'k'});});
    if(!db.objectStoreNames.contains(ST_HIS))db.createObjectStore(ST_HIS,{keyPath:'id'});
  };
  const NEED=[ST_REC,ST_EVT,ST_SUM,ST_SET,ST_HIS];
  const tryOpen=ver=>new Promise((r2,j2)=>{
    const rq=ver?indexedDB.open(DB_NAME,ver):indexedDB.open(DB_NAME);
    rq.onupgradeneeded=e=>build(e.target.result);
    rq.onsuccess=e=>r2(e.target.result);rq.onerror=()=>j2(rq.error);
  });
  // 自我修復：版本衝突改不帶版本；缺 store 升版補建
  return tryOpen(1)
    .catch(err=>{ if(err&&err.name==='VersionError') return tryOpen(null); throw err; })
    .then(db=>{ if(NEED.every(s=>db.objectStoreNames.contains(s))) return db;
      const nv=db.version+1; db.close(); return tryOpen(nv); });
}
async function idbSaveAll(){
  try{const db=await openIDB();
    const tx=db.transaction([ST_REC,ST_EVT,ST_SET],'readwrite');
    const sr=tx.objectStore(ST_REC);sr.clear();RECORDS.forEach(r=>sr.put(r));
    const se=tx.objectStore(ST_EVT);se.clear();EVENTS.forEach(e=>se.put(e));
    tx.objectStore(ST_SET).put({k:'main',v:SETTINGS});
    return new Promise(r=>{tx.oncomplete=()=>r();tx.onerror=()=>r();});
  }catch(e){console.warn('idbSaveAll',e);}
}
async function idbLoadAll(){
  try{const db=await openIDB();
    const tx=db.transaction([ST_REC,ST_EVT,ST_SET],'readonly');
    RECORDS=await new Promise(r=>{const q=tx.objectStore(ST_REC).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});
    EVENTS=await new Promise(r=>{const q=tx.objectStore(ST_EVT).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});
    const s=await new Promise(r=>{const q=tx.objectStore(ST_SET).get('main');q.onsuccess=()=>r(q.result?q.result.v:null);q.onerror=()=>r(null);});
    if(s)SETTINGS={...SETTINGS,...s};
    if(RECORDS.length&&!EVENTS.length)rebuildEvents();
  }catch(e){console.warn('idbLoadAll',e);RECORDS=[];EVENTS=[];}

let PENDING_ROWS=null;
function pickSheet(wb){
  // 找 ALL CUSTOMER；找不到就取第一個資料量最大的分頁
  let names=wb.SheetNames;
  let hit=names.find(n=>/ALL\s*CUSTOMER/i.test(n));
  if(hit)return hit;
  hit=names.find(n=>/CUSTOMER/i.test(n)&&!/SUMMARY|MASTER|FABRIC|LIST/i.test(n));
  return hit||names[0];
}
function parseWorkbook(wb){
  const sn=pickSheet(wb);
  const ws=wb.Sheets[sn];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,cellDates:false,defval:''});
  // 表頭在第3/4列合併，資料從第5列（index 4）
  const rows=aoa.slice(4);
  const recs=[];let noDate=0,abn=0;
  rows.forEach(arr=>{
    if(!arr||!arr.length)return;
    const rec=rowToRecord(arr);
    if(isEmptyRow(rec))return;
    if(isSummaryRow(rec))return;
    // 異常偵測
    if(num(rec.qtyInput)>num(rec.actualCutStock)+1 && num(rec.actualCutStock)>0)rec._abn=true,abn++;
    // 無法解析日期
    RAW_EVENT_COLS.forEach(([col])=>{let v=rec[col];if(v){let ev=parseTimeline(v,'x',{});if(ev.every(e=>e.parseStatus==='unparsed'))noDate++;}});
    recs.push(rec);
  });
  return {sheetName:sn,records:recs,noDate,abn};
}
function handleFiles(files){
  const arr=[...files];if(!arr.length)return;
  let all=[],meta=[];
  let done=0;
  arr.forEach(f=>{
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:false});
        const res=parseWorkbook(wb);
        all=all.concat(res.records);meta.push({file:f.name,sheet:res.sheetName,count:res.records.length,noDate:res.noDate,abn:res.abn});
      }catch(err){toast('解析失敗: '+f.name,'err');console.warn(err);}
      if(++done===arr.length){PENDING_ROWS={records:all,meta};previewImport();}
    };
    rd.readAsArrayBuffer(f);
  });
}
function previewImport(){
  const {records,meta}=PENDING_ROWS;
  const existing=new Set(RECORDS.map(dupKey));
  let newN=0,dupN=0,abnN=0,noDateN=0;
  records.forEach(r=>{if(existing.has(dupKey(r)))dupN++;else newN++;if(r._abn)abnN++;});
  meta.forEach(m=>noDateN+=m.noDate);
  PENDING_ROWS.stat={total:records.length,newN,dupN,abnN,noDateN};

    </div>

      <button class="btn btn-y" onclick="confirmImport()">${t('impConfirm')}</button>
      <button class="btn btn-g" onclick="cancelImport()">${t('impReparse')}</button>
    </div>

    </tr></thead><tbody>${prev.map(r=>`<tr>
      <td>${esc(r.customer)}</td><td>${esc(r.po)}</td><td>${esc(r.style)}</td><td>${esc(r.color)}</td><td>${esc(r.size)}</td>
      <td class="num">${fmt(r.openQty)}</td><td>${esc(r.fabricItem||r.fabricType)}</td><td class="num">${fmt(r.actualCutStock)}</td>
      <td class="num">${fmt(r.totalShipped)}</td><td>${esc(r.etd)}</td></tr>`).join('')}</tbody></table></div>`;

function cancelImport(){PENDING_ROWS=null;renderImport();}
function confirmImport(){
  if(!PENDING_ROWS)return;
  const {records}=PENDING_ROWS;
  const existing=new Map(RECORDS.map(r=>[dupKey(r),r]));
  const dups=records.filter(r=>existing.has(dupKey(r)));
  if(dups.length){PENDING={records,existing,mode:null};askDup(dups.length);return;}
  applyImport(records,existing,'add');
}
function askDup(n){
  showModal(`<div class="modal-t">${t('dupTitle')}<button class="mclose" onclick="closeModal()">×</button></div>
    <div class="al al-w">${t('dupBody')}<br><b>${n}</b> ${t('impDup')}</div>
    <div class="btnrow" style="justify-content:flex-end">
      <button class="btn btn-g" onclick="resolveDup('skip')">${t('dupSkip')}</button>
      <button class="btn btn-b" onclick="resolveDup('rev')">${t('dupRev')}</button>
      <button class="btn btn-r" onclick="resolveDup('replace')">${t('dupReplace')}</button>
    </div>`);
}
function resolveDup(mode){closeModal();applyImport(PENDING.records,PENDING.existing,mode);}
function applyImport(records,existing,mode){
  let added=0,replaced=0,skipped=0;
  records.forEach(r=>{
    const k=dupKey(r);
    if(existing.has(k)){
      if(mode==='skip'){skipped++;return;}
      if(mode==='replace'){const old=existing.get(k);r.id=old.id;const i=RECORDS.findIndex(x=>x.id===old.id);if(i>=0)RECORDS[i]=r;replaced++;return;}
      if(mode==='rev'){r.style=r.style+' (REV)';r.styleKey=styleKey(r.style);RECORDS.push(r);existing.set(dupKey(r),r);added++;return;}
    }
    RECORDS.push(r);existing.set(k,r);added++;
  });
  rebuildEvents();
  IMPORT_HISTORY.unshift({id:uid(),ts:nowStamp(),files:(PENDING_ROWS?PENDING_ROWS.meta.map(m=>m.file).join(', '):''),added,replaced,skipped,total:records.length});
  IMPORT_HISTORY=IMPORT_HISTORY.slice(0,40);
  PENDING_ROWS=null;PENDING=null;
  persist();toast(`${t('imported')}: +${added} ⟳${replaced} ⊘${skipped}`,'ok');
  goTab('dashboard');renderAll();
}

function filteredRecords(){
  return RECORDS.filter(r=>{
    if(GF.cust&&r.customer!==GF.cust)return false;
    if(GF.garment&&r.garmentType!==GF.garment)return false;

    if(GF.line&&normText(r.lineNo)!==GF.line)return false;
    return true;
  });
}
function filteredEvents(){
  const recIds=new Set(filteredRecords().map(r=>r.id));

}
/* KPI 計算 */
function computeKPI(list){
  const D=list.map(derive);
  const S=(f)=>D.reduce((s,d)=>s+(+d[f]||0),0);
  return {
    totalOrder:S('openQty'),
    openOrder:S('openOrderPcs'),
    actualCut:S('acs'),
    uncut:S('uncut'),
    input:S('input'),
    packed:S('packed'),
    shipped:S('totalShipped'),
    unshipped:S('openOrderPcs'),
    fg:S('fg'),
    cutWip:S('cutWip'),
    notSew:S('notSew'),
    fabReq:S('reqNotCut'),
    fabStock:S('fabStock'),
    fabShort:S('fabShort'),
    custN:uniq(list,r=>r.customer).length,
    poN:uniq(list,r=>r.po).length,
    styleN:uniq(list,r=>r.styleKey).length,
    sizeN:uniq(list,r=>r.size).length,
    lineN:uniq(list,r=>normText(r.lineNo)).filter(Boolean).length,
    overdueN:D.filter(d=>d.overdue).length
  };
}
/* 依維度加總 */
function groupSum(list,keyFn){
  const m={};
  list.forEach(r=>{const k=keyFn(r);if(k==null||k==='')return;const d=derive(r);
    if(!m[k])m[k]={key:k,openQty:0,acs:0,uncut:0,input:0,packed:0,shipped:0,unship:0,fg:0,cutWip:0,notSew:0,
      fabReq:0,fabStock:0,fabShort:0,marker:0,recs:[]};
    const o=m[k];
    o.openQty+=d.openQty;o.acs+=d.acs;o.uncut+=d.uncut;o.input+=d.input;o.packed+=d.packed;
    o.shipped+=d.totalShipped;o.unship+=d.openOrderPcs;o.fg+=d.fg;o.cutWip+=d.cutWip;o.notSew+=d.notSew;
    o.fabReq+=d.reqNotCut;o.fabStock+=d.fabStock;o.fabShort+=d.fabShort;o.marker+=d.marker;o.recs.push(r);
  });
  return Object.values(m);
}
/* 事件依日期聚合（process 分列）*/
function eventPeriodSum(evList,mode){
  const m={};
  evList.forEach(e=>{
    const key=e.date?periodKeyOf(e.date,mode):'(no-date)';
    if(!m[key])m[key]={key,marker:0,cutting:0,sewing:0,loading:0,receiving:0,shipping:0,total:0};
    m[key][e.process]=(m[key][e.process]||0)+e.qty;m[key].total+=e.qty;
  });
  return Object.values(m).sort((a,b)=>a.key<b.key?-1:1);
}

  ensurePeriod();renderModebar();saveFilter();

function ensurePeriod(){
  const dates=RECORDS.map(r=>r.etd||r.shippedDateRaw&&parseAnyDate(r.shippedDateRaw)||r.poDate).filter(Boolean).sort();
  const ref=CUR_PERIOD&&isValidRef(CUR_PERIOD,MODE)?refToDate(CUR_PERIOD):(dates.length?dates[dates.length-1]:TODAY);
  CUR_PERIOD=periodKeyOf(ref||TODAY,MODE);
}
function isValidRef(p,mode){if(mode==='day')return /^\d{4}-\d{2}-\d{2}$/.test(p);if(mode==='week')return /^\d{4}-W\d{2}$/.test(p);if(mode==='month')return /^\d{4}-\d{2}$/.test(p);return /^\d{4}$/.test(p);}
function refToDate(p){if(/^\d{4}-W\d{2}$/.test(p)){let b=weekBounds(p);return b?b.start:TODAY;}if(/^\d{4}-\d{2}$/.test(p))return p+'-01';if(/^\d{4}$/.test(p))return p+'-01-01';return p;}
function periodNav(dir){
  let d=new Date(refToDate(CUR_PERIOD)+'T00:00:00');
  if(MODE==='day')d.setDate(d.getDate()+dir);
  else if(MODE==='week')d.setDate(d.getDate()+7*dir);
  else if(MODE==='month')d.setMonth(d.getMonth()+dir);
  else d.setFullYear(d.getFullYear()+dir);
  CUR_PERIOD=periodKeyOf(fmtDate(d),MODE);renderModebar();saveFilter();renderTab(CUR_TAB);
}

/* ── 布料缺口去重排名（dashboard/fabric 共用）───────────────────────────── */
function fabricShortageRank(list){
  const m={};
  list.forEach(r=>{const code=r.fabricItem||r.fabricType;if(!code)return;const d=derive(r);
    if(!m[code])m[code]={key:code,reqNotCut:0,fabStock:0,fabShort:0,recs:0,type:r.fabricType};
    m[code].reqNotCut+=d.reqNotCut;m[code].fabStock=Math.max(m[code].fabStock,d.fabStock);m[code].recs++;});
  // 去重布號後：缺口 = 需求 - 庫存（庫存取該布號最大值代表倉庫實際庫存）
  Object.values(m).forEach(o=>{o.fabShort=Math.max(o.reqNotCut-o.fabStock,0);o.coverage=o.reqNotCut>0?o.fabStock/o.reqNotCut:1;});
  return Object.values(m).sort((a,b)=>b.fabShort-a.fabShort);
}

/* ── 客戶→類別→PO→款式→顏色→尺寸 下鑽 ────────────────────────────────── */
const DRILL_LEVELS=[r=>r.customer,r=>r.garmentType,r=>r.po,r=>r.style,r=>r.color,r=>r.size];
const DRILL_LABELS=['cust','garment','po','style','color','size'];
function drillMetrics(recs){
  const D=recs.map(derive);const S=f=>D.reduce((s,d)=>s+(+d[f]||0),0);
  return {openQty:S('openQty'),reqNotCut:S('reqNotCut'),fabStock:S('fabStock'),marker:S('marker'),acs:S('acs'),
    uncut:S('uncut'),input:S('input'),packed:S('packed'),totalShipped:S('totalShipped'),fg:S('fg'),
    openOrderPcs:S('openOrderPcs'),notSew:S('notSew'),cutWip:S('cutWip'),fabShort:S('fabShort')};
}
function drillStatus(recs){
  const c={};recs.map(derive).forEach(d=>{c[d.status]=(c[d.status]||0)+1;});
  const order=['risk','fabric','cutting','watch','shipped','ok','nodata'];
  for(const s of order)if(c[s])return s;return 'nodata';
}

function renderDrill(list){
  const body=document.getElementById('drillBody');
  const rows=[];
  function walk(recs,lvl,prefix){
    const groups={};
    recs.forEach(r=>{const k=DRILL_LEVELS[lvl](r)||'—';(groups[k]=groups[k]||[]).push(r);});
    Object.keys(groups).sort().forEach(k=>{
      const g=groups[k];const m=drillMetrics(g);const id=prefix+'||'+k;const isOpen=expanded[id];
      const hasChild=lvl<DRILL_LEVELS.length-1;
      rows.push(`<tr class="drow lv${lvl+1} ${isOpen?'open':''}" onclick="toggleDrill('${esc(id).replace(/'/g,'')}')">
        <td>${hasChild?'<span class="cr">▶</span>':'<span style="display:inline-block;width:13px"></span>'} ${esc(k)}<span class="tag" style="margin-left:6px">${g.length}</span></td>
        <td class="num">${fmt(m.openQty)}</td><td class="num">${fmt(m.reqNotCut)}</td><td class="num">${fmt(m.marker)}</td>
        <td class="num">${fmt(m.acs)}</td><td class="num">${fmt(m.uncut)}</td><td class="num">${fmt(m.input)}</td>
        <td class="num">${fmt(m.packed)}</td><td class="num">${fmt(m.totalShipped)}</td><td class="num">${fmt(m.fg)}</td>
        <td class="num">${fmt(m.openOrderPcs)}</td><td class="num">${fmt(m.notSew)}</td><td>${badge(drillStatus(g))}</td></tr>`);
      if(isOpen&&hasChild)walk(g,lvl+1,id);

  }

/* ── 排產產能比對（讀 ProdPlanCapacity）─────────────────────────────────── */
function loadPlanFromIDB(){
  return new Promise(res=>{
    try{const rq=indexedDB.open('ProdPlanCapacity');   // 不帶版本：讀既有版本
      // 資料庫不存在時取消建立，避免留下空庫影響排產系統
      rq.onupgradeneeded=e=>{try{e.target.transaction.abort();}catch(_){}};
      rq.onsuccess=e=>{const db=e.target.result;
        if(!db.objectStoreNames.contains('records')){res([]);return;}
        const tx=db.transaction(['records'],'readonly');const q=tx.objectStore('records').getAll();
        q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);};
      rq.onerror=()=>res([]);
    }catch(e){res([]);}
  });
}
async function cmpReadPlan(){PLAN_RECORDS=await loadPlanFromIDB();if(!PLAN_RECORDS.length)toast(t('cmpNoPlan'),'warn');else toast(fmt(PLAN_RECORDS.length)+' plan records','ok');renderCompare();}
function cmpPasteParse(){
  const v=document.getElementById('cmpPasteBox').value.trim();if(!v)return;
  try{let o=JSON.parse(v);let recs=Array.isArray(o)?o:(o.records||[]);PLAN_RECORDS=recs;toast(fmt(recs.length)+' plan records','ok');renderCompare();}
  catch(e){toast('JSON error','err');}
}
function planKey(p,relax){
  const c=normCustomer(p.customer),po=normText(p.po),st=styleKey(p.style),co=normText(p.color),sz=normText(p.size),ln=normText(p.line);
  if(relax===0)return [c,po,st,co,sz,ln].join('|');
  if(relax===1)return [c,po,st,co,sz].join('|');
  if(relax===2)return [c,po,st,sz].join('|');
  if(relax===3)return [c,st,sz].join('|');
  return [st,sz].join('|');
}
function recKey(r,relax){
  const c=r.customer,po=r.po,st=r.styleKey,co=r.color,sz=r.size,ln=normText(r.lineNo);
  if(relax===0)return [c,po,st,co,sz,ln].join('|');
  if(relax===1)return [c,po,st,co,sz].join('|');
  if(relax===2)return [c,po,st,sz].join('|');
  if(relax===3)return [c,st,sz].join('|');
  return [st,sz].join('|');
}
function buildComparePayload(){
  const list=filteredRecords();
  const evs=filteredEvents();
  return {module:SETTINGS.moduleKey,version:VER,generatedAt:nowStamp(),
    records:list.map(r=>{const d=derive(r);return {customer:r.customer,po:r.po,style:r.style,color:r.color,size:r.size,
      line:r.lineNo,etd:r.etd,openQty:d.openQty,actualCutStock:d.acs,qtyInput:d.input,packed:d.packed,
      shipped:d.totalShipped,unshipped:d.openOrderPcs,uncut:d.uncut,fabShort:d.fabShort};}),
    summaryBy:{Customer:groupSum(list,r=>r.customer).map(o=>({key:o.key,openQty:o.openQty,shipped:o.shipped,unship:o.unship})),
      Line:lineCross(evs.filter(e=>e.process==='sewing'||e.process==='loading'),e=>e.line,e=>e.customer),
      Month:eventPeriodSum(evs,'month')}};
}
function renderCompare(){
  const list=filteredRecords();
  const el=document.getElementById('compare');
  let cmpRows='';
  if(PLAN_RECORDS.length&&list.length){
    // 建 plan 索引（漸進放寬）
    const planIdx=[{},{},{},{},{}];
    PLAN_RECORDS.forEach(p=>{for(let rx=0;rx<5;rx++){const k=planKey(p,rx);(planIdx[rx][k]=planIdx[rx][k]||[]).push(p);}});
    const rows=list.map(r=>{
      const d=derive(r);let plan=null,used=-1;
      for(let rx=0;rx<5;rx++){const k=recKey(r,rx);if(planIdx[rx][k]){plan=planIdx[rx][k];used=rx;break;}}
      const planQty=plan?plan.reduce((s,p)=>s+(num(p.sewingQty)||num(p.sewQty)||0),0):0;
      const demand=d.openQty;const cutAvail=d.acs;
      const gapPlan=demand-planQty,gapCut=planQty-cutAvail,gapShip=demand-d.totalShipped;
      let risk='ok';

      else if(d.packed>d.totalShipped&&r.etd&&r.etd<TODAY)risk='shipdelay';
      else if(demand>planQty&&planQty>0)risk='underplan';
      else if(planQty>demand*1.15&&demand>0)risk='overplan';
      else if(d.input>d.acs+1&&d.acs>0)risk='dataabn';
      return {r,d,planQty,demand,cutAvail,gapPlan,gapCut,gapShip,risk,used};
    }).filter(x=>x.planQty>0||x.demand>0).sort((a,b)=>Math.abs(b.gapPlan)-Math.abs(a.gapPlan));

        ${rows.slice(0,300).map(x=>{const rl=RISK[x.risk];return `<tr><td>${esc(x.r.customer)}</td><td>${esc(x.r.po)}</td><td>${esc(x.r.style)}</td>

        <td class="num">${fmt(x.cutAvail)}</td><td class="num">${fmt(x.d.input)}</td><td class="num">${fmt(x.d.totalShipped)}</td>
        <td class="num">${fmt(x.d.openOrderPcs)}</td><td class="num" style="color:${x.gapPlan>0?'#dc2626':'#059669'}">${fmt(x.gapPlan)}</td>
        <td class="num" style="color:${x.gapCut>0?'#dc2626':'#059669'}">${fmt(x.gapCut)}</td>
